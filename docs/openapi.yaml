      x-business-rules: [BR-56, BR-36]
      parameters:
        - name: farmCropId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Crop input details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CropInput'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    patch:
      tags: [Crops]
      operationId: updateMyCropInput
      summary: Update a crop input application
      description: |
        Updates details of an own crop input application (BR-56).
      x-permission: farmer.crop_input.manage_own
      x-business-rules: [BR-56, BR-36, BR-35]
      parameters:
        - name: farmCropId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCropInputRequest'
      responses:
        '200':
          description: Updated crop input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CropInput'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [Crops]
      operationId: deleteMyCropInput
      summary: Soft-delete a crop input application
      description: |
        Soft-deletes an own crop input record (BR-56e).
      x-permission: farmer.crop_input.manage_own
      x-business-rules: [BR-56, BR-36, BR-35]
      parameters:
        - name: farmCropId
          in: path
