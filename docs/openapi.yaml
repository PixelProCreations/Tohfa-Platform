        '500': { $ref: '#/components/responses/ServerError' }

  /cart:
    get:
      tags: [Cart & Orders]
      operationId: getCart
      summary: Current cart
      description: Items are reserved for 24 hours once the cart is locked (BR-22); `lockExpiresAt` is the deadline.
      x-permission: cart.view_own
      x-business-rules: [BR-22]
      responses:
        '200':
          description: Cart.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
    put:
      tags: [Cart & Orders]
      operationId: replaceCart
      summary: Replace the whole cart
      description: Re-reserves stock for every line and restarts the 24-hour lock (BR-22).
      x-permission: cart.manage_own
      x-business-rules: [BR-22]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CartReplace' }
            example:
              warehouseId: 3f1b7c2e-2a44-4f0e-9b1a-6b0d2f0f1a01
              items:
                - { productId: 11112222-3333-4444-5555-666677778888, grade: GRADE_1, qtyKg: '2.000' }
      responses:
        '200':
          description: Cart replaced.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [Cart & Orders]
      operationId: clearCart
      summary: Empty the cart and release reservations
      description: |
        Empties the cart and immediately releases every stock reservation it was holding
        (BR-22).
      x-permission: cart.manage_own
      x-business-rules: [BR-22]
      responses:
        '204': { description: Cart cleared; reserved stock released back to the ledger. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /cart/items:
    post:
      tags: [Cart & Orders]
      operationId: addCartItem
      summary: Add or increment a cart line
      description: |
        Reserves stock from the ONLINE allocation bucket. Insufficient sellable stock
        returns 409 `STOCK_UNAVAILABLE`; exceeding the online allocation for the day
        returns 409 `INSUFFICIENT_ALLOCATION` (BR-12).
      x-permission: cart.manage_own
      x-business-rules: [BR-12, BR-22]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CartItemCreate' }
            example: { productId: 11112222-3333-4444-5555-666677778888, grade: GRADE_1, qtyKg: '1.500' }
      responses:
        '201':
          description: Line added; the updated cart is returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Stock or allocation unavailable.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://api.tohfa.in/problems/stock-unavailable
                title: Requested quantity is unavailable
                status: 409
                detail: Only 0.750 kg of Carrot GRADE_1 remains at Coonoor today.
                code: STOCK_UNAVAILABLE
                traceId: 01J9F1B2C3D4E5F6G7H8J9K4
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /orders:
    post:
      tags: [Cart & Orders]
      operationId: checkout
      summary: Place an order (wallet-first checkout)
      description: |
        Converts the locked cart into an order. Wallet is the primary payment method
        (BR-17); an insufficient balance returns 422 `WALLET_INSUFFICIENT` with
        the shortfall so the client can prompt a top-up. An expired cart lock returns 409
        `CART_LOCK_EXPIRED` (BR-22). Every order supports warehouse pickup (BR-21); the delivery half of the model is
        unresolved — see `docs/rules.md` open contradiction 3. Money-moving — `Idempotency-Key` required; a replay never writes a second wallet debit (BR-17).
      x-permission: order.place
      x-business-rules: [BR-17, BR-21, BR-22]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKeyHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckoutRequest' }
            example:
              fulfillmentType: HOME_DELIVERY
              warehouseId: 3f1b7c2e-2a44-4f0e-9b1a-6b0d2f0f1a01
              deliveryAddressId: 8a7b6c5d-4e3f-4a2b-8c1d-0e9f8a7b6c5d
              deliveryDate: '2026-08-20'
              deliverySlot: MORNING_8_12
              paymentMethod: WALLET
      responses:
        '201':
          description: Order confirmed; the wallet has been debited and the delivery OTP issued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402':
          description: Wallet balance insufficient (BR-17a).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://docs.tohfa.in/problems/wallet-insufficient
                title: Wallet balance is insufficient
                status: 402
                detail: Order total is INR 412.50 and the wallet holds INR 180.00.
                code: WALLET_INSUFFICIENT
                traceId: 01J9F1B2C3D4E5F6G7H8J9K5
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }
    get:
      tags: [Cart & Orders]
      operationId: listOrders
      summary: Own order history
      description: |
        Lists the caller's own orders, newest first. There is no cross-customer visibility in
        either direction (BR-36).
      x-permission: order.view_own
      x-business-rules: [BR-36]
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
        - { name: status, in: query, schema: { $ref: '#/components/schemas/OrderStatus' } }
      responses:
        '200':
          description: Paged orders, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/OrderSummary' } }
                  page: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /orders/{id}:
    get:
      tags: [Cart & Orders]
      operationId: getOrder
      summary: Order detail
      description: Line items carry the grade and certification badges only — never the source farm (BR-16).
      x-permission: order.view_own
      x-business-rules: [BR-16, BR-36]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '200':
          description: Order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /orders/{id}/tracking:
    get:
      tags: [Cart & Orders]
      operationId: getOrderTracking
      summary: Order tracking timeline
      description: Confirmed -> Packed -> Dispatched -> Out for delivery -> Delivered. Poll this, or subscribe to `/orders/{id}/events` for pushes.
      x-permission: order.view_own
      x-business-rules: [BR-21, BR-36]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '200':
          description: Tracking timeline.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderTracking' }
              example:
                orderId: 5a4b3c2d-1e0f-4a9b-8c7d-6e5f4a3b2c1d
                status: OUT_FOR_DELIVERY
                otpRequired: true
                estimatedArrival: '2026-08-20T05:30:00Z'
                events:
                  - { status: CONFIRMED, at: '2026-08-18T06:31:00Z', note: null }
                  - { status: PACKED, at: '2026-08-19T02:10:00Z', note: Packed at Coonoor }
                  - { status: DISPATCHED, at: '2026-08-20T01:05:00Z', note: TN43AB1234 }
                  - { status: OUT_FOR_DELIVERY, at: '2026-08-20T04:40:00Z', note: null }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /orders/{id}/events:
    get:
      tags: [Cart & Orders]
      operationId: streamOrderEvents
      summary: Live order events (SSE)
      description: |
        Server-Sent Events stream. Each event is `event: order.status` with a JSON
        `OrderTrackingEvent` payload; a `: keepalive` comment is emitted every 20 seconds.
        The stream closes once the order reaches `DELIVERED` or `CANCELLED`. Clients
        resume with the standard `Last-Event-ID` header.
      x-permission: order.view_own
      x-business-rules: [BR-36]
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
        - { name: Last-Event-ID, in: header, required: false, schema: { type: string } }
      responses:
        '200':
          description: Event stream opened.
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE frames; the `data:` field of each frame is an `OrderTrackingEvent` JSON object.
              example: |
                event: order.status
                id: 42
                data: {"status":"PACKED","at":"2026-08-19T02:10:00Z","note":"Packed at Coonoor"}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /orders/{id}/reorder:
    post:
      tags: [Cart & Orders]
      operationId: reorder
      summary: One-tap reorder
      description: Rebuilds the cart from a past order, skipping anything unavailable today; skipped lines are reported in `unavailable`.
      x-permission: order.reorder_own
      x-business-rules: [BR-12, BR-22]
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
        - { $ref: '#/components/parameters/IdempotencyKeyHeader' }
      responses:
        '200':
          description: Cart rebuilt.
          content:
            application/json:
              schema:
                type: object
                required: [cart, unavailable]
                properties:
                  cart: { $ref: '#/components/schemas/Cart' }
                  unavailable:
                    type: array
                    items:
                      type: object
                      properties:
                        productId: { type: string, format: uuid }
                        name: { type: string }
                        reason: { type: string, enum: [OUT_OF_STOCK, DELISTED, INSUFFICIENT_ALLOCATION] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/orders:
    get:
      tags: [Fulfilment]
      operationId: listAdminOrders
      summary: Warehouse order queue
      description: A Sub Warehouse Admin sees only orders assigned to their warehouse; a cross-warehouse filter returns 403 `WAREHOUSE_SCOPE_VIOLATION` (BR-30).
      x-permission: order.list.view_all
      x-business-rules: [BR-30]
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
        - { name: status, in: query, schema: { $ref: '#/components/schemas/OrderStatus' } }
        - { name: warehouseId, in: query, schema: { type: string, format: uuid } }
        - { name: channel, in: query, schema: { $ref: '#/components/schemas/SalesChannel' } }
        - { name: deliveryDate, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Paged orders.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/OrderSummary' } }
                  page: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Warehouse scope violation.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://api.tohfa.in/problems/warehouse-scope-violation
                title: Warehouse scope violation
                status: 403
                detail: You are assigned to Coonoor and may not query Gudalur.
                code: WAREHOUSE_SCOPE_VIOLATION
                traceId: 01J9F1B2C3D4E5F6G7H8J9K6
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/orders/{id}/assign-warehouse:
    post:
      tags: [Fulfilment]
      operationId: assignOrderWarehouse
      summary: Assign or reassign an order to a warehouse
      description: |
        Assigns or reassigns the fulfilling warehouse for an order — a customer may collect from
        any of the four warehouses (BR-27). A Sub Warehouse Admin cannot assign orders to its
        own warehouse.
      x-permission: order.warehouse.assign
      x-business-rules: [BR-21, BR-27]
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
        - { $ref: '#/components/parameters/IdempotencyKeyHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [warehouseId]
              properties:
                warehouseId: { type: string, format: uuid }
                reason: { type: string, maxLength: 300 }
      responses:
        '200':
          description: Assigned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/orders/{id}/pack:
    post:
      tags: [Fulfilment]
      operationId: packOrder
      summary: Mark the order packed
      description: Consumes the reserved batches FEFO and appends `SALE` rows to the stock ledger (BR-37). Only valid from `CONFIRMED`.
      x-permission: order.mark_packed
      x-business-rules: [BR-30, BR-37]
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
        - { $ref: '#/components/parameters/IdempotencyKeyHeader' }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                packedLines:
                  type: array
                  items:
                    type: object
                    required: [orderItemId, fulfilledQtyKg]
                    properties:
                      orderItemId: { type: string, format: uuid }
                      fulfilledQtyKg: { $ref: '#/components/schemas/Quantity' }
      responses:
        '200':
          description: Packed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The order is not in a state that allows packing.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://api.tohfa.in/problems/invalid-state-transition
                title: Invalid state transition
                status: 409
                detail: Cannot pack an order in status DISPATCHED.
                code: INVALID_STATE_TRANSITION
                traceId: 01J9F1B2C3D4E5F6G7H8J9K7
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/orders/{id}/dispatch:
    post:
      tags: [Fulfilment]
      operationId: dispatchOrder
      summary: Dispatch a packed order
      description: |
        Transitions a packed order to `OUT_FOR_DELIVERY`. Track 1 fulfils every order by
        warehouse pickup (BR-21), so this path is specified but not enabled — see
        `docs/rules.md` open contradiction 3.
      x-permission: order.dispatch
      x-business-rules: [BR-21]
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
        - { $ref: '#/components/parameters/IdempotencyKeyHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                vehicleNumber: { type: string, maxLength: 20 }
                deliveryPartnerId: { type: string, format: uuid }
                expectedArrival: { type: string, format: date-time }
            example: { vehicleNumber: TN43AB1234, expectedArrival: '2026-08-20T05:30:00Z' }
      responses:
        '200':
          description: Dispatched.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/orders/{id}/verify-otp:
    post:
      tags: [Fulfilment]
      operationId: verifyOrderOtp
      summary: Verify the 4-digit handover OTP
      description: |
        Used for both doorstep delivery and warehouse pickup (BR-20, BR-21). Success moves
        the order to `DELIVERED` and releases the settlement due to the farmer. Three
        wrong codes lock the OTP and require it to be reissued.
      x-permission: order.pickup_otp.verify
      x-business-rules: [BR-20, BR-21, BR-30]
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
        - { $ref: '#/components/parameters/IdempotencyKeyHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [otp]
              properties:
                otp: { type: string, pattern: '^[0-9]{4}$' }
                podPhotoUrl: { type: string, format: uri }
            example: { otp: '4821' }
      responses:
        '200':
          description: Verified; the order is delivered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: The OTP did not match.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://api.tohfa.in/problems/invalid-otp
                title: Invalid OTP
                status: 422
                detail: 2 attempts remaining before this OTP is locked.
                code: OTP_INVALID
                traceId: 01J9F1B2C3D4E5F6G7H8J9K8
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /wallets/me:
    get:
      tags: [Wallet]
      operationId: getMyWallet
      summary: Own wallet balance
      description: The balance is derived from the append-only ledger, never edited directly.
      x-permission: wallet.own.view
      x-business-rules: [BR-36]
      responses:
        '200':
          description: Wallet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wallet' }
              example:
                id: c3d4e5f6-a7b8-4901-8234-56789abcdef0
                ownerType: CUSTOMER
                balance: '1820.50'
                currency: INR
                status: ACTIVE
                updatedAt: '2026-08-18T06:31:00Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /wallets/me/transactions:
    get:
      tags: [Wallet]
      operationId: listMyWalletTransactions
      summary: Own wallet ledger
      description: |
        Returns the caller's own append-only wallet ledger, newest first. Balances are derived
        from these rows and are never edited in place (BR-36).
      x-permission: wallet.own.view
      x-business-rules: [BR-36]
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
        - { name: type, in: query, schema: { $ref: '#/components/schemas/WalletTransactionType' } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Paged ledger rows, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/WalletTransaction' } }
                  page: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /wallets/me/topups:
    post:
      tags: [Wallet]
      operationId: createTopup
      summary: Start a digital top-up (Razorpay)
      description: |
        Creates a Razorpay order and returns the parameters the mobile SDK needs. The
        wallet is **not** credited here — it is credited when the signed
        `payment.captured` webhook arrives. Money-moving, so `Idempotency-Key`
        is required.
      x-permission: wallet.topup.digital
      x-business-rules: []
      parameters: [{ $ref: '#/components/parameters/IdempotencyKeyHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, mode]
              properties:
                amount: { $ref: '#/components/schemas/Money' }
                mode: { type: string, enum: [UPI, CARD, NETBANKING] }
            example: { amount: '1000.00', mode: UPI }
      responses:
        '201':
          description: Gateway order created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopupIntent' }
              example:
                topupId: d4e5f6a7-b8c9-4012-8345-6789abcdef01
                gateway: RAZORPAY
                gatewayOrderId: order_QhX2mK9pLr4tZa
                amount: '1000.00'
                currency: INR
                status: PENDING
                razorpayKeyId: rzp_test_1DP5mmOlF5G5ag
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /webhooks/razorpay:
    post:
      tags: [Wallet]
      operationId: razorpayWebhook
      summary: Razorpay webhook receiver
      description: |
        Public but authenticated by HMAC — the raw body is verified against
        `X-Razorpay-Signature` before parsing. Events are deduplicated on the Razorpay
        event id, so redelivery is safe. An invalid signature returns 401.
      security: []
      x-permission: public
      x-business-rules: []
      parameters:
        - { name: X-Razorpay-Signature, in: header, required: true, schema: { type: string } }
        - { name: X-Razorpay-Event-Id, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event, payload]
              properties:
                event: { type: string, examples: [payment.captured, payment.failed, payout.processed] }
                created_at: { type: integer }
                payload: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Accepted (also returned for a duplicate event id).
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: { type: boolean }
                  duplicate: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/wallets/{customerId}/cash-topup:
    post:
      tags: [Wallet]
      operationId: createCashTopup
      summary: Process a cash top-up at a warehouse
      description: |
        The customer hands cash to the warehouse admin, who records the fiscal cash tag.
        The wallet is credited server-side and an SMS is sent (BR-18). The cap is
        INR 10,000 per transaction — above it the call fails 422
        `CASH_LIMIT_EXCEEDED`. Only admins assigned to that warehouse may process it
        (BR-30).
      x-permission: wallet.cash_topup.process
      x-business-rules: [BR-18, BR-19, BR-30]
      parameters:
        - { name: customerId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKeyHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CashTopupCreate' }
            example:
              amount: '5000.00'
              warehouseId: 3f1b7c2e-2a44-4f0e-9b1a-6b0d2f0f1a01
              fiscalCashTag: OOTY-2026-08-18-0042
              remarks: Cash received at counter 2.
      responses:
        '201':
          description: Wallet credited; the ledger row is returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalletTransaction' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Cap exceeded.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://api.tohfa.in/problems/cash-topup-cap-exceeded
                title: Cash top-up cap exceeded
                status: 422
                detail: Cash top-up is capped at INR 10,000.00 per transaction.
                code: CASH_LIMIT_EXCEEDED
                traceId: 01J9F1B2C3D4E5F6G7H8J9K9
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/payout-dues:
    get:
      tags: [Payouts & Invoices]
      operationId: listPayoutDues
      summary: Farmer payout dues, aged
      description: Dues arise once goods are accepted at quality check. Ageing buckets are 7 / 15 / 30 days.
      x-permission: payout.dues.view
      x-business-rules: []
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
        - { name: farmerId, in: query, schema: { type: string, format: uuid } }
        - { name: ageBucket, in: query, schema: { type: string, enum: [D0_7, D8_15, D16_30, D30_PLUS] } }
      responses:
        '200':
          description: Paged dues.
          content:
            application/json:
              schema:
                type: object
                required: [items, page, totals]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/PayoutDue' } }
                  page: { $ref: '#/components/schemas/PageMeta' }
                  totals:
                    type: object
                    properties:
                      totalDue: { $ref: '#/components/schemas/Money' }
                      farmerCount: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/payouts:
    post:
      tags: [Payouts & Invoices]
      operationId: createPayout
      summary: Initiate a farmer payout
      description: |
        Payouts up to INR 10,000 are released on a single approval. Above that the payout
        is created in `PENDING_APPROVAL` and needs a second, Super Admin approval
        (BR-31); attempting to release it directly returns 403 `DUAL_APPROVAL_REQUIRED`.
        Money-moving — `Idempotency-Key` required.
      x-permission: payout.farmer.initiate
      x-business-rules: [BR-31]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKeyHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayoutCreate' }
            example:
              farmerId: 9f8e7d6c-5b4a-4392-8180-7f6e5d4c3b2a
              amount: '18400.00'
              mode: IMPS
              bankAccountId: 2b3c4d5e-6f70-4812-8934-5a6b7c8d9e0f
              dueIds: [7a6b5c4d-3e2f-4108-8927-6b5a4c3d2e1f]
      responses:
        '201':
          description: Payout created. `requiresDualApproval` tells the client whether a second approval is outstanding.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payout' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/payouts/{id}/approve:
    post:
      tags: [Payouts & Invoices]
      operationId: approvePayout
      summary: Approve a payout
      description: |
        The initiator may never be an approver (BR-31, 403 `SAME_ACTOR_APPROVAL`), and
        the two approvers must be different people. For amounts above INR 10,000 the
        second approver must hold the Super Admin role (BR-31). Once both approvals are
        in, the payout is submitted to RazorpayX.
      x-permission: payout.approve_above_10k
      x-business-rules: [BR-31]
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
        - { $ref: '#/components/parameters/IdempotencyKeyHeader' }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Approval recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payout' }
              example:
                id: 3c4d5e6f-7081-4923-8a45-6b7c8d9e0f12
                payoutNumber: PO-2026-000871
                farmerId: 9f8e7d6c-5b4a-4392-8180-7f6e5d4c3b2a
                amount: '18400.00'
                mode: IMPS
                status: APPROVED
                requiresDualApproval: true
                initiatedBy: 2a9f0d1b-7c3e-4a55-9f0b-1e2d3c4b5a60
                approvedBy: [6c5d4e3f-2a19-4087-8b76-5c4d3e2f1a09, 4d3c2b1a-0f9e-4d8c-9b7a-6e5d4c3b2a19]
                approvedAt: '2026-08-18T07:02:00Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Self-approval of a payout is refused.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://api.tohfa.in/problems/self-approval-of-payout
                title: Self-approval of a payout is not permitted
                status: 403
                detail: You initiated payout PO-2026-000871; a different approver is required.
                code: SAME_ACTOR_APPROVAL
                traceId: 01J9F1B2C3D4E5F6G7H8J9KA
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /invoices:
    get:
      tags: [Payouts & Invoices]
      operationId: listInvoices
      summary: Own invoices
      description: Farmers see purchase invoices, customers see sale invoices, admins see everything in scope. GST invoices exist only for B2B and Horeca, which are out of scope in Track 1 (BR-15).
      x-permission: invoice.view_own
      x-business-rules: [BR-16, BR-36]
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
        - { name: type, in: query, schema: { $ref: '#/components/schemas/InvoiceType' } }
        - { name: fromDate, in: query, schema: { type: string, format: date } }
        - { name: toDate, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Paged invoices.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Invoice' } }
                  page: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /invoices/{id}:
    get:
      tags: [Payouts & Invoices]
      operationId: getInvoice
      summary: Invoice detail with lines
      description: |
        Returns one invoice with its line items. A farmer or customer sees only their own, and a
        customer invoice names TOHFA as the seller, never the farm (BR-16, BR-36).
      x-permission: invoice.view_own
      x-business-rules: [BR-16, BR-36]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '200':
          description: Invoice.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /invoices/{id}/download:
    get:
      tags: [Payouts & Invoices]
      operationId: downloadInvoice
      summary: Download the invoice PDF
      description: Returns the PDF inline, or a 302 to a short-lived signed CDN URL when `redirect=true`.
      x-permission: invoice.view_own
      x-business-rules: [BR-16, BR-36]
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
        - { name: redirect, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: The invoice PDF.
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '302':
          description: Redirect to a signed URL valid for 5 minutes.
          headers:
            Location: { schema: { type: string, format: uri } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /notifications:
    get:
      tags: [Platform]
      operationId: listNotifications
      summary: Own notifications
      description: |
        Lists the caller's own notifications, unread first.
      x-permission: notification.own.view
      x-business-rules: []
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
        - { name: unreadOnly, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Paged notifications.
          content:
            application/json:
              schema:
                type: object
                required: [items, page, unreadCount]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Notification' } }
                  page: { $ref: '#/components/schemas/PageMeta' }
                  unreadCount: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /notifications/{id}/read:
    post:
      tags: [Platform]
      operationId: markNotificationRead
      summary: Mark a notification read
      description: |
        Marks one of the caller's own notifications as read. Repeating the call is a no-op, not
        an error.
      x-permission: notification.own.mark_read
      x-business-rules: []
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '200':
          description: Marked read.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /notifications/device-tokens:
    post:
      tags: [Platform]
      operationId: registerDeviceToken
      summary: Register device token for push notifications
      description: |
        Registers or updates an FCM device token for the authenticated user (S-50).
      x-permission: notification.own.view
      x-business-rules: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, platform, app]
              properties:
                token: { type: string, minLength: 1, maxLength: 512 }
                platform: { type: string, enum: [android, ios, web] }
                app: { type: string, enum: [farmer-mobile, customer-mobile, admin-web] }
                locale: { type: string, enum: [en, ta], default: en }
      responses:
        '201':
          description: Device token registered.
          content:
            application/json:
              schema:
                type: object
                required: [id, token, platform, app, locale, revoked, lastSeen]
                properties:
                  id: { type: string, format: uuid }
                  token: { type: string }
                  platform: { type: string }
                  app: { type: string }
                  locale: { type: string }
                  revoked: { type: boolean }
                  lastSeen: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /notifications/device-tokens/{token}:
    delete:
      tags: [Platform]
      operationId: revokeDeviceToken
      summary: Revoke a registered device token
      description: |
        Revokes an FCM device token so no further push notifications are routed to it (S-50).
      x-permission: notification.own.view
      x-business-rules: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Revocation result.
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /notification-preferences:
    get:
      tags: [Platform]
      operationId: listNotificationPreferences
      summary: Own notification-category preferences
      description: |
        Returns the caller's push-notification category toggles (farmer app Settings, screen 73).
        Always all five categories, in a fixed order; a category the caller has never changed is
        reported as `enabled: true` (no stored row means enabled). A disabled category suppresses
        only the PUSH alert for the events mapped to it; the in-app (Notifications Center) and SMS
        notifications are still created (BR-52). Events that map to no category are unaffected.
      x-permission: notification.own.view
      x-business-rules: [BR-52]
      responses:
        '200':
          description: All five category preferences.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    minItems: 5
                    maxItems: 5
                    items: { $ref: '#/components/schemas/NotificationPreference' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /notification-preferences/{category}:
    patch:
      tags: [Platform]
      operationId: updateNotificationPreference
      summary: Turn one notification category on or off
      description: |
        Sets the caller's own preference for one category. Idempotent: repeating the same value is
        a no-op, not an error. An unknown category is a validation failure (422), like any other
        malformed path parameter.
      x-permission: notification.own.view
      x-business-rules: [BR-52]
      parameters:
        - name: category
          in: path
          required: true
          schema: { $ref: '#/components/schemas/NotificationCategory' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: The stored preference.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreference' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/audit-log:
    get:
      tags: [Platform]
      operationId: getAuditLog
      summary: Immutable system audit log
      description: |
        Every privileged action is recorded here. Warehouse admins see only entries scoped
        to their own warehouse (BR-30). Entries are append-only and are never redacted.
      x-permission: auditlog.view
      x-business-rules: [BR-30, BR-35]
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
        - { name: actorId, in: query, schema: { type: string, format: uuid } }
        - { name: action, in: query, schema: { type: string, examples: [payout.approve, listing.approve] } }
        - { name: entityType, in: query, schema: { type: string } }
        - { name: entityId, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Paged audit entries.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AuditLogEntry' } }
                  page: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /healthz:
    get:
      tags: [Platform]
      operationId: healthz
      summary: Liveness probe
      description: |
        Liveness only: returns 200 while the process is running. It deliberately touches no
        dependency, so a Postgres or Redis outage never restarts the container.
      security: []
      x-permission: public
      x-business-rules: []
      responses:
        '200':
          description: The process is alive.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
                  version: { type: string }
              example: { status: ok, version: 1.0.0 }

  /readyz:
    get:
      tags: [Platform]
      operationId: readyz
      summary: Readiness probe
      description: Reports the health of every downstream dependency. Returns 503 while any required dependency is down.
      security: []
      x-permission: public
      x-business-rules: []
      responses:
        '200':
          description: Ready to serve traffic.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
              example:
                status: ready
                checks:
                  - { name: postgres, status: up, latencyMs: 3 }
                  - { name: redis, status: up, latencyMs: 1 }
                  - { name: razorpay, status: up, latencyMs: 118 }
                  - { name: blob-storage, status: up, latencyMs: 42 }
        '503':
          description: Not ready.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }

  /uploads/sign:
    post:
      tags: [Platform]
      operationId: signUpload
      summary: Get a signed URL for a direct upload
      description: |
        Clients upload documents, certificates, produce photos and pod photos directly to
        blob storage using the returned pre-signed URL, then send the resulting `fileUrl`
        to the relevant endpoint. Large files may be uploaded in resumable chunks.
      x-permission: upload.signed_url.create
      x-business-rules: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignUploadRequest' }
            example: { purpose: CERTIFICATE, contentType: application/pdf, sizeBytes: 481203, fileName: npop-2026.pdf }
      responses:
        '201':
          description: Signed upload target.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignedUploadTarget' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /uploads/mock/*:
    put:
      tags: [Platform]
      operationId: mockUploadReceiver
      summary: Dev/test-only receiving end of a mock signed upload URL
      description: |
        Not a real API endpoint for clients to call directly — it exists only because
        `POST /uploads/sign` returns a real `uploadUrl` clients PUT the file bytes to next,
        and in dev/test (`AZURE_STORAGE_CONNECTION_STRING` unset) that URL points back at
        this app instead of a real Azure/Cloudinary host, since `createBlobStorage()` falls
        back to `InMemoryBlobStorage`. A production deployment with real storage credentials
        never mounts a URL under this path — the signed URL points at the real provider.
        No auth: this stands in for a third-party storage provider whose real security is
        the pre-signed URL's own time-limited secrecy, not this app's session.
      x-permission: public
      x-business-rules: []
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '201':
          description: Bytes stored; returns the durable file URL.
          content:
            application/json:
              schema:
                type: object
                required: [fileUrl]
                properties:
                  fileUrl: { type: string, format: uri }
        '400': { $ref: '#/components/responses/BadRequest' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Short-lived RS256 access token from `/auth/login`, `/auth/otp/verify` or
        `/auth/refresh`. Claims: `sub` (user id), `typ` (farmer|customer|admin),
        `roles[]`, `wh` (assigned warehouse id, for Sub Warehouse Admins), `exp`.
        Role and warehouse claims are advisory for the client only — the server always
        re-resolves permissions from `rbac.json` per request.

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    OfferIdParam:
      name: offerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AuditFindingIdParam:
      name: findingId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CursorParam:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from the previous page's `page.nextCursor`. Omit for the first page.
      schema: { type: string, maxLength: 512 }
    LimitParam:
      name: limit
      in: query
      required: false
      description: Page size.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Client-generated UUIDv4, unique per logical operation. Required on every
        money-moving or otherwise non-repeatable POST. Replaying the same key
        with an identical body returns the original response; replaying it with a
        different body returns 409 `IDEMPOTENCY_KEY_REUSED`. Keys are retained 24 hours.
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.tohfa.in/problems/bad-request
            title: Malformed request
            status: 400
            detail: Request body is not valid JSON.
            code: BAD_REQUEST
            traceId: 01J9F1B2C3D4E5F6G7H8J9KB
    Unauthorized:
      description: Missing, expired or invalid credentials.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.tohfa.in/problems/unauthorized
            title: Authentication required
            status: 401
            detail: The access token has expired.
            code: UNAUTHENTICATED
            traceId: 01J9F1B2C3D4E5F6G7H8J9KC
    Forbidden:
      description: Authenticated but not permitted — RBAC or warehouse scope.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.tohfa.in/problems/forbidden
            title: Permission denied
            status: 403
            detail: Your role does not hold listing.approve.
            code: FORBIDDEN
            traceId: 01J9F1B2C3D4E5F6G7H8J9KD
    NotFound:
      description: No such resource, or it is outside your scope.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.tohfa.in/problems/not-found
            title: Resource not found
            status: 404
            detail: No listing with id 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d.
            code: NOT_FOUND
            traceId: 01J9F1B2C3D4E5F6G7H8J9KE
    Conflict:
      description: The resource is not in a state that allows this operation.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.tohfa.in/problems/invalid-state-transition
            title: Invalid state transition
            status: 409
            detail: The listing is already approved.
            code: INVALID_STATE_TRANSITION
            traceId: 01J9F1B2C3D4E5F6G7H8J9KF
    UnprocessableEntity:
      description: Well-formed but semantically invalid — field validation or a business rule. Any string in a body, query or path that contains a NUL (U+0000) character is refused here too, with the field path in `errors` (database text cannot hold it).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.tohfa.in/problems/validation-failed
            title: Validation failed
            status: 422
            detail: 2 fields failed validation.
            code: VALIDATION_FAILED
            traceId: 01J9F1B2C3D4E5F6G7H8J9KG
            errors:
              body.askingPricePerKg: [Must be a positive amount with at most 2 decimal places.]
              body.quantityKg: [Must be at least 1.000 kg.]
    TooManyRequests:
      description: Rate limited.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.tohfa.in/problems/rate-limited
            title: Too many requests
            status: 429
            detail: OTP resend is limited to one per 60 seconds.
            code: RATE_LIMITED
            traceId: 01J9F1B2C3D4E5F6G7H8J9KH
    ServerError:
      description: Unexpected server error. Quote the traceId to support.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.tohfa.in/problems/internal-error
            title: Internal server error
            status: 500
            detail: An unexpected error occurred.
            code: INTERNAL
            traceId: 01J9F1B2C3D4E5F6G7H8J9KJ

  schemas:
    Warehouse:
      type: object
      description: A warehouse holding consolidated farmer inventory (BR-24).
      required: [id, code, name, type, isActive, createdAt]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: WH-CBE-MAIN }
        name: { type: string, example: Coimbatore Main Warehouse }
        type: { type: string, enum: [MAIN, SUB] }
        city: { type: string, nullable: true, example: Coonoor }
        capacityKg: { type: number, nullable: true, description: Storage capacity in kg. }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }

    Problem:
      type: object
      description: |
        RFC 9457 problem detail. Every non-2xx response in this API uses this shape with
        media type `application/problem+json`.

        `code` is the stable, machine-readable discriminator — clients switch on it, never
        on `title` or `detail`, which are human-facing and may be reworded or localized.

        Generic codes (the transport-level half of `ProblemCode` in
        `packages/shared-types/src/errors.ts`): `BAD_REQUEST`, `VALIDATION_FAILED`,
        `UNAUTHENTICATED`, `FORBIDDEN`, `NOT_FOUND`, `CONFLICT`, `RATE_LIMITED`,
        `INTERNAL`.

        Domain codes — every one of these exists in the `ErrorCode` union in
        `packages/shared-types/src/errors.ts`, and `pnpm spec:drift` fails the build if
        this list and that file disagree:

        * `CERT_EXPIRED` — the farmer holds no verified, unexpired certificate (one has expired, or the farmer's market block is set); listings are blocked (BR-01).
        * `CERT_UNVERIFIED` — the farmer holds no verified, unexpired certificate and an unexpired one is awaiting admin verification (BR-02).
        * `CERT_MISSING` — the farmer holds no verified, unexpired PGS or NPOP certificate and none is pending or expired: no certificate on file, or only rejected ones; listings are blocked (BR-02).
        * `PRICE_ABOVE_CEILING` — a listing price exceeds the fair price ceiling (BR-07).
        * `RETAIL_ABOVE_CEILING` — a retail price exceeds the fair price ceiling (BR-09).
        * `FREE_TIER_LIMIT` — the free-tier listing quota is exhausted; a subscription is required (BR-14).
        * `LISTING_NOT_PENDING` — the listing is no longer editable or actionable.
        * `COUNTER_LIMIT_REACHED` — all 3 counter rounds have been used (BR-11).
        * `COUNTER_OFFER_EXPIRED` — the 24-hour counter-offer window has closed (BR-10).
        * `SELF_APPROVAL_FORBIDDEN` — an actor may not approve their own submission (BR-29, BR-37).
        * `WAREHOUSE_SCOPE_VIOLATION` — a Sub Warehouse Admin reached outside their warehouse (BR-30).
        * `WAREHOUSE_REQUIRED` — a warehouse-scoped role was created without a warehouse (BR-25).
        * `WALLET_INSUFFICIENT` — wallet-first checkout needs a top-up (BR-17).
        * `CASH_LIMIT_EXCEEDED` — cash top-up above INR 10,000 (BR-19).
        * `FISCAL_TAG_REQUIRED` — a cash top-up arrived without its fiscal cash tag (BR-18).
        * `DUAL_APPROVAL_REQUIRED` — a payout above INR 10,000 needs a second approval (BR-31).
        * `SAME_ACTOR_APPROVAL` — the initiator may not also approve (BR-31).
        * `STOCK_UNAVAILABLE` — not enough sellable stock for the requested quantity.
        * `INSUFFICIENT_ALLOCATION` — the channel's allocated quantity is used up (BR-12).
        * `ALLOCATION_SUM_INVALID` — the channel percentages do not sum to 100 (BR-12).
        * `CART_LOCK_EXPIRED` — the 24-hour cart reservation lapsed (BR-22).
        * `OTP_INVALID` — the supplied OTP did not match (BR-20, BR-32).
        * `OTP_EXPIRED` — the OTP challenge is past its validity window (BR-32).
        * `OTP_LOCKED` — three failed attempts; a new challenge is required (BR-32).
        * `OTP_RESEND_TOO_SOON` — a resend was requested inside the 60-second window (BR-32).
        * `OTP_SMS_DELIVERY_FAILED` — the configured SMS provider rejected or failed to send the OTP (BR-32).
        * `AUDIT_QUARTER_TAKEN` — that farmer already has a non-cancelled audit in this fiscal year and quarter (BR-03).
        * `SCORE_OUT_OF_RANGE` — a rating or audit category score is out of range (BR-06).
        * `AUDIT_INCOMPLETE` — an audit cannot be completed because one or more of its 10 category scores is missing; a missing category is incomplete, not zero (BR-06).
        * `FIELD_LOCKED` — Aadhaar or mobile may only be changed by a Super Admin (BR-33).
        * `INVALID_STATE_TRANSITION` — the entity is not in a state that permits this operation.
        * `IDEMPOTENCY_KEY_REUSED` — the key was reused with a different payload.
        * `WEATHER_PROVIDER_ERROR` — the upstream weather provider was unreachable or misconfigured.
        * `OAUTH_TOKEN_INVALID` — Google/Facebook rejected, or could not verify, the provided token (BR-39).
        * `OAUTH_IDENTITY_ALREADY_LINKED` — that provider identity is already linked to a different account (BR-39).
        * `OAUTH_LINK_TOKEN_INVALID` — the `linkToken` passed to `/auth/otp/verify` is expired, malformed or tampered with (BR-39).
        * `DIARY_INVALID_SUB_ACTIVITY` — the sub-activity does not belong to the given activity category (BR-42).
        * `DIARY_NO_ACTIVE_CROP` — the plot has no farm_crops row in status GROWING (BR-42).
        * `DIARY_MINUTES_REQUIRED` — diary entry time-spent minutes is missing or not greater than zero (BR-42).
        * `DIARY_WORKER_HOURS_INVALID` — a diary workforce entry's hoursWorked is not greater than 0 and at most 24 (BR-44).
        * `DIARY_WAGE_RATE_INVALID` — a diary workforce entry's wageRatePaise is not a positive integer number of paise (BR-44).
        * `CROP_PLOT_ALREADY_GROWING` — the plot already has another live crop in status GROWING (BR-46).
        * `LIVESTOCK_ALREADY_EXITED` — the animal already has a lifecycle event recorded; it cannot leave the herd twice (BR-47).
        * `TRAINING_FULL` — the training workshop has reached full capacity (BR-59).
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          description: A URI identifying the problem type; dereferences to human documentation.
          examples: [https://api.tohfa.in/problems/price-above-ceiling]
        title:
          type: string
          description: Short, human-readable summary. Stable per `type`, but not machine-parsed.
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: Repeats the HTTP status code.
        detail:
          type: [string, 'null']
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: [string, 'null']
          format: uri-reference
          description: URI reference identifying the specific occurrence.
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
          description: Machine-readable error code in SCREAMING_SNAKE_CASE. Switch on this.
          examples: [PRICE_ABOVE_CEILING, CART_LOCK_EXPIRED]
        traceId:
          type: string
          description: |
            Request correlation id: the same value the server returns in the `x-correlation-id`
            response header and writes on every log line for the request. Always quote this to
            support. Omitted only for an error rendered outside a request context. (Earlier
            revisions of this spec named this field `correlationId`; the server sends `traceId`,
            see `AppError.toProblem` in `apps/api/src/http/problem.ts`.)
          examples: ['01J9F1B2C3D4E5F6G7H8J9K0']
        errors:
          type: object
          description: |
            Per-field validation failures, present on 422 `VALIDATION_FAILED`. A map, not a list:
            each key is the dotted path of the offending input prefixed with the request part
            (`body.`, `query.`, `params.`), e.g. `body.expiresOn` or `body.items.2.qtyKg` (`body`
            alone when the whole body is wrong); each value is a non-empty list of English,
            human-readable messages for that input. Clients bind errors to form fields by key and
            should treat the message text as a display fallback, never parse it.
          additionalProperties:
            type: array
            minItems: 1
            items: { type: string }
          examples:
            - body.expiresOn: ['Must be a real calendar date in YYYY-MM-DD format']
              body.certNumber: ['String must contain at least 1 character(s)']
        meta:
          type: object
          additionalProperties: true
          description: Extra machine-readable context for some codes, e.g. `ceilingPrice` and `attemptedPrice` on `PRICE_ABOVE_CEILING`.

    PageMeta:
      type: object
      description: Cursor pagination envelope. Cursors are opaque and must not be parsed or constructed by clients.
      required: [nextCursor, hasMore]
      properties:
        nextCursor:
          type: [string, 'null']
          description: Pass back as `cursor` to fetch the next page; null on the last page.
        hasMore: { type: boolean }

    SignUploadRequest:
      type: object
      description: |
        Request body shared by `POST /uploads/sign` (an authenticated user signing an upload)
        and `POST /farmers/applications/{id}/uploads/sign` (its registration-scoped, auth-free
        sibling for an applicant who has no account yet).
      required: [purpose, contentType, sizeBytes]
      properties:
        purpose:
          type: string
          enum: [FARMER_DOCUMENT, CERTIFICATE, LISTING_PHOTO, GRN_PHOTO, QC_PHOTO, POD_PHOTO, PROFILE_PHOTO, ISSUE_PHOTO, DIARY_PHOTO, DIARY_VOICE_NOTE, SOIL_TEST_REPORT, PEST_PHOTO, WORKER_PHOTO, WORKER_ID_PROOF, AUDIT_REPORT]
        contentType: { type: string, examples: [image/jpeg, application/pdf] }
        sizeBytes: { type: integer, minimum: 1, maximum: 26214400 }
        fileName: { type: string, maxLength: 200 }

    SignedUploadTarget:
      type: object
      description: |
        A pre-signed direct-upload target, returned by `POST /uploads/sign` and its
        registration-scoped sibling `POST /farmers/applications/{id}/uploads/sign`.
      required: [id, uploadUrl, fileUrl, storageKey, method, expiresAt]
      properties:
        id: { type: string, format: uuid, description: The `uploads` table row id this signed target was recorded against. Pass this back as e.g. `photoUploadId`/`labReportUploadId`/`idProofUploadId` when creating the parent record (a pest detection, a soil test, a worker, etc.) so it can be linked to this upload. }
        uploadUrl: { type: string, format: uri }
        fileUrl: { type: string, format: uri, description: The durable URL to send back to the API once the upload completes. }
        storageKey: { type: string, description: The key this upload was minted under — pass it back to whatever endpoint needs to reference the finished upload (e.g. attaching a diary photo, a listing photo, etc.). }
        method: { type: string, enum: [PUT, POST] }
        headers: { type: object, additionalProperties: { type: string } }
        expiresAt: { type: string, format: date-time }
        resumable: { type: boolean }

    Money:
      type: string
      pattern: '^-?[0-9]{1,10}(\.[0-9]{1,2})?$'
      description: |
        A monetary amount in INR as a **decimal string**, e.g. `"1820.50"`.

        Money is a string, never a JSON number, because IEEE-754 doubles cannot represent
        decimal fractions exactly: JavaScript clients silently turn `0.1 + 0.2` into
        `0.30000000000000004`, and a wallet ledger that must reconcile to the paisa
        cannot tolerate that. Serialising as a string preserves the exact value the
        server computed with `NUMERIC(12,2)` and forces clients to use a decimal library
        rather than accidental float arithmetic. Negative values are permitted only on
        ledger rows, where they denote a debit.
      examples: ['1820.50', '-412.00', '0.00']

    Quantity:
      type: string
      pattern: '^-?[0-9]{1,9}(\.[0-9]{1,3})?$'
      description: A weight in kilograms as a decimal string with up to 3 decimal places. String for the same reason as `Money`.
      examples: ['250.000', '1.500']

    Mobile:
      type: string
      pattern: '^\+91[6-9][0-9]{9}$'
      description: Indian mobile number in E.164.
      examples: ['+919876543210']

    Locale:
      type: string
      enum: [en, ta]
      default: en
      description: English (primary) or Tamil.

    Grade:
      type: string
      enum: [GRADE_1, GRADE_2, GRADE_3, REJECT]
      description: Produce grade. `REJECT` is never sellable and never appears on the customer surface.

    CertificationType:
      type: string
      enum: [PGS, NPOP, OTHER]
      description: |
        PGS Organic, NPOP, or OTHER (any other organic certification — e.g. Jaivik
        Bharat, USDA Organic, EU Organic — entered as free text in `issuingBody`). The
        farmer app's certification-type picker already offered these other schemes
        under `OTHER` before the backend accepted the value; `OTHER` was added here to
        match, not to introduce new client behaviour.

    OrderStatus:
      type: string
      enum: [CONFIRMED, PACKED, DISPATCHED, OUT_FOR_DELIVERY, DELIVERED, CANCELLED]

    CounterOfferStatus:
      type: string
      enum: [PENDING, ACCEPTED, REJECTED, COUNTERED, LAPSED]
      description: A `PENDING` offer becomes `LAPSED` automatically 24 hours after creation (BR-10); a lapse is neither an acceptance nor a rejection.

    ApplicationStatus:
      type: string
      enum: [DRAFT, SUBMITTED, DOCS_REVIEW, FARM_VERIFICATION, AUDIT, INFO_REQUESTED, APPROVED, REJECTED]
      description: The fixed farmer application timeline.

    ListingStatus:
      type: string
      enum: [DRAFT, PENDING_APPROVAL, COUNTER_OFFERED, ACCEPTED, REJECTED, WITHDRAWN, EXPIRED, FULFILLED]

    PurchaseOrderStatus:
      type: string
      enum: [ISSUED, PARTIALLY_RECEIVED, RECEIVED, CANCELLED]

    BatchStatus:
      type: string
      enum: [ACTIVE, DEPLETED, EXPIRED, WRITTEN_OFF]

    StockTxnType:
      type: string
      enum: [RECEIPT, SALE, TRANSFER_OUT, TRANSFER_IN, ADJUSTMENT, WASTAGE, RETURN_IN, RESERVATION, RELEASE]

    WalletTransactionType:
      type: string
      enum: [TOPUP_CASH, TOPUP_DIGITAL, ORDER_DEBIT, ORDER_REFUND, PAYOUT_DEBIT, SALE_CREDIT, SUBSCRIPTION_DEBIT, ADJUSTMENT]

    AllocationChannel:
      type: string
      enum: [ONLINE, LIVE_MARKET, RESERVE, BUFFER]
      description: |
        The four allocation buckets of BR-12 — ONLINE 70%, LIVE_MARKET 10%,
        RESERVE 10% (marriages and functions), BUFFER 10%. B2B and Horeca draw from
        BUFFER and RESERVE; they are sales channels, not allocation buckets.

    SalesChannel:
      type: string
      enum: [ONLINE, MARKET, HORECA, B2B]

    InvoiceType:
      type: string
      enum: [SALE_RETAIL, SALE_B2B, PURCHASE_FARMER, PAYOUT, SUBSCRIPTION]

    PayoutStatus:
      type: string
      enum: [REQUESTED, PENDING_APPROVAL, APPROVED, PROCESSING, PAID, FAILED, REVERSED]

    FulfillmentType:
      type: string
      enum: [HOME_DELIVERY, WAREHOUSE_PICKUP]
      description: Every order supports warehouse pickup (BR-21); delivery is contested — see `docs/rules.md` open contradiction 3.

    DeliverySlot:
      type: string
      enum: [MORNING_8_12, AFTERNOON_12_4, EVENING_4_8]

    PaymentMethod:
      type: string
      enum: [WALLET, UPI, CARD, NETBANKING, COD]
      description: Wallet is the primary method (BR-17). COD availability is configuration-gated.

    CustomerRegistrationRequest:
      type: object
      required: [mobile, fullName, password]
      properties:
        mobile: { $ref: '#/components/schemas/Mobile' }
        fullName: { type: string, minLength: 2, maxLength: 120 }
        email: { type: [string, 'null'], format: email }
        password: { type: string, minLength: 10, maxLength: 128 }
        preferredLocale: { $ref: '#/components/schemas/Locale' }
        preferredWarehouseId: { type: [string, 'null'], format: uuid }

    RegistrationAccepted:
      type: object
      required: [userId, status, otpExpiresAt]
      properties:
        userId: { type: string, format: uuid }
        status: { type: string, enum: [PENDING_OTP] }
        otpExpiresAt: { type: string, format: date-time }
        resendAvailableAt: { type: string, format: date-time }

    OtpSendRequest:
      type: object
      required: [mobile, purpose]
      properties:
        mobile: { $ref: '#/components/schemas/Mobile' }
        purpose: { type: string, enum: [REGISTRATION, LOGIN, PASSWORD_RESET] }

    OtpChallenge:
      type: object
      required: [challengeId, expiresAt, attemptsRemaining]
      properties:
        challengeId: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }
        resendAvailableAt: { type: string, format: date-time, description: 60 seconds after dispatch (BR-32). }
        attemptsRemaining: { type: integer, maximum: 3, description: Lockout at 0 (BR-32). }

    OtpVerifyRequest:
      type: object
      required: [challengeId, code]
      properties:
        challengeId: { type: string, format: uuid }
        code: { type: string, pattern: '^[0-9]{6}$' }
        deviceId: { type: string, maxLength: 120 }
        platform: { type: string, enum: [ios, android, web] }
        linkToken:
          type: string
          description: |
            BR-39, optional. The `linkToken` returned by `POST /auth/oauth/{provider}`'s
            NOT_LINKED response, identifying which verified provider identity to link once this
            OTP verification succeeds. Omitted on a plain mobile+OTP verify.

    OtpVerifyResponse:
      description: |
        `TokenPair`, plus BR-39's additive/optional `oauthProfile` — present only when the
        request carried a `linkToken`, so the mobile client can prefill Step 1 of its
        registration stepper without a second API call.
      allOf:
        - $ref: '#/components/schemas/TokenPair'
        - type: object
          properties:
            oauthProfile: { $ref: '#/components/schemas/OAuthProfile' }

    LoginRequest:
      type: object
      required: [mobile, password]
      properties:
        mobile: { $ref: '#/components/schemas/Mobile' }
        password: { type: string, minLength: 1, maxLength: 128 }
        roleCode:
          type: string
          description: Required on the second call when the account holds multiple admin roles.
          enum: [SUPER_ADMIN, TOHFA_ADMIN, FARMER_ADMIN, MAIN_WH_ADMIN, SUB_WH_ADMIN]
        deviceId: { type: string, maxLength: 120 }
        platform: { type: string, enum: [ios, android, web] }
        rememberDevice: { type: boolean, default: false }

    TokenPair:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: integer, description: Access token lifetime in seconds. }
        requiresRoleSelection: { type: boolean, default: false }
        availableRoles:
          type: array
          items: { $ref: '#/components/schemas/RoleAssignment' }
        user: { $ref: '#/components/schemas/CurrentUser' }

    RoleAssignment:
      type: object
      required: [code]
      properties:
        code:
          type: string
          enum: [SUPER_ADMIN, TOHFA_ADMIN, FARMER_ADMIN, MAIN_WH_ADMIN, SUB_WH_ADMIN]
        warehouseId: { type: [string, 'null'], format: uuid, description: Set, and required, for SUB_WH_ADMIN (BR-30). }
        warehouseName: { type: [string, 'null'] }
        zoneId: { type: [string, 'null'], format: uuid, description: Scopes a Farmer Admin's own-zone grants (e.g. audit.view). }

    CurrentUser:
      type: object
      required: [id, fullName, userType]
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        mobile: { $ref: '#/components/schemas/Mobile' }
        email: { type: [string, 'null'], format: email }
        userType: { type: string, enum: [farmer, customer, admin, delivery_partner] }
        preferredLocale: { $ref: '#/components/schemas/Locale' }
        roles: { type: array, items: { $ref: '#/components/schemas/RoleAssignment' } }
        permissions:
          type: array
          description: Resolved permission codes from rbac.json. Advisory for UI gating only; the server re-checks every request.
          items: { type: string }

    OAuthProvider:
      type: string
      enum: [google, facebook]
      description: The only two social-login providers TOHFA recognises (BR-39).

    OAuthLoginRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: A Google ID token, or a Facebook access token, depending on the `:provider` path segment.
        deviceId: { type: string, maxLength: 120 }
        platform: { type: string, enum: [ios, android, web] }
        roleCode:
          type: string
          description: Required on the second call when the linked account holds multiple admin roles.
          enum: [SUPER_ADMIN, TOHFA_ADMIN, FARMER_ADMIN, MAIN_WH_ADMIN, SUB_WH_ADMIN]

    OAuthProfile:
      type: object
      description: |
        Whatever of these the provider actually returned. `email` and `photoUrl` are usually
        present; `fullName` usually is; none are guaranteed (BR-39).
      properties:
        fullName: { type: string, nullable: true }
        email: { type: string, format: email, nullable: true }
        photoUrl: { type: string, format: uri, nullable: true }

    OAuthNotLinkedResponse:
      type: object
      description: Returned by `POST /auth/oauth/{provider}` when the verified identity has no linked account yet (BR-39). No account is created; no tokens are issued.
      required: [status, profile, linkToken]
      properties:
        status: { type: string, enum: [NOT_LINKED] }
        profile: { $ref: '#/components/schemas/OAuthProfile' }
        linkToken:
          type: string
          description: Short-lived (10 minute), single-use, server-signed token. Pass to `POST /auth/otp/verify` to complete the link.

    OAuthLinkRequest:
      type: object
      required: [provider, token]
      properties:
        provider: { $ref: '#/components/schemas/OAuthProvider' }
        token:
          type: string
          description: A Google ID token, or a Facebook access token, matching `provider`.

    OAuthIdentity:
      type: object
      required: [provider, linkedAt]
      properties:
        provider: { $ref: '#/components/schemas/OAuthProvider' }
        email: { type: string, format: email, nullable: true }
        linkedAt: { type: string, format: date-time }

    FarmerApplicationStepPayload:
      type: object
      description: |
        Exactly one of the five step objects, matching the `step` path parameter:
        1 `personal`, 2 `farm`, 3 `location`, 4 `documents`, 5 `review`.
      properties:
        personal:
          type: object
          properties:
            fullName: { type: string, maxLength: 120 }
            dob: { type: string, format: date }
            gender: { type: string, enum: [MALE, FEMALE, OTHER] }
            farmingExperienceYears:
              type: integer
              minimum: 0
              maximum: 90
              deprecated: true
              description: |
                Legacy. Experience is collected in step 2 (`farm.experienceYears`); this is
                still accepted and still read on approval so applications that were in
                flight before the move are not silently zeroed.
            address: { type: string, maxLength: 300 }
            # BR-33b / Decision 8 (db/migrations/0003_farmers_and_farms.sql): the full
            # Aadhaar number is never accepted by this API at all -- not stored, not
            # returned, not logged. There is no server-side tokenization step in this
            # codebase; a raw 12-digit `aadhaarNumber` here was legacy/aspirational
            # documentation that no longer matches the implementation (updateStep
            # actively strips it if a client still sends one). Only the last 4 digits,
            # and an opaque token from an external KYC/tokenisation provider (if one is
            # ever integrated upstream of this API), are accepted.
            aadhaarLast4:
              type: string
              pattern: '^[0-9]{4}$'
              writeOnly: true
              description: Last 4 digits only, for human matching in the KYC queue. Never the full number (BR-33b).
            aadhaarToken:
              type: string
              writeOnly: true
              description: |
                Opaque reference from an external KYC/tokenisation provider, if one has
                already tokenized the farmer's Aadhaar upstream of this API. Not a
                reversible encoding of the number; this API never derives it from a raw
                Aadhaar itself (BR-33b).
        farm:
          type: object
          description: |
            The single farming operation — asked once, never repeated per parcel.
          properties:
            farmName:
              type: string
              minLength: 1
              maxLength: 120
              description: |
                The name of the whole farming operation, e.g. "Great Earth Organic". Asked once,
                for the operation. This is NOT a parcel name: each step-3 location carries its own
                `label` ("Home plot", "River plot"), and it is that label — never this — that
                becomes a `farms` row's name on approval. Stored as given in `step2_farm_details`;
                it has no column of its own. Farm-identifying, so it never reaches a customer
                response (BR-16).
            typeOfFarming: { type: string }
            experienceYears:
              type: integer
              minimum: 0
              maximum: 120
              description: |
                Years of farming experience. Collected here, on the operation, and written to
                `farmers.farming_experience_years` on approval.
            totalAreaAcres:
              type: number
              exclusiveMinimum: 0
              description: |
                The farmer's STATED total land holding, typically taken from their patta/chitta
                land records. It may legitimately differ from the sum of the step-3 `locations[].areaAcres`,
                which are measured on the ground: unmarked land, stale records or an inflated
                claim all show up as a gap. The server stores the claim as given — it is never
                derived from, reconciled against, or validated to match the parcel sum, and a
                mismatch never blocks submission. The discrepancy is signal for FARM_VERIFICATION.
            numberOfFarms:
              type: integer
              minimum: 1
              description: |
                The farmer's STATED count of separate plots, taken from the same land records as
                `totalAreaAcres`. It may legitimately differ from the number of step-3 `locations`,
                which are the plots actually marked on the ground — a farmer who states 3 plots but
                has marked 2 is exactly what FARM_VERIFICATION is there to look at. Stored as given
                in `step2_farm_details`: never derived from `locations.length`, never validated to
                match it, and never blocking. It has no column of its own and does not decide how
                many farms are created on approval — that count comes from the step-3 locations.
            waterSource: { type: string }
            primaryCrops: { type: array, items: { type: string } }
        location:
          type: object
          required: [locations]
          properties:
            locations:
              type: array
              minItems: 1
              description: |
                The land locations of the one farming operation — one labelled parcel per
                entry, each with its own acreage and its own GPS/FMB boundary. Their
                `areaAcres` sum is shown beside the farmer's stated `farm.totalAreaAcres`
                so any gap is visible; it never overwrites it.
              items:
                type: object
                required: [id, label, areaAcres]
                properties:
                  id: { type: string, minLength: 1, maxLength: 100, description: Client-generated key for this location. }
                  label: { type: string, minLength: 1, maxLength: 120, description: Farmer-facing name for the parcel, e.g. "Home plot". }
                  areaAcres: { type: number, exclusiveMinimum: 0, description: Farmer-stated acreage of this parcel. }
                  gpsCaptured: { type: boolean, description: False when the farmer fell back to manual lat/lng entry. }
                  latitude: { type: number, minimum: -90, maximum: 90 }
                  longitude: { type: number, minimum: -180, maximum: 180 }
                  calculatedAreaAcres: { type: number, minimum: 0, description: Server-derived from the polygon; overwrites any client value. }
                  calculatedAreaHectares: { type: number, minimum: 0 }
                  fmbPolygon:
                    type: object
                    description: GeoJSON Polygon of the Farm Map Boundary drawn on the map.
                    properties:
                      type: { type: string, enum: [Polygon] }
                      coordinates:
                        type: array
                        items: { type: array, items: { type: array, items: { type: number }, minItems: 2, maxItems: 2 } }
                  village: { type: string }
                  taluk: { type: string }
                  district: { type: string }
        documents:
          type: object
          properties:
            idProofUrl: { type: string, format: uri, description: Mandatory. }
            farmDocUrl: { type: string, format: uri, description: Mandatory. }
            certificateUrl: { type: [string, 'null'], format: uri, description: Optional at application time. }
        review:
          type: object
          properties:
            declarationAccepted: { type: boolean }
            signatureUrl: { type: [string, 'null'], format: uri }

    FarmerApplication:
      type: object
      required: [id, status, mobile, fullName, completedSteps, createdAt]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ApplicationStatus' }
        mobile: { $ref: '#/components/schemas/Mobile' }
        fullName: { type: string }
        tohfaFarmerId: { type: [string, 'null'], description: Issued on approval, format TOHFA-F-YYYY-XXXX. }
        completedSteps: { type: array, items: { type: integer, minimum: 1, maximum: 5 } }
        data: { $ref: '#/components/schemas/FarmerApplicationStepPayload' }
        zoneId: { type: [string, 'null'], format: uuid }
        submittedAt: { type: [string, 'null'], format: date-time }
        decidedAt: { type: [string, 'null'], format: date-time }
        decidedBy: { type: [string, 'null'], format: uuid }
        rejectionReason: { type: [string, 'null'] }
        infoRequest: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }

    FarmerApplicationSummary:
      type: object
      required: [id, status, fullName, submittedAt]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ApplicationStatus' }
        fullName: { type: string }
        village: { type: [string, 'null'] }
        zoneId: { type: [string, 'null'], format: uuid }
        areaAcres: { type: [number, 'null'] }
        submittedAt: { type: [string, 'null'], format: date-time }
        slaDueAt: { type: [string, 'null'], format: date-time, description: 3-5 working days from submission. }
        documentsComplete: { type: boolean }

    ApplicationStatusTimeline:
      type: object
      required: [applicationId, status, steps]
      properties:
        applicationId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ApplicationStatus' }
        submittedAt: { type: [string, 'null'], format: date-time }
        expectedDecisionBy: { type: [string, 'null'], format: date-time }
        steps:
          type: array
          items:
            type: object
            required: [status, reachedAt]
            properties:
              status: { $ref: '#/components/schemas/ApplicationStatus' }
              reachedAt: { type: string, format: date-time }
              note: { type: [string, 'null'] }

    FarmerProfile:
      type: object
      required: [id, tohfaFarmerId, fullName, mobile, kycStatus]
      properties:
        id: { type: string, format: uuid }
        tohfaFarmerId: { type: string, examples: [TOHFA-F-2026-0114] }
        fullName: { type: string }
        mobile:
          allOf: [{ $ref: '#/components/schemas/Mobile' }]
          readOnly: true
          description: Locked field (BR-33).
        aadhaarLast4:
          type: [string, 'null']
          pattern: '^[0-9]{4}$'
          readOnly: true
          description: Locked field; the full number is never returned (BR-33).
        dob: { type: [string, 'null'], format: date, description: Calendar date (YYYY-MM-DD) copied from registration at approval; null if never supplied. }
        gender:
          type: [string, 'null']
          enum: [MALE, FEMALE, OTHER, UNDISCLOSED, null]
          description: Matches the farmers.gender CHECK constraint; null if never supplied.
        farmingExperienceYears: { type: [integer, 'null'] }
        address: { type: [string, 'null'] }
        zoneId: { type: [string, 'null'], format: uuid }
        kycStatus: { type: string, enum: [PENDING, VERIFIED, REJECTED] }
        overallRating: { type: [number, 'null'], description: Farm rating, 10 categories x 10 points. }
        ratingTier: { type: [string, 'null'], enum: [POOR, MODERATE, GOOD, EXCELLENT, null] }
        subscriptionTier: { type: string, enum: [FREE, PAID] }
        subscriptionValidTo: { type: [string, 'null'], format: date }
        isMarketBlocked: { type: boolean, description: True while a certificate is expired or unverified (BR-01, BR-02). }
        marketBlockReason: { type: [string, 'null'] }
        preferredLocale: { $ref: '#/components/schemas/Locale' }

    FarmerBankAccount:
      type: object
      description: |
        A bank account payout destination. Account numbers are always masked to the last 4 digits (BR-53a).
      required: [id, accountHolderName, bankName, isVerified, isDefault, createdAt]
      properties:
        id: { type: string, format: uuid }
        accountHolderName: { type: string }
        accountNumberLast4:
          type: [string, 'null']
          pattern: '^[0-9]{4}$'
          description: Last 4 digits only. Never the full account number.
        ifsc:
          type: [string, 'null']
          pattern: '^[A-Z]{4}0[A-Z0-9]{6}$'
        bankName:
          type: [string, 'null']
          description: Null for a UPI destination, which is not a bank account.
        branchName: { type: [string, 'null'] }
        upiVpa: { type: [string, 'null'] }
        isVerified: { type: boolean }
        isDefault: { type: boolean }
        createdAt: { type: string, format: date-time }

    CreateFarmerBankAccountRequest:
      type: object
      required: [accountHolderName, accountNumber, ifsc, bankName]
      properties:
        accountHolderName: { type: string, minLength: 2, maxLength: 120 }
        accountNumber:
          type: string
          minLength: 9
          maxLength: 18
          pattern: '^[0-9]{9,18}$'
          description: Digits only. Only the last 4 are kept; the full number is never stored or returned.
        ifsc:
          type: string
          pattern: '^[A-Za-z]{4}0[A-Za-z0-9]{6}$'
          description: Case-insensitive; stored and returned upper-case.
        bankName: { type: string, minLength: 2, maxLength: 120 }
        branchName: { type: string, maxLength: 120 }
        isDefault: { type: boolean, default: false }

    UpdateFarmerBankAccountRequest:
      type: object
      properties:
        accountHolderName: { type: string, minLength: 2, maxLength: 120 }
        accountNumber: { type: string, minLength: 9, maxLength: 18, pattern: '^[0-9]{9,18}$' }
        ifsc:
          type: string
          pattern: '^[A-Za-z]{4}0[A-Za-z0-9]{6}$'
          description: Case-insensitive; stored and returned upper-case.
        bankName: { type: string, minLength: 2, maxLength: 120 }
        branchName: { type: [string, 'null'], maxLength: 120 }
        isDefault: { type: boolean }

    FarmerUpiPreference:
      type: object
      required: [id, upiVpa, isVerified, isDefault]
      properties:
        id: { type: string, format: uuid }
        upiVpa: { type: string }
        isVerified: { type: boolean }
        isDefault: { type: boolean }

    UpdateFarmerUpiRequest:
      type: object
      required: [upiVpa]
      properties:
        upiVpa:
          type: string
          pattern: '^[a-zA-Z0-9.\-_]{2,256}@[a-zA-Z]{2,64}$'
        isDefault:
          type: boolean
          description: Applied only when sent. Omitted keeps the current default flag.
    FarmerDocumentItem:
      type: object
      required:
        - docType
        - displayName
        - uploadStatus
        - readUrl
      properties:
        docType:
          type: string
          description: |
            Standard slot (ID_PROOF, LAND_PATTA, CERTIFICATE, SOIL_CARD) or, for any further
            recognised application upload, that upload's own docType.
          example: ID_PROOF
        displayName:
          type: string
          description: Human-readable title of the document.
          example: Aadhaar Card
        uploadStatus:
          type: string
          enum: [VERIFIED, UPLOADED, PENDING, ACTION_NEEDED]
          description: |
            VERIFIED only when a verified record exists for the uploaded file itself (a verified
            farmer_documents row, or a verified certificate with its file). UPLOADED when a file is on
            record but not verified. PENDING when no file is on record. ACTION_NEEDED for the soil card
            slot, which no upload flow can fill yet.
          example: UPLOADED
        readUrl:
          type: [string, 'null']
          format: uri
          description: |
            Short-lived (15 minute) signed read URL, or null when there is no file. Only files
            recorded as this farmer's own are ever signed.
        fileName:
          type: [string, 'null']
          description: The stored file's name, or the name the applicant supplied; null when unknown.
        docSubType:
          type: [string, 'null']
          description: Sub-type recorded with the document (e.g. Patta, or the certificate type); null when none is recorded.
          example: Aadhaar Card
        documentNumberLast4:
          type: [string, 'null']
          pattern: '^[0-9]{4}$'
          description: Masked document number (last 4 digits only, Aadhaar slot).
          example: '4821'
        uploadedAt:
          type: [string, 'null']
          format: date-time
          description: Timestamp when the document was uploaded.
        verifiedAt:
          type: [string, 'null']
          format: date-time
          description: Timestamp when the document was verified by an admin.

    FarmerProfileDocumentsResponse:
      type: object
      required:
        - documents
      properties:
        documents:
          type: array
          items:
            $ref: '#/components/schemas/FarmerDocumentItem'

    TreePlanting:
      type: object
      required:
        - id
        - farmerId
        - speciesName
        - treeCount
        - createdAt
      properties:
        id: { type: string, format: uuid }
        farmerId: { type: string, format: uuid }
        farmId: { type: [string, 'null'], format: uuid }
        plotId: { type: [string, 'null'], format: uuid }
        speciesName: { type: string, maxLength: 200 }
        treeCount: { type: integer, minimum: 1, maximum: 2147483647 }
        plantedOn: { type: [string, 'null'], format: date }
        zoneName: { type: [string, 'null'], maxLength: 200 }
        purpose: { type: [string, 'null'], maxLength: 500 }
        notes: { type: [string, 'null'], maxLength: 2000 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }

    CreateTreePlantingRequest:
      type: object
      required:
        - speciesName
        - treeCount
      properties:
        farmId: { type: string, format: uuid }
        plotId: { type: string, format: uuid }
        speciesName: { type: string, minLength: 1, maxLength: 200 }
        treeCount: { type: integer, minimum: 1, maximum: 2147483647 }
        plantedOn: { type: string, format: date }
        zoneName: { type: string, maxLength: 200 }
        purpose: { type: string, maxLength: 500 }
        notes: { type: string, maxLength: 2000 }

    UpdateTreePlantingRequest:
      type: object
      properties:
        farmId: { type: [string, 'null'], format: uuid }
        plotId: { type: [string, 'null'], format: uuid }
        speciesName: { type: string, minLength: 1, maxLength: 200 }
        treeCount: { type: integer, minimum: 1, maximum: 2147483647 }
        plantedOn: { type: [string, 'null'], format: date }
        zoneName: { type: [string, 'null'], maxLength: 200 }
        purpose: { type: [string, 'null'], maxLength: 500 }
        notes: { type: [string, 'null'], maxLength: 2000 }

    TreePlantingsListResponse:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TreePlanting'
        page:
          type: object
          required: [hasMore]
          properties:
            nextCursor: { type: [string, 'null'] }
            hasMore: { type: boolean }

    CropInput:
      type: object
      required:
        - id
        - farmerId
        - farmCropId
        - inputType
        - inputName
        - appliedOn
        - quantity
        - unit
        - createdAt
      properties:
        id: { type: string, format: uuid }
        farmerId: { type: string, format: uuid }
        farmCropId: { type: string, format: uuid }
        inputType:
          type: string
          enum: [FERTILIZER, MANURE, BIO_INPUT, PESTICIDE, OTHER]
        inputName: { type: string, maxLength: 200 }
        appliedOn:
          type: string
          format: date
          description: A real calendar date (2026-02-30 is rejected), not in the future in Asia/Kolkata (BR-56b).
        quantity: { type: number, exclusiveMinimum: 0, maximum: 99999999.99 }
        unit:
          type: string
          enum: [KG, LITRE, GRAM, ML, BAG, TONNE, OTHER]
        nitrogenPct: { type: [number, 'null'], minimum: 0, maximum: 100 }
        phosphorusPct: { type: [number, 'null'], minimum: 0, maximum: 100 }
        potassiumPct: { type: [number, 'null'], minimum: 0, maximum: 100 }
        applicationMethod: { type: [string, 'null'], maxLength: 100 }
        costInr:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        notes: { type: [string, 'null'], maxLength: 2000 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }

    CropInputCost:
      type: string
      pattern: '^[0-9]{1,8}(\.[0-9]{1,2})?$'
      description: |
        Cost of one input application in INR as a decimal string, e.g. `"1200.50"`. Never a JSON
        number (see `Money`). Non-negative, at most 2 decimals and at most 8 integer digits because
        the column is numeric(10,2).

    CreateCropInputRequest:
      type: object
      required:
        - inputType
        - inputName
        - appliedOn
        - quantity
        - unit
      properties:
        inputType:
          type: string
          enum: [FERTILIZER, MANURE, BIO_INPUT, PESTICIDE, OTHER]
        inputName: { type: string, minLength: 1, maxLength: 200 }
        appliedOn:
          type: string
          format: date
          description: A real calendar date (2026-02-30 is rejected), not in the future in Asia/Kolkata (BR-56b).
        quantity: { type: number, exclusiveMinimum: 0, maximum: 99999999.99 }
        unit:
          type: string
          enum: [KG, LITRE, GRAM, ML, BAG, TONNE, OTHER]
        nitrogenPct:
          type: number
          minimum: 0
          maximum: 100
          description: Nitrogen, phosphorus and potassium percentages together must not exceed 100 (422 VALIDATION_FAILED).
        phosphorusPct: { type: number, minimum: 0, maximum: 100 }
        potassiumPct: { type: number, minimum: 0, maximum: 100 }
        applicationMethod: { type: string, maxLength: 100 }
        costInr: { $ref: '#/components/schemas/CropInputCost' }
        notes: { type: string, maxLength: 2000 }

    UpdateCropInputRequest:
      type: object
      properties:
        inputType:
          type: string
          enum: [FERTILIZER, MANURE, BIO_INPUT, PESTICIDE, OTHER]
        inputName: { type: string, minLength: 1, maxLength: 200 }
        appliedOn:
          type: string
          format: date
          description: A real calendar date (2026-02-30 is rejected), not in the future in Asia/Kolkata (BR-56b).
        quantity: { type: number, exclusiveMinimum: 0, maximum: 99999999.99 }
        unit:
          type: string
          enum: [KG, LITRE, GRAM, ML, BAG, TONNE, OTHER]
        nitrogenPct: { type: [number, 'null'], minimum: 0, maximum: 100 }
        phosphorusPct: { type: [number, 'null'], minimum: 0, maximum: 100 }
        potassiumPct: { type: [number, 'null'], minimum: 0, maximum: 100 }
        applicationMethod: { type: [string, 'null'], maxLength: 100 }
        costInr:
          oneOf:
            - $ref: '#/components/schemas/CropInputCost'
            - type: 'null'
        notes: { type: [string, 'null'], maxLength: 2000 }

    CropInputsListResponse:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CropInput'
        page:
          type: object
          required: [hasMore]
          properties:
            nextCursor: { type: [string, 'null'] }
            hasMore: { type: boolean }

    CropNpkContributionResponse:
      type: object
      required:
        - farmCropId
        - totalInputsCount
        - totalQuantityKg
        - totalNitrogenKg
        - totalPhosphorusKg
        - totalPotassiumKg
        - totalCostInr
      properties:
        farmCropId: { type: string, format: uuid }
        totalInputsCount: { type: integer, minimum: 0 }
        totalQuantityKg: { type: number, minimum: 0 }
        totalNitrogenKg: { type: number, minimum: 0 }
        totalPhosphorusKg: { type: number, minimum: 0 }
        totalPotassiumKg: { type: number, minimum: 0 }
        totalCostInr: { $ref: '#/components/schemas/Money' }

    CropMilestone:
      type: object
      required:
        - id
        - farmerId
        - farmCropId
        - stageCode
        - stageName
        - sequenceOrder
        - status
        - createdAt
      properties:
        id: { type: string, format: uuid }
        farmerId: { type: string, format: uuid }
        farmCropId: { type: string, format: uuid }
        templateId: { type: [string, 'null'], format: uuid }
        stageCode: { type: string }
        stageName: { type: string }
        sequenceOrder: { type: integer }
        status:
          type: string
          enum: [PENDING, COMPLETED, SKIPPED]
        targetDate: { type: [string, 'null'], format: date }
        completedOn: { type: [string, 'null'], format: date }
        notes: { type: [string, 'null'], maxLength: 2000 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }

    UpdateCropMilestoneRequest:
      type: object
      properties:
        status:
          type: string
          enum: [PENDING, COMPLETED, SKIPPED]
        completedOn: { type: [string, 'null'], format: date }
        targetDate: { type: [string, 'null'], format: date }
        notes: { type: [string, 'null'], maxLength: 2000 }

    CropMilestonesListResponse:
      type: object
      required:
        - items
        - totalCount
        - completedCount
        - progressPct
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CropMilestone'
        totalCount: { type: integer, minimum: 0 }
        completedCount: { type: integer, minimum: 0 }
        progressPct: { type: number, minimum: 0, maximum: 100 }

    CropMilestoneTemplate:
      type: object
      required:
        - id
        - stageCode
        - stageName
        - sequenceOrder
      properties:
        id: { type: string, format: uuid }
        cropMasterId: { type: [string, 'null'], format: uuid }
        stageCode: { type: string }
        stageName: { type: string }
        description: { type: [string, 'null'] }
        sequenceOrder: { type: integer }
        expectedDaysAfterPlanting: { type: [integer, 'null'] }

    CalendarItem:
      type: object
      required:
        - id
        - category
        - title
        - description
        - date
      properties:
        id: { type: string }
        category:
          type: string
          enum: [PLATFORM_EVENT, AUDIT, CERTIFICATE_EXPIRY, CROP_HARVEST]
        title: { type: string }
        description: { type: [string, 'null'] }
        date: { type: string, format: date }
        metadata: { type: object }

    CalendarResponse:
      type: object
      required:
        - from
        - to
        - items
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        items:
          type: array
          items:
            $ref: '#/components/schemas/CalendarItem'

    PlatformEvent:
      type: object
      required:
        - id
        - title
        - description
        - eventType
        - eventDate
        - startTime
        - endTime
        - locationName
        - targetAudience
        - isPublished
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: [string, 'null'] }
        eventType:
          type: string
          enum: [WORKSHOP, TRAINING, COMMUNITY_MEET, MARKET_DAY, OTHER]
        eventDate: { type: string, format: date }
        startTime: { type: [string, 'null'], pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: 'HH:MM, 24-hour.' }
        endTime: { type: [string, 'null'], pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: 'HH:MM, 24-hour; later than startTime when both are set.' }
        locationName: { type: [string, 'null'] }
        targetAudience:
          type: string
          enum: [ALL, FARMER, CUSTOMER]
        isPublished: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }

    CreatePlatformEventRequest:
      type: object
      required:
        - title
        - eventType
        - eventDate
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        eventType:
          type: string
          enum: [WORKSHOP, TRAINING, COMMUNITY_MEET, MARKET_DAY, OTHER]
        eventDate: { type: string, format: date, description: A real calendar date. }
        startTime: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: 'HH:MM, 24-hour.' }
        endTime: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: 'HH:MM, 24-hour; must be later than startTime when both are given.' }
        locationName: { type: string, maxLength: 200 }
        targetAudience:
          type: string
          enum: [ALL, FARMER, CUSTOMER]
          default: ALL
        isPublished: { type: boolean, default: true }

    UpdatePlatformEventRequest:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 2000 }
        eventType:
          type: string
          enum: [WORKSHOP, TRAINING, COMMUNITY_MEET, MARKET_DAY, OTHER]
        eventDate: { type: string, format: date }
        startTime: { type: [string, 'null'], pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: 'HH:MM, 24-hour.' }
        endTime: { type: [string, 'null'], pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: 'HH:MM, 24-hour; must be later than startTime (the stored one when only endTime is sent) or 422 on body.endTime.' }
        locationName: { type: [string, 'null'], maxLength: 200 }
        targetAudience:
          type: string
          enum: [ALL, FARMER, CUSTOMER]
        isPublished: { type: boolean }

    PlatformEventsListResponse:
      type: object
      required: [items, total, page, limit]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlatformEvent'
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }



    FarmWeather:
      type: object
      description: A weather snapshot for one farm's registered centroid (BR-16 — farmer-only).
      required: [provider, observedAt, location, current, hourly, daily]
      properties:
        provider: { type: string, enum: [openweathermap], description: Which adapter served this snapshot. }
        observedAt: { type: string, format: date-time, description: When the upstream observation was taken. }
        location: { $ref: '#/components/schemas/FarmWeatherLocation' }
        current: { $ref: '#/components/schemas/FarmWeatherCurrent' }
        hourly:
          type: array
          description: Up to 8 entries covering the next 24 hours in 3-hour steps.
          items: { $ref: '#/components/schemas/FarmWeatherHourly' }
        daily:
          type: array
          description: Up to 7 entries. The first entry is always the farm's local today.
          items: { $ref: '#/components/schemas/FarmWeatherDaily' }

    FarmWeatherLocation:
      type: object
      required: [farmName, village, latitude, longitude]
      properties:
        farmName: { type: string }
        village: { type: [string, 'null'] }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }

    FarmWeatherCurrent:
      type: object
      required: [temperatureC, feelsLikeC, condition, humidityPct, windKph, precipitationChancePct]
      properties:
        temperatureC: { type: number, description: Degrees Celsius. }
        feelsLikeC: { type: number, description: Apparent temperature in degrees Celsius. }
        condition: { $ref: '#/components/schemas/WeatherCondition' }
        humidityPct: { type: number, minimum: 0, maximum: 100 }
        windKph: { type: number, minimum: 0, description: Wind speed in kilometres per hour. }
        precipitationChancePct: { type: number, minimum: 0, maximum: 100 }

    FarmWeatherHourly:
      type: object
      required: [at, temperatureC, condition]
      properties:
        at: { type: string, format: date-time }
        temperatureC: { type: number }
        condition: { $ref: '#/components/schemas/WeatherCondition' }

    FarmWeatherDaily:
      type: object
      required: [date, minTempC, maxTempC, condition, precipitationMm]
      properties:
        date: { type: string, format: date }
        minTempC: { type: number }
        maxTempC: { type: number }
        condition: { $ref: '#/components/schemas/WeatherCondition' }
        precipitationMm: { type: number, minimum: 0 }

    WeatherCondition:
      type: string
      description: Provider-neutral weather taxonomy. Both adapters map their vocabulary onto this set.
      enum: [CLEAR, CLEAR_NIGHT, PARTLY_CLOUDY, CLOUDY, FOG, LIGHT_RAIN, RAIN, THUNDERSTORM]

    FarmerProfileUpdate:
      type: object
      description: Aadhaar and mobile are deliberately absent — they are locked (BR-33).
      properties:
        fullName: { type: string, minLength: 2, maxLength: 120 }
        dob: { type: string, format: date }
        gender: { type: string, enum: [MALE, FEMALE, OTHER] }
        farmingExperienceYears: { type: integer, minimum: 0, maximum: 90 }
        address: { type: string, maxLength: 300 }
        preferredLocale: { $ref: '#/components/schemas/Locale' }
      additionalProperties: false

    FarmRatingModule:
      type: object
      description: |
        One rating category's score. No `name`/display-name field on purpose — root
        CLAUDE.md §2.7 forbids user-facing strings sourced from the DB reaching a client;
        the mobile/admin clients own category display names via their own i18n catalogues.
      required: [categoryCode, score, maxScore]
      properties:
        categoryCode:
          type: string
          enum:
            [
              CERTIFICATION,
              SOIL_LAND,
              FARMING_PRACTICES,
              ENVIRONMENTAL,
              PRODUCE_QUALITY,
              TRACEABILITY,
              SOCIAL_LABOR,
              FINANCIAL,
              MARKET_RELATIONS,
              INNOVATION,
            ]
        score: { type: [integer, 'null'], minimum: 0, maximum: 10 }
        maxScore: { type: integer, enum: [10] }

    FarmRating:
      type: object
      description: |
        BR-06 (LOCKED): exactly 10 named categories, each scored 0-10, summed DIRECTLY to
        a 0-100 total — no multiplier. A rating missing any category score is
        incomplete, not zero. Read-only: since 2026-10-01 a rating is created only by
        completing an INTERNAL audit, always `COMPLETE`; a `DRAFT` with partial scores
        can only be a legacy manual row, and a never-rated farmer gets an all-null
        `DRAFT` shell with `source: null`.
      required: [farmerId, periodLabel, status, modules, overallRating, ratingTier, ratedAt, source, sourceAuditId]
      properties:
        farmerId: { type: string, format: uuid }
        periodLabel:
          type: string
          description: |
            Identifies the rating cycle. Audit-derived ratings use the audit's fiscal
            period, e.g. `2026-27 Q1`; legacy manual rows use `CYCLE-n`. A never-rated
            farmer gets the placeholder `CYCLE-1` (not persisted).
        status: { type: string, enum: [DRAFT, COMPLETE] }
        modules:
          type: array
          minItems: 10
          maxItems: 10
          items: { $ref: '#/components/schemas/FarmRatingModule' }
        overallRating: { type: [number, 'null'], description: Direct sum of the 10 category scores (0-100). }
        ratingTier: { type: [string, 'null'], enum: [POOR, MODERATE, GOOD, EXCELLENT, null] }
        ratedAt: { type: [string, 'null'], format: date-time, description: Set only once status is COMPLETE. }
        source:
          type: [string, 'null']
          enum: [AUDIT, MANUAL, null]
          readOnly: true
          description: |
            `AUDIT` = derived from a completed INTERNAL audit (see `sourceAuditId`);
            `MANUAL` = legacy rating entered through the removed manual PUT, kept as
            history; null = the farmer has never been rated.
        sourceAuditId:
          type: [string, 'null']
          format: uuid
          readOnly: true
          description: The completed INTERNAL audit this rating was derived from; null unless `source` is `AUDIT`.

    AuditType:
      type: string
      description: INTERNAL is conducted by a TOHFA admin; EXTERNAL records an outside agency's visit, entered by an admin from the agency's report (no agency login).
      enum: [INTERNAL, EXTERNAL]

    AuditStatus:
      type: string
      description: SCHEDULED -> IN_PROGRESS -> COMPLETED; SCHEDULED or IN_PROGRESS -> CANCELLED.
      enum: [SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED]

    AuditFindingSeverity:
      type: string
      enum: [MAJOR, MINOR, OBSERVATION]

    AuditTier:
      type: [string, 'null']
      description: |
        Resolved at read time from `rating_tier_config` (BR-04a) for `totalScore`; null
        until the audit is COMPLETED. Never stored on the audit.
      enum: [POOR, MODERATE, GOOD, EXCELLENT, null]

    AuditComplianceStatus:
      type: string
      description: |
        BR-03b. `COMPLIANT`: 4 COMPLETED audits in the fiscal year. `PENDING`: fewer than
        4 and the fiscal year has not ended. `NON_COMPLIANT`: fewer than 4 and the fiscal
        year has ended — never silently passed.
      enum: [COMPLIANT, PENDING, NON_COMPLIANT]

    FiscalYear:
      type: string
      description: Indian fiscal year April-March, e.g. `2026-27` (same format as invoices).
      pattern: '^[0-9]{4}-[0-9]{2}$'
      examples: ['2026-27']

    RatingCategoryCode:
      type: string
      description: The 10 seeded `rating_categories` (BR-06), shared by farm ratings and audits. Clients own display names via i18n.
      enum:
        [
          CERTIFICATION,
          SOIL_LAND,
          FARMING_PRACTICES,
          ENVIRONMENTAL,
          PRODUCE_QUALITY,
          TRACEABILITY,
          SOCIAL_LABOR,
          FINANCIAL,
          MARKET_RELATIONS,
          INNOVATION,
        ]

    AuditFindingCounts:
      type: object
      description: Computed at read time from `audit_findings`. `openMajor` counts unresolved MAJOR findings.
      required: [major, minor, observation, openMajor]
      properties:
        major: { type: integer, minimum: 0 }
        minor: { type: integer, minimum: 0 }
        observation: { type: integer, minimum: 0 }
        openMajor: { type: integer, minimum: 0 }

    AuditReportUpload:
      type: object
      description: The optional uploaded report file (typically the external agency's own report). Download it via the report endpoint with `variant=agency`.
      required: [uploadId, mimeType, sizeBytes]
      properties:
        uploadId: { type: string, format: uuid }
        mimeType: { type: string, examples: [application/pdf] }
        sizeBytes: { type: integer, minimum: 1 }

    AuditCategoryScore:
      type: object
      description: |
        One category's score on an audit. Always 10 of these, in `rating_categories`
        sort order; `score` is null for a category not yet scored (incomplete, not zero —
        BR-06). No display name on purpose (clients own names via i18n, as with
        `FarmRatingModule`).
      required: [categoryCode, score, maxScore]
      properties:
        categoryCode: { $ref: '#/components/schemas/RatingCategoryCode' }
        score: { type: [integer, 'null'], minimum: 0, maximum: 10 }
        maxScore: { type: integer, enum: [10] }
        remarks: { type: [string, 'null'] }

    AuditFinding:
      type: object
      required: [id, auditId, severity, description, categoryCode, correctiveAction, dueDate, resolvedAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        auditId: { type: string, format: uuid }
        severity: { $ref: '#/components/schemas/AuditFindingSeverity' }
        categoryCode:
          oneOf:
            - { $ref: '#/components/schemas/RatingCategoryCode' }
            - { type: 'null' }
        description: { type: string }
        correctiveAction: { type: [string, 'null'] }
        dueDate: { type: [string, 'null'], format: date }
        resolvedAt: { type: [string, 'null'], format: date-time }
        resolvedByName: { type: [string, 'null'], description: Admin views only; omitted from farmer responses. }
        resolutionNote: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }

    AuditSummary:
      type: object
      description: One row of the admin audit list / calendar / farmer history.
      required:
        [id, farmerId, tohfaFarmerId, farmerName, farmId, farmName, zoneId, zoneName, fiscalYear, quarter,
         auditType, status, scheduledFor, startedAt, completedAt, auditorUserId, auditorName,
         externalAgencyName, totalScore, maxScore, tier, majorViolationsCount, findingCounts, redFlagged]
      properties:
        id: { type: string, format: uuid }
        farmerId: { type: string, format: uuid }
        tohfaFarmerId: { type: string, examples: [TOHFA-F-2026-0234] }
        farmerName: { type: string }
        farmId: { type: [string, 'null'], format: uuid }
        farmName: { type: [string, 'null'] }
        zoneId: { type: [string, 'null'], format: uuid, description: The zone the audit was scheduled in (snapshot). }
        zoneName: { type: [string, 'null'] }
        fiscalYear: { $ref: '#/components/schemas/FiscalYear' }
        quarter: { type: integer, minimum: 1, maximum: 4 }
        auditType: { $ref: '#/components/schemas/AuditType' }
        status: { $ref: '#/components/schemas/AuditStatus' }
        scheduledFor: { type: string, format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        auditorUserId: { type: [string, 'null'], format: uuid }
        auditorName: { type: [string, 'null'], description: Internal auditor's name. }
        externalAgencyName: { type: [string, 'null'], description: EXTERNAL audits only. }
        totalScore: { type: [integer, 'null'], minimum: 0, maximum: 100, description: Direct sum of the 10 category scores; set on completion. }
        maxScore: { type: integer, enum: [100] }
        tier: { $ref: '#/components/schemas/AuditTier' }
        majorViolationsCount: { type: integer, minimum: 0, description: 'BR-05a: persisted on completion; 0 before.' }
        findingCounts: { $ref: '#/components/schemas/AuditFindingCounts' }
        redFlagged: { type: boolean, description: 'BR-05b: set only by an explicit admin action.' }

    Audit:
      description: The full audit record (admin view), without its score sheet and findings.
      allOf:
        - { $ref: '#/components/schemas/AuditSummary' }
        - type: object
          required:
            [summary, reportUpload, redFlagReason, redFlaggedAt, redFlaggedByName, cancelledReason,
             cancelledAt, createdByName, createdAt, updatedAt]
          properties:
            summary: { type: [string, 'null'], description: Auditor's overall remarks. }
            reportUpload:
              oneOf:
                - { $ref: '#/components/schemas/AuditReportUpload' }
                - { type: 'null' }
            redFlagReason: { type: [string, 'null'] }
            redFlaggedAt: { type: [string, 'null'], format: date-time }
            redFlaggedByName: { type: [string, 'null'] }
            cancelledReason: { type: [string, 'null'] }
            cancelledAt: { type: [string, 'null'], format: date-time }
            createdByName: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: [string, 'null'], format: date-time }

    AuditDetail:
      description: An audit with its 10-category score sheet and its findings (admin view).
      allOf:
        - { $ref: '#/components/schemas/Audit' }
        - type: object
          required: [categoryScores, findings]
          properties:
            categoryScores:
              type: array
              minItems: 10
              maxItems: 10
              items: { $ref: '#/components/schemas/AuditCategoryScore' }
            findings:
              type: array
              items: { $ref: '#/components/schemas/AuditFinding' }

    FarmerAuditSummary:
      type: object
      description: |
        The farmer's own audit (BR-36). An ALLOW-LIST: red-flag fields, creator and other
        internal admin fields are deliberately absent, so adding a column to `audits`
        cannot leak it to the farmer app.
      required:
        [id, farmId, farmName, fiscalYear, quarter, auditType, status, scheduledFor, startedAt, completedAt,
         auditorName, externalAgencyName, totalScore, maxScore, tier, majorViolationsCount, findingCounts]
      properties:
        id: { type: string, format: uuid }
        farmId: { type: [string, 'null'], format: uuid }
        farmName: { type: [string, 'null'] }
        fiscalYear: { $ref: '#/components/schemas/FiscalYear' }
        quarter: { type: integer, minimum: 1, maximum: 4 }
        auditType: { $ref: '#/components/schemas/AuditType' }
        status: { $ref: '#/components/schemas/AuditStatus' }
        scheduledFor: { type: string, format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        auditorName: { type: [string, 'null'] }
        externalAgencyName: { type: [string, 'null'] }
        totalScore: { type: [integer, 'null'], minimum: 0, maximum: 100, description: Null until COMPLETED. }
        maxScore: { type: integer, enum: [100] }
        tier: { $ref: '#/components/schemas/AuditTier' }
        majorViolationsCount: { type: integer, minimum: 0 }
        findingCounts: { $ref: '#/components/schemas/AuditFindingCounts' }

    FarmerAuditDetail:
      description: The farmer's own audit with scores and findings (populated only once COMPLETED).
      allOf:
        - { $ref: '#/components/schemas/FarmerAuditSummary' }
        - type: object
          required: [summary, hasAgencyReport, cancelledReason, categoryScores, findings]
          properties:
            summary: { type: [string, 'null'] }
            hasAgencyReport: { type: boolean, description: True when `variant=agency` can be downloaded. }
            cancelledReason: { type: [string, 'null'] }
            categoryScores:
              type: array
              minItems: 10
              maxItems: 10
              items: { $ref: '#/components/schemas/AuditCategoryScore' }
            findings:
              type: array
              items: { $ref: '#/components/schemas/AuditFinding' }

    AuditCreate:
      type: object
      description: |
        `fiscalYear`/`quarter` are NOT accepted — they are derived from `scheduledFor`
        (Asia/Kolkata). EXTERNAL requires `externalAgencyName`; INTERNAL forbids it.
      required: [farmerId, auditType, scheduledFor]
      additionalProperties: false
      properties:
        farmerId: { type: string, format: uuid }
        farmId: { type: string, format: uuid, description: Optional; must belong to the farmer. }
        auditType: { $ref: '#/components/schemas/AuditType' }
        scheduledFor: { type: string, format: date-time }
        auditorUserId: { type: string, format: uuid, description: INTERNAL only; may be assigned later. }
        externalAgencyName: { type: string, minLength: 2, maxLength: 200 }

    AuditUpdate:
      type: object
      description: Reschedule / reassign. SCHEDULED audits only. At least one field besides `reason`.
      additionalProperties: false
      minProperties: 1
      properties:
        scheduledFor: { type: string, format: date-time }
        farmId: { type: [string, 'null'], format: uuid }
        auditorUserId: { type: [string, 'null'], format: uuid, description: INTERNAL only. }
        externalAgencyName: { type: string, minLength: 2, maxLength: 200, description: EXTERNAL only. }
        reason: { type: string, maxLength: 500, description: Recorded in the audit_log row. }

    AuditScoresUpdate:
      type: object
      description: |
        1-10 category scores, upserted. `score` is checked for integer-ness only in the
        schema; a value outside 0-10 is 422 `SCORE_OUT_OF_RANGE` from the service
        (BR-06a).
      required: [scores]
      additionalProperties: false
      properties:
        scores:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            required: [categoryCode, score]
            additionalProperties: false
            properties:
              categoryCode: { $ref: '#/components/schemas/RatingCategoryCode' }
              score: { type: integer }
              remarks: { type: string, maxLength: 1000 }
        summary: { type: string, maxLength: 4000 }
        reportStorageKey:
          type: string
          maxLength: 512
          description: '`storageKey` from `POST /uploads/sign` with purpose `AUDIT_REPORT`.'

    AuditCompleteRequest:
      type: object
      additionalProperties: false
      properties:
        summary: { type: string, maxLength: 4000 }
        reportStorageKey:
          type: string
          maxLength: 512
          description: '`storageKey` from `POST /uploads/sign` with purpose `AUDIT_REPORT`.'

    AuditFindingCreate:
      type: object
      required: [severity, description]
      additionalProperties: false
      properties:
        severity: { $ref: '#/components/schemas/AuditFindingSeverity' }
        categoryCode: { $ref: '#/components/schemas/RatingCategoryCode' }
        description: { type: string, minLength: 3, maxLength: 2000 }
        correctiveAction: { type: string, maxLength: 2000 }
        dueDate: { type: string, format: date }

    AuditFindingUpdate:
      type: object
      description: 'After COMPLETED only `resolved: true` and `resolutionNote` are accepted.'
      additionalProperties: false
      minProperties: 1
      properties:
        severity: { $ref: '#/components/schemas/AuditFindingSeverity' }
        categoryCode:
          oneOf:
            - { $ref: '#/components/schemas/RatingCategoryCode' }
            - { type: 'null' }
        description: { type: string, minLength: 3, maxLength: 2000 }
        correctiveAction: { type: [string, 'null'], maxLength: 2000 }
        dueDate: { type: [string, 'null'], format: date }
        resolved: { type: boolean }
        resolutionNote: { type: string, maxLength: 2000 }

    AuditBulkRescheduleRequest:
      type: object
      description: Exactly one of `newScheduledFor` or `shiftDays`.
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [auditId]
            additionalProperties: false
            properties:
              auditId: { type: string, format: uuid }
              expectedScheduledFor:
                type: string
                format: date-time
                description: Optional optimistic-concurrency guard; the item fails with `CONFLICT` if the audit's current `scheduledFor` differs.
        newScheduledFor: { type: string, format: date-time }
        shiftDays: { type: integer, minimum: -90, maximum: 365, not: { const: 0 } }
        reason: { type: string, maxLength: 500, description: Recorded in each audit_log row. }
      oneOf:
        - { required: [newScheduledFor] }
        - { required: [shiftDays] }

    AuditBulkRescheduleResult:
      type: object
      required: [results, rescheduledCount, failedCount]
      properties:
        rescheduledCount: { type: integer, minimum: 0 }
        failedCount: { type: integer, minimum: 0 }
        results:
          type: array
          items:
            type: object
            required: [auditId, outcome]
            properties:
              auditId: { type: string, format: uuid }
              outcome: { type: string, enum: [RESCHEDULED, FAILED] }
              code:
                type: string
                description: Present when FAILED.
                enum: [NOT_FOUND, INVALID_STATE_TRANSITION, AUDIT_QUARTER_TAKEN, CONFLICT]
              detail: { type: string }
              audit:
                description: Present when RESCHEDULED.
                allOf:
                  - { $ref: '#/components/schemas/AuditSummary' }

    AuditComplianceFarmer:
      type: object
      required:
        [farmerId, tohfaFarmerId, farmerName, zoneId, zoneName, completedCount, requiredCount, complianceStatus,
         currentQuarterAudit, redFlaggedAuditCount, openMajorFindingCount]
      properties:
        farmerId: { type: string, format: uuid }
        tohfaFarmerId: { type: string }
        farmerName: { type: string }
        zoneId: { type: [string, 'null'], format: uuid }
        zoneName: { type: [string, 'null'] }
        completedCount: { type: integer, minimum: 0, maximum: 4 }
        requiredCount: { type: integer, enum: [4], description: One per fiscal quarter (BR-03). }
        complianceStatus: { $ref: '#/components/schemas/AuditComplianceStatus' }
        currentQuarterAudit:
          description: The farmer's live audit in the current quarter, or null (null for a past fiscal year).
          oneOf:
            - type: object
              required: [auditId, status, scheduledFor, overdue]
              properties:
                auditId: { type: string, format: uuid }
                status: { $ref: '#/components/schemas/AuditStatus' }
                scheduledFor: { type: string, format: date-time }
                overdue: { type: boolean, description: SCHEDULED/IN_PROGRESS with scheduledFor in the past. }
            - { type: 'null' }
        redFlaggedAuditCount: { type: integer, minimum: 0 }
        openMajorFindingCount: { type: integer, minimum: 0 }

    AuditComplianceSummary:
      type: object
      description: |
        Read-time compliance view for one fiscal year (BR-03b). `counts` cover the whole
        in-scope population; `farmers` is one cursor page. Drill into the audits behind a
        count with `GET /admin/audits` (`overdue`, `redFlagged`, `hasOpenMajorFindings`).
      required: [fiscalYear, isFiscalYearClosed, currentQuarter, currentQuarterEndsOn, asOf, counts, farmers, page]
      properties:
        fiscalYear: { $ref: '#/components/schemas/FiscalYear' }
        isFiscalYearClosed: { type: boolean, description: True once 31 March of the fiscal year has passed (Asia/Kolkata). }
        currentQuarter: { type: [integer, 'null'], minimum: 1, maximum: 4, description: Null unless `fiscalYear` is the current one. }
        currentQuarterEndsOn: { type: [string, 'null'], format: date, description: Last day of the current quarter (for "window closes in n days"). }
        asOf: { type: string, format: date-time }
        counts:
          type: object
          required:
            [farmersInScope, compliant, pending, nonCompliant, overdueAudits, farmersWithoutCurrentQuarterAudit,
             redFlaggedAudits, redFlaggedFarmers, openMajorFindings, scheduledThisQuarter]
          properties:
            farmersInScope: { type: integer, minimum: 0 }
            compliant: { type: integer, minimum: 0 }
            pending: { type: integer, minimum: 0 }
            nonCompliant: { type: integer, minimum: 0 }
            overdueAudits: { type: integer, minimum: 0, description: SCHEDULED/IN_PROGRESS audits in this fiscal year with scheduledFor in the past. }
            farmersWithoutCurrentQuarterAudit: { type: integer, minimum: 0, description: Farmers with no non-cancelled audit in the current quarter; 0 for a past fiscal year. }
            redFlaggedAudits: { type: integer, minimum: 0 }
            redFlaggedFarmers: { type: integer, minimum: 0 }
            openMajorFindings: { type: integer, minimum: 0 }
            scheduledThisQuarter: { type: integer, minimum: 0 }
        farmers:
          type: array
          items: { $ref: '#/components/schemas/AuditComplianceFarmer' }
        page: { $ref: '#/components/schemas/PageMeta' }

    Certification:
      type: object
      required: [id, farmerId, certType, customTypeName, certNumber, expiresOn, verificationStatus, blocksListings, createdAt]
      properties:
        id: { type: string, format: uuid }
        farmerId: { type: string, format: uuid, description: Admin-only context; never reaches the customer surface (BR-16). }
        certType: { $ref: '#/components/schemas/CertificationType' }
        customTypeName: { type: [string, 'null'], maxLength: 80, description: "The scheme an OTHER certificate belongs to (e.g. Jaivik Bharat). Always null for PGS and NPOP (BR-48i)." }
        certNumber: { type: string, maxLength: 80 }
        issuingBody: { type: string, maxLength: 160 }
        issuedOn: { type: string, format: date }
        expiresOn: { type: string, format: date }
        documentUrl: { type: [string, 'null'], format: uri }
        verificationStatus: { type: string, enum: [UNVERIFIED, VERIFIED, REJECTED] }
        verifiedAt: { type: [string, 'null'], format: date-time }
        verifiedBy: { type: [string, 'null'], format: uuid }
        verificationNotes: { type: [string, 'null'] }
        portalCheckedUrl: { type: [string, 'null'] }
        daysToExpiry: { type: integer, description: Negative once expired. Drives the farmer-app countdown. }
        blocksListings: { type: boolean, description: "Per certificate only: true when THIS certificate does not qualify on its own, because it is expired (BR-01), not VERIFIED (BR-02), or of type OTHER, which never qualifies (BR-02). It is not the farmer's eligibility. A farmer who holds any other qualifying certificate (verified, unexpired, PGS or NPOP) can still list." }
        createdAt: { type: string, format: date-time }

    CertificationCreate:
      type: object
      description: Validated per BR-48; see `POST /farmers/me/certifications`.
      required: [certType, certNumber, issuingBody, issuedOn, expiresOn]
      properties:
        certType: { $ref: '#/components/schemas/CertificationType' }
        customTypeName: { type: [string, 'null'], minLength: 1, maxLength: 80, description: "Required (trimmed, 1-80 characters) when certType is OTHER; must be null or omitted for PGS and NPOP (BR-48i)." }
        certNumber: { type: string, minLength: 1, maxLength: 80, description: Trimmed; blank is rejected. }
        issuingBody: { type: string, minLength: 1, maxLength: 160, description: Trimmed; blank is rejected. }
        issuedOn: { type: string, format: date, description: "A real calendar date, YYYY-MM-DD; not after today (Asia/Kolkata) and strictly before expiresOn (BR-48)." }
        expiresOn: { type: string, format: date, description: "A real calendar date, YYYY-MM-DD. May be in the past, but not more than system_config.cert_expiry_max_past_days (seeded 365) days before today, and not more than system_config.cert_expiry_max_future_days (seeded 730) days after today (Asia/Kolkata) (BR-48)." }
        documentUrl: { type: string, format: uri }

    CertificationUpdate:
      type: object
      description: |
        `PATCH /farmers/me/certifications/{id}` (BR-49) and its admin counterpart
        `PATCH /admin/certifications/{id}` (BR-51). Every field is optional but at
        least one is required. Each present field is checked as in
        `CertificationCreate`; the stored certificate with the patch applied must then
        pass all of BR-48. `customTypeName: null` clears the scheme name (required when
        moving a certificate from OTHER to PGS or NPOP). Unknown keys are ignored.
      minProperties: 1
      properties:
        certType: { $ref: '#/components/schemas/CertificationType' }
        customTypeName: { type: [string, 'null'], minLength: 1, maxLength: 80, description: "Trimmed. Send null to clear it; the merged result must have one iff certType is OTHER (BR-48i)." }
        certNumber: { type: string, minLength: 1, maxLength: 80, description: Trimmed; blank is rejected. }
        issuingBody: { type: string, minLength: 1, maxLength: 160, description: Trimmed; blank is rejected. }
        issuedOn: { type: string, format: date, description: "A real calendar date, YYYY-MM-DD (BR-48)." }
        expiresOn: { type: string, format: date, description: "A real calendar date, YYYY-MM-DD, within both BR-48 windows." }
        documentUrl: { type: string, format: uri, description: Replaces the certificate's document; the previous document is kept on record. }

    DiaryPlot:
      type: object
      description: |
        A farmer's own plot, for use as the plot picker on a new diary entry.
        Currently a deliberate stub fixture — see `GET /farmers/me/diary/plots`.
      required: [id, name, areaAcres]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        areaAcres: { type: [number, 'null'] }

    DiaryActiveCrop:
      type: object
      description: |
        A crop cycle currently in status GROWING on a plot (BR-42b). Currently a
        deliberate stub fixture — see `GET /farmers/me/diary/plots/{plotId}/active-crops`.
      required: [id, cropName, plantedOn]
      properties:
        id: { type: string, format: uuid }
        cropName: { type: string }
        plantedOn: { type: [string, 'null'], format: date }

    DiarySubActivity:
      type: object
      description: A specific activity within a diary taxonomy category (BR-45).
      required: [key, categoryKey, name, nameTa, sortOrder, isActive]
      properties:
        key: { type: string, example: land_prep.ploughing_tilling }
        categoryKey: { type: string, example: land_prep }
        name: { type: string }
        nameTa: { type: [string, 'null'] }
        sortOrder: { type: integer, minimum: 0, maximum: 32767 }
        isActive: { type: boolean }

    DiaryCategory:
      type: object
      description: A top-level diary activity category (BR-45).
      required: [key, name, nameTa, iconKey, sortOrder, isActive]
      properties:
        key: { type: string, example: land_prep }
        name: { type: string }
        nameTa: { type: [string, 'null'] }
        iconKey: { type: [string, 'null'] }
        sortOrder: { type: integer, minimum: 0, maximum: 32767 }
        isActive: { type: boolean }

    DiaryTaxonomy:
      type: object
      description: |
        The current, active-only activity taxonomy: every active category with its
        nested active sub-activities (BR-42a, BR-45b).
      required: [categories]
      properties:
        categories:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/DiaryCategory'
              - type: object
                required: [subActivities]
                properties:
                  subActivities:
                    type: array
                    items: { $ref: '#/components/schemas/DiarySubActivity' }

    DiaryWorkerInput:
      type: object
      description: |
        One worker's labour/wage detail on a diary entry. `wageRatePaise` is integer
        paise, not a decimal rupee string — root CLAUDE.md §2.2, money is never a float
        (see db/migrations/0022_farm_diary_workforce.sql). `hoursWorked` must be
        greater than 0 and at most 24, or the request is rejected with
        `DIARY_WORKER_HOURS_INVALID` (BR-44a); `wageRatePaise` must be a positive
        whole number of paise, or `DIARY_WAGE_RATE_INVALID` (BR-44b).
      required: [name, hoursWorked, wageRatePaise]
      properties:
        name: { type: string, maxLength: 120 }
        role: { type: string, maxLength: 80 }
        hoursWorked: { type: number, exclusiveMinimum: 0, maximum: 24 }
        wageRatePaise: { type: integer, minimum: 1, description: Integer paise per hour. }
        paymentStatus: { type: string, enum: [PENDING, PAID], default: PENDING }
      additionalProperties: false

    DiaryWorker:
      allOf:
        - $ref: '#/components/schemas/DiaryWorkerInput'
        - type: object
          required: [id, paymentStatus]
          properties:
            id: { type: string, format: uuid }

    DiaryPhoto:
      type: object
      description: A photo attached to a diary entry (BR-16, BR-41 — EXIF/GPS already stripped).
      required: [id, storageKey, mimeType, sizeBytes, createdAt]
      properties:
        id: { type: string, format: uuid }
        storageKey: { type: string }
        mimeType: { type: string }
        sizeBytes: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }

    DiaryPhotoAttachRequest:
      type: object
      description: |
        Body of `POST /farmers/me/diary/entries/{entryId}/photos`. `storageKey` must be
        a key previously issued by `POST /uploads/sign` for purpose `DIARY_PHOTO`.
      required: [storageKey, mimeType, sizeBytes]
      properties:
        storageKey:
          type: string
          minLength: 1
          maxLength: 512
          pattern: '^[a-z0-9_]+/[A-Za-z0-9._-]+$'
          description: A key returned by `POST /uploads/sign` for purpose `DIARY_PHOTO`.
        mimeType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        sizeBytes: { type: integer, minimum: 1, maximum: 26214400 }
      additionalProperties: false

    DiaryEntryCreateRequest:
      type: object
      description: |
        Body of `POST /farmers/me/diary/entries`. There is deliberately no `farmerId`
        field — the owner is always the caller (BR-40). `farmCropId` may be omitted —
        the server attaches the plot's most recently planted GROWING crop cycle — but
        when supplied it must itself be a GROWING crop on that plot, or the request is
        rejected with `DIARY_NO_ACTIVE_CROP` (BR-42b).
      required: [plotId, categoryKey, subActivityKey, minutes]
      properties:
        plotId: { type: string, format: uuid }
        farmCropId: { type: string, format: uuid }
        categoryKey: { type: string }
        subActivityKey: { type: string }
        minutes:
          type: integer
          maximum: 1440
          description: Time spent, in minutes. Missing or non-positive returns `DIARY_MINUTES_REQUIRED` (BR-42c).
        activityFields:
          type: object
          additionalProperties: true
          default: {}
          description: Free-form fields specific to the chosen sub-activity.
        notes: { type: string, maxLength: 2000 }
        activityOn: { type: string, format: date, description: 'Format YYYY-MM-DD. Defaults to today.' }
        voiceNoteKey: { type: string, minLength: 1, maxLength: 512 }
        voiceNoteDurationS: { type: integer, minimum: 1, maximum: 32767 }
        workers:
          type: array
          maxItems: 100
          default: []
          items: { $ref: '#/components/schemas/DiaryWorkerInput' }
      additionalProperties: false

    DiaryEntryUpdateRequest:
      type: object
      description: |
        Partial update of a diary entry — at least one field must be supplied.
        `plotId` and `farmCropId` are NOT present: they are not editable (BR-43).
        `workers`, when supplied, REPLACES the whole workforce set (BR-44c); when
        omitted the existing set is left untouched. Nullable fields accept `null` to
        clear them.
      properties:
        categoryKey: { type: string }
        subActivityKey: { type: string }
        minutes: { type: integer, maximum: 1440 }
        activityFields: { type: object, additionalProperties: true }
        notes: { type: [string, 'null'], maxLength: 2000 }
        activityOn: { type: string, format: date }
        voiceNoteKey: { type: [string, 'null'], minLength: 1, maxLength: 512 }
        voiceNoteDurationS: { type: [integer, 'null'], minimum: 1, maximum: 32767 }
        workers:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/DiaryWorkerInput' }
      additionalProperties: false

    DiaryEntrySummary:
      type: object
      description: |
        A logged farm activity, list form — `workerCount`/`photoCount` instead of the
        full `workers`/`photos` arrays (see `DiaryEntry` for the detail view).
      required:
        - id
        - plotId
        - farmCropId
        - categoryKey
        - subActivityKey
        - minutes
        - notes
        - activityOn
        - loggedAt
        - totalLabourCostPaise
        - createdAt
        - updatedAt
        - workerCount
        - photoCount
      properties:
        id: { type: string, format: uuid }
        plotId: { type: string, format: uuid }
        farmCropId: { type: string, format: uuid }
        categoryKey: { type: string }
        subActivityKey: { type: string }
        minutes: { type: integer }
        notes: { type: [string, 'null'] }
        activityOn: { type: string, format: date }
        loggedAt: { type: string, format: date-time }
        totalLabourCostPaise:
          type: integer
          minimum: 0
          description: |
            Read-only. Integer paise, computed at read time as
            ROUND(SUM(hoursWorked * wageRatePaise)) over the entry's workers — never
            stored (root CLAUDE.md §2.2 — money is never a float; BR-44).
        createdAt: { type: string, format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }
        workerCount: { type: integer, minimum: 0 }
        photoCount: { type: integer, minimum: 0 }

    DiaryEntry:
      type: object
      description: |
        A logged farm activity, with full workforce and photo detail and computed
        workforce cost. `totalLabourCostPaise` is computed at read time as
        ROUND(SUM(hoursWorked * wageRatePaise)) over `workers` — never stored — so it
        can never drift from an edited worker set (BR-40, BR-42, BR-44).
      required:
        - id
        - plotId
        - farmCropId
        - categoryKey
        - subActivityKey
        - minutes
        - activityFields
        - notes
        - activityOn
        - loggedAt
        - voiceNoteKey
        - voiceNoteDurationS
        - workers
        - totalLabourCostPaise
        - createdAt
        - updatedAt
        - photos
      properties:
        id: { type: string, format: uuid }
        plotId: { type: string, format: uuid }
        farmCropId: { type: string, format: uuid }
        categoryKey: { type: string }
        subActivityKey: { type: string }
        minutes: { type: integer }
        activityFields: { type: object, additionalProperties: true }
        notes: { type: [string, 'null'] }
        activityOn: { type: string, format: date }
        loggedAt: { type: string, format: date-time }
        voiceNoteKey: { type: [string, 'null'] }
        voiceNoteDurationS: { type: [integer, 'null'] }
        workers:
          type: array
          items: { $ref: '#/components/schemas/DiaryWorker' }
        totalLabourCostPaise:
          type: integer
          minimum: 0
          description: |
            Read-only. Integer paise, computed from `workers`, never stored (root
            CLAUDE.md §2.2 — money is never a float; see db/migrations/0021).
        createdAt: { type: string, format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }
        photos:
          type: array
          items: { $ref: '#/components/schemas/DiaryPhoto' }

    DiaryCalendar:
      type: object
      description: Per-day entry counts for one month, for the diary calendar view's day markers (BR-40).
      required: [month, days]
      properties:
        month: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        days:
          type: array
          items:
            type: object
            required: [date, entryCount]
            properties:
              date: { type: string, format: date }
              entryCount: { type: integer, minimum: 1 }

    DiaryCategoryCreateRequest:
      type: object
      description: Body of `POST /admin/diary/categories` (BR-45).
      required: [key, name, sortOrder]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 80
          pattern: '^[a-z0-9_.]+$'
          example: land_prep
          description: Lowercase letters, digits, "_" and ".".
        name: { type: string, maxLength: 120 }
        nameTa: { type: string, maxLength: 120 }
        iconKey: { type: string, maxLength: 80 }
        sortOrder: { type: integer, minimum: 0, maximum: 32767 }
      additionalProperties: false

    DiaryCategoryUpdateRequest:
      type: object
      description: |
        Partial update of a taxonomy category — at least one field must be supplied.
        Retiring a category (`isActive: false`) excludes it from the farmer-facing
        taxonomy and from new-entry validation, but never hard-deletes it — existing
        diary entries referencing it remain valid (BR-45b).
      properties:
        name: { type: string, maxLength: 120 }
        nameTa: { type: [string, 'null'], maxLength: 120 }
        iconKey: { type: [string, 'null'], maxLength: 80 }
        sortOrder: { type: integer, minimum: 0, maximum: 32767 }
        isActive: { type: boolean }
      additionalProperties: false

    DiarySubActivityCreateRequest:
      type: object
      description: Body of `POST /admin/diary/categories/{categoryKey}/sub-activities` (BR-45).
      required: [key, name, sortOrder]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 80
          pattern: '^[a-z0-9_.]+$'
          example: land_prep.ploughing_tilling
          description: Must be `<categoryKey>.<name>`.
        name: { type: string, maxLength: 120 }
        nameTa: { type: string, maxLength: 120 }
        sortOrder: { type: integer, minimum: 0, maximum: 32767 }
      additionalProperties: false

    DiarySubActivityUpdateRequest:
      type: object
      description: |
        Partial update of a sub-activity — at least one field must be supplied,
        following the same never-hard-delete retirement rule as its parent category
        (BR-45b).
      properties:
        name: { type: string, maxLength: 120 }
        nameTa: { type: [string, 'null'], maxLength: 120 }
        sortOrder: { type: integer, minimum: 0, maximum: 32767 }
        isActive: { type: boolean }
      additionalProperties: false

    GeoJsonPolygon:
      type: object
      required: [type, coordinates]
      description: >-
        GeoJSON Polygon, WGS84 (SRID 4326) — matches the `boundary` geography column on
        both `farms` and `plots` (db/migrations/0003_farmers_and_farms.sql).
      properties:
        type: { type: string, enum: [Polygon] }
        coordinates:
          type: array
          items: { type: array, items: { type: array, items: { type: number }, minItems: 2, maxItems: 2 } }

    Farm:
      type: object
      description: One of a farmer's land locations. Farm-anonymous rule BR-16 applies — never reaches a customer response.
      required: [id, name, boundaryVersion, district, isPrimary, waterSources, landBoundaryContext, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 120 }
        surveyNumber: { type: [string, 'null'] }
        areaAcres: { type: [number, 'null'] }
        centroidLat: { type: [number, 'null'], minimum: -90, maximum: 90 }
        centroidLng: { type: [number, 'null'], minimum: -180, maximum: 180 }
        boundary:
          description: The drawn FMB polygon, or null when none has been drawn yet.
          oneOf:
            - { $ref: '#/components/schemas/GeoJsonPolygon' }
            - type: 'null'
        boundaryAreaAcres: { type: [number, 'null'], description: Server-derived from the polygon. }
        boundaryDrawnBy: { type: [string, 'null'], format: uuid }
        boundaryDrawnAt: { type: [string, 'null'], format: date-time }
        boundaryVersion: { type: integer, minimum: 0 }
        address: { type: [string, 'null'] }
        village: { type: [string, 'null'] }
        taluk: { type: [string, 'null'] }
        district: { type: string }
        isPrimary: { type: boolean, description: Set only by the farmer-application approval backfill; never client-settable. }
        waterSources: { type: array, items: { type: string }, description: Mobile-constrained free text, e.g. Borewell. }
        landBoundaryContext: { type: array, items: { type: string }, description: Mobile-constrained free text, e.g. stand_alone. }
        notes: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }

    FarmListItem:
      allOf:
        - $ref: '#/components/schemas/Farm'
        - type: object
          required: [plotCount]
          properties:
            plotCount: { type: integer, minimum: 0, description: Number of zones (plots) drawn under this farm. }

    FarmCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        areaAcres: { type: number, exclusiveMinimum: 0 }
        boundary: { $ref: '#/components/schemas/GeoJsonPolygon' }
        village: { type: string, minLength: 1, maxLength: 120 }
        taluk: { type: string, minLength: 1, maxLength: 120 }
        district: { type: string, minLength: 1, maxLength: 120 }

    FarmUpdate:
      type: object
      description: Every field is optional; only the keys present in the body change.
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        areaAcres: { type: number, exclusiveMinimum: 0 }
        boundary:
          description: A GeoJSON Polygon to (re)draw the boundary, or null to clear it.
          oneOf:
            - { $ref: '#/components/schemas/GeoJsonPolygon' }
            - type: 'null'
        calculatedAreaAcres:
          type: number
          minimum: 0
          description: >-
            Server-derived acreage of `boundary`, named to match Step3Location.tsx /
            farmer-applications.schema.ts's field of the same name. Only consulted when
            `boundary` is also present in the same body.
        village: { type: string, minLength: 1, maxLength: 120 }
        taluk: { type: string, minLength: 1, maxLength: 120 }
        district: { type: string, minLength: 1, maxLength: 120 }
        waterSources: { type: array, items: { type: string, minLength: 1, maxLength: 60 } }
        landBoundaryContext: { type: array, items: { type: string, minLength: 1, maxLength: 60 } }
        notes: { type: [string, 'null'], maxLength: 2000 }

    Plot:
      type: object
      description: A zone ("plots" in the farm diary) sub-dividing one of a farmer's land locations.
      required: [id, farmId, name, createdAt]
      properties:
        id: { type: string, format: uuid }
        farmId: { type: string, format: uuid }
        name: { type: string, maxLength: 120 }
        areaAcres: { type: [number, 'null'] }
        soilType: { type: [string, 'null'] }
        sunExposure: { type: [string, 'null'] }
        irrigationType: { type: [string, 'null'] }
        boundary:
          description: >-
            The drawn zone polygon, or null when none has been drawn yet. Farm-anonymous
            rule BR-16 applies — never reaches a customer response.
          oneOf:
            - { $ref: '#/components/schemas/GeoJsonPolygon' }
            - type: 'null'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }

    PlotCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        areaAcres: { type: number, exclusiveMinimum: 0 }
        boundary: { $ref: '#/components/schemas/GeoJsonPolygon' }
        soilType: { type: string, minLength: 1, maxLength: 60 }
        sunExposure: { type: string, minLength: 1, maxLength: 60 }
        irrigationType: { type: string, minLength: 1, maxLength: 60 }

    PlotUpdate:
      type: object
      description: Every field is optional; only the keys present in the body change.
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        areaAcres: { type: number, exclusiveMinimum: 0 }
        boundary:
          description: A GeoJSON Polygon to (re)draw the zone boundary, or null to clear it.
          oneOf:
            - { $ref: '#/components/schemas/GeoJsonPolygon' }
            - type: 'null'
        soilType: { type: string, minLength: 1, maxLength: 60 }
        sunExposure: { type: string, minLength: 1, maxLength: 60 }
        irrigationType: { type: string, minLength: 1, maxLength: 60 }

    SoilTestRecord:
      type: object
      description: >-
        A lab soil test result for a zone (FR-F06 soil diary). The `*Label` fields are
        computed server-side from `system_config` classification bands by one shared
        function (BR-40) — never a client literal, never duplicated per endpoint.
      required:
        - id
        - plotId
        - testDate
        - nextDueDate
        - organicCarbonPct
        - ph
        - ecDsPerM
        - organicCarbonLabel
        - phLabel
        - ecLabel
        - createdAt
      properties:
        id: { type: string, format: uuid }
        plotId: { type: string, format: uuid }
        testDate: { type: string, format: date }
        nextDueDate: { type: string, format: date }
        organicCarbonPct: { type: number, minimum: 0, maximum: 100 }
        ph: { type: number, minimum: 0, maximum: 14 }
        ecDsPerM: { type: number, minimum: 0, description: Electrical conductivity, dS/m. }
        tdsPpm: { type: [integer, 'null'], minimum: 0 }
        nitrogenKgPerHa: { type: [number, 'null'], minimum: 0 }
        phosphorusKgPerHa: { type: [number, 'null'], minimum: 0 }
        potassiumKgPerHa: { type: [number, 'null'], minimum: 0 }
        limeStatus:
          type: [string, 'null']
          enum: [Harmless, Slight, Moderate, Severe, null]
        labReportUploadId: { type: [string, 'null'], format: uuid }
        organicCarbonLabel: { type: string, description: 'BR-40 label, e.g. Low/Medium/High.' }
        phLabel: { type: string, description: 'BR-40 label, e.g. Acidic/Good/Alkaline.' }
        ecLabel: { type: string, description: 'BR-40 label, e.g. Good/High.' }
        tdsLabel: { type: [string, 'null'], description: Null exactly when tdsPpm is null. }
        nitrogenLabel: { type: [string, 'null'], description: Null exactly when nitrogenKgPerHa is null. }
        phosphorusLabel: { type: [string, 'null'], description: Null exactly when phosphorusKgPerHa is null. }
        potassiumLabel: { type: [string, 'null'], description: Null exactly when potassiumKgPerHa is null. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }

    SoilTestRecordCreate:
      type: object
      required: [testDate, nextDueDate, organicCarbonPct, ph, ecDsPerM]
      properties:
        testDate: { type: string, format: date }
        nextDueDate: { type: string, format: date }
        organicCarbonPct: { type: number, minimum: 0, maximum: 100 }
        ph: { type: number, minimum: 0, maximum: 14 }
        ecDsPerM: { type: number, minimum: 0 }
        tdsPpm: { type: integer, minimum: 0 }
        nitrogenKgPerHa: { type: number, minimum: 0 }
        phosphorusKgPerHa: { type: number, minimum: 0 }
        potassiumKgPerHa: { type: number, minimum: 0 }
        limeStatus: { type: string, enum: [Harmless, Slight, Moderate, Severe] }
        labReportUploadId:
          type: string
          format: uuid
          description: Must reference an upload (purpose SOIL_TEST_REPORT) owned by the caller.

    SoilHealthSummaryMetric:
      type: object
      description: >-
        Pure arithmetic over the zone's own soil test records (BR-38: no generated
        advisory text). `trendDirection` tracks only whether the raw reading rose,
        fell, or held — never a judgement about whether that direction is good.
      required: [currentValue, previousValue, deltaValue, trendDirection, chartPoints]
      properties:
        currentValue: { type: [number, 'null'] }
        previousValue: { type: [number, 'null'] }
        deltaValue: { type: [number, 'null'], description: currentValue - previousValue. }
        trendDirection:
          type: [string, 'null']
          enum: [improving, declining, flat, null]
        chartPoints:
          type: array
          description: Up to the last 6 readings that have a value for this metric, oldest first.
          items:
            type: object
            required: [month, value]
            properties:
              month: { type: string, description: 'YYYY-MM, derived from testDate.' }
              value: { type: number }

    SoilHealthSummary:
      type: object
      required: [ph, organicCarbon, tds]
      properties:
        ph: { $ref: '#/components/schemas/SoilHealthSummaryMetric' }
        organicCarbon: { $ref: '#/components/schemas/SoilHealthSummaryMetric' }
        tds: { $ref: '#/components/schemas/SoilHealthSummaryMetric' }

    SoilAmendment:
      type: object
      description: An amendment (compost, lime, manure, ...) applied to a zone (FR-F06 soil diary).
      required: [id, plotId, amendmentType, quantityKg, appliedDate, createdAt]
      properties:
        id: { type: string, format: uuid }
        plotId: { type: string, format: uuid }
        amendmentType: { type: string, maxLength: 120 }
        quantityKg: { type: number, exclusiveMinimum: 0 }
        appliedDate: { type: string, format: date }
        notes: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }

    SoilAmendmentCreate:
      type: object
      required: [amendmentType, quantityKg, appliedDate]
      properties:
        amendmentType: { type: string, minLength: 1, maxLength: 120 }
        quantityKg: { type: number, exclusiveMinimum: 0 }
        appliedDate: { type: string, format: date }
        notes: { type: string, maxLength: 2000 }

    SoilAmendmentUpdate:
      type: object
      description: Every field is optional; only the keys present in the body change.
      properties:
        amendmentType: { type: string, minLength: 1, maxLength: 120 }
        quantityKg: { type: number, exclusiveMinimum: 0 }
        appliedDate: { type: string, format: date }
        notes: { type: [string, 'null'], maxLength: 2000 }

    SoilMoistureObservation:
      type: object
      description: An ad-hoc soil moisture observation for a zone (FR-F06 soil diary).
      required: [id, plotId, level, observedAt, observedBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        plotId: { type: string, format: uuid }
        level: { type: string, enum: [Dry, Moist, Wet] }
        observedAt: { type: string, format: date-time }
        observedBy:
          type: string
          format: uuid
          description: The authenticated caller who logged the observation — never client-supplied.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }

    SoilMoistureObservationCreate:
      type: object
      required: [level]
      properties:
        level: { type: string, enum: [Dry, Moist, Wet] }
        observedAt:
          type: string
          format: date-time
          description: Defaults to now() server-side when omitted.

    ErosionConservationNote:
      type: object
      description: >-
        An erosion risk assessment and/or conservation practice note for a zone
        (FR-F06 soil diary). `riskLevel` is a farmer self-assessment (BR-38), never a
        server-computed risk model.
      required: [id, plotId, riskLevel, loggedAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        plotId: { type: string, format: uuid }
        riskLevel: { type: string, enum: ['Low Risk', 'Moderate Risk', 'High Risk'] }
        practiceNotes: { type: [string, 'null'] }
        loggedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }

    ErosionConservationNoteCreate:
      type: object
      required: [riskLevel]
      properties:
        riskLevel: { type: string, enum: ['Low Risk', 'Moderate Risk', 'High Risk'] }
        practiceNotes: { type: string, maxLength: 2000 }
        loggedAt:
          type: string
          format: date-time
          description: Defaults to now() server-side when omitted.

    CropRotationEntry:
      type: object
      description: >-
        One crop in a zone's ordered rotation plan (FR-F06 soil diary). 100%
        farmer-entered planning, never system-suggested (BR-38).
      required: [id, plotId, sequenceOrder, cropName, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        plotId: { type: string, format: uuid }
        sequenceOrder: { type: integer, minimum: 1 }
        cropName: { type: string, maxLength: 120 }
        plannedDate: { type: [string, 'null'], format: date }
        status: { type: string, enum: [CURRENT, NEXT, PLANNED] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }

    CropRotationEntryInput:
      type: object
      required: [sequenceOrder, cropName, status]
      properties:
        sequenceOrder: { type: integer, minimum: 1 }
        cropName: { type: string, minLength: 1, maxLength: 120 }
        plannedDate: { type: string, format: date }
        status: { type: string, enum: [CURRENT, NEXT, PLANNED] }

    CropRotationPlan:
      type: object
      required: [sequence, coverCropWindow]
      properties:
        sequence:
          type: array
          items: { $ref: '#/components/schemas/CropRotationEntry' }
        coverCropWindow:
          description: The zone's current/most relevant cover crop window, or null if none has been logged.
          oneOf:
            - { $ref: '#/components/schemas/CoverCropWindow' }
            - type: 'null'

    CoverCropWindow:
      type: object
      description: >-
        A cover-crop planting window (date range + crop type) for a zone, tracked
        alongside but separately from the ordered crop rotation sequence (FR-F06 soil
        diary). 100% farmer-entered planning, never system-suggested (BR-38).
      required: [id, plotId, coverCropType, windowStart, windowEnd, createdAt]
      properties:
        id: { type: string, format: uuid }
        plotId: { type: string, format: uuid }
        coverCropType: { type: string, maxLength: 120 }
        windowStart: { type: string, format: date }
        windowEnd: { type: string, format: date }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }

    CoverCropWindowCreate:
      type: object
      required: [coverCropType, windowStart, windowEnd]
      properties:
        coverCropType: { type: string, minLength: 1, maxLength: 120 }
        windowStart: { type: string, format: date }
        windowEnd: { type: string, format: date, description: Must be on or after windowStart. }

    PestLibraryEntry:
      type: object
      description: >-
        A global pest/disease/weed/deficiency reference catalog entry (FR-F07).
        NOT zone-scoped — every caller reads the same row. Static admin-curated
        content: recommendedTreatment/intervalDays/phiDays describe the catalog
        entry itself, never a system-generated per-farmer suggestion (BR-38).
      required: [id, name, category, riskLevel, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        scientificName: { type: [string, 'null'] }
        category:
          type: string
          enum: [Disease, Pest, Weed, Deficiency]
        riskLevel:
          type: string
          enum: [High, Medium, Low]
        crops:
          type: array
          items: { type: string }
          description: Host crops this entry is known to affect.
        season: { type: [string, 'null'] }
        symptoms:
          type: array
          items: { type: string }
        organicTreatments:
          type: array
          items: { type: string }
        prevention:
          type: array
          items: { type: string }
        recommendedTreatment: { type: [string, 'null'] }
        intervalDays: { type: [integer, 'null'], minimum: 0 }
        phiDays: { type: [integer, 'null'], minimum: 0, description: Pre-harvest interval, in days. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }

    WeatherRiskNote:
      type: object
      description: >-
        An admin-authored, region-scoped weather/risk advisory note (FR-F07). NOT
        farmer-owned. Static hand-typed content, not a computed risk model wired
        to a live weather feed (BR-38).
      required: [id, region, note, createdAt]
      properties:
        id: { type: string, format: uuid }
        region: { type: string }
        note: { type: string }
        riskLevel:
          type: [string, 'null']
          enum: [High, Medium, Low, null]
        validFrom: { type: [string, 'null'], format: date }
        validUntil: { type: [string, 'null'], format: date }
        createdBy: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }

    PestDetection:
      type: object
      description: >-
        A farmer-logged pest/disease sighting on a zone (FR-F07). Farmer-entered
        observation only, never a system-detected/computed alert (BR-38).
      required: [id, plotId, pestName, severity, status, detectedOn, createdAt]
      properties:
        id: { type: string, format: uuid }
        plotId: { type: string, format: uuid }
        farmCropId: { type: [string, 'null'], format: uuid }
        pestLibraryId: { type: [string, 'null'], format: uuid }
        pestName: { type: string }
        scientificName: { type: [string, 'null'] }
        cropLabel:
          type: [string, 'null']
          description: >-
            Free-text crop label the farmer picked in the Crop/Zone field when
            reporting the detection (e.g. "Carrot — Nantes"). Null for
            detections logged before this field existed, or when omitted.
        severity:
          type: string
          enum: [High, Medium, Low]
        status:
          type: string
          enum: [Ongoing, Resolved, Recurring]
        detectedOn: { type: string, format: date }
        notes: { type: [string, 'null'] }
        photoUploadId: { type: [string, 'null'], format: uuid }
        resolvedAt: { type: [string, 'null'], format: date-time }
        resolutionEffective:
          type: [boolean, 'null']
          description: The farmer's own after-the-fact assessment of whether the treatment worked — never a server-computed efficacy score.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }

    PestDetectionCreate:
      type: object
      required: [pestName, severity, detectedOn]
      properties:
        farmCropId: { type: string, format: uuid }
        pestLibraryId: { type: string, format: uuid }
        pestName: { type: string, minLength: 1, maxLength: 120 }
        scientificName: { type: string, maxLength: 160 }
        cropLabel: { type: string, maxLength: 160 }
        severity:
          type: string
          enum: [High, Medium, Low]
        detectedOn: { type: string, format: date }
        notes: { type: string, maxLength: 2000 }
        photoUploadId:
          type: string
          format: uuid
          description: Must reference an upload (purpose PEST_PHOTO) owned by the caller.

    PestDetectionUpdate:
      type: object
      description: Partial update — typically marking a detection resolved.
      properties:
        status:
          type: string
          enum: [Ongoing, Resolved, Recurring]
        resolutionEffective: { type: [boolean, 'null'] }
        notes: { type: [string, 'null'], maxLength: 2000 }

    PestTreatmentLog:
      type: object
      description: >-
        A farmer-logged treatment application on a zone, optionally against a
        specific detection (FR-F07). Farmer-entered only — never a system-applied
        treatment (BR-38).
      required: [id, plotId, pestName, category, severity, treatment, appliedOn, createdAt]
      properties:
        id: { type: string, format: uuid }
        plotId: { type: string, format: uuid }
        farmCropId: { type: [string, 'null'], format: uuid }
        detectionId: { type: [string, 'null'], format: uuid }
        pestLibraryId: { type: [string, 'null'], format: uuid }
        pestName: { type: string }
        category:
          type: string
          enum: [Disease, Pest, Weed, Deficiency]
        severity:
          type: string
          enum: [High, Medium, Low]
        treatment: { type: string }
        intervalDays: { type: [integer, 'null'], minimum: 0 }
        phiDays: { type: [integer, 'null'], minimum: 0 }
        appliedOn: { type: string, format: date }
        nextApplicationDate: { type: [string, 'null'], format: date }
        photoUploadId: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }

    PestTreatmentLogCreate:
      type: object
      required: [pestName, category, severity, treatment, appliedOn]
      properties:
        farmCropId: { type: string, format: uuid }
        detectionId: { type: string, format: uuid }
        pestLibraryId: { type: string, format: uuid }
        pestName: { type: string, minLength: 1, maxLength: 120 }
        category:
          type: string
          enum: [Disease, Pest, Weed, Deficiency]
        severity:
          type: string
          enum: [High, Medium, Low]
        treatment: { type: string, minLength: 1, maxLength: 200 }
        intervalDays: { type: integer, minimum: 0 }
        phiDays: { type: integer, minimum: 0 }
        appliedOn: { type: string, format: date }
        nextApplicationDate: { type: string, format: date }
        photoUploadId:
          type: string
          format: uuid
          description: Must reference an upload (purpose PEST_PHOTO) owned by the caller.

    PestTreatmentReminder:
      type: object
      description: >-
        A follow-up reminder a farmer explicitly created for a zone, optionally
        tied to the detection that prompted it (FR-F07). Farmer-entered to-do —
        no scheduled job writes to this table (BR-38).
      required: [id, plotId, title, dueDate, repeatInterval, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        plotId: { type: string, format: uuid }
        detectionId: { type: [string, 'null'], format: uuid }
        title: { type: string }
        targetPest: { type: [string, 'null'] }
        dueDate: { type: string, format: date }
        repeatInterval:
          type: string
          enum: [ONE_TIME, WEEKLY, BIWEEKLY, MONTHLY]
        status:
          type: string
          enum: [Upcoming, Completed]
        completedAt: { type: [string, 'null'], format: date-time }
        notes: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }

    PestTreatmentReminderCreate:
      type: object
      required: [title, dueDate]
      properties:
        detectionId: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 160 }
        targetPest: { type: string, maxLength: 120 }
        dueDate: { type: string, format: date }
        repeatInterval:
          type: string
          enum: [ONE_TIME, WEEKLY, BIWEEKLY, MONTHLY]
          default: ONE_TIME
        notes: { type: string, maxLength: 2000 }

    PestTreatmentReminderUpdate:
      type: object
      description: Partial update — typically marking a reminder done.
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        dueDate: { type: string, format: date }
        status:
          type: string
          enum: [Upcoming, Completed]
        notes: { type: [string, 'null'], maxLength: 2000 }

    PestAnalyticsSummary:
      type: object
      description: >-
        A read-only aggregate over the caller's own already-logged pest data for
        one of their own farms (FR-F07). Not automated advice, a risk model, or a
        system-generated suggestion — nothing here is computed for or written to
        a farmer who has not already logged the underlying detections/treatment
        logs themself (BR-38).
      required: [detectionsBySeason, mostAffectedCrops, treatmentEffectiveness]
      properties:
        detectionsBySeason:
          type: array
          items:
            type: object
            required: [season, count]
            properties:
              season: { type: string }
              count: { type: integer, minimum: 0 }
        mostAffectedCrops:
          type: array
          items:
            type: object
            required: [crop, count]
            properties:
              crop: { type: string }
              count: { type: integer, minimum: 0 }
        treatmentEffectiveness:
          type: array
          items:
            type: object
            required: [treatment, timesUsed, timesEffective]
            properties:
              treatment: { type: string }
              timesUsed: { type: integer, minimum: 0 }
              timesEffective: { type: integer, minimum: 0 }

    Worker:
      type: object
      description: >-
        A worker on a farm's roster. Farm-scoped, not plot-scoped
        (db/migrations/0025_workforce.sql) — a worker is hired by the farm as
        a whole and moves between plots over the course of a day/season.
      required: [id, farmId, name, payType, payRatePaise, createdAt]
      properties:
        id: { type: string, format: uuid }
        farmId: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
        roleTitle: { type: [string, 'null'], maxLength: 120 }
        dateOfBirth: { type: [string, 'null'], format: date }
        gender: { type: [string, 'null'] }
        idProofUploadId: { type: [string, 'null'], format: uuid }
        photoUploadId: { type: [string, 'null'], format: uuid }
        bankAccountNo: { type: [string, 'null'] }
        ifscCode: { type: [string, 'null'] }
        upiId: { type: [string, 'null'] }
        payType:
          type: string
          enum: [daily, monthly]
        payRatePaise:
          type: integer
          exclusiveMinimum: 0
          description: BR-41a — a positive integer, never a float (root CLAUDE.md §2.2).
        createdAt: { type: string, format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }

    WorkerCreate:
      type: object
      required: [name, payType, payRatePaise]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        roleTitle: { type: string, maxLength: 120 }
        dateOfBirth: { type: string, format: date }
        gender: { type: string }
        idProofUploadId:
          type: string
          format: uuid
          description: Must reference an upload (purpose WORKER_ID_PROOF) owned by the caller.
        photoUploadId:
          type: string
          format: uuid
          description: Must reference an upload (purpose WORKER_PHOTO) owned by the caller.
        bankAccountNo: { type: string, maxLength: 40 }
        ifscCode: { type: string, maxLength: 20 }
        upiId: { type: string, maxLength: 120 }
        payType: { type: string, enum: [daily, monthly] }
        payRatePaise: { type: integer, exclusiveMinimum: 0 }

    WorkerUpdate:
      type: object
      description: Every field is optional; only the keys present in the body change.
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        roleTitle: { type: [string, 'null'], maxLength: 120 }
        dateOfBirth: { type: [string, 'null'], format: date }
        gender: { type: [string, 'null'] }
        idProofUploadId:
          type: [string, 'null']
          format: uuid
          description: Must reference an upload (purpose WORKER_ID_PROOF) owned by the caller.
        photoUploadId:
          type: [string, 'null']
          format: uuid
          description: Must reference an upload (purpose WORKER_PHOTO) owned by the caller.
        bankAccountNo: { type: [string, 'null'], maxLength: 40 }
        ifscCode: { type: [string, 'null'], maxLength: 20 }
        upiId: { type: [string, 'null'], maxLength: 120 }
        payType: { type: string, enum: [daily, monthly] }
        payRatePaise:
          type: integer
          exclusiveMinimum: 0
          description: BR-41a — a positive integer, never a float (root CLAUDE.md §2.2).

    AttendanceRecord:
      type: object
      description: >-
        One worker's attendance for one day (db/migrations/0025_workforce.sql
        `worker_attendance`, unique per worker/work_date).
      required: [id, workerId, workDate, present, createdAt]
      properties:
        id: { type: string, format: uuid }
        workerId: { type: string, format: uuid }
        workerName:
          type: string
          description: Included when listing across workers for one day (GET /farms/{farmId}/attendance).
        farmCropId: { type: [string, 'null'], format: uuid }
        workDate: { type: string, format: date }
        present: { type: boolean }
        activity: { type: [string, 'null'], maxLength: 200 }
        hoursWorked:
          type: [number, 'null']
          exclusiveMinimum: 0
          maximum: 24
          description: BR-41b — in (0, 24] when present, CHECKed at the database level.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }

    AttendanceUpsertItem:
      type: object
      description: One entry in a bulk attendance upsert (POST /farms/{farmId}/attendance).
      required: [workerId, present]
      properties:
        workerId: { type: string, format: uuid }
        present: { type: boolean }
        farmCropId: { type: string, format: uuid }
        activity: { type: string, maxLength: 200 }
        hoursWorked:
          type: number
          exclusiveMinimum: 0
          maximum: 24
          description: BR-41b — in (0, 24] when present, CHECKed at the database level.

    WorkerAdvance:
      type: object
      description: >-
        A cash advance given to a worker (db/migrations/0025_workforce.sql
        `worker_advances`), insert-only — never edited after creation.
      required: [id, workerId, amountPaise, givenOn, createdAt]
      properties:
        id: { type: string, format: uuid }
        workerId: { type: string, format: uuid }
        amountPaise: { type: integer, exclusiveMinimum: 0 }
        givenOn: { type: string, format: date }
        notes: { type: [string, 'null'], maxLength: 2000 }
        createdAt: { type: string, format: date-time }

    WorkerAdvanceCreate:
      type: object
      required: [amountPaise, givenOn]
      properties:
        amountPaise: { type: integer, exclusiveMinimum: 0 }
        givenOn: { type: string, format: date }
        notes: { type: string, maxLength: 2000 }

    WorkerPayout:
      type: object
      description: >-
        A payroll payout recorded for a worker's pay period
        (db/migrations/0025_workforce.sql `worker_payouts`), unique per
        (worker, period). This is a record of an amount already paid, not a
        stored gross/net figure the read-time payroll function depends on
        (BR-41c).
      required: [id, workerId, periodStart, periodEnd, amountPaise, paymentMethod, paidAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        workerId: { type: string, format: uuid }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        amountPaise: { type: integer, exclusiveMinimum: 0 }
        paymentMethod: { type: string, enum: [cash, bank_transfer, upi] }
        paidAt: { type: string, format: date-time }
        notes: { type: [string, 'null'], maxLength: 2000 }
        createdAt: { type: string, format: date-time }

    WorkerPayoutCreate:
      type: object
      required: [periodStart, periodEnd, amountPaise, paymentMethod]
      properties:
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        amountPaise: { type: integer, exclusiveMinimum: 0 }
        paymentMethod: { type: string, enum: [cash, bank_transfer, upi] }
        notes: { type: string, maxLength: 2000 }

    WorkforceSummary:
      type: object
      description: >-
        Headline workforce numbers for a farm, computed at read time from raw
        attendance/advance/payout rows — never a stored column (BR-41c).
      required: [workerCount, hoursThisMonth, payrollDueThisMonthPaise]
      properties:
        workerCount: { type: integer, minimum: 0 }
        hoursThisMonth: { type: number, minimum: 0 }
        payrollDueThisMonthPaise: { type: integer, minimum: 0 }

    PayrollSummaryItem:
      type: object
      description: >-
        One worker's payroll figures for a period, computed at read time from
        raw attendance/advance/payout rows — never a stored column (BR-41c).
      required: [workerId, workerName, grossPaise, advancesPaise, netPayablePaise, paidStatus]
      properties:
        workerId: { type: string, format: uuid }
        workerName: { type: string }
        grossPaise: { type: integer, minimum: 0 }
        advancesPaise: { type: integer, minimum: 0 }
        netPayablePaise: { type: integer, description: grossPaise - advancesPaise. }
        paidStatus:
          type: string
          enum: [pending, paid]
          description: paid when a worker_payouts row exists for this worker and period.

    CropHoursSummary:
      type: object
      description: >-
        Labor cost and hours attributed to one planting (farm_crops), computed
        at read time from raw attendance rows — never a stored column (BR-41c).
      required: [totalCostPaise, hoursLogged, workersInvolved, avgRatePaise]
      properties:
        totalCostPaise: { type: integer, minimum: 0 }
        hoursLogged: { type: number, minimum: 0 }
        workersInvolved: { type: integer, minimum: 0 }
        avgRatePaise: { type: integer, minimum: 0 }

    FarmCropStatus:
      type: string
      enum: [PLANNED, GROWING, HARVESTED, FAILED]
      description: |
        farm_crops.status. New plantings start PLANNED; at most one row per plot
        may be GROWING at a time (BR-46).

    SeedQuantityUnit:
      type: string
      enum: [grams, kg, packets, units]

    ExpectedGrade:
      type: string
      enum: [GRADE_A, GRADE_B, GRADE_C]

    CropMaster:
      type: object
      description: |
        A crop taxonomy row (`crop_master`). Allow-list response: `hsnCode` and the
        raw `categoryId` join are internal and not exposed here — the mobile crop
        screens only need name/nameTa/iconKey/defaultUnit for display and picking.
      required: [id, slug, name, nameTa, categoryId, botanicalName, defaultUnit, seasonMonths, shelfLifeDays, iconKey, isActive]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string, example: carrot }
        name: { type: string }
        nameTa: { type: [string, 'null'] }
        categoryId: { type: string, format: uuid }
        botanicalName: { type: [string, 'null'] }
        defaultUnit: { type: string, enum: [kg] }
        seasonMonths:
          type: [array, 'null']
          items: { type: integer, minimum: 1, maximum: 12 }
        shelfLifeDays: { type: [integer, 'null'], exclusiveMinimum: 0 }
        iconKey: { type: [string, 'null'] }
        isActive: { type: boolean }

    CropMasterCreateRequest:
      type: object
      description: Body of `POST /admin/crop-master`.
      required: [slug, name, categoryId]
      properties:
        slug: { type: string, minLength: 1, maxLength: 80, pattern: '^[a-z0-9-]+$' }
        name: { type: string, maxLength: 120 }
        nameTa: { type: string, maxLength: 120 }
        categoryId: { type: string, format: uuid }
        botanicalName: { type: string, maxLength: 160 }
        defaultUnit: { type: string, enum: [kg], default: kg }
        seasonMonths:
          type: array
          maxItems: 12
          items: { type: integer, minimum: 1, maximum: 12 }
        shelfLifeDays: { type: integer, exclusiveMinimum: 0 }
        iconKey: { type: string, maxLength: 80 }
      additionalProperties: false

    CropMasterUpdateRequest:
      type: object
      description: |
        Partial update of a crop type — at least one field must be supplied.
        Retiring one (`isActive: false`) excludes it from the farmer-facing picker
        but never hard-deletes it — existing `farm_crops`/listings referencing it
        remain valid.
      properties:
        name: { type: string, maxLength: 120 }
        nameTa: { type: [string, 'null'], maxLength: 120 }
        categoryId: { type: string, format: uuid }
        botanicalName: { type: [string, 'null'], maxLength: 160 }
        seasonMonths:
          type: [array, 'null']
          maxItems: 12
          items: { type: integer, minimum: 1, maximum: 12 }
        shelfLifeDays: { type: [integer, 'null'], exclusiveMinimum: 0 }
        iconKey: { type: [string, 'null'], maxLength: 80 }
        isActive: { type: boolean }
      additionalProperties: false

    FarmCrop:
      type: object
      description: |
        A planting record (`farm_crops`), plus the crop_master display fields the
        mobile crop screens render (`cropName`/`cropNameTa`/`cropIconKey`).
      required:
        - id
        - plotId
        - cropMasterId
        - cropName
        - cropNameTa
        - cropIconKey
        - status
        - plantedOn
        - expectedHarvestOn
        - actualHarvestOn
        - expectedYieldKg
        - actualYieldKg
        - seedVariety
        - seedCompany
        - seedQuantity
        - seedQuantityUnit
        - seedCostPaise
        - expectedGrade
        - notes
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        plotId: { type: string, format: uuid }
        cropMasterId: { type: string, format: uuid }
        cropName: { type: string }
        cropNameTa: { type: [string, 'null'] }
        cropIconKey: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/FarmCropStatus' }
        plantedOn: { type: [string, 'null'], format: date }
        expectedHarvestOn: { type: [string, 'null'], format: date }
        actualHarvestOn: { type: [string, 'null'], format: date }
        expectedYieldKg: { type: [number, 'null'], minimum: 0 }
        actualYieldKg: { type: [number, 'null'], minimum: 0 }
        seedVariety: { type: [string, 'null'] }
        seedCompany: { type: [string, 'null'] }
        seedQuantity: { type: [number, 'null'], minimum: 0 }
        seedQuantityUnit:
          oneOf:
            - { $ref: '#/components/schemas/SeedQuantityUnit' }
            - type: 'null'
        seedCostPaise:
          type: [integer, 'null']
          minimum: 0
          description: Integer paise, not rupees — root CLAUDE.md §2.2, money is never a float.
        expectedGrade:
          oneOf:
            - { $ref: '#/components/schemas/ExpectedGrade' }
            - type: 'null'
        notes: { type: [string, 'null'], maxLength: 2000 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }

    FarmCropCreateRequest:
      type: object
      description: |
        Body of `POST /farmers/me/plots/{plotId}/crops`. There is deliberately no
        `plotId` or `farmerId` field here — `plotId` travels in the URL and the
        owner is always the caller (root CLAUDE.md §2.1). The new row is created
        in status `PLANNED`, the farm_crops column default.
      required: [cropMasterId]
      properties:
        cropMasterId: { type: string, format: uuid }
        plantedOn: { type: string, format: date }
        expectedHarvestOn: { type: string, format: date }
        expectedYieldKg: { type: number, minimum: 0 }
        seedVariety: { type: string, maxLength: 160 }
        seedCompany: { type: string, maxLength: 160 }
        seedQuantity: { type: number, minimum: 0 }
        seedQuantityUnit: { $ref: '#/components/schemas/SeedQuantityUnit' }
        seedCostPaise: { type: integer, minimum: 0 }
        expectedGrade: { $ref: '#/components/schemas/ExpectedGrade' }
        notes: { type: string, maxLength: 2000 }
      additionalProperties: false

    FarmCropUpdateRequest:
      type: object
      description: |
        Partial update of a `farm_crops` row — at least one field must be
        supplied. `plotId` and `cropMasterId` are NOT present: they are not
        editable. Moving `status` to `GROWING` when the plot already has another
        live `GROWING` crop is rejected with `CROP_PLOT_ALREADY_GROWING` (BR-46).
        Nullable fields accept `null` to clear them.
      properties:
        status: { $ref: '#/components/schemas/FarmCropStatus' }
        plantedOn: { type: [string, 'null'], format: date }
        expectedHarvestOn: { type: [string, 'null'], format: date }
        actualHarvestOn: { type: [string, 'null'], format: date }
        expectedYieldKg: { type: [number, 'null'], minimum: 0 }
        actualYieldKg: { type: [number, 'null'], minimum: 0 }
        seedVariety: { type: [string, 'null'], maxLength: 160 }
        seedCompany: { type: [string, 'null'], maxLength: 160 }
        seedQuantity: { type: [number, 'null'], minimum: 0 }
        seedQuantityUnit:
          oneOf:
            - { $ref: '#/components/schemas/SeedQuantityUnit' }
            - type: 'null'
        seedCostPaise: { type: [integer, 'null'], minimum: 0 }
        expectedGrade:
          oneOf:
            - { $ref: '#/components/schemas/ExpectedGrade' }
            - type: 'null'
        notes: { type: [string, 'null'], maxLength: 2000 }
      additionalProperties: false

    PlotRotationHistory:
      type: object
      description: |
        Most-recent-first planting history for one plot, for the crop rotation
        timeline view (CropRotationScreen.tsx).
      required: [plotId, history]
      properties:
        plotId: { type: string, format: uuid }
        history:
          type: array
          items:
            type: object
            required: [farmCropId, cropName, cropIconKey, plantedOn, actualHarvestOn, status]
            properties:
              farmCropId: { type: string, format: uuid }
              cropName: { type: string }
              cropIconKey: { type: [string, 'null'] }
              plantedOn: { type: [string, 'null'], format: date }
              actualHarvestOn: { type: [string, 'null'], format: date }
              status: { $ref: '#/components/schemas/FarmCropStatus' }

    FarmAssetCategory:
      type: string
      enum: [TOOL, EQUIPMENT, MACHINERY]
      description: farm_assets.category. One unified table for the three near-identical mock screens (Machinery/Tools/Equipment).

    FarmAssetStatus:
      type: string
      enum: [OK, DUE_SOON, OVERDUE]
      description: |
        Computed on every read from `nextServiceDueOn` vs today (Asia/Kolkata)
        — never a database column. DUE_SOON's window is
        `system_config.asset_service_due_soon_days` (a specification-gap
        placeholder, see db/seed/001_reference.sql).

    FarmAsset:
      type: object
      description: |
        A maintenance-tracked farm asset (`farm_assets`) — one unified row
        shape for MachineryListScreen/ToolsListScreen/EquipmentListScreen.tsx,
        distinguished by `category`. `makeModel`/`fuelType` are
        machinery-specific and `coverageAreaAcres` is equipment-specific, but
        all three are plain nullable columns rather than three separate
        tables.

        `nextServiceDueOn` is a GENERATED column: `COALESCE(lastServicedOn,
        purchasedOn) + serviceIntervalDays`, matching the mock Add screens'
        own copy ("Next-due date is calculated from this interval and the
        last service."). `status`/`dueNote` are derived from it at read time
        and are never stored (db/migrations/0025_farm_assets.sql).
      required:
        - id
        - farmId
        - category
        - name
        - makeModel
        - fuelType
        - coverageAreaAcres
        - purchasedOn
        - costPaise
        - serviceIntervalDays
        - lastServicedOn
        - nextServiceDueOn
        - status
        - dueNote
        - notes
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        farmId: { type: string, format: uuid }
        category: { $ref: '#/components/schemas/FarmAssetCategory' }
        name: { type: string }
        makeModel: { type: [string, 'null'] }
        fuelType: { type: [string, 'null'] }
        coverageAreaAcres: { type: [number, 'null'], minimum: 0 }
        purchasedOn: { type: [string, 'null'], format: date }
        costPaise:
          type: [integer, 'null']
          minimum: 0
          description: Integer paise, not rupees — root CLAUDE.md §2.2, money is never a float.
        serviceIntervalDays: { type: [integer, 'null'], exclusiveMinimum: 0 }
        lastServicedOn: { type: [string, 'null'], format: date }
        nextServiceDueOn:
          type: [string, 'null']
          format: date
          description: GENERATED column. Never accepted in a request body — see FarmAssetCreateRequest/FarmAssetUpdateRequest.
        status: { $ref: '#/components/schemas/FarmAssetStatus' }
        dueNote:
          type: [string, 'null']
          example: '5 days away'
          description: e.g. "12 days overdue" / "Due today" / "5 days away". Computed, never stored. Null when nextServiceDueOn is null.
        notes: { type: [string, 'null'], maxLength: 2000 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }

    FarmAssetCreateRequest:
      type: object
      description: |
        Body of `POST /farmers/me/farm-assets`. There is deliberately no
        `farmerId` field — the owner is always the caller (root CLAUDE.md
        §2.1). `farmId` names one of the caller's own `farms`; a foreign
        `farmId` is 404. `serviceIntervalDays` is required, matching every
        mock Add screen (AddToolScreen/AddMachineryScreen/AddEquipmentScreen.tsx)
        marking "Service interval (days)" as required.
      required: [farmId, category, name, serviceIntervalDays]
      properties:
        farmId: { type: string, format: uuid }
        category: { $ref: '#/components/schemas/FarmAssetCategory' }
        name: { type: string, maxLength: 160 }
        makeModel: { type: string, maxLength: 160 }
        fuelType: { type: string, maxLength: 80 }
        coverageAreaAcres: { type: number, minimum: 0 }
        purchasedOn: { type: string, format: date }
        costPaise: { type: integer, minimum: 0 }
        serviceIntervalDays: { type: integer, exclusiveMinimum: 0 }
        lastServicedOn: { type: string, format: date }
        notes: { type: string, maxLength: 2000 }
      additionalProperties: false

    FarmAssetUpdateRequest:
      type: object
      description: |
        Partial update of a `farm_assets` row — at least one field must be
        supplied. `farmId` and `category` are NOT present: they are not
        editable. Nullable fields accept `null` to clear them.
      properties:
        name: { type: string, maxLength: 160 }
        makeModel: { type: [string, 'null'], maxLength: 160 }
        fuelType: { type: [string, 'null'], maxLength: 80 }
        coverageAreaAcres: { type: [number, 'null'], minimum: 0 }
        purchasedOn: { type: [string, 'null'], format: date }
        costPaise: { type: [integer, 'null'], minimum: 0 }
        serviceIntervalDays: { type: [integer, 'null'], exclusiveMinimum: 0 }
        lastServicedOn: { type: [string, 'null'], format: date }
        notes: { type: [string, 'null'], maxLength: 2000 }
      additionalProperties: false

    AnimalSpecies:
      type: string
      enum: [CATTLE, BUFFALO, GOAT, POULTRY, SHEEP]

    AnimalGender:
      type: string
      enum: [FEMALE, MALE]

    AnimalSource:
      type: string
      enum: [BORN_ON_FARM, PURCHASED]

    OrganicStatus:
      type: string
      enum: [ORGANIC, TRANSITIONING, CONVENTIONAL]

    LifecycleStatus:
      type: string
      enum: [ACTIVE, SOLD, TRANSFERRED, CULLED, DECEASED]
      description: |
        livestock_animals.lifecycle_status. New animals start ACTIVE; the rest
        are terminal, set exactly once by a lifecycle event (BR-47).

    LifecycleEventType:
      type: string
      enum: [SOLD, TRANSFERRED, CULLED, DECEASED]

    DairyProductType:
      type: string
      enum: [MILK, CURD, PANEER, BUTTER, GHEE, BUTTERMILK, CHEESE, EGGS]
      description: |
        The fixed 8-product dairy/poultry catalog. Each value logs in exactly
        one ProductionUnit: MILK/GHEE/BUTTERMILK in LITERS, CURD/PANEER/
        BUTTER/CHEESE in KG, EGGS as a COUNT.

    ProductionUnit:
      type: string
      enum: [LITERS, KG, COUNT]

    Animal:
      type: object
      description: |
        A `livestock_animals` row. Allow-list response: the internal `farm_id`
        is not exposed — the caller already knows whose herd this is, either
        from `/me` or from the `farmerId` it passed on the admin route.
      required:
        - id
        - tag
        - name
        - species
        - breed
        - gender
        - dateOfBirth
        - source
        - purchasedOn
        - sourceFarm
        - organicStatus
        - lifecycleStatus
        - withdrawalUntil
        - notes
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        tag: { type: string, example: C-014 }
        name: { type: [string, 'null'] }
        species: { $ref: '#/components/schemas/AnimalSpecies' }
        breed: { type: [string, 'null'] }
        gender: { $ref: '#/components/schemas/AnimalGender' }
        dateOfBirth: { type: [string, 'null'], format: date }
        source: { $ref: '#/components/schemas/AnimalSource' }
        purchasedOn: { type: [string, 'null'], format: date }
        sourceFarm: { type: [string, 'null'] }
        organicStatus: { $ref: '#/components/schemas/OrganicStatus' }
        lifecycleStatus: { $ref: '#/components/schemas/LifecycleStatus' }
        withdrawalUntil:
          type: [string, 'null']
          format: date
          description: |
            Post-medication milk/meat withdrawal window. While this is
            today-or-later, the animal's produce should not be marked
            organic-sellable (display-only; no business rule keys off it yet).
        notes: { type: [string, 'null'], maxLength: 2000 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }

    AnimalCreateRequest:
      type: object
      description: |
        Body of `POST /farmers/me/livestock/animals`. There is deliberately no
        `farmId` field — the new animal is attached to the caller's primary
        farm server-side (root CLAUDE.md §2.1) — and no `lifecycleStatus`:
        every new animal starts `ACTIVE`.
      required: [tag, species, gender]
      properties:
        tag: { type: string, minLength: 1, maxLength: 40 }
        name: { type: string, minLength: 1, maxLength: 120 }
        species: { $ref: '#/components/schemas/AnimalSpecies' }
        breed: { type: string, minLength: 1, maxLength: 120 }
        gender: { $ref: '#/components/schemas/AnimalGender' }
        dateOfBirth: { type: string, format: date }
        source: { $ref: '#/components/schemas/AnimalSource', default: BORN_ON_FARM }
        purchasedOn: { type: string, format: date }
        sourceFarm: { type: string, minLength: 1, maxLength: 160 }
        organicStatus: { $ref: '#/components/schemas/OrganicStatus', default: CONVENTIONAL }
        withdrawalUntil: { type: string, format: date }
        notes: { type: string, maxLength: 2000 }
      additionalProperties: false

    AnimalUpdateRequest:
      type: object
      description: |
        Partial update of a `livestock_animals` row — at least one field must
        be supplied. `lifecycleStatus` is NOT present: it only ever changes
        via `POST .../lifecycle-events` (BR-47). Nullable fields accept
        `null` to clear them.
      properties:
        tag: { type: string, minLength: 1, maxLength: 40 }
        name: { type: [string, 'null'], minLength: 1, maxLength: 120 }
        species: { $ref: '#/components/schemas/AnimalSpecies' }
        breed: { type: [string, 'null'], minLength: 1, maxLength: 120 }
        gender: { $ref: '#/components/schemas/AnimalGender' }
        dateOfBirth: { type: [string, 'null'], format: date }
        source: { $ref: '#/components/schemas/AnimalSource' }
        purchasedOn: { type: [string, 'null'], format: date }
        sourceFarm: { type: [string, 'null'], minLength: 1, maxLength: 160 }
        organicStatus: { $ref: '#/components/schemas/OrganicStatus' }
        withdrawalUntil: { type: [string, 'null'], format: date }
        notes: { type: [string, 'null'], maxLength: 2000 }
      additionalProperties: false

    LifecycleEventCreateRequest:
      type: object
      description: |
        Body of `POST /farmers/me/livestock/animals/{animalId}/lifecycle-events`.
        `salePricePaise` is integer paise, not rupees (root CLAUDE.md §2.2);
        only meaningful for `eventType: SOLD`. `eventDate` defaults to today
        when omitted.
      required: [eventType]
      properties:
        eventType: { $ref: '#/components/schemas/LifecycleEventType' }
        eventDate: { type: string, format: date }
        counterparty:
          type: string
          minLength: 1
          maxLength: 160
          description: Buyer name or destination farm.
        salePricePaise: { type: integer, minimum: 0 }
        reason: { type: string, minLength: 1, maxLength: 500 }
        notes: { type: string, maxLength: 2000 }
      additionalProperties: false

    ProductionLog:
      type: object
      description: A `livestock_production_logs` row.
      required: [id, animalId, productType, quantity, unit, loggedOn, batchInfo, sessions, notes, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        animalId:
          type: [string, 'null']
          format: uuid
          description: Null for flock-level egg collection, which has no single bird to attribute the count to.
        productType: { $ref: '#/components/schemas/DairyProductType' }
        quantity: { type: number, exclusiveMinimum: 0 }
        unit: { $ref: '#/components/schemas/ProductionUnit' }
        loggedOn: { type: string, format: date }
        batchInfo: { type: [string, 'null'], description: 'Free text, e.g. "Batch #3, cultured 24hr".' }
        sessions:
          type: [integer, 'null']
          exclusiveMinimum: 0
          description: Number of milking sessions that day. Only meaningful for MILK.
        notes: { type: [string, 'null'], maxLength: 2000 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }

    ProductionLogCreateRequest:
      type: object
      description: |
        Body of `POST /farmers/me/livestock/production-logs`. `unit` must
        match `productType`'s one fixed unit (see `DairyProductType`'s
        description) or the request is 422.
      required: [productType, quantity, unit]
      properties:
        animalId: { type: string, format: uuid }
        productType: { $ref: '#/components/schemas/DairyProductType' }
        quantity: { type: number, exclusiveMinimum: 0 }
        unit: { $ref: '#/components/schemas/ProductionUnit' }
        loggedOn: { type: string, format: date }
        batchInfo: { type: string, minLength: 1, maxLength: 500 }
        sessions: { type: integer, exclusiveMinimum: 0 }
        notes: { type: string, maxLength: 2000 }
      additionalProperties: false

    FairPrice:
      type: object
      required: [id, cropId, grade, ceilingPrice, effectiveFrom]
      properties:
        id: { type: string, format: uuid }
        cropId: { type: string, format: uuid }
        cropName: { type: string }
        grade: { $ref: '#/components/schemas/Grade' }
        ceilingPrice: { $ref: '#/components/schemas/Money' }
        frequency: { type: string, enum: [DAILY, WEEKLY] }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: [string, 'null'], format: date, description: Null while the window is open. }
        setBy: { type: [string, 'null'], format: uuid }
        notes: { type: [string, 'null'] }

    FairPriceCreate:
      type: object
      required: [cropId, grade, ceilingPrice, effectiveFrom]
      properties:
        cropId: { type: string, format: uuid }
        grade: { $ref: '#/components/schemas/Grade' }
        ceilingPrice: { $ref: '#/components/schemas/Money' }
        frequency: { type: string, enum: [DAILY, WEEKLY], default: WEEKLY }
        effectiveFrom: { type: string, format: date }
        notes: { type: string, maxLength: 300 }

    RetailPrice:
      type: object
      required: [id, cropId, grade, price, effectiveFrom]
      properties:
        id: { type: string, format: uuid }
        cropId: { type: string, format: uuid }
        cropName: { type: string }
        grade: { $ref: '#/components/schemas/Grade' }
        price: { $ref: '#/components/schemas/Money' }
        ceilingPrice: { $ref: '#/components/schemas/Money' }
        markupPct: { type: [number, 'null'] }
        gstInclusive: { type: boolean }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: [string, 'null'], format: date }

    RetailPriceCreate:
      type: object
      required: [cropId, grade, price, effectiveFrom]
      properties:
        cropId: { type: string, format: uuid }
        grade: { $ref: '#/components/schemas/Grade' }
        price: { $ref: '#/components/schemas/Money' }
        markupPct: { type: number, minimum: 0, maximum: 200 }
        gstInclusive: { type: boolean, default: true }
        effectiveFrom: { type: string, format: date }

    Listing:
      type: object
      required: [id, cropId, grade, quantityKg, askingPricePerKg, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        farmerId: { type: string, format: uuid }
        farmId: { type: [string, 'null'], format: uuid }
        cropId: { type: string, format: uuid }
        cropName: { type: string }
        grade: { $ref: '#/components/schemas/Grade' }
        quantityKg: { $ref: '#/components/schemas/Quantity' }
        askingPricePerKg: { $ref: '#/components/schemas/Money' }
        ceilingPricePerKg: { $ref: '#/components/schemas/Money' }
        finalPricePerKg: { type: [string, 'null'], description: Set once a counter-offer is accepted or the listing is approved. }
        finalQuantityKg: { type: [string, 'null'] }
        availableFrom: { type: [string, 'null'], format: date }
        photos: { type: array, items: { type: string, format: uri } }
        status: { $ref: '#/components/schemas/ListingStatus' }
        counterRoundsUsed: { type: integer, minimum: 0, maximum: 3, description: BR-11. }
        activeCounterOffer: { $ref: '#/components/schemas/CounterOffer' }
        rejectionReason: { type: [string, 'null'] }
        purchaseOrderId: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }

    ListingCreate:
      type: object
      required: [cropId, grade, quantityKg, askingPricePerKg]
      properties:
        farmId: { type: string, format: uuid }
        cropId: { type: string, format: uuid }
        grade: { $ref: '#/components/schemas/Grade', description: 'REJECT is not accepted here.' }
        quantityKg: { $ref: '#/components/schemas/Quantity' }
        askingPricePerKg: { $ref: '#/components/schemas/Money' }
        availableFrom: { type: string, format: date }
        photos: { type: array, maxItems: 5, items: { type: string, format: uri } }

    ListingUpdate:
      type: object
      properties:
        quantityKg: { $ref: '#/components/schemas/Quantity' }
        askingPricePerKg: { $ref: '#/components/schemas/Money' }
        availableFrom: { type: string, format: date }
        photos: { type: array, maxItems: 5, items: { type: string, format: uri } }
      additionalProperties: false

    AdminListing:
      allOf:
        - $ref: '#/components/schemas/Listing'
        - type: object
          properties:
            farmerName: { type: string }
            tohfaFarmerId: { type: string }
            zoneId: { type: [string, 'null'], format: uuid }
            farmerRating: { type: [number, 'null'] }
            routedAway:
              type: boolean
              description: True when the viewing Farmer Admin owns this listing; it is read-only for them and routed to another admin (BR-29).

    CounterOffer:
      type: object
      required: [id, round, offeredBy, pricePerKg, quantityKg, status, expiresAt]
      properties:
        id: { type: string, format: uuid }
        listingId: { type: [string, 'null'], format: uuid }
        goodsReceiptId: { type: [string, 'null'], format: uuid }
        round: { type: integer, minimum: 1, maximum: 4 }
        offeredBy: { type: string, enum: [ADMIN, FARMER] }
        offeredByUserId: { type: [string, 'null'], format: uuid }
        pricePerKg: { $ref: '#/components/schemas/Money' }
        quantityKg: { $ref: '#/components/schemas/Quantity' }
        message: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/CounterOfferStatus' }
        expiresAt: { type: string, format: date-time, description: Created plus 24 hours (BR-10). }
        respondedAt: { type: [string, 'null'], format: date-time }

    CounterOfferCreate:
      type: object
      required: [pricePerKg, quantityKg]
      properties:
        pricePerKg: { $ref: '#/components/schemas/Money' }
        quantityKg: { $ref: '#/components/schemas/Quantity' }
        message: { type: string, maxLength: 500 }

    PurchaseOrder:
      type: object
      required: [id, poNumber, farmerId, warehouseId, quantityKg, pricePerKg, totalAmount, status]
      properties:
        id: { type: string, format: uuid }
        poNumber: { type: string, examples: [PO-2026-004412] }
        farmerId: { type: string, format: uuid }
        listingId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        cropId: { type: string, format: uuid }
        grade: { $ref: '#/components/schemas/Grade' }
        quantityKg: { $ref: '#/components/schemas/Quantity' }
        pricePerKg: { $ref: '#/components/schemas/Money' }
        totalAmount: { $ref: '#/components/schemas/Money' }
        status: { $ref: '#/components/schemas/PurchaseOrderStatus' }
        expectedDeliveryDate: { type: [string, 'null'], format: date }
        issuedAt: { type: string, format: date-time }

    PurchaseOrderDetail:
      allOf:
        - $ref: '#/components/schemas/PurchaseOrder'
        - type: object
          properties:
            farmerName: { type: string }
            tohfaFarmerId: { type: string }
            receivedQtyKg: { $ref: '#/components/schemas/Quantity' }
            goodsReceipts: { type: array, items: { $ref: '#/components/schemas/GoodsReceipt' } }

    GoodsReceiptCreate:
      type: object
      required: [purchaseOrderId, warehouseId, grossQtyKg]
      properties:
        purchaseOrderId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        grossQtyKg: { $ref: '#/components/schemas/Quantity' }
        vehicleNumber: { type: string, maxLength: 20 }
        photos: { type: array, maxItems: 5, items: { type: string, format: uri } }
        remarks: { type: string, maxLength: 500 }

    GoodsReceipt:
      type: object
      required: [id, grnNumber, purchaseOrderId, warehouseId, grossQtyKg, status, receivedAt]
      properties:
        id: { type: string, format: uuid }
        grnNumber: { type: string, examples: [GRN-2026-008812] }
        purchaseOrderId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        grossQtyKg: { $ref: '#/components/schemas/Quantity' }
        acceptedQtyKg: { $ref: '#/components/schemas/Quantity' }
        rejectedQtyKg: { $ref: '#/components/schemas/Quantity' }
        rejectionReason: { type: [string, 'null'] }
        vehicleNumber: { type: [string, 'null'] }
        photos: { type: array, items: { type: string, format: uri } }
        status: { type: string, enum: [AWAITING_QC, ACCEPTED, PARTIALLY_ACCEPTED, REJECTED, COUNTER_OFFERED] }
        receivedBy: { type: string, format: uuid }
        receivedAt: { type: string, format: date-time }

    QualityCheckCreate:
      type: object
      required: [assignedGrade, outcome, acceptedQtyKg]
      properties:
        assignedGrade: { $ref: '#/components/schemas/Grade' }
        outcome: { type: string, enum: [ACCEPTED, PARTIALLY_ACCEPTED, REJECTED] }
        acceptedQtyKg: { $ref: '#/components/schemas/Quantity' }
        rejectedQtyKg: { $ref: '#/components/schemas/Quantity' }
        moisturePct: { type: number, minimum: 0, maximum: 100 }
        visualScore: { type: integer, minimum: 0, maximum: 10 }
        defectNotes: { type: string, maxLength: 500 }
        photos: { type: array, maxItems: 5, items: { type: string, format: uri } }
        priceAdjustment: { $ref: '#/components/schemas/Money', description: 'Signed per-kg adjustment when the assigned grade differs from the listed grade.' }
        storageLocation: { type: string, maxLength: 40 }
        expiryOn: { type: string, format: date }

    QualityCheck:
      type: object
      required: [id, goodsReceiptId, assignedGrade, outcome, checkedAt]
      properties:
        id: { type: string, format: uuid }
        goodsReceiptId: { type: string, format: uuid }
        assignedGrade: { $ref: '#/components/schemas/Grade' }
        outcome: { type: string, enum: [ACCEPTED, PARTIALLY_ACCEPTED, REJECTED] }
        acceptedQtyKg: { $ref: '#/components/schemas/Quantity' }
        rejectedQtyKg: { $ref: '#/components/schemas/Quantity' }
        moisturePct: { type: [number, 'null'] }
        visualScore: { type: [integer, 'null'] }
        defectNotes: { type: [string, 'null'] }
        photos: { type: array, items: { type: string, format: uri } }
        priceAdjustment: { $ref: '#/components/schemas/Money' }
        checkedBy: { type: string, format: uuid }
        checkedAt: { type: string, format: date-time }

    RejectedGoodsDisposal:
      type: object
      description: Record of disposal for rejected goods from quality check or intake.
      required: [id, goodsReceiptId, warehouseId, quantityKg, disposalMethod, reason, disposedBy, disposedAt]
      properties:
        id: { type: string, format: uuid }
        goodsReceiptId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        quantityKg: { $ref: '#/components/schemas/Quantity' }
        disposalMethod: { type: string, enum: [COMPOST, DISCARD, RETURN_TO_FARMER, BIO_WASTE] }
        reason: { type: string }
        photos: { type: array, items: { type: string, format: uri } }
        disposedBy: { type: string, format: uuid }
        disposedAt: { type: string, format: date-time }

    Batch:
      type: object
      description: An inventory batch. `sourceFarmerId` exists for traceability and is admin-only; it must never be projected onto a customer response (BR-16).
      required: [id, batchCode, warehouseId, cropId, grade, qtyAvailableKg, status]
      properties:
        id: { type: string, format: uuid }
        batchCode: { type: string, examples: [OOT-CAR-G1-20260818-01] }
        warehouseId: { type: string, format: uuid }
        cropId: { type: string, format: uuid }
        cropName: { type: string }
        grade: { $ref: '#/components/schemas/Grade' }
        goodsReceiptId: { type: [string, 'null'], format: uuid }
        sourceFarmerId: { type: [string, 'null'], format: uuid }
        qtyReceivedKg: { $ref: '#/components/schemas/Quantity' }
        qtyAvailableKg: { $ref: '#/components/schemas/Quantity' }
        qtyReservedKg: { $ref: '#/components/schemas/Quantity' }
        costPerKg: { $ref: '#/components/schemas/Money' }
        storageLocation: { type: [string, 'null'] }
        receivedOn: { type: string, format: date }
        expiryOn: { type: [string, 'null'], format: date }
        status: { $ref: '#/components/schemas/BatchStatus' }

    StockLedgerEntry:
      type: object
      description: An append-only ledger row. Rows are immutable; corrections are new rows (BR-37).
      required: [id, batchId, warehouseId, txnType, qtyDeltaKg, balanceAfterKg, performedAt]
      properties:
        id: { type: string, format: uuid }
        batchId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        txnType: { $ref: '#/components/schemas/StockTxnType' }
        qtyDeltaKg: { $ref: '#/components/schemas/Quantity', description: 'Signed: negative for outflows.' }
        balanceAfterKg: { $ref: '#/components/schemas/Quantity' }
        refType: { type: [string, 'null'], examples: [order_item, stock_adjustment] }
        refId: { type: [string, 'null'], format: uuid }
        performedBy: { type: [string, 'null'], format: uuid }
        performedAt: { type: string, format: date-time }
        remarks: { type: [string, 'null'] }

    StockAdjustmentCreate:
      type: object
      required: [batchId, adjustmentType, qtyDeltaKg, reason]
      properties:
        batchId: { type: string, format: uuid }
        adjustmentType: { type: string, enum: [DAMAGE, SHRINKAGE, COUNT_CORRECTION, EXPIRY] }
        qtyDeltaKg: { $ref: '#/components/schemas/Quantity' }
        reason: { type: string, minLength: 5, maxLength: 500 }

    StockAdjustment:
      type: object
      required: [id, batchId, adjustmentType, qtyDeltaKg, status, adjustedAt]
      properties:
        id: { type: string, format: uuid }
        batchId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        adjustmentType: { type: string, enum: [DAMAGE, SHRINKAGE, COUNT_CORRECTION, EXPIRY] }
        qtyDeltaKg: { $ref: '#/components/schemas/Quantity' }
        reason: { type: string }
        status: { type: string, enum: [PENDING_APPROVAL, APPROVED, REJECTED] }
        ledgerEntryId: { type: [string, 'null'], format: uuid }
        adjustedBy: { type: string, format: uuid }
        approvedBy: { type: [string, 'null'], format: uuid }
        adjustedAt: { type: string, format: date-time }

    Allocation:
      type: object
      required: [id, warehouseId, cropId, grade, allocationDate, channel, allocatedQtyKg]
      properties:
        id: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        cropId: { type: string, format: uuid }
        grade: { $ref: '#/components/schemas/Grade' }
        allocationDate: { type: string, format: date }
        channel: { $ref: '#/components/schemas/AllocationChannel' }
        allocatedQtyKg: { $ref: '#/components/schemas/Quantity' }
        consumedQtyKg: { $ref: '#/components/schemas/Quantity' }
        computedBy: { type: string, enum: [AUTO, MANUAL] }
        overriddenBy: { type: [string, 'null'], format: uuid }

    AllocationConfigUpdate:
      type: object
      required: [effectiveFrom, channels]
      properties:
        effectiveFrom: { type: string, format: date }
        channels:
          type: array
          minItems: 4
          maxItems: 4
          description: All four channels must be present and the percentages must sum to exactly 100 (BR-12).
          items:
            type: object
            required: [channel, percentage]
            properties:
              channel: { $ref: '#/components/schemas/AllocationChannel' }
              percentage: { type: number, minimum: 0, maximum: 100 }

    AllocationConfig:
      type: object
      required: [effectiveFrom, channels]
      properties:
        effectiveFrom: { type: string, format: date }
        channels:
          type: array
          items:
            type: object
            properties:
              channel: { $ref: '#/components/schemas/AllocationChannel' }
              percentage: { type: number }
        setBy: { type: string, format: uuid }
        setAt: { type: string, format: date-time }

    Category:
      type: object
      required: [id, name, slug]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        imageUrl: { type: [string, 'null'], format: uri }
        sortOrder: { type: integer }
        productCount: { type: integer }

    Product:
      type: object
      description: |
        FARM-ANONYMOUS. This schema is an allow-list. Never add farmerId, farmName,
        farmLocation, gps, or fmb fields. See BR-16.

        Customers see grade, certification badges and TOHFA branding only. Traceability
        back to the source farm lives on `Batch`, which is admin-only. `additionalProperties`
        is false so a serializer leak fails contract tests instead of shipping.
      required: [id, name, categoryId, grade, pricePerKg, availableQty, unit]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        categoryId: { type: string, format: uuid }
        grade: { $ref: '#/components/schemas/Grade' }
        pricePerKg: { $ref: '#/components/schemas/Money' }
        availableQty: { $ref: '#/components/schemas/Quantity' }
        unit: { type: string, enum: [kg] }
        photos: { type: array, items: { type: string, format: uri } }
        certificationBadges: { type: array, items: { $ref: '#/components/schemas/CertificationType' } }
        warehouseIds:
          type: array
          description: Warehouses where this product can be collected or dispatched from. Warehouse identity is TOHFA's, not the farm's, so it is safe to expose.
          items: { type: string, format: uuid }

    CatalogHome:
      type: object
      required: [categories, featured]
      properties:
        banners:
          type: array
          items:
            type: object
            properties:
