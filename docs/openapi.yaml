  /admin/warehouse-staff/{id}/deactivate:
    post:
      tags: [Warehouse Staff]
      operationId: deactivateWarehouseStaff
      summary: Deactivate a warehouse staff member
      description: |
        Soft: sets `status` INACTIVE. The row and its attendance stay for the record, but no new
        attendance can be marked for the person (409). Idempotent: deactivating an inactive member
        returns 200 and writes no audit row. A real change writes a `staff.deactivate` audit row
        (masked image) in the same transaction. There is no hard delete (BR-83).
      x-permission: admin.staff.manage
      x-business-rules: [BR-83]
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
      responses:
        '200':
          description: The staff member, now INACTIVE.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseStaff' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WarehouseStaffForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/staff-attendance/roll-call:
    get:
      tags: [Warehouse Staff]
      operationId: getStaffRollCall
      summary: Daily roll call
      description: |
        Every ACTIVE staff member of the caller's warehouse(s) with the day's mark, or
        `attendance: null` when not marked yet ("Not Checked In" in the design). A staff member
        deactivated later still appears on a day they have a record for. `date` is an
        Asia/Kolkata calendar date and defaults to today there. Counts are exact. A caller confined
        to one warehouse (a Main Warehouse Admin with an assigned warehouse) sees only that
        warehouse; `warehouseId` naming another is 404 (BR-84). A Main Warehouse Admin with no
        assigned warehouse sees all four (confirmed by the owner 2026-10-11).

        A Sub Warehouse Admin gets 403: this response names staff, and a Sub Warehouse Admin cannot
        list staff, so it has no attendance access (owner decision 2026-10-11, BR-83).

        UNCONFIRMED: `admin.staff.attendance.view` is a documented spec gap (owner approval pending
        for its other grants). The roll call does not exclude staff who joined after `date`.
      x-permission: admin.staff.attendance.view
      x-business-rules: [BR-84]
      parameters:
        - { name: date, in: query, description: 'Asia/Kolkata calendar date, a real YYYY-MM-DD date; default today.', schema: { type: string, format: date } }
        - { name: warehouseId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The roll call.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffRollCall' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WarehouseStaffForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/staff-attendance/summary:
    get:
      tags: [Warehouse Staff]
      operationId: getStaffAttendanceSummary
      summary: Attendance summary per staff member
      description: |
        Exact counts of PRESENT, ABSENT and LEAVE days per staff member over `month` (YYYY-MM) or
        over `from` to `to` (inclusive), plus totals. `marked` is present + absent + leave: days
        with no row are not counted. ACTIVE staff appear even with zero rows; a deactivated member
        appears only when they have rows in the range. `staffId` or `warehouseId` outside the
        caller's scope is 404. A from/to range is capped by
        `system_config.staff_attendance_max_range_days` (366 by default, UNCONFIRMED), else 422; a
        month is never capped (BR-84).
      x-permission: admin.staff.attendance.view
      x-business-rules: [BR-84]
      parameters:
        - { name: month, in: query, description: 'YYYY-MM. Give this or both `from` and `to`.', schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: staffId, in: query, schema: { type: string, format: uuid } }
        - { name: warehouseId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffAttendanceSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WarehouseStaffForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/staff-attendance:
    get:
      tags: [Warehouse Staff]
      operationId: listStaffAttendance
      summary: Attendance history
      description: |
