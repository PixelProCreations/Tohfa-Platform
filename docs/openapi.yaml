        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    patch:
      tags: [Pest Management]
      operationId: updateMyPestDetection
      summary: Update a pest detection's status
      description: |
        Partial update of a detection logged under one of the caller's own zones —
        typically marking it resolved and recording whether the farmer's own
        treatment worked (`resolutionEffective` is the farmer's own after-the-fact
        assessment, never a server-computed efficacy score, BR-38). Only the
        fields present in the body change. A farm, plot or detection id that does
        not exist, or belongs to another farmer, 404s rather than 403 (BR-36).
      x-permission: farmer.pest.manage_own
      x-business-rules: [BR-36, BR-38]
      parameters:
        - name: farmId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: plotId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: detectionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PestDetectionUpdate' }
            example:
              status: Resolved
              resolutionEffective: true
      responses:
        '200':
          description: Updated pest detection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PestDetection' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farms/{farmId}/plots/{plotId}/pest-treatment-logs:
    get:
      tags: [Pest Management]
      operationId: listMyPestTreatmentLogs
      summary: List a zone's pest treatment logs
      description: |
        Lists treatment applications (organic spray, biological control, ...)
        logged against one of the caller's own zones, newest `appliedOn` first. A
        farm or plot id that does not exist, or belongs to another farmer, 404s
        rather than 403 (BR-36).
      x-permission: farmer.pest.manage_own
      x-business-rules: [BR-36, BR-38]
      parameters:
        - name: farmId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: plotId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The zone's pest treatment logs.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PestTreatmentLog' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Pest Management]
      operationId: createMyPestTreatmentLog
      summary: Log a pest treatment application
      description: |
        Logs a treatment application for one of the caller's own zones, optionally
        against a specific `detectionId`. `intervalDays`/`phiDays` are typically
        copied from the selected pest library entry at log time (or entered by
        hand) so the row is a self-contained record of what the farmer actually
        applied, not a live join that changes retroactively if the catalog entry
        is later edited. `photoUploadId`, when supplied, must reference an upload
        (`POST /uploads/sign` with `purpose: PEST_PHOTO`) the caller themself
        created. Farmer-entered only, never a system-applied treatment (BR-38). A
        farm or plot id that does not exist, or belongs to another farmer, 404s
        rather than 403 (BR-36).
      x-permission: farmer.pest.manage_own
      x-business-rules: [BR-36, BR-38]
      parameters:
        - name: farmId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: plotId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PestTreatmentLogCreate' }
            example:
              pestName: Powdery Mildew
              category: Disease
              severity: Low
              treatment: Wettable Sulphur / Trichoderma
              intervalDays: 12
              phiDays: 5
              appliedOn: '2026-09-21'
      responses:
        '201':
          description: Pest treatment log created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PestTreatmentLog' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farms/{farmId}/plots/{plotId}/pest-treatment-reminders:
    get:
      tags: [Pest Management]
      operationId: listMyPestTreatmentReminders
      summary: List a zone's pest treatment reminders
      description: |
        Lists follow-up reminders the caller created for one of their own zones,
        soonest `dueDate` first. Every row here was explicitly typed by the
        farmer — no scheduled job writes to this table (BR-38). A farm or plot id
        that does not exist, or belongs to another farmer, 404s rather than 403
        (BR-36).
      x-permission: farmer.pest.manage_own
      x-business-rules: [BR-36, BR-38]
      parameters:
        - name: farmId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: plotId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The zone's pest treatment reminders.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PestTreatmentReminder' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Pest Management]
      operationId: createMyPestTreatmentReminder
      summary: Create a pest treatment reminder
      description: |
        Creates a follow-up reminder for one of the caller's own zones, optionally
        tied to the pest detection that prompted it. This is a farmer-entered
        to-do, not an automatically generated notification — creating this
        endpoint at all sits on the BR-38 boundary this feature stays on the
        manual side of (docs/rules.md "Open contradictions" row 19): the server
        only ever stores a reminder the farmer typed, never one it invented on
        their behalf. A farm or plot id that does not exist, or belongs to
        another farmer, 404s rather than 403 (BR-36).
      x-permission: farmer.pest.manage_own
      x-business-rules: [BR-36, BR-38]
      parameters:
        - name: farmId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: plotId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PestTreatmentReminderCreate' }
            example:
              title: Re-check for aphids
              targetPest: Aphids
              dueDate: '2026-09-28'
              repeatInterval: ONE_TIME
      responses:
        '201':
          description: Pest treatment reminder created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PestTreatmentReminder' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farms/{farmId}/plots/{plotId}/pest-treatment-reminders/{reminderId}:
