          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: workerId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: month
          in: query
          required: false
          schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
          description: 'YYYY-MM. Narrows results to work_date within that calendar month.'
        - name: farmCropId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The worker's attendance history.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AttendanceRecord' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

