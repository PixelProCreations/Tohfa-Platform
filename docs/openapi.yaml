          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LifecycleEventCreateRequest' }
      responses:
        '201':
          description: Event recorded; the animal's updated state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Animal' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farmers/me/livestock/production-logs:
    get:
      tags: [Livestock]
      operationId: listMyLivestockProductionLogs
      summary: Produce history log
      description: |
        Lists the caller's own `livestock_production_logs` rows, newest-first,
