    FarmWeather:
      type: object
      description: A weather snapshot for one farm's registered centroid (BR-16 — farmer-only).
      required: [provider, observedAt, location, current, hourly, daily]
      properties:
        provider: { type: string, enum: [openweathermap], description: Which adapter served this snapshot. }
        observedAt: { type: string, format: date-time, description: When the upstream observation was taken. }
        location: { $ref: '#/components/schemas/FarmWeatherLocation' }
        current: { $ref: '#/components/schemas/FarmWeatherCurrent' }
        hourly:
          type: array
          description: Up to 8 entries covering the next 24 hours in 3-hour steps.
          items: { $ref: '#/components/schemas/FarmWeatherHourly' }
        daily:
          type: array
          description: Up to 7 entries. The first entry is always the farm's local today.
          items: { $ref: '#/components/schemas/FarmWeatherDaily' }

    FarmWeatherLocation:
      type: object
      required: [farmName, village, latitude, longitude]
      properties:
        farmName: { type: string }
        village: { type: [string, 'null'] }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }

    FarmWeatherCurrent:
      type: object
      required: [temperatureC, feelsLikeC, condition, humidityPct, windKph, precipitationChancePct]
      properties:
        temperatureC: { type: number, description: Degrees Celsius. }
        feelsLikeC: { type: number, description: Apparent temperature in degrees Celsius. }
        condition: { $ref: '#/components/schemas/WeatherCondition' }
        humidityPct: { type: number, minimum: 0, maximum: 100 }
        windKph: { type: number, minimum: 0, description: Wind speed in kilometres per hour. }
        precipitationChancePct: { type: number, minimum: 0, maximum: 100 }

    FarmWeatherHourly:
      type: object
      required: [at, temperatureC, condition]
      properties:
        at: { type: string, format: date-time }
        temperatureC: { type: number }
        condition: { $ref: '#/components/schemas/WeatherCondition' }

    FarmWeatherDaily:
      type: object
      required: [date, minTempC, maxTempC, condition, precipitationMm]
      properties:
        date: { type: string, format: date }
        minTempC: { type: number }
        maxTempC: { type: number }
        condition: { $ref: '#/components/schemas/WeatherCondition' }
        precipitationMm: { type: number, minimum: 0 }

    WeatherCondition:
      type: string
      description: Provider-neutral weather taxonomy. Both adapters map their vocabulary onto this set.
      enum: [CLEAR, CLEAR_NIGHT, PARTLY_CLOUDY, CLOUDY, FOG, LIGHT_RAIN, RAIN, THUNDERSTORM]

    FarmerProfileUpdate:
      type: object
      description: Aadhaar and mobile are deliberately absent — they are locked (BR-33).
      properties:
        fullName: { type: string, minLength: 2, maxLength: 120 }
        dob: { type: string, format: date }
        gender: { type: string, enum: [MALE, FEMALE, OTHER] }
        farmingExperienceYears: { type: integer, minimum: 0, maximum: 90 }
        address: { type: string, maxLength: 300 }
        preferredLocale: { $ref: '#/components/schemas/Locale' }
      additionalProperties: false

    FarmRatingModule:
      type: object
      description: |
        One rating category's score. No `name`/display-name field on purpose — root
        CLAUDE.md §2.7 forbids user-facing strings sourced from the DB reaching a client;
        the mobile/admin clients own category display names via their own i18n catalogues.
      required: [categoryCode, score, maxScore]
      properties:
        categoryCode:
          type: string
          enum:
            [
              CERTIFICATION,
              SOIL_LAND,
              FARMING_PRACTICES,
              ENVIRONMENTAL,
              PRODUCE_QUALITY,
              TRACEABILITY,
              SOCIAL_LABOR,
              FINANCIAL,
              MARKET_RELATIONS,
              INNOVATION,
            ]
        score: { type: [integer, 'null'], minimum: 0, maximum: 10 }
        maxScore: { type: integer, enum: [10] }

    FarmRating:
      type: object
      description: |
        BR-06 (LOCKED): exactly 10 named categories, each scored 0-10, summed DIRECTLY to
        a 0-100 total — no multiplier. A rating missing any category score is
        incomplete, not zero. Read-only: since 2026-10-01 a rating is created only by
        completing an INTERNAL audit, always `COMPLETE`; a `DRAFT` with partial scores
        can only be a legacy manual row, and a never-rated farmer gets an all-null
        `DRAFT` shell with `source: null`.
      required: [farmerId, periodLabel, status, modules, overallRating, ratingTier, ratedAt, source, sourceAuditId]
      properties:
        farmerId: { type: string, format: uuid }
        periodLabel:
          type: string
          description: |
            Identifies the rating cycle. Audit-derived ratings use the audit's fiscal
            period, e.g. `2026-27 Q1`; legacy manual rows use `CYCLE-n`. A never-rated
            farmer gets the placeholder `CYCLE-1` (not persisted).
        status: { type: string, enum: [DRAFT, COMPLETE] }
        modules:
          type: array
          minItems: 10
          maxItems: 10
          items: { $ref: '#/components/schemas/FarmRatingModule' }
        overallRating: { type: [number, 'null'], description: Direct sum of the 10 category scores (0-100). }
        ratingTier: { type: [string, 'null'], enum: [POOR, MODERATE, GOOD, EXCELLENT, null] }
        ratedAt: { type: [string, 'null'], format: date-time, description: Set only once status is COMPLETE. }
        source:
          type: [string, 'null']
          enum: [AUDIT, MANUAL, null]
          readOnly: true
          description: |
            `AUDIT` = derived from a completed INTERNAL audit (see `sourceAuditId`);
            `MANUAL` = legacy rating entered through the removed manual PUT, kept as
            history; null = the farmer has never been rated.
        sourceAuditId:
          type: [string, 'null']
          format: uuid
          readOnly: true
          description: The completed INTERNAL audit this rating was derived from; null unless `source` is `AUDIT`.

    AuditType:
      type: string
      description: INTERNAL is conducted by a TOHFA admin; EXTERNAL records an outside agency's visit, entered by an admin from the agency's report (no agency login).
      enum: [INTERNAL, EXTERNAL]

    AuditStatus:
      type: string
      description: SCHEDULED -> IN_PROGRESS -> COMPLETED; SCHEDULED or IN_PROGRESS -> CANCELLED.
      enum: [SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED]

    AuditFindingSeverity:
      type: string
      enum: [MAJOR, MINOR, OBSERVATION]

    AuditTier:
      type: [string, 'null']
      description: |
        Resolved at read time from `rating_tier_config` (BR-04a) for `totalScore`; null
        until the audit is COMPLETED. Never stored on the audit.
      enum: [POOR, MODERATE, GOOD, EXCELLENT, null]

    AuditComplianceStatus:
      type: string
      description: |
        BR-03b. `COMPLIANT`: 4 COMPLETED audits in the fiscal year. `PENDING`: fewer than
        4 and the fiscal year has not ended. `NON_COMPLIANT`: fewer than 4 and the fiscal
        year has ended — never silently passed.
      enum: [COMPLIANT, PENDING, NON_COMPLIANT]

    FiscalYear:
      type: string
      description: Indian fiscal year April-March, e.g. `2026-27` (same format as invoices).
      pattern: '^[0-9]{4}-[0-9]{2}$'
      examples: ['2026-27']

    RatingCategoryCode:
      type: string
      description: The 10 seeded `rating_categories` (BR-06), shared by farm ratings and audits. Clients own display names via i18n.
      enum:
        [
          CERTIFICATION,
          SOIL_LAND,
          FARMING_PRACTICES,
          ENVIRONMENTAL,
          PRODUCE_QUALITY,
          TRACEABILITY,
          SOCIAL_LABOR,
          FINANCIAL,
          MARKET_RELATIONS,
          INNOVATION,
        ]

    AuditFindingCounts:
      type: object
      description: Computed at read time from `audit_findings`. `openMajor` counts unresolved MAJOR findings.
      required: [major, minor, observation, openMajor]
      properties:
        major: { type: integer, minimum: 0 }
        minor: { type: integer, minimum: 0 }
        observation: { type: integer, minimum: 0 }
        openMajor: { type: integer, minimum: 0 }

    AuditReportUpload:
      type: object
      description: The optional uploaded report file (typically the external agency's own report). Download it via the report endpoint with `variant=agency`.
      required: [uploadId, mimeType, sizeBytes]
      properties:
        uploadId: { type: string, format: uuid }
        mimeType: { type: string, examples: [application/pdf] }
        sizeBytes: { type: integer, minimum: 1 }

    AuditCategoryScore:
      type: object
      description: |
        One category's score on an audit. Always 10 of these, in `rating_categories`
        sort order; `score` is null for a category not yet scored (incomplete, not zero —
        BR-06). No display name on purpose (clients own names via i18n, as with
        `FarmRatingModule`).
      required: [categoryCode, score, maxScore]
      properties:
        categoryCode: { $ref: '#/components/schemas/RatingCategoryCode' }
        score: { type: [integer, 'null'], minimum: 0, maximum: 10 }
        maxScore: { type: integer, enum: [10] }
        remarks: { type: [string, 'null'] }

    AuditFinding:
      type: object
      required: [id, auditId, severity, description, categoryCode, correctiveAction, dueDate, resolvedAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        auditId: { type: string, format: uuid }
        severity: { $ref: '#/components/schemas/AuditFindingSeverity' }
        categoryCode:
          oneOf:
            - { $ref: '#/components/schemas/RatingCategoryCode' }
            - { type: 'null' }
        description: { type: string }
        correctiveAction: { type: [string, 'null'] }
        dueDate: { type: [string, 'null'], format: date }
        resolvedAt: { type: [string, 'null'], format: date-time }
        resolvedByName: { type: [string, 'null'], description: Admin views only; omitted from farmer responses. }
        resolutionNote: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }

    AuditSummary:
      type: object
      description: One row of the admin audit list / calendar / farmer history.
      required:
        [id, farmerId, tohfaFarmerId, farmerName, farmId, farmName, zoneId, zoneName, fiscalYear, quarter,
         auditType, status, scheduledFor, startedAt, completedAt, auditorUserId, auditorName,
         externalAgencyName, totalScore, maxScore, tier, majorViolationsCount, findingCounts, redFlagged]
      properties:
        id: { type: string, format: uuid }
        farmerId: { type: string, format: uuid }
        tohfaFarmerId: { type: string, examples: [TOHFA-F-2026-0234] }
        farmerName: { type: string }
        farmId: { type: [string, 'null'], format: uuid }
        farmName: { type: [string, 'null'] }
        zoneId: { type: [string, 'null'], format: uuid, description: The zone the audit was scheduled in (snapshot). }
        zoneName: { type: [string, 'null'] }
        fiscalYear: { $ref: '#/components/schemas/FiscalYear' }
        quarter: { type: integer, minimum: 1, maximum: 4 }
        auditType: { $ref: '#/components/schemas/AuditType' }
        status: { $ref: '#/components/schemas/AuditStatus' }
        scheduledFor: { type: string, format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        auditorUserId: { type: [string, 'null'], format: uuid }
        auditorName: { type: [string, 'null'], description: Internal auditor's name. }
        externalAgencyName: { type: [string, 'null'], description: EXTERNAL audits only. }
        totalScore: { type: [integer, 'null'], minimum: 0, maximum: 100, description: Direct sum of the 10 category scores; set on completion. }
        maxScore: { type: integer, enum: [100] }
        tier: { $ref: '#/components/schemas/AuditTier' }
        majorViolationsCount: { type: integer, minimum: 0, description: 'BR-05a: persisted on completion; 0 before.' }
        findingCounts: { $ref: '#/components/schemas/AuditFindingCounts' }
        redFlagged: { type: boolean, description: 'BR-05b: set only by an explicit admin action.' }

    Audit:
      description: The full audit record (admin view), without its score sheet and findings.
      allOf:
        - { $ref: '#/components/schemas/AuditSummary' }
        - type: object
          required:
            [summary, reportUpload, redFlagReason, redFlaggedAt, redFlaggedByName, cancelledReason,
             cancelledAt, createdByName, createdAt, updatedAt]
          properties:
            summary: { type: [string, 'null'], description: Auditor's overall remarks. }
            reportUpload:
              oneOf:
                - { $ref: '#/components/schemas/AuditReportUpload' }
                - { type: 'null' }
            redFlagReason: { type: [string, 'null'] }
            redFlaggedAt: { type: [string, 'null'], format: date-time }
            redFlaggedByName: { type: [string, 'null'] }
            cancelledReason: { type: [string, 'null'] }
            cancelledAt: { type: [string, 'null'], format: date-time }
            createdByName: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: [string, 'null'], format: date-time }

    AuditDetail:
      description: An audit with its 10-category score sheet and its findings (admin view).
      allOf:
        - { $ref: '#/components/schemas/Audit' }
        - type: object
          required: [categoryScores, findings]
          properties:
            categoryScores:
              type: array
              minItems: 10
              maxItems: 10
              items: { $ref: '#/components/schemas/AuditCategoryScore' }
            findings:
              type: array
              items: { $ref: '#/components/schemas/AuditFinding' }

    FarmerAuditSummary:
      type: object
      description: |
        The farmer's own audit (BR-36). An ALLOW-LIST: red-flag fields, creator and other
        internal admin fields are deliberately absent, so adding a column to `audits`
        cannot leak it to the farmer app.
      required:
        [id, farmId, farmName, fiscalYear, quarter, auditType, status, scheduledFor, startedAt, completedAt,
         auditorName, externalAgencyName, totalScore, maxScore, tier, majorViolationsCount, findingCounts]
      properties:
        id: { type: string, format: uuid }
        farmId: { type: [string, 'null'], format: uuid }
        farmName: { type: [string, 'null'] }
        fiscalYear: { $ref: '#/components/schemas/FiscalYear' }
        quarter: { type: integer, minimum: 1, maximum: 4 }
        auditType: { $ref: '#/components/schemas/AuditType' }
        status: { $ref: '#/components/schemas/AuditStatus' }
        scheduledFor: { type: string, format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        auditorName: { type: [string, 'null'] }
        externalAgencyName: { type: [string, 'null'] }
        totalScore: { type: [integer, 'null'], minimum: 0, maximum: 100, description: Null until COMPLETED. }
        maxScore: { type: integer, enum: [100] }
        tier: { $ref: '#/components/schemas/AuditTier' }
        majorViolationsCount: { type: integer, minimum: 0 }
        findingCounts: { $ref: '#/components/schemas/AuditFindingCounts' }

    FarmerAuditDetail:
      description: The farmer's own audit with scores and findings (populated only once COMPLETED).
      allOf:
        - { $ref: '#/components/schemas/FarmerAuditSummary' }
        - type: object
          required: [summary, hasAgencyReport, cancelledReason, categoryScores, findings]
          properties:
            summary: { type: [string, 'null'] }
            hasAgencyReport: { type: boolean, description: True when `variant=agency` can be downloaded. }
            cancelledReason: { type: [string, 'null'] }
            categoryScores:
              type: array
              minItems: 10
              maxItems: 10
              items: { $ref: '#/components/schemas/AuditCategoryScore' }
            findings:
              type: array
              items: { $ref: '#/components/schemas/AuditFinding' }

    AuditCreate:
      type: object
      description: |
        `fiscalYear`/`quarter` are NOT accepted — they are derived from `scheduledFor`
        (Asia/Kolkata). EXTERNAL requires `externalAgencyName`; INTERNAL forbids it.
      required: [farmerId, auditType, scheduledFor]
      additionalProperties: false
      properties:
        farmerId: { type: string, format: uuid }
        farmId: { type: string, format: uuid, description: Optional; must belong to the farmer. }
        auditType: { $ref: '#/components/schemas/AuditType' }
        scheduledFor: { type: string, format: date-time }
        auditorUserId: { type: string, format: uuid, description: INTERNAL only; may be assigned later. }
        externalAgencyName: { type: string, minLength: 2, maxLength: 200 }

    AuditUpdate:
      type: object
      description: Reschedule / reassign. SCHEDULED audits only. At least one field besides `reason`.
      additionalProperties: false
      minProperties: 1
      properties:
        scheduledFor: { type: string, format: date-time }
        farmId: { type: [string, 'null'], format: uuid }
        auditorUserId: { type: [string, 'null'], format: uuid, description: INTERNAL only. }
        externalAgencyName: { type: string, minLength: 2, maxLength: 200, description: EXTERNAL only. }
        reason: { type: string, maxLength: 500, description: Recorded in the audit_log row. }

    AuditScoresUpdate:
      type: object
      description: |
        1-10 category scores, upserted. `score` is checked for integer-ness only in the
        schema; a value outside 0-10 is 422 `SCORE_OUT_OF_RANGE` from the service
        (BR-06a).
      required: [scores]
      additionalProperties: false
      properties:
        scores:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            required: [categoryCode, score]
            additionalProperties: false
            properties:
              categoryCode: { $ref: '#/components/schemas/RatingCategoryCode' }
              score: { type: integer }
              remarks: { type: string, maxLength: 1000 }
        summary: { type: string, maxLength: 4000 }
        reportStorageKey:
          type: string
          maxLength: 512
          description: '`storageKey` from `POST /uploads/sign` with purpose `AUDIT_REPORT`.'

    AuditCompleteRequest:
      type: object
      additionalProperties: false
      properties:
        summary: { type: string, maxLength: 4000 }
        reportStorageKey:
          type: string
          maxLength: 512
          description: '`storageKey` from `POST /uploads/sign` with purpose `AUDIT_REPORT`.'

    AuditFindingCreate:
      type: object
      required: [severity, description]
      additionalProperties: false
      properties:
        severity: { $ref: '#/components/schemas/AuditFindingSeverity' }
        categoryCode: { $ref: '#/components/schemas/RatingCategoryCode' }
        description: { type: string, minLength: 3, maxLength: 2000 }
        correctiveAction: { type: string, maxLength: 2000 }
        dueDate: { type: string, format: date }

    AuditFindingUpdate:
      type: object
      description: 'After COMPLETED only `resolved: true` and `resolutionNote` are accepted.'
      additionalProperties: false
      minProperties: 1
      properties:
        severity: { $ref: '#/components/schemas/AuditFindingSeverity' }
        categoryCode:
          oneOf:
            - { $ref: '#/components/schemas/RatingCategoryCode' }
            - { type: 'null' }
        description: { type: string, minLength: 3, maxLength: 2000 }
        correctiveAction: { type: [string, 'null'], maxLength: 2000 }
        dueDate: { type: [string, 'null'], format: date }
        resolved: { type: boolean }
        resolutionNote: { type: string, maxLength: 2000 }

    AuditBulkRescheduleRequest:
      type: object
      description: Exactly one of `newScheduledFor` or `shiftDays`.
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [auditId]
            additionalProperties: false
            properties:
              auditId: { type: string, format: uuid }
              expectedScheduledFor:
                type: string
                format: date-time
                description: Optional optimistic-concurrency guard; the item fails with `CONFLICT` if the audit's current `scheduledFor` differs.
        newScheduledFor: { type: string, format: date-time }
        shiftDays: { type: integer, minimum: -90, maximum: 365, not: { const: 0 } }
        reason: { type: string, maxLength: 500, description: Recorded in each audit_log row. }
      oneOf:
        - { required: [newScheduledFor] }
        - { required: [shiftDays] }

    AuditBulkRescheduleResult:
      type: object
      required: [results, rescheduledCount, failedCount]
      properties:
        rescheduledCount: { type: integer, minimum: 0 }
        failedCount: { type: integer, minimum: 0 }
        results:
          type: array
          items:
            type: object
            required: [auditId, outcome]
            properties:
              auditId: { type: string, format: uuid }
              outcome: { type: string, enum: [RESCHEDULED, FAILED] }
              code:
                type: string
                description: Present when FAILED.
                enum: [NOT_FOUND, INVALID_STATE_TRANSITION, AUDIT_QUARTER_TAKEN, CONFLICT]
              detail: { type: string }
              audit:
                description: Present when RESCHEDULED.
                allOf:
                  - { $ref: '#/components/schemas/AuditSummary' }

    AuditComplianceFarmer:
      type: object
      required:
        [farmerId, tohfaFarmerId, farmerName, zoneId, zoneName, completedCount, requiredCount, complianceStatus,
         currentQuarterAudit, redFlaggedAuditCount, openMajorFindingCount]
      properties:
        farmerId: { type: string, format: uuid }
        tohfaFarmerId: { type: string }
        farmerName: { type: string }
        zoneId: { type: [string, 'null'], format: uuid }
        zoneName: { type: [string, 'null'] }
        completedCount: { type: integer, minimum: 0, maximum: 4 }
        requiredCount: { type: integer, enum: [4], description: One per fiscal quarter (BR-03). }
        complianceStatus: { $ref: '#/components/schemas/AuditComplianceStatus' }
        currentQuarterAudit:
          description: The farmer's live audit in the current quarter, or null (null for a past fiscal year).
          oneOf:
            - type: object
              required: [auditId, status, scheduledFor, overdue]
              properties:
                auditId: { type: string, format: uuid }
                status: { $ref: '#/components/schemas/AuditStatus' }
                scheduledFor: { type: string, format: date-time }
                overdue: { type: boolean, description: SCHEDULED/IN_PROGRESS with scheduledFor in the past. }
            - { type: 'null' }
        redFlaggedAuditCount: { type: integer, minimum: 0 }
        openMajorFindingCount: { type: integer, minimum: 0 }

    AuditComplianceSummary:
      type: object
      description: |
        Read-time compliance view for one fiscal year (BR-03b). `counts` cover the whole
        in-scope population; `farmers` is one cursor page. Drill into the audits behind a
        count with `GET /admin/audits` (`overdue`, `redFlagged`, `hasOpenMajorFindings`).
      required: [fiscalYear, isFiscalYearClosed, currentQuarter, currentQuarterEndsOn, asOf, counts, farmers, page]
      properties:
        fiscalYear: { $ref: '#/components/schemas/FiscalYear' }
        isFiscalYearClosed: { type: boolean, description: True once 31 March of the fiscal year has passed (Asia/Kolkata). }
        currentQuarter: { type: [integer, 'null'], minimum: 1, maximum: 4, description: Null unless `fiscalYear` is the current one. }
        currentQuarterEndsOn: { type: [string, 'null'], format: date, description: Last day of the current quarter (for "window closes in n days"). }
        asOf: { type: string, format: date-time }
        counts:
          type: object
          required:
            [farmersInScope, compliant, pending, nonCompliant, overdueAudits, farmersWithoutCurrentQuarterAudit,
             redFlaggedAudits, redFlaggedFarmers, openMajorFindings, scheduledThisQuarter]
          properties:
            farmersInScope: { type: integer, minimum: 0 }
            compliant: { type: integer, minimum: 0 }
            pending: { type: integer, minimum: 0 }
            nonCompliant: { type: integer, minimum: 0 }
            overdueAudits: { type: integer, minimum: 0, description: SCHEDULED/IN_PROGRESS audits in this fiscal year with scheduledFor in the past. }
            farmersWithoutCurrentQuarterAudit: { type: integer, minimum: 0, description: Farmers with no non-cancelled audit in the current quarter; 0 for a past fiscal year. }
            redFlaggedAudits: { type: integer, minimum: 0 }
            redFlaggedFarmers: { type: integer, minimum: 0 }
            openMajorFindings: { type: integer, minimum: 0 }
            scheduledThisQuarter: { type: integer, minimum: 0 }
        farmers:
          type: array
          items: { $ref: '#/components/schemas/AuditComplianceFarmer' }
        page: { $ref: '#/components/schemas/PageMeta' }

    Certification:
      type: object
      required: [id, farmerId, certType, customTypeName, certNumber, expiresOn, verificationStatus, blocksListings, createdAt]
      properties:
        id: { type: string, format: uuid }
        farmerId: { type: string, format: uuid, description: Admin-only context; never reaches the customer surface (BR-16). }
        certType: { $ref: '#/components/schemas/CertificationType' }
        customTypeName: { type: [string, 'null'], maxLength: 80, description: "The scheme an OTHER certificate belongs to (e.g. Jaivik Bharat). Always null for PGS and NPOP (BR-48i)." }
        certNumber: { type: string, maxLength: 80 }
        issuingBody: { type: string, maxLength: 160 }
        issuedOn: { type: string, format: date }
        expiresOn: { type: string, format: date }
        documentUrl: { type: [string, 'null'], format: uri }
        verificationStatus: { type: string, enum: [UNVERIFIED, VERIFIED, REJECTED] }
        verifiedAt: { type: [string, 'null'], format: date-time }
        verifiedBy: { type: [string, 'null'], format: uuid }
        verificationNotes: { type: [string, 'null'] }
        portalCheckedUrl: { type: [string, 'null'] }
        daysToExpiry: { type: integer, description: Negative once expired. Drives the farmer-app countdown. }
        blocksListings: { type: boolean, description: "Per certificate only: true when THIS certificate does not qualify on its own, because it is expired (BR-01), not VERIFIED (BR-02), or of type OTHER, which never qualifies (BR-02). It is not the farmer's eligibility. A farmer who holds any other qualifying certificate (verified, unexpired, PGS or NPOP) can still list." }
        createdAt: { type: string, format: date-time }

    CertificationCreate:
      type: object
      description: Validated per BR-48; see `POST /farmers/me/certifications`.
      required: [certType, certNumber, issuingBody, issuedOn, expiresOn]
      properties:
        certType: { $ref: '#/components/schemas/CertificationType' }
        customTypeName: { type: [string, 'null'], minLength: 1, maxLength: 80, description: "Required (trimmed, 1-80 characters) when certType is OTHER; must be null or omitted for PGS and NPOP (BR-48i)." }
        certNumber: { type: string, minLength: 1, maxLength: 80, description: Trimmed; blank is rejected. }
        issuingBody: { type: string, minLength: 1, maxLength: 160, description: Trimmed; blank is rejected. }
        issuedOn: { type: string, format: date, description: "A real calendar date, YYYY-MM-DD; not after today (Asia/Kolkata) and strictly before expiresOn (BR-48)." }
        expiresOn: { type: string, format: date, description: "A real calendar date, YYYY-MM-DD. May be in the past, but not more than system_config.cert_expiry_max_past_days (seeded 365) days before today, and not more than system_config.cert_expiry_max_future_days (seeded 730) days after today (Asia/Kolkata) (BR-48)." }
        documentUrl: { type: string, format: uri }

    CertificationUpdate:
      type: object
      description: |
        `PATCH /farmers/me/certifications/{id}` (BR-49) and its admin counterpart
        `PATCH /admin/certifications/{id}` (BR-51). Every field is optional but at
        least one is required. Each present field is checked as in
        `CertificationCreate`; the stored certificate with the patch applied must then
        pass all of BR-48. `customTypeName: null` clears the scheme name (required when
        moving a certificate from OTHER to PGS or NPOP). Unknown keys are ignored.
      minProperties: 1
      properties:
        certType: { $ref: '#/components/schemas/CertificationType' }
        customTypeName: { type: [string, 'null'], minLength: 1, maxLength: 80, description: "Trimmed. Send null to clear it; the merged result must have one iff certType is OTHER (BR-48i)." }
        certNumber: { type: string, minLength: 1, maxLength: 80, description: Trimmed; blank is rejected. }
        issuingBody: { type: string, minLength: 1, maxLength: 160, description: Trimmed; blank is rejected. }
        issuedOn: { type: string, format: date, description: "A real calendar date, YYYY-MM-DD (BR-48)." }
        expiresOn: { type: string, format: date, description: "A real calendar date, YYYY-MM-DD, within both BR-48 windows." }
        documentUrl: { type: string, format: uri, description: Replaces the certificate's document; the previous document is kept on record. }

    DiaryPlot:
      type: object
      description: |
        A farmer's own plot, for use as the plot picker on a new diary entry.
        Currently a deliberate stub fixture — see `GET /farmers/me/diary/plots`.
      required: [id, name, areaAcres]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        areaAcres: { type: [number, 'null'] }

    DiaryActiveCrop:
      type: object
      description: |
        A crop cycle currently in status GROWING on a plot (BR-42b). Currently a
        deliberate stub fixture — see `GET /farmers/me/diary/plots/{plotId}/active-crops`.
      required: [id, cropName, plantedOn]
      properties:
        id: { type: string, format: uuid }
        cropName: { type: string }
        plantedOn: { type: [string, 'null'], format: date }

    DiarySubActivity:
      type: object
      description: A specific activity within a diary taxonomy category (BR-45).
      required: [key, categoryKey, name, nameTa, sortOrder, isActive]
      properties:
        key: { type: string, example: land_prep.ploughing_tilling }
        categoryKey: { type: string, example: land_prep }
        name: { type: string }
        nameTa: { type: [string, 'null'] }
        sortOrder: { type: integer, minimum: 0, maximum: 32767 }
        isActive: { type: boolean }

    DiaryCategory:
      type: object
      description: A top-level diary activity category (BR-45).
      required: [key, name, nameTa, iconKey, sortOrder, isActive]
      properties:
        key: { type: string, example: land_prep }
        name: { type: string }
        nameTa: { type: [string, 'null'] }
        iconKey: { type: [string, 'null'] }
        sortOrder: { type: integer, minimum: 0, maximum: 32767 }
        isActive: { type: boolean }

    DiaryTaxonomy:
      type: object
      description: |
        The current, active-only activity taxonomy: every active category with its
        nested active sub-activities (BR-42a, BR-45b).
      required: [categories]
      properties:
        categories:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/DiaryCategory'
              - type: object
                required: [subActivities]
                properties:
                  subActivities:
                    type: array
                    items: { $ref: '#/components/schemas/DiarySubActivity' }

    DiaryWorkerInput:
      type: object
      description: |
        One worker's labour/wage detail on a diary entry. `wageRatePaise` is integer
        paise, not a decimal rupee string — root CLAUDE.md §2.2, money is never a float
        (see db/migrations/0022_farm_diary_workforce.sql). `hoursWorked` must be
        greater than 0 and at most 24, or the request is rejected with
        `DIARY_WORKER_HOURS_INVALID` (BR-44a); `wageRatePaise` must be a positive
        whole number of paise, or `DIARY_WAGE_RATE_INVALID` (BR-44b).
      required: [name, hoursWorked, wageRatePaise]
      properties:
        name: { type: string, maxLength: 120 }
        role: { type: string, maxLength: 80 }
        hoursWorked: { type: number, exclusiveMinimum: 0, maximum: 24 }
        wageRatePaise: { type: integer, minimum: 1, description: Integer paise per hour. }
        paymentStatus: { type: string, enum: [PENDING, PAID], default: PENDING }
      additionalProperties: false

    DiaryWorker:
      allOf:
        - $ref: '#/components/schemas/DiaryWorkerInput'
        - type: object
          required: [id, paymentStatus]
          properties:
            id: { type: string, format: uuid }

    DiaryPhoto:
      type: object
      description: A photo attached to a diary entry (BR-16, BR-41 — EXIF/GPS already stripped).
      required: [id, storageKey, mimeType, sizeBytes, createdAt]
      properties:
        id: { type: string, format: uuid }
        storageKey: { type: string }
        mimeType: { type: string }
        sizeBytes: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }

    DiaryPhotoAttachRequest:
      type: object
      description: |
        Body of `POST /farmers/me/diary/entries/{entryId}/photos`. `storageKey` must be
        a key previously issued by `POST /uploads/sign` for purpose `DIARY_PHOTO`.
      required: [storageKey, mimeType, sizeBytes]
      properties:
        storageKey:
          type: string
          minLength: 1
          maxLength: 512
          pattern: '^[a-z0-9_]+/[A-Za-z0-9._-]+$'
          description: A key returned by `POST /uploads/sign` for purpose `DIARY_PHOTO`.
        mimeType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        sizeBytes: { type: integer, minimum: 1, maximum: 26214400 }
      additionalProperties: false

    DiaryEntryCreateRequest:
      type: object
      description: |
        Body of `POST /farmers/me/diary/entries`. There is deliberately no `farmerId`
        field — the owner is always the caller (BR-40). `farmCropId` may be omitted —
        the server attaches the plot's most recently planted GROWING crop cycle — but
        when supplied it must itself be a GROWING crop on that plot, or the request is
        rejected with `DIARY_NO_ACTIVE_CROP` (BR-42b).
      required: [plotId, categoryKey, subActivityKey, minutes]
      properties:
        plotId: { type: string, format: uuid }
        farmCropId: { type: string, format: uuid }
        categoryKey: { type: string }
        subActivityKey: { type: string }
        minutes:
          type: integer
          maximum: 1440
          description: Time spent, in minutes. Missing or non-positive returns `DIARY_MINUTES_REQUIRED` (BR-42c).
        activityFields:
          type: object
          additionalProperties: true
          default: {}
          description: Free-form fields specific to the chosen sub-activity.
        notes: { type: string, maxLength: 2000 }
        activityOn: { type: string, format: date, description: 'Format YYYY-MM-DD. Defaults to today.' }
        voiceNoteKey: { type: string, minLength: 1, maxLength: 512 }
        voiceNoteDurationS: { type: integer, minimum: 1, maximum: 32767 }
        workers:
          type: array
          maxItems: 100
          default: []
          items: { $ref: '#/components/schemas/DiaryWorkerInput' }
      additionalProperties: false

    DiaryEntryUpdateRequest:
      type: object
      description: |
        Partial update of a diary entry — at least one field must be supplied.
        `plotId` and `farmCropId` are NOT present: they are not editable (BR-43).
        `workers`, when supplied, REPLACES the whole workforce set (BR-44c); when
        omitted the existing set is left untouched. Nullable fields accept `null` to
        clear them.
      properties:
        categoryKey: { type: string }
        subActivityKey: { type: string }
        minutes: { type: integer, maximum: 1440 }
        activityFields: { type: object, additionalProperties: true }
        notes: { type: [string, 'null'], maxLength: 2000 }
        activityOn: { type: string, format: date }
        voiceNoteKey: { type: [string, 'null'], minLength: 1, maxLength: 512 }
        voiceNoteDurationS: { type: [integer, 'null'], minimum: 1, maximum: 32767 }
        workers:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/DiaryWorkerInput' }
      additionalProperties: false

    DiaryEntrySummary:
      type: object
      description: |
        A logged farm activity, list form — `workerCount`/`photoCount` instead of the
        full `workers`/`photos` arrays (see `DiaryEntry` for the detail view).
      required:
        - id
        - plotId
        - farmCropId
        - categoryKey
        - subActivityKey
        - minutes
        - notes
        - activityOn
        - loggedAt
        - totalLabourCostPaise
        - createdAt
        - updatedAt
        - workerCount
        - photoCount
      properties:
        id: { type: string, format: uuid }
        plotId: { type: string, format: uuid }
        farmCropId: { type: string, format: uuid }
        categoryKey: { type: string }
        subActivityKey: { type: string }
        minutes: { type: integer }
        notes: { type: [string, 'null'] }
        activityOn: { type: string, format: date }
        loggedAt: { type: string, format: date-time }
        totalLabourCostPaise:
          type: integer
          minimum: 0
          description: |
            Read-only. Integer paise, computed at read time as
            ROUND(SUM(hoursWorked * wageRatePaise)) over the entry's workers — never
            stored (root CLAUDE.md §2.2 — money is never a float; BR-44).
        createdAt: { type: string, format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }
        workerCount: { type: integer, minimum: 0 }
        photoCount: { type: integer, minimum: 0 }

    DiaryEntry:
      type: object
      description: |
        A logged farm activity, with full workforce and photo detail and computed
        workforce cost. `totalLabourCostPaise` is computed at read time as
        ROUND(SUM(hoursWorked * wageRatePaise)) over `workers` — never stored — so it
        can never drift from an edited worker set (BR-40, BR-42, BR-44).
      required:
        - id
        - plotId
        - farmCropId
        - categoryKey
        - subActivityKey
        - minutes
        - activityFields
        - notes
        - activityOn
        - loggedAt
        - voiceNoteKey
        - voiceNoteDurationS
        - workers
        - totalLabourCostPaise
        - createdAt
        - updatedAt
        - photos
      properties:
        id: { type: string, format: uuid }
        plotId: { type: string, format: uuid }
        farmCropId: { type: string, format: uuid }
        categoryKey: { type: string }
        subActivityKey: { type: string }
        minutes: { type: integer }
        activityFields: { type: object, additionalProperties: true }
        notes: { type: [string, 'null'] }
        activityOn: { type: string, format: date }
        loggedAt: { type: string, format: date-time }
        voiceNoteKey: { type: [string, 'null'] }
        voiceNoteDurationS: { type: [integer, 'null'] }
        workers:
          type: array
          items: { $ref: '#/components/schemas/DiaryWorker' }
        totalLabourCostPaise:
          type: integer
          minimum: 0
          description: |
            Read-only. Integer paise, computed from `workers`, never stored (root
            CLAUDE.md §2.2 — money is never a float; see db/migrations/0021).
        createdAt: { type: string, format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }
        photos:
          type: array
          items: { $ref: '#/components/schemas/DiaryPhoto' }

    DiaryCalendar:
      type: object
      description: Per-day entry counts for one month, for the diary calendar view's day markers (BR-40).
      required: [month, days]
      properties:
        month: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        days:
          type: array
          items:
            type: object
            required: [date, entryCount]
            properties:
              date: { type: string, format: date }
              entryCount: { type: integer, minimum: 1 }

    DiaryCategoryCreateRequest:
      type: object
      description: Body of `POST /admin/diary/categories` (BR-45).
      required: [key, name, sortOrder]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 80
          pattern: '^[a-z0-9_.]+$'
          example: land_prep
          description: Lowercase letters, digits, "_" and ".".
        name: { type: string, maxLength: 120 }
        nameTa: { type: string, maxLength: 120 }
        iconKey: { type: string, maxLength: 80 }
        sortOrder: { type: integer, minimum: 0, maximum: 32767 }
      additionalProperties: false

    DiaryCategoryUpdateRequest:
      type: object
      description: |
        Partial update of a taxonomy category — at least one field must be supplied.
        Retiring a category (`isActive: false`) excludes it from the farmer-facing
        taxonomy and from new-entry validation, but never hard-deletes it — existing
        diary entries referencing it remain valid (BR-45b).
      properties:
        name: { type: string, maxLength: 120 }
        nameTa: { type: [string, 'null'], maxLength: 120 }
        iconKey: { type: [string, 'null'], maxLength: 80 }
        sortOrder: { type: integer, minimum: 0, maximum: 32767 }
        isActive: { type: boolean }
      additionalProperties: false

    DiarySubActivityCreateRequest:
      type: object
      description: Body of `POST /admin/diary/categories/{categoryKey}/sub-activities` (BR-45).
      required: [key, name, sortOrder]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 80
          pattern: '^[a-z0-9_.]+$'
          example: land_prep.ploughing_tilling
          description: Must be `<categoryKey>.<name>`.
        name: { type: string, maxLength: 120 }
        nameTa: { type: string, maxLength: 120 }
        sortOrder: { type: integer, minimum: 0, maximum: 32767 }
      additionalProperties: false

    DiarySubActivityUpdateRequest:
      type: object
      description: |
        Partial update of a sub-activity — at least one field must be supplied,
        following the same never-hard-delete retirement rule as its parent category
        (BR-45b).
      properties:
        name: { type: string, maxLength: 120 }
        nameTa: { type: [string, 'null'], maxLength: 120 }
        sortOrder: { type: integer, minimum: 0, maximum: 32767 }
        isActive: { type: boolean }
      additionalProperties: false

    GeoJsonPolygon:
      type: object
      required: [type, coordinates]
      description: >-
        GeoJSON Polygon, WGS84 (SRID 4326) — matches the `boundary` geography column on
        both `farms` and `plots` (db/migrations/0003_farmers_and_farms.sql).
      properties:
        type: { type: string, enum: [Polygon] }
        coordinates:
          type: array
          items: { type: array, items: { type: array, items: { type: number }, minItems: 2, maxItems: 2 } }

    Farm:
      type: object
      description: One of a farmer's land locations. Farm-anonymous rule BR-16 applies — never reaches a customer response.
      required: [id, name, boundaryVersion, district, isPrimary, waterSources, landBoundaryContext, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 120 }
        surveyNumber: { type: [string, 'null'] }
        areaAcres: { type: [number, 'null'] }
        centroidLat: { type: [number, 'null'], minimum: -90, maximum: 90 }
        centroidLng: { type: [number, 'null'], minimum: -180, maximum: 180 }
        boundary:
          description: The drawn FMB polygon, or null when none has been drawn yet.
          oneOf:
            - { $ref: '#/components/schemas/GeoJsonPolygon' }
            - type: 'null'
        boundaryAreaAcres: { type: [number, 'null'], description: Server-derived from the polygon. }
        boundaryDrawnBy: { type: [string, 'null'], format: uuid }
        boundaryDrawnAt: { type: [string, 'null'], format: date-time }
        boundaryVersion: { type: integer, minimum: 0 }
        address: { type: [string, 'null'] }
        village: { type: [string, 'null'] }
        taluk: { type: [string, 'null'] }
        district: { type: string }
        isPrimary: { type: boolean, description: Set only by the farmer-application approval backfill; never client-settable. }
        waterSources: { type: array, items: { type: string }, description: Mobile-constrained free text, e.g. Borewell. }
        landBoundaryContext: { type: array, items: { type: string }, description: Mobile-constrained free text, e.g. stand_alone. }
        notes: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }

    FarmListItem:
      allOf:
        - $ref: '#/components/schemas/Farm'
        - type: object
          required: [plotCount]
          properties:
            plotCount: { type: integer, minimum: 0, description: Number of zones (plots) drawn under this farm. }

    FarmCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        areaAcres: { type: number, exclusiveMinimum: 0 }
        boundary: { $ref: '#/components/schemas/GeoJsonPolygon' }
        village: { type: string, minLength: 1, maxLength: 120 }
        taluk: { type: string, minLength: 1, maxLength: 120 }
        district: { type: string, minLength: 1, maxLength: 120 }

    FarmUpdate:
      type: object
      description: Every field is optional; only the keys present in the body change.
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        areaAcres: { type: number, exclusiveMinimum: 0 }
        boundary:
          description: A GeoJSON Polygon to (re)draw the boundary, or null to clear it.
          oneOf:
            - { $ref: '#/components/schemas/GeoJsonPolygon' }
            - type: 'null'
        calculatedAreaAcres:
          type: number
          minimum: 0
          description: >-
            Server-derived acreage of `boundary`, named to match Step3Location.tsx /
            farmer-applications.schema.ts's field of the same name. Only consulted when
            `boundary` is also present in the same body.
        village: { type: string, minLength: 1, maxLength: 120 }
        taluk: { type: string, minLength: 1, maxLength: 120 }
        district: { type: string, minLength: 1, maxLength: 120 }
        waterSources: { type: array, items: { type: string, minLength: 1, maxLength: 60 } }
        landBoundaryContext: { type: array, items: { type: string, minLength: 1, maxLength: 60 } }
        notes: { type: [string, 'null'], maxLength: 2000 }

    Plot:
      type: object
      description: A zone ("plots" in the farm diary) sub-dividing one of a farmer's land locations.
      required: [id, farmId, name, createdAt]
      properties:
        id: { type: string, format: uuid }
        farmId: { type: string, format: uuid }
        name: { type: string, maxLength: 120 }
        areaAcres: { type: [number, 'null'] }
        soilType: { type: [string, 'null'] }
        sunExposure: { type: [string, 'null'] }
        irrigationType: { type: [string, 'null'] }
        boundary:
          description: >-
            The drawn zone polygon, or null when none has been drawn yet. Farm-anonymous
            rule BR-16 applies — never reaches a customer response.
          oneOf:
            - { $ref: '#/components/schemas/GeoJsonPolygon' }
            - type: 'null'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }

    PlotCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        areaAcres: { type: number, exclusiveMinimum: 0 }
        boundary: { $ref: '#/components/schemas/GeoJsonPolygon' }
        soilType: { type: string, minLength: 1, maxLength: 60 }
        sunExposure: { type: string, minLength: 1, maxLength: 60 }
        irrigationType: { type: string, minLength: 1, maxLength: 60 }

    PlotUpdate:
      type: object
      description: Every field is optional; only the keys present in the body change.
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        areaAcres: { type: number, exclusiveMinimum: 0 }
        boundary:
          description: A GeoJSON Polygon to (re)draw the zone boundary, or null to clear it.
          oneOf:
            - { $ref: '#/components/schemas/GeoJsonPolygon' }
            - type: 'null'
        soilType: { type: string, minLength: 1, maxLength: 60 }
        sunExposure: { type: string, minLength: 1, maxLength: 60 }
        irrigationType: { type: string, minLength: 1, maxLength: 60 }

    SoilTestRecord:
      type: object
      description: >-
        A lab soil test result for a zone (FR-F06 soil diary). The `*Label` fields are
        computed server-side from `system_config` classification bands by one shared
        function (BR-40) — never a client literal, never duplicated per endpoint.
      required:
        - id
        - plotId
        - testDate
        - nextDueDate
        - organicCarbonPct
        - ph
        - ecDsPerM
        - organicCarbonLabel
        - phLabel
        - ecLabel
        - createdAt
      properties:
        id: { type: string, format: uuid }
        plotId: { type: string, format: uuid }
        testDate: { type: string, format: date }
        nextDueDate: { type: string, format: date }
        organicCarbonPct: { type: number, minimum: 0, maximum: 100 }
        ph: { type: number, minimum: 0, maximum: 14 }
        ecDsPerM: { type: number, minimum: 0, description: Electrical conductivity, dS/m. }
        tdsPpm: { type: [integer, 'null'], minimum: 0 }
        nitrogenKgPerHa: { type: [number, 'null'], minimum: 0 }
        phosphorusKgPerHa: { type: [number, 'null'], minimum: 0 }
        potassiumKgPerHa: { type: [number, 'null'], minimum: 0 }
        limeStatus:
          type: [string, 'null']
          enum: [Harmless, Slight, Moderate, Severe, null]
        labReportUploadId: { type: [string, 'null'], format: uuid }
        organicCarbonLabel: { type: string, description: 'BR-40 label, e.g. Low/Medium/High.' }
        phLabel: { type: string, description: 'BR-40 label, e.g. Acidic/Good/Alkaline.' }
        ecLabel: { type: string, description: 'BR-40 label, e.g. Good/High.' }
        tdsLabel: { type: [string, 'null'], description: Null exactly when tdsPpm is null. }
        nitrogenLabel: { type: [string, 'null'], description: Null exactly when nitrogenKgPerHa is null. }
        phosphorusLabel: { type: [string, 'null'], description: Null exactly when phosphorusKgPerHa is null. }
        potassiumLabel: { type: [string, 'null'], description: Null exactly when potassiumKgPerHa is null. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }

    SoilTestRecordCreate:
      type: object
      required: [testDate, nextDueDate, organicCarbonPct, ph, ecDsPerM]
      properties:
        testDate: { type: string, format: date }
        nextDueDate: { type: string, format: date }
        organicCarbonPct: { type: number, minimum: 0, maximum: 100 }
        ph: { type: number, minimum: 0, maximum: 14 }
        ecDsPerM: { type: number, minimum: 0 }
        tdsPpm: { type: integer, minimum: 0 }
        nitrogenKgPerHa: { type: number, minimum: 0 }
        phosphorusKgPerHa: { type: number, minimum: 0 }
        potassiumKgPerHa: { type: number, minimum: 0 }
        limeStatus: { type: string, enum: [Harmless, Slight, Moderate, Severe] }
        labReportUploadId:
          type: string
          format: uuid
          description: Must reference an upload (purpose SOIL_TEST_REPORT) owned by the caller.

    SoilHealthSummaryMetric:
      type: object
      description: >-
        Pure arithmetic over the zone's own soil test records (BR-38: no generated
        advisory text). `trendDirection` tracks only whether the raw reading rose,
        fell, or held — never a judgement about whether that direction is good.
      required: [currentValue, previousValue, deltaValue, trendDirection, chartPoints]
      properties:
        currentValue: { type: [number, 'null'] }
        previousValue: { type: [number, 'null'] }
        deltaValue: { type: [number, 'null'], description: currentValue - previousValue. }
        trendDirection:
          type: [string, 'null']
          enum: [improving, declining, flat, null]
        chartPoints:
          type: array
          description: Up to the last 6 readings that have a value for this metric, oldest first.
          items:
            type: object
            required: [month, value]
            properties:
              month: { type: string, description: 'YYYY-MM, derived from testDate.' }
              value: { type: number }

    SoilHealthSummary:
      type: object
      required: [ph, organicCarbon, tds]
      properties:
        ph: { $ref: '#/components/schemas/SoilHealthSummaryMetric' }
        organicCarbon: { $ref: '#/components/schemas/SoilHealthSummaryMetric' }
        tds: { $ref: '#/components/schemas/SoilHealthSummaryMetric' }

    SoilAmendment:
      type: object
      description: An amendment (compost, lime, manure, ...) applied to a zone (FR-F06 soil diary).
      required: [id, plotId, amendmentType, quantityKg, appliedDate, createdAt]
      properties:
        id: { type: string, format: uuid }
        plotId: { type: string, format: uuid }
        amendmentType: { type: string, maxLength: 120 }
        quantityKg: { type: number, exclusiveMinimum: 0 }
        appliedDate: { type: string, format: date }
        notes: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }

    SoilAmendmentCreate:
      type: object
      required: [amendmentType, quantityKg, appliedDate]
      properties:
        amendmentType: { type: string, minLength: 1, maxLength: 120 }
        quantityKg: { type: number, exclusiveMinimum: 0 }
        appliedDate: { type: string, format: date }
        notes: { type: string, maxLength: 2000 }

    SoilAmendmentUpdate:
      type: object
      description: Every field is optional; only the keys present in the body change.
      properties:
        amendmentType: { type: string, minLength: 1, maxLength: 120 }
        quantityKg: { type: number, exclusiveMinimum: 0 }
        appliedDate: { type: string, format: date }
        notes: { type: [string, 'null'], maxLength: 2000 }

    SoilMoistureObservation:
      type: object
      description: An ad-hoc soil moisture observation for a zone (FR-F06 soil diary).
      required: [id, plotId, level, observedAt, observedBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        plotId: { type: string, format: uuid }
        level: { type: string, enum: [Dry, Moist, Wet] }
        observedAt: { type: string, format: date-time }
        observedBy:
          type: string
          format: uuid
          description: The authenticated caller who logged the observation — never client-supplied.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }

    SoilMoistureObservationCreate:
      type: object
      required: [level]
      properties:
        level: { type: string, enum: [Dry, Moist, Wet] }
        observedAt:
          type: string
          format: date-time
          description: Defaults to now() server-side when omitted.

    ErosionConservationNote:
      type: object
      description: >-
        An erosion risk assessment and/or conservation practice note for a zone
        (FR-F06 soil diary). `riskLevel` is a farmer self-assessment (BR-38), never a
        server-computed risk model.
      required: [id, plotId, riskLevel, loggedAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        plotId: { type: string, format: uuid }
        riskLevel: { type: string, enum: ['Low Risk', 'Moderate Risk', 'High Risk'] }
        practiceNotes: { type: [string, 'null'] }
        loggedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }

    ErosionConservationNoteCreate:
      type: object
      required: [riskLevel]
      properties:
        riskLevel: { type: string, enum: ['Low Risk', 'Moderate Risk', 'High Risk'] }
        practiceNotes: { type: string, maxLength: 2000 }
        loggedAt:
          type: string
          format: date-time
          description: Defaults to now() server-side when omitted.

    CropRotationEntry:
      type: object
      description: >-
        One crop in a zone's ordered rotation plan (FR-F06 soil diary). 100%
        farmer-entered planning, never system-suggested (BR-38).
      required: [id, plotId, sequenceOrder, cropName, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        plotId: { type: string, format: uuid }
        sequenceOrder: { type: integer, minimum: 1 }
        cropName: { type: string, maxLength: 120 }
        plannedDate: { type: [string, 'null'], format: date }
        status: { type: string, enum: [CURRENT, NEXT, PLANNED] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }

    CropRotationEntryInput:
      type: object
      required: [sequenceOrder, cropName, status]
      properties:
        sequenceOrder: { type: integer, minimum: 1 }
        cropName: { type: string, minLength: 1, maxLength: 120 }
        plannedDate: { type: string, format: date }
        status: { type: string, enum: [CURRENT, NEXT, PLANNED] }

    CropRotationPlan:
      type: object
      required: [sequence, coverCropWindow]
      properties:
        sequence:
          type: array
          items: { $ref: '#/components/schemas/CropRotationEntry' }
        coverCropWindow:
          description: The zone's current/most relevant cover crop window, or null if none has been logged.
          oneOf:
            - { $ref: '#/components/schemas/CoverCropWindow' }
            - type: 'null'

    CoverCropWindow:
      type: object
      description: >-
        A cover-crop planting window (date range + crop type) for a zone, tracked
        alongside but separately from the ordered crop rotation sequence (FR-F06 soil
        diary). 100% farmer-entered planning, never system-suggested (BR-38).
      required: [id, plotId, coverCropType, windowStart, windowEnd, createdAt]
      properties:
        id: { type: string, format: uuid }
        plotId: { type: string, format: uuid }
        coverCropType: { type: string, maxLength: 120 }
        windowStart: { type: string, format: date }
        windowEnd: { type: string, format: date }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }

    CoverCropWindowCreate:
      type: object
      required: [coverCropType, windowStart, windowEnd]
      properties:
        coverCropType: { type: string, minLength: 1, maxLength: 120 }
        windowStart: { type: string, format: date }
        windowEnd: { type: string, format: date, description: Must be on or after windowStart. }

    PestLibraryEntry:
      type: object
      description: >-
        A global pest/disease/weed/deficiency reference catalog entry (FR-F07).
        NOT zone-scoped — every caller reads the same row. Static admin-curated
        content: recommendedTreatment/intervalDays/phiDays describe the catalog
        entry itself, never a system-generated per-farmer suggestion (BR-38).
      required: [id, name, category, riskLevel, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        scientificName: { type: [string, 'null'] }
        category:
          type: string
          enum: [Disease, Pest, Weed, Deficiency]
        riskLevel:
          type: string
          enum: [High, Medium, Low]
        crops:
          type: array
          items: { type: string }
          description: Host crops this entry is known to affect.
        season: { type: [string, 'null'] }
        symptoms:
          type: array
          items: { type: string }
        organicTreatments:
          type: array
          items: { type: string }
        prevention:
          type: array
          items: { type: string }
        recommendedTreatment: { type: [string, 'null'] }
        intervalDays: { type: [integer, 'null'], minimum: 0 }
        phiDays: { type: [integer, 'null'], minimum: 0, description: Pre-harvest interval, in days. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }

    WeatherRiskNote:
      type: object
      description: >-
        An admin-authored, region-scoped weather/risk advisory note (FR-F07). NOT
        farmer-owned. Static hand-typed content, not a computed risk model wired
        to a live weather feed (BR-38).
      required: [id, region, note, createdAt]
      properties:
        id: { type: string, format: uuid }
        region: { type: string }
        note: { type: string }
        riskLevel:
          type: [string, 'null']
          enum: [High, Medium, Low, null]
        validFrom: { type: [string, 'null'], format: date }
        validUntil: { type: [string, 'null'], format: date }
        createdBy: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }

    PestDetection:
      type: object
      description: >-
        A farmer-logged pest/disease sighting on a zone (FR-F07). Farmer-entered
        observation only, never a system-detected/computed alert (BR-38).
      required: [id, plotId, pestName, severity, status, detectedOn, createdAt]
      properties:
        id: { type: string, format: uuid }
        plotId: { type: string, format: uuid }
        farmCropId: { type: [string, 'null'], format: uuid }
        pestLibraryId: { type: [string, 'null'], format: uuid }
        pestName: { type: string }
        scientificName: { type: [string, 'null'] }
        cropLabel:
          type: [string, 'null']
          description: >-
            Free-text crop label the farmer picked in the Crop/Zone field when
            reporting the detection (e.g. "Carrot — Nantes"). Null for
            detections logged before this field existed, or when omitted.
        severity:
          type: string
          enum: [High, Medium, Low]
        status:
          type: string
          enum: [Ongoing, Resolved, Recurring]
        detectedOn: { type: string, format: date }
        notes: { type: [string, 'null'] }
        photoUploadId: { type: [string, 'null'], format: uuid }
        resolvedAt: { type: [string, 'null'], format: date-time }
        resolutionEffective:
          type: [boolean, 'null']
          description: The farmer's own after-the-fact assessment of whether the treatment worked — never a server-computed efficacy score.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }

    PestDetectionCreate:
      type: object
      required: [pestName, severity, detectedOn]
      properties:
        farmCropId: { type: string, format: uuid }
        pestLibraryId: { type: string, format: uuid }
        pestName: { type: string, minLength: 1, maxLength: 120 }
        scientificName: { type: string, maxLength: 160 }
        cropLabel: { type: string, maxLength: 160 }
        severity:
          type: string
          enum: [High, Medium, Low]
        detectedOn: { type: string, format: date }
        notes: { type: string, maxLength: 2000 }
        photoUploadId:
          type: string
          format: uuid
          description: Must reference an upload (purpose PEST_PHOTO) owned by the caller.

    PestDetectionUpdate:
      type: object
      description: Partial update — typically marking a detection resolved.
      properties:
        status:
          type: string
          enum: [Ongoing, Resolved, Recurring]
        resolutionEffective: { type: [boolean, 'null'] }
        notes: { type: [string, 'null'], maxLength: 2000 }

    PestTreatmentLog:
      type: object
      description: >-
        A farmer-logged treatment application on a zone, optionally against a
        specific detection (FR-F07). Farmer-entered only — never a system-applied
        treatment (BR-38).
      required: [id, plotId, pestName, category, severity, treatment, appliedOn, createdAt]
      properties:
        id: { type: string, format: uuid }
        plotId: { type: string, format: uuid }
        farmCropId: { type: [string, 'null'], format: uuid }
        detectionId: { type: [string, 'null'], format: uuid }
        pestLibraryId: { type: [string, 'null'], format: uuid }
        pestName: { type: string }
        category:
          type: string
          enum: [Disease, Pest, Weed, Deficiency]
        severity:
          type: string
          enum: [High, Medium, Low]
        treatment: { type: string }
        intervalDays: { type: [integer, 'null'], minimum: 0 }
        phiDays: { type: [integer, 'null'], minimum: 0 }
        appliedOn: { type: string, format: date }
        nextApplicationDate: { type: [string, 'null'], format: date }
        photoUploadId: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }

    PestTreatmentLogCreate:
      type: object
      required: [pestName, category, severity, treatment, appliedOn]
      properties:
        farmCropId: { type: string, format: uuid }
        detectionId: { type: string, format: uuid }
        pestLibraryId: { type: string, format: uuid }
        pestName: { type: string, minLength: 1, maxLength: 120 }
        category:
          type: string
          enum: [Disease, Pest, Weed, Deficiency]
        severity:
          type: string
          enum: [High, Medium, Low]
        treatment: { type: string, minLength: 1, maxLength: 200 }
        intervalDays: { type: integer, minimum: 0 }
        phiDays: { type: integer, minimum: 0 }
        appliedOn: { type: string, format: date }
        nextApplicationDate: { type: string, format: date }
        photoUploadId:
          type: string
          format: uuid
          description: Must reference an upload (purpose PEST_PHOTO) owned by the caller.

    PestTreatmentReminder:
      type: object
      description: >-
        A follow-up reminder a farmer explicitly created for a zone, optionally
        tied to the detection that prompted it (FR-F07). Farmer-entered to-do —
        no scheduled job writes to this table (BR-38).
      required: [id, plotId, title, dueDate, repeatInterval, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        plotId: { type: string, format: uuid }
        detectionId: { type: [string, 'null'], format: uuid }
        title: { type: string }
        targetPest: { type: [string, 'null'] }
        dueDate: { type: string, format: date }
        repeatInterval:
          type: string
          enum: [ONE_TIME, WEEKLY, BIWEEKLY, MONTHLY]
        status:
          type: string
          enum: [Upcoming, Completed]
        completedAt: { type: [string, 'null'], format: date-time }
        notes: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }

    PestTreatmentReminderCreate:
      type: object
      required: [title, dueDate]
      properties:
        detectionId: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 160 }
        targetPest: { type: string, maxLength: 120 }
        dueDate: { type: string, format: date }
        repeatInterval:
          type: string
          enum: [ONE_TIME, WEEKLY, BIWEEKLY, MONTHLY]
          default: ONE_TIME
        notes: { type: string, maxLength: 2000 }

    PestTreatmentReminderUpdate:
      type: object
      description: Partial update — typically marking a reminder done.
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        dueDate: { type: string, format: date }
        status:
          type: string
          enum: [Upcoming, Completed]
        notes: { type: [string, 'null'], maxLength: 2000 }

    PestAnalyticsSummary:
      type: object
      description: >-
        A read-only aggregate over the caller's own already-logged pest data for
        one of their own farms (FR-F07). Not automated advice, a risk model, or a
        system-generated suggestion — nothing here is computed for or written to
        a farmer who has not already logged the underlying detections/treatment
        logs themself (BR-38).
      required: [detectionsBySeason, mostAffectedCrops, treatmentEffectiveness]
      properties:
        detectionsBySeason:
          type: array
          items:
            type: object
            required: [season, count]
            properties:
              season: { type: string }
              count: { type: integer, minimum: 0 }
        mostAffectedCrops:
          type: array
          items:
            type: object
            required: [crop, count]
            properties:
              crop: { type: string }
              count: { type: integer, minimum: 0 }
        treatmentEffectiveness:
          type: array
          items:
            type: object
            required: [treatment, timesUsed, timesEffective]
            properties:
              treatment: { type: string }
              timesUsed: { type: integer, minimum: 0 }
              timesEffective: { type: integer, minimum: 0 }

    Worker:
      type: object
      description: >-
        A worker on a farm's roster. Farm-scoped, not plot-scoped
        (db/migrations/0025_workforce.sql) — a worker is hired by the farm as
        a whole and moves between plots over the course of a day/season.
      required: [id, farmId, name, payType, payRatePaise, createdAt]
      properties:
        id: { type: string, format: uuid }
        farmId: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
        roleTitle: { type: [string, 'null'], maxLength: 120 }
        dateOfBirth: { type: [string, 'null'], format: date }
        gender: { type: [string, 'null'] }
        idProofUploadId: { type: [string, 'null'], format: uuid }
        photoUploadId: { type: [string, 'null'], format: uuid }
        bankAccountNo: { type: [string, 'null'] }
        ifscCode: { type: [string, 'null'] }
        upiId: { type: [string, 'null'] }
        payType:
          type: string
          enum: [daily, monthly]
        payRatePaise:
          type: integer
          exclusiveMinimum: 0
          description: BR-41a — a positive integer, never a float (root CLAUDE.md §2.2).
        createdAt: { type: string, format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }

    WorkerCreate:
      type: object
      required: [name, payType, payRatePaise]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        roleTitle: { type: string, maxLength: 120 }
        dateOfBirth: { type: string, format: date }
        gender: { type: string }
        idProofUploadId:
          type: string
          format: uuid
          description: Must reference an upload (purpose WORKER_ID_PROOF) owned by the caller.
        photoUploadId:
          type: string
          format: uuid
          description: Must reference an upload (purpose WORKER_PHOTO) owned by the caller.
        bankAccountNo: { type: string, maxLength: 40 }
        ifscCode: { type: string, maxLength: 20 }
        upiId: { type: string, maxLength: 120 }
        payType: { type: string, enum: [daily, monthly] }
        payRatePaise: { type: integer, exclusiveMinimum: 0 }

    WorkerUpdate:
      type: object
      description: Every field is optional; only the keys present in the body change.
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        roleTitle: { type: [string, 'null'], maxLength: 120 }
        dateOfBirth: { type: [string, 'null'], format: date }
        gender: { type: [string, 'null'] }
        idProofUploadId:
          type: [string, 'null']
          format: uuid
          description: Must reference an upload (purpose WORKER_ID_PROOF) owned by the caller.
        photoUploadId:
          type: [string, 'null']
          format: uuid
          description: Must reference an upload (purpose WORKER_PHOTO) owned by the caller.
        bankAccountNo: { type: [string, 'null'], maxLength: 40 }
        ifscCode: { type: [string, 'null'], maxLength: 20 }
        upiId: { type: [string, 'null'], maxLength: 120 }
        payType: { type: string, enum: [daily, monthly] }
        payRatePaise:
          type: integer
          exclusiveMinimum: 0
          description: BR-41a — a positive integer, never a float (root CLAUDE.md §2.2).

    AttendanceRecord:
      type: object
      description: >-
        One worker's attendance for one day (db/migrations/0025_workforce.sql
        `worker_attendance`, unique per worker/work_date).
      required: [id, workerId, workDate, present, createdAt]
      properties:
        id: { type: string, format: uuid }
        workerId: { type: string, format: uuid }
        workerName:
          type: string
          description: Included when listing across workers for one day (GET /farms/{farmId}/attendance).
        farmCropId: { type: [string, 'null'], format: uuid }
        workDate: { type: string, format: date }
        present: { type: boolean }
        activity: { type: [string, 'null'], maxLength: 200 }
        hoursWorked:
          type: [number, 'null']
          exclusiveMinimum: 0
          maximum: 24
          description: BR-41b — in (0, 24] when present, CHECKed at the database level.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }

    AttendanceUpsertItem:
      type: object
      description: One entry in a bulk attendance upsert (POST /farms/{farmId}/attendance).
      required: [workerId, present]
      properties:
        workerId: { type: string, format: uuid }
        present: { type: boolean }
        farmCropId: { type: string, format: uuid }
        activity: { type: string, maxLength: 200 }
        hoursWorked:
          type: number
          exclusiveMinimum: 0
          maximum: 24
          description: BR-41b — in (0, 24] when present, CHECKed at the database level.

    WorkerAdvance:
      type: object
      description: >-
        A cash advance given to a worker (db/migrations/0025_workforce.sql
        `worker_advances`), insert-only — never edited after creation.
      required: [id, workerId, amountPaise, givenOn, createdAt]
      properties:
        id: { type: string, format: uuid }
        workerId: { type: string, format: uuid }
        amountPaise: { type: integer, exclusiveMinimum: 0 }
        givenOn: { type: string, format: date }
        notes: { type: [string, 'null'], maxLength: 2000 }
        createdAt: { type: string, format: date-time }

    WorkerAdvanceCreate:
      type: object
      required: [amountPaise, givenOn]
      properties:
        amountPaise: { type: integer, exclusiveMinimum: 0 }
        givenOn: { type: string, format: date }
        notes: { type: string, maxLength: 2000 }

    WorkerPayout:
      type: object
      description: >-
        A payroll payout recorded for a worker's pay period
        (db/migrations/0025_workforce.sql `worker_payouts`), unique per
        (worker, period). This is a record of an amount already paid, not a
        stored gross/net figure the read-time payroll function depends on
        (BR-41c).
      required: [id, workerId, periodStart, periodEnd, amountPaise, paymentMethod, paidAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        workerId: { type: string, format: uuid }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        amountPaise: { type: integer, exclusiveMinimum: 0 }
        paymentMethod: { type: string, enum: [cash, bank_transfer, upi] }
        paidAt: { type: string, format: date-time }
        notes: { type: [string, 'null'], maxLength: 2000 }
        createdAt: { type: string, format: date-time }

    WorkerPayoutCreate:
      type: object
      required: [periodStart, periodEnd, amountPaise, paymentMethod]
      properties:
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        amountPaise: { type: integer, exclusiveMinimum: 0 }
        paymentMethod: { type: string, enum: [cash, bank_transfer, upi] }
        notes: { type: string, maxLength: 2000 }

    WorkforceSummary:
      type: object
      description: >-
        Headline workforce numbers for a farm, computed at read time from raw
        attendance/advance/payout rows — never a stored column (BR-41c).
      required: [workerCount, hoursThisMonth, payrollDueThisMonthPaise]
      properties:
        workerCount: { type: integer, minimum: 0 }
        hoursThisMonth: { type: number, minimum: 0 }
        payrollDueThisMonthPaise: { type: integer, minimum: 0 }

    PayrollSummaryItem:
      type: object
      description: >-
        One worker's payroll figures for a period, computed at read time from
        raw attendance/advance/payout rows — never a stored column (BR-41c).
      required: [workerId, workerName, grossPaise, advancesPaise, netPayablePaise, paidStatus]
      properties:
        workerId: { type: string, format: uuid }
        workerName: { type: string }
        grossPaise: { type: integer, minimum: 0 }
        advancesPaise: { type: integer, minimum: 0 }
        netPayablePaise: { type: integer, description: grossPaise - advancesPaise. }
        paidStatus:
          type: string
          enum: [pending, paid]
          description: paid when a worker_payouts row exists for this worker and period.

    CropHoursSummary:
      type: object
      description: >-
        Labor cost and hours attributed to one planting (farm_crops), computed
        at read time from raw attendance rows — never a stored column (BR-41c).
      required: [totalCostPaise, hoursLogged, workersInvolved, avgRatePaise]
      properties:
        totalCostPaise: { type: integer, minimum: 0 }
        hoursLogged: { type: number, minimum: 0 }
        workersInvolved: { type: integer, minimum: 0 }
        avgRatePaise: { type: integer, minimum: 0 }

    FarmCropStatus:
      type: string
      enum: [PLANNED, GROWING, HARVESTED, FAILED]
      description: |
        farm_crops.status. New plantings start PLANNED; at most one row per plot
        may be GROWING at a time (BR-46).

    SeedQuantityUnit:
      type: string
      enum: [grams, kg, packets, units]

    ExpectedGrade:
      type: string
      enum: [GRADE_A, GRADE_B, GRADE_C]

    CropMaster:
      type: object
      description: |
        A crop taxonomy row (`crop_master`). Allow-list response: `hsnCode` and the
        raw `categoryId` join are internal and not exposed here — the mobile crop
        screens only need name/nameTa/iconKey/defaultUnit for display and picking.
      required: [id, slug, name, nameTa, categoryId, botanicalName, defaultUnit, seasonMonths, shelfLifeDays, iconKey, isActive]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string, example: carrot }
        name: { type: string }
        nameTa: { type: [string, 'null'] }
        categoryId: { type: string, format: uuid }
        botanicalName: { type: [string, 'null'] }
        defaultUnit: { type: string, enum: [kg] }
        seasonMonths:
          type: [array, 'null']
          items: { type: integer, minimum: 1, maximum: 12 }
        shelfLifeDays: { type: [integer, 'null'], exclusiveMinimum: 0 }
        iconKey: { type: [string, 'null'] }
        isActive: { type: boolean }

    CropMasterCreateRequest:
      type: object
      description: Body of `POST /admin/crop-master`.
      required: [slug, name, categoryId]
      properties:
        slug: { type: string, minLength: 1, maxLength: 80, pattern: '^[a-z0-9-]+$' }
        name: { type: string, maxLength: 120 }
        nameTa: { type: string, maxLength: 120 }
        categoryId: { type: string, format: uuid }
        botanicalName: { type: string, maxLength: 160 }
        defaultUnit: { type: string, enum: [kg], default: kg }
        seasonMonths:
          type: array
          maxItems: 12
          items: { type: integer, minimum: 1, maximum: 12 }
        shelfLifeDays: { type: integer, exclusiveMinimum: 0 }
        iconKey: { type: string, maxLength: 80 }
      additionalProperties: false

    CropMasterUpdateRequest:
      type: object
      description: |
        Partial update of a crop type — at least one field must be supplied.
        Retiring one (`isActive: false`) excludes it from the farmer-facing picker
        but never hard-deletes it — existing `farm_crops`/listings referencing it
        remain valid.
      properties:
        name: { type: string, maxLength: 120 }
        nameTa: { type: [string, 'null'], maxLength: 120 }
        categoryId: { type: string, format: uuid }
        botanicalName: { type: [string, 'null'], maxLength: 160 }
        seasonMonths:
          type: [array, 'null']
          maxItems: 12
          items: { type: integer, minimum: 1, maximum: 12 }
        shelfLifeDays: { type: [integer, 'null'], exclusiveMinimum: 0 }
        iconKey: { type: [string, 'null'], maxLength: 80 }
        isActive: { type: boolean }
      additionalProperties: false

    FarmCrop:
      type: object
      description: |
        A planting record (`farm_crops`), plus the crop_master display fields the
        mobile crop screens render (`cropName`/`cropNameTa`/`cropIconKey`).
      required:
        - id
        - plotId
        - cropMasterId
        - cropName
        - cropNameTa
        - cropIconKey
        - status
        - plantedOn
        - expectedHarvestOn
        - actualHarvestOn
        - expectedYieldKg
        - actualYieldKg
        - seedVariety
        - seedCompany
        - seedQuantity
        - seedQuantityUnit
        - seedCostPaise
        - expectedGrade
        - notes
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        plotId: { type: string, format: uuid }
        cropMasterId: { type: string, format: uuid }
        cropName: { type: string }
        cropNameTa: { type: [string, 'null'] }
        cropIconKey: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/FarmCropStatus' }
        plantedOn: { type: [string, 'null'], format: date }
        expectedHarvestOn: { type: [string, 'null'], format: date }
        actualHarvestOn: { type: [string, 'null'], format: date }
        expectedYieldKg: { type: [number, 'null'], minimum: 0 }
        actualYieldKg: { type: [number, 'null'], minimum: 0 }
        seedVariety: { type: [string, 'null'] }
        seedCompany: { type: [string, 'null'] }
        seedQuantity: { type: [number, 'null'], minimum: 0 }
        seedQuantityUnit:
          oneOf:
            - { $ref: '#/components/schemas/SeedQuantityUnit' }
            - type: 'null'
        seedCostPaise:
          type: [integer, 'null']
          minimum: 0
          description: Integer paise, not rupees — root CLAUDE.md §2.2, money is never a float.
        expectedGrade:
          oneOf:
            - { $ref: '#/components/schemas/ExpectedGrade' }
            - type: 'null'
        notes: { type: [string, 'null'], maxLength: 2000 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }

    FarmCropCreateRequest:
      type: object
      description: |
        Body of `POST /farmers/me/plots/{plotId}/crops`. There is deliberately no
        `plotId` or `farmerId` field here — `plotId` travels in the URL and the
        owner is always the caller (root CLAUDE.md §2.1). The new row is created
        in status `PLANNED`, the farm_crops column default.
      required: [cropMasterId]
      properties:
        cropMasterId: { type: string, format: uuid }
        plantedOn: { type: string, format: date }
        expectedHarvestOn: { type: string, format: date }
        expectedYieldKg: { type: number, minimum: 0 }
        seedVariety: { type: string, maxLength: 160 }
        seedCompany: { type: string, maxLength: 160 }
        seedQuantity: { type: number, minimum: 0 }
        seedQuantityUnit: { $ref: '#/components/schemas/SeedQuantityUnit' }
        seedCostPaise: { type: integer, minimum: 0 }
        expectedGrade: { $ref: '#/components/schemas/ExpectedGrade' }
        notes: { type: string, maxLength: 2000 }
      additionalProperties: false

    FarmCropUpdateRequest:
      type: object
      description: |
        Partial update of a `farm_crops` row — at least one field must be
        supplied. `plotId` and `cropMasterId` are NOT present: they are not
        editable. Moving `status` to `GROWING` when the plot already has another
        live `GROWING` crop is rejected with `CROP_PLOT_ALREADY_GROWING` (BR-46).
        Nullable fields accept `null` to clear them.
      properties:
        status: { $ref: '#/components/schemas/FarmCropStatus' }
        plantedOn: { type: [string, 'null'], format: date }
        expectedHarvestOn: { type: [string, 'null'], format: date }
        actualHarvestOn: { type: [string, 'null'], format: date }
        expectedYieldKg: { type: [number, 'null'], minimum: 0 }
        actualYieldKg: { type: [number, 'null'], minimum: 0 }
        seedVariety: { type: [string, 'null'], maxLength: 160 }
        seedCompany: { type: [string, 'null'], maxLength: 160 }
        seedQuantity: { type: [number, 'null'], minimum: 0 }
        seedQuantityUnit:
          oneOf:
            - { $ref: '#/components/schemas/SeedQuantityUnit' }
            - type: 'null'
        seedCostPaise: { type: [integer, 'null'], minimum: 0 }
        expectedGrade:
          oneOf:
            - { $ref: '#/components/schemas/ExpectedGrade' }
            - type: 'null'
        notes: { type: [string, 'null'], maxLength: 2000 }
      additionalProperties: false

    PlotRotationHistory:
      type: object
      description: |
        Most-recent-first planting history for one plot, for the crop rotation
        timeline view (CropRotationScreen.tsx).
      required: [plotId, history]
      properties:
        plotId: { type: string, format: uuid }
        history:
          type: array
          items:
            type: object
            required: [farmCropId, cropName, cropIconKey, plantedOn, actualHarvestOn, status]
            properties:
              farmCropId: { type: string, format: uuid }
              cropName: { type: string }
              cropIconKey: { type: [string, 'null'] }
              plantedOn: { type: [string, 'null'], format: date }
              actualHarvestOn: { type: [string, 'null'], format: date }
              status: { $ref: '#/components/schemas/FarmCropStatus' }

    FarmAssetCategory:
      type: string
      enum: [TOOL, EQUIPMENT, MACHINERY]
      description: farm_assets.category. One unified table for the three near-identical mock screens (Machinery/Tools/Equipment).

    FarmAssetStatus:
      type: string
      enum: [OK, DUE_SOON, OVERDUE]
      description: |
        Computed on every read from `nextServiceDueOn` vs today (Asia/Kolkata)
        — never a database column. DUE_SOON's window is
        `system_config.asset_service_due_soon_days` (a specification-gap
        placeholder, see db/seed/001_reference.sql).

    FarmAsset:
      type: object
      description: |
        A maintenance-tracked farm asset (`farm_assets`) — one unified row
        shape for MachineryListScreen/ToolsListScreen/EquipmentListScreen.tsx,
        distinguished by `category`. `makeModel`/`fuelType` are
        machinery-specific and `coverageAreaAcres` is equipment-specific, but
        all three are plain nullable columns rather than three separate
        tables.

        `nextServiceDueOn` is a GENERATED column: `COALESCE(lastServicedOn,
        purchasedOn) + serviceIntervalDays`, matching the mock Add screens'
        own copy ("Next-due date is calculated from this interval and the
        last service."). `status`/`dueNote` are derived from it at read time
        and are never stored (db/migrations/0025_farm_assets.sql).
      required:
        - id
        - farmId
        - category
        - name
        - makeModel
        - fuelType
        - coverageAreaAcres
        - purchasedOn
        - costPaise
        - serviceIntervalDays
        - lastServicedOn
        - nextServiceDueOn
        - status
        - dueNote
        - notes
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        farmId: { type: string, format: uuid }
        category: { $ref: '#/components/schemas/FarmAssetCategory' }
        name: { type: string }
        makeModel: { type: [string, 'null'] }
        fuelType: { type: [string, 'null'] }
        coverageAreaAcres: { type: [number, 'null'], minimum: 0 }
        purchasedOn: { type: [string, 'null'], format: date }
        costPaise:
          type: [integer, 'null']
          minimum: 0
          description: Integer paise, not rupees — root CLAUDE.md §2.2, money is never a float.
        serviceIntervalDays: { type: [integer, 'null'], exclusiveMinimum: 0 }
        lastServicedOn: { type: [string, 'null'], format: date }
        nextServiceDueOn:
          type: [string, 'null']
          format: date
          description: GENERATED column. Never accepted in a request body — see FarmAssetCreateRequest/FarmAssetUpdateRequest.
        status: { $ref: '#/components/schemas/FarmAssetStatus' }
        dueNote:
          type: [string, 'null']
          example: '5 days away'
          description: e.g. "12 days overdue" / "Due today" / "5 days away". Computed, never stored. Null when nextServiceDueOn is null.
        notes: { type: [string, 'null'], maxLength: 2000 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }

    FarmAssetCreateRequest:
      type: object
      description: |
        Body of `POST /farmers/me/farm-assets`. There is deliberately no
        `farmerId` field — the owner is always the caller (root CLAUDE.md
        §2.1). `farmId` names one of the caller's own `farms`; a foreign
        `farmId` is 404. `serviceIntervalDays` is required, matching every
        mock Add screen (AddToolScreen/AddMachineryScreen/AddEquipmentScreen.tsx)
        marking "Service interval (days)" as required.
      required: [farmId, category, name, serviceIntervalDays]
      properties:
        farmId: { type: string, format: uuid }
        category: { $ref: '#/components/schemas/FarmAssetCategory' }
        name: { type: string, maxLength: 160 }
        makeModel: { type: string, maxLength: 160 }
        fuelType: { type: string, maxLength: 80 }
        coverageAreaAcres: { type: number, minimum: 0 }
        purchasedOn: { type: string, format: date }
        costPaise: { type: integer, minimum: 0 }
        serviceIntervalDays: { type: integer, exclusiveMinimum: 0 }
        lastServicedOn: { type: string, format: date }
        notes: { type: string, maxLength: 2000 }
      additionalProperties: false

    FarmAssetUpdateRequest:
      type: object
      description: |
        Partial update of a `farm_assets` row — at least one field must be
        supplied. `farmId` and `category` are NOT present: they are not
        editable. Nullable fields accept `null` to clear them.
      properties:
        name: { type: string, maxLength: 160 }
        makeModel: { type: [string, 'null'], maxLength: 160 }
        fuelType: { type: [string, 'null'], maxLength: 80 }
        coverageAreaAcres: { type: [number, 'null'], minimum: 0 }
        purchasedOn: { type: [string, 'null'], format: date }
        costPaise: { type: [integer, 'null'], minimum: 0 }
        serviceIntervalDays: { type: [integer, 'null'], exclusiveMinimum: 0 }
        lastServicedOn: { type: [string, 'null'], format: date }
        notes: { type: [string, 'null'], maxLength: 2000 }
      additionalProperties: false

    AnimalSpecies:
      type: string
      enum: [CATTLE, BUFFALO, GOAT, POULTRY, SHEEP]

    AnimalGender:
      type: string
      enum: [FEMALE, MALE]

    AnimalSource:
      type: string
      enum: [BORN_ON_FARM, PURCHASED]

    OrganicStatus:
      type: string
      enum: [ORGANIC, TRANSITIONING, CONVENTIONAL]

    LifecycleStatus:
      type: string
      enum: [ACTIVE, SOLD, TRANSFERRED, CULLED, DECEASED]
      description: |
        livestock_animals.lifecycle_status. New animals start ACTIVE; the rest
        are terminal, set exactly once by a lifecycle event (BR-47).

    LifecycleEventType:
      type: string
      enum: [SOLD, TRANSFERRED, CULLED, DECEASED]

    DairyProductType:
      type: string
      enum: [MILK, CURD, PANEER, BUTTER, GHEE, BUTTERMILK, CHEESE, EGGS]
      description: |
        The fixed 8-product dairy/poultry catalog. Each value logs in exactly
        one ProductionUnit: MILK/GHEE/BUTTERMILK in LITERS, CURD/PANEER/
        BUTTER/CHEESE in KG, EGGS as a COUNT.

    ProductionUnit:
      type: string
      enum: [LITERS, KG, COUNT]

    Animal:
      type: object
      description: |
        A `livestock_animals` row. Allow-list response: the internal `farm_id`
        is not exposed — the caller already knows whose herd this is, either
        from `/me` or from the `farmerId` it passed on the admin route.
      required:
        - id
        - tag
        - name
        - species
        - breed
        - gender
        - dateOfBirth
        - source
        - purchasedOn
        - sourceFarm
        - organicStatus
        - lifecycleStatus
        - withdrawalUntil
        - notes
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        tag: { type: string, example: C-014 }
        name: { type: [string, 'null'] }
        species: { $ref: '#/components/schemas/AnimalSpecies' }
        breed: { type: [string, 'null'] }
        gender: { $ref: '#/components/schemas/AnimalGender' }
        dateOfBirth: { type: [string, 'null'], format: date }
        source: { $ref: '#/components/schemas/AnimalSource' }
        purchasedOn: { type: [string, 'null'], format: date }
        sourceFarm: { type: [string, 'null'] }
        organicStatus: { $ref: '#/components/schemas/OrganicStatus' }
        lifecycleStatus: { $ref: '#/components/schemas/LifecycleStatus' }
        withdrawalUntil:
          type: [string, 'null']
          format: date
          description: |
            Post-medication milk/meat withdrawal window. While this is
            today-or-later, the animal's produce should not be marked
            organic-sellable (display-only; no business rule keys off it yet).
        notes: { type: [string, 'null'], maxLength: 2000 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }

    AnimalCreateRequest:
      type: object
      description: |
        Body of `POST /farmers/me/livestock/animals`. There is deliberately no
        `farmId` field — the new animal is attached to the caller's primary
        farm server-side (root CLAUDE.md §2.1) — and no `lifecycleStatus`:
        every new animal starts `ACTIVE`.
      required: [tag, species, gender]
      properties:
        tag: { type: string, minLength: 1, maxLength: 40 }
        name: { type: string, minLength: 1, maxLength: 120 }
        species: { $ref: '#/components/schemas/AnimalSpecies' }
        breed: { type: string, minLength: 1, maxLength: 120 }
        gender: { $ref: '#/components/schemas/AnimalGender' }
        dateOfBirth: { type: string, format: date }
        source: { $ref: '#/components/schemas/AnimalSource', default: BORN_ON_FARM }
        purchasedOn: { type: string, format: date }
        sourceFarm: { type: string, minLength: 1, maxLength: 160 }
        organicStatus: { $ref: '#/components/schemas/OrganicStatus', default: CONVENTIONAL }
        withdrawalUntil: { type: string, format: date }
        notes: { type: string, maxLength: 2000 }
      additionalProperties: false

    AnimalUpdateRequest:
      type: object
      description: |
        Partial update of a `livestock_animals` row — at least one field must
        be supplied. `lifecycleStatus` is NOT present: it only ever changes
        via `POST .../lifecycle-events` (BR-47). Nullable fields accept
        `null` to clear them.
      properties:
        tag: { type: string, minLength: 1, maxLength: 40 }
        name: { type: [string, 'null'], minLength: 1, maxLength: 120 }
        species: { $ref: '#/components/schemas/AnimalSpecies' }
        breed: { type: [string, 'null'], minLength: 1, maxLength: 120 }
        gender: { $ref: '#/components/schemas/AnimalGender' }
        dateOfBirth: { type: [string, 'null'], format: date }
        source: { $ref: '#/components/schemas/AnimalSource' }
        purchasedOn: { type: [string, 'null'], format: date }
        sourceFarm: { type: [string, 'null'], minLength: 1, maxLength: 160 }
        organicStatus: { $ref: '#/components/schemas/OrganicStatus' }
        withdrawalUntil: { type: [string, 'null'], format: date }
        notes: { type: [string, 'null'], maxLength: 2000 }
      additionalProperties: false

    LifecycleEventCreateRequest:
      type: object
      description: |
        Body of `POST /farmers/me/livestock/animals/{animalId}/lifecycle-events`.
        `salePricePaise` is integer paise, not rupees (root CLAUDE.md §2.2);
        only meaningful for `eventType: SOLD`. `eventDate` defaults to today
        when omitted.
      required: [eventType]
      properties:
        eventType: { $ref: '#/components/schemas/LifecycleEventType' }
        eventDate: { type: string, format: date }
        counterparty:
          type: string
          minLength: 1
          maxLength: 160
          description: Buyer name or destination farm.
        salePricePaise: { type: integer, minimum: 0 }
        reason: { type: string, minLength: 1, maxLength: 500 }
        notes: { type: string, maxLength: 2000 }
      additionalProperties: false

    ProductionLog:
      type: object
      description: A `livestock_production_logs` row.
      required: [id, animalId, productType, quantity, unit, loggedOn, batchInfo, sessions, notes, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        animalId:
          type: [string, 'null']
          format: uuid
          description: Null for flock-level egg collection, which has no single bird to attribute the count to.
        productType: { $ref: '#/components/schemas/DairyProductType' }
        quantity: { type: number, exclusiveMinimum: 0 }
        unit: { $ref: '#/components/schemas/ProductionUnit' }
        loggedOn: { type: string, format: date }
        batchInfo: { type: [string, 'null'], description: 'Free text, e.g. "Batch #3, cultured 24hr".' }
        sessions:
          type: [integer, 'null']
          exclusiveMinimum: 0
          description: Number of milking sessions that day. Only meaningful for MILK.
        notes: { type: [string, 'null'], maxLength: 2000 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }

    ProductionLogCreateRequest:
      type: object
      description: |
        Body of `POST /farmers/me/livestock/production-logs`. `unit` must
        match `productType`'s one fixed unit (see `DairyProductType`'s
        description) or the request is 422.
      required: [productType, quantity, unit]
      properties:
        animalId: { type: string, format: uuid }
        productType: { $ref: '#/components/schemas/DairyProductType' }
        quantity: { type: number, exclusiveMinimum: 0 }
        unit: { $ref: '#/components/schemas/ProductionUnit' }
        loggedOn: { type: string, format: date }
        batchInfo: { type: string, minLength: 1, maxLength: 500 }
        sessions: { type: integer, exclusiveMinimum: 0 }
        notes: { type: string, maxLength: 2000 }
      additionalProperties: false

    FairPrice:
