        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiaryPhotoAttachRequest' }
      responses:
        '201':
          description: Photo attached.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiaryPhoto' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farmers/me/diary/entries/{entryId}/photos/{photoId}:
    delete:
      tags: [Farm Diary]
      operationId: deleteMyDiaryEntryPhoto
      summary: Remove a photo from an own diary entry
      description: Removes a photo attachment from an own diary entry.
      x-permission: farmer.diary.edit_own
      parameters:
        - name: entryId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: photoId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/diary/categories:
    post:
      tags: [Farm Diary]
      operationId: createDiaryCategory
      summary: Create an activity taxonomy category
      description: |
        Adds a new top-level activity category to the admin-manageable diary taxonomy.
