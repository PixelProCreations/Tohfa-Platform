      responses:
        '201':
          description: Zone created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plot' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farms/{farmId}/plots/{plotId}:
    patch:
      tags: [Farms & Zones]
      operationId: updateMyFarmPlot
      summary: Update a zone
      description: |
        Partial update of a zone nested under one of the caller's own land locations;
        only the fields present in the body change. Ownership is checked by joining
        through the parent farm (`plots.farm_id -> farms.farmer_id`); a farm or plot id
        that does not exist, or belongs to another farmer, 404s rather than 403
        (BR-36). Renaming to a name already used on the same farm 409s.
      x-permission: farmer.farm.manage_own
      x-business-rules: [BR-36]
      parameters:
        - name: farmId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: plotId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlotUpdate' }
            example:
              sunExposure: Partial
              irrigationType: Drip
      responses:
        '200':
          description: Updated zone.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plot' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [Farms & Zones]
      operationId: deleteMyFarmPlot
      summary: Remove a zone
      description: |
        Hard-deletes a zone — the `plots` table has no `deleted_at` (db/migrations/0003).
        A farm or plot id that does not exist, or belongs to another farmer, 404s rather
        than 403 (BR-36).
      x-permission: farmer.farm.manage_own
      x-business-rules: [BR-36]
      parameters:
        - name: farmId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: plotId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Zone removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farms/{farmId}/soil-reports/download-link:
    get:
      tags: [Soil Management]
      operationId: getMySoilReportDownloadLink
      summary: Get a short-lived signed link to the soil health report PDF
      description: |
        Returns a signed, relative `downloadUrl` pointing at
        `GET /farms/{farmId}/soil-reports/export`, valid for 15 minutes (`expiresAt` is
        epoch milliseconds), so the mobile app can hand the PDF to the device browser or
        share sheet without attaching a bearer token. `period` defaults to `6 months`;
        `include` and `plotId` are carried into the signed link. A farm id that does not
        exist, or belongs to another farmer, 404s rather than 403 (BR-36).
      x-permission: farmer.soil.manage_own
      x-business-rules: [BR-36]
      parameters:
        - name: farmId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: period
          in: query
          required: false
          schema: { type: string, enum: ['3 months', '6 months', 'All time'], default: 6 months }
        - name: include
          in: query
          required: false
          schema: { type: string }
        - name: plotId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: token
          in: query
          required: false
          schema: { type: string }
        - name: expires
          in: query
          required: false
          schema: { type: number }
        - name: redirect
          in: query
          required: false
          schema: { type: boolean }
      responses:
        '200':
          description: The signed download link.
          content:
            application/json:
              schema:
                type: object
                required: [downloadUrl, fileName, expiresAt]
                properties:
                  downloadUrl: { type: string }
                  fileName: { type: string }
                  expiresAt: { type: number }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farms/{farmId}/soil-reports/export:
    get:
      tags: [Soil Management]
      operationId: exportMySoilReport
      summary: Download the soil health report PDF
      description: |
        Returns the farm's soil health report as `application/pdf` (attachment named
        `Soil_Health_Report_<period>.pdf`). Authorised either by a valid bearer token or by
        the `token` and `expires` query parameters of a link from
        `GET /farms/{farmId}/soil-reports/download-link`; this route therefore carries
        `security: []` and does not use `requirePermission`. With neither, it
        is 401; a signature that is invalid or expired is 403. With `redirect=true` an
        authenticated caller instead receives a 302 to the signed `downloadUrl`
        (a missing farm, or one owned by another farmer, is 404 in that mode). `period`
        defaults to `6 months`.
      security: []
      x-business-rules: [BR-36]
      parameters:
        - name: farmId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: period
          in: query
          required: false
          schema: { type: string, enum: ['3 months', '6 months', 'All time'], default: 6 months }
        - name: include
          in: query
          required: false
          schema: { type: string }
        - name: plotId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: token
          in: query
          required: false
          schema: { type: string }
        - name: expires
          in: query
          required: false
          schema: { type: number }
        - name: redirect
          in: query
          required: false
          schema: { type: boolean }
      responses:
        '200':
          description: The soil health report.
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '302':
          description: Redirect to the signed download URL (`redirect=true`).
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farms/{farmId}/plots/{plotId}/soil-tests:
    get:
      tags: [Soil Management]
      operationId: listMySoilTests
      summary: List a zone's soil test records
      description: |
        Lists lab soil test results logged for one of the caller's own zones, newest
        `testDate` first. Every item carries the BR-40 classification labels
        (`organicCarbonLabel`, `phLabel`, `ecLabel`, `tdsLabel`, `nitrogenLabel`,
        `phosphorusLabel`, `potassiumLabel`) computed from `system_config` bands by the
        one shared server-side function — never a client literal. A farm or plot id
        that does not exist, or belongs to another farmer, 404s rather than 403 (BR-36).
      x-permission: farmer.soil.manage_own
      x-business-rules: [BR-36, BR-40]
      parameters:
        - name: farmId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: plotId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The zone's soil test records.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SoilTestRecord' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Soil Management]
      operationId: createMySoilTest
      summary: Log a soil test result
      description: |
        Logs a lab soil test result for one of the caller's own zones. `labReportUploadId`,
        when supplied, must reference an upload (`POST /uploads/sign` with
        `purpose: SOIL_TEST_REPORT`) the caller themself created — an upload id that does
        not exist, or was created by someone else, is rejected as `VALIDATION_FAILED`
        rather than silently linked. The response carries the same BR-40 classification
        labels as the list/detail endpoints. A farm or plot id that does not exist, or
        belongs to another farmer, 404s rather than 403 (BR-36).
      x-permission: farmer.soil.manage_own
      x-business-rules: [BR-36, BR-40]
      parameters:
        - name: farmId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: plotId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SoilTestRecordCreate' }
            example:
              testDate: '2026-04-01'
              nextDueDate: '2026-10-01'
              organicCarbonPct: 0.6
              ph: 6.8
              ecDsPerM: 0.5
              tdsPpm: 300
              nitrogenKgPerHa: 400
              phosphorusKgPerHa: 18
              potassiumKgPerHa: 200
              limeStatus: Harmless
      responses:
        '201':
          description: Soil test record created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SoilTestRecord' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farms/{farmId}/plots/{plotId}/soil-tests/health-summary:
    get:
      tags: [Soil Management]
      operationId: getMySoilTestHealthSummary
      summary: Soil health tracker (pH, organic carbon, TDS trend)
      description: |
        Returns all three tracked metrics (`ph`, `organicCarbon`, `tds`) in one call rather
        than accepting a `metric` query parameter, since the mobile tracker screen renders
        all three together and this avoids three round trips. Each metric reports the
        latest and previous reading, their arithmetic difference, a `trendDirection` that
        only tracks whether the raw number rose, fell, or held (never a judgement about
        whether that direction is agronomically good for the metric), and up to the last 6
        readings as chart points. This is pure arithmetic over the zone's own records —
        it deliberately carries no generated advisory or recommendation text, which is the
        automated-advice territory BR-38 blocks pending client resolution. A farm or plot
        id that does not exist, or belongs to another farmer, 404s rather than 403 (BR-36).
      x-permission: farmer.soil.manage_own
      x-business-rules: [BR-36, BR-38]
      parameters:
        - name: farmId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: plotId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The zone's soil health tracker summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SoilHealthSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farms/{farmId}/plots/{plotId}/soil-tests/{testId}:
