    get:
      tags: [Customers]
      operationId: getAdminCustomerSupportTicket
      summary: Customer support ticket thread
      description: |
        The ticket and its messages, oldest first. For an `own` actor, internal notes and message
        content naming a farmer (farmer name, farm name, farmer id, village, GPS) are removed or
        redacted (BR-97, BR-16), and `redacted` is true on any message so altered; scope `all`
        actors see the unredacted thread. 404 when the customer is outside the scope or the ticket
        is not this customer's (BR-91).
      x-permission: customer.support_history.view
      x-business-rules: [BR-97, BR-91, BR-92]
      parameters:
        - { $ref: '#/components/parameters/CustomerIdPathParam' }
        - { name: ticketId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The ticket thread.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCustomerSupportTicketDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/customers/{customerId}/support-tickets/{ticketId}/replies:
    post:
      tags: [Customers]
      operationId: replyAdminCustomerSupportTicket
      summary: Reply to a customer support ticket
      description: |
        Appends a reply to the thread as a new `support_messages` row (append-only at the database
        level, migration 0066); earlier messages are never edited (BR-97). One audit row (ids only)
        is written in the same transaction (BR-97f).

        Double gate (owner decision 2026-10-11, BR-97d): the route checks
        `customer.support_history.view` FIRST, whose resolved scope decides which customers are
        visible (BR-91), and THEN `support.ticket.respond` (`x-permission`), which authorises the
        write. The caller needs both; `x-additional-permissions` lists the first. 403 `FORBIDDEN`
        when either is not granted.

        Errors: 404 `NOT_FOUND` when the customer is outside the visibility scope or the ticket is
        not this customer's (BR-91). 409 `CONFLICT` when the ticket is `CLOSED` (BR-97i). 422
        `VALIDATION_FAILED` for an invalid body, and when the message or the attachment key names a
        farmer identity known for this customer (farmer name, farm name, farmer id or code, village,
        batch code, GPS position), with `errors["body.message"]` set; nothing is stored (BR-97c,
        BR-16). The 422 applies to every actor, whatever its scope.
      x-permission: support.ticket.respond
      x-additional-permissions: [customer.support_history.view]
      x-business-rules: [BR-97, BR-91]
      parameters:
        - { $ref: '#/components/parameters/CustomerIdPathParam' }
        - { name: ticketId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminCustomerSupportReplyRequest' }
      responses:
        '201':
          description: Reply stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCustomerSupportMessage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`CONFLICT`: the ticket is CLOSED (BR-97i).'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: '`VALIDATION_FAILED`: invalid body, or the reply names a farmer identity (BR-97c).'
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/sales/summary:
    get:
      tags: [Sales]
      operationId: getAdminSalesSummary
      summary: Sales dashboard summary
      description: |
        Counts and revenue of DIRECT and MARKET sales that are `payment_status = PAID`,
        `status = PICKED_UP` and have `completed_at` set, only (BR-96). Pending UPI sales, failed
        attempts and cancelled sales are excluded. Days are Asia/Kolkata days of `completed_at`;
        `to` defaults to today and `from` to `to`. The span is capped by
        `system_config.report_max_range_days` (default 366), else 422. Exact integer-paise sums,
        shown as `Money`. Both channels and all four methods are always present (zero-filled).
        Confined to the caller's scope (`own` = its warehouse); a `warehouseId` outside the scope is
        404. `needsAttention` (spec gap, SWA M6 read slice) is derived, not stored; see the schema.
      x-permission: sales.dashboard.view
      x-business-rules: [BR-96, BR-98]
      parameters:
        - { $ref: '#/components/parameters/SalesFromParam' }
        - { $ref: '#/components/parameters/SalesToParam' }
        - { name: warehouseId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalesDashboardSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/sales/customers/lookup:
    get:
      tags: [Sales]
      operationId: lookupAdminSaleCustomer
      summary: Find a customer at the counter
      description: |
        Exactly one of `mobile`, `code` or `q` (422 otherwise). `mobile` matches on the last 10
        digits; `code` is case-insensitive exact; `q` (spec gap, SWA M6 write side) matches name or
        customer code (substring) or, with 4+ digits, mobile digits. Matches only customers in the
        caller's customer scope (BR-91: an order or a SUCCESS top-up at the warehouse, or
        `preferred_warehouse_id`); no match is an empty `items`, never 403. The mobile is always
        returned masked (`mobileMasked`, BR-92g). `walletBalance` lets the counter offer WALLET payment.
      x-permission: sales.sale.create
      x-business-rules: [BR-91, BR-92, BR-85]
      parameters:
        - { name: mobile, in: query, required: false, schema: { type: string, pattern: '^\+?[0-9]{10,15}$' } }
        - { name: code, in: query, required: false, schema: { type: string, minLength: 1, maxLength: 40 } }
        - { name: q, in: query, required: false, description: 'Spec gap: name, customer code or mobile digits.', schema: { type: string, minLength: 2, maxLength: 100 } }
      responses:
        '200':
          description: Matching customers (zero or more).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/SaleCustomerMatch' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/sales/products:
    get:
      tags: [Sales]
      operationId: listAdminSaleProducts
      summary: Products sellable on a channel
      description: |
        `channel=MARKET` lists only products with a LIVE_MARKET allocation at the warehouse, with
        `availableQtyKg` equal to what remains of it (never more than the batch's unheld stock);
        `channel=DIRECT` lists ALL pooled ACTIVE batch stock (BR-95). Any other channel value is 422
        (BR-95g). Farm-anonymous allow-list: grade, certification badges and TOHFA branding only (BR-90).

        DIRECT availability (owner decision 2026-10-11): the sum of `qty_available` over sellable
        batches minus the stock held by pending UPI sales (`PENDING_PAYMENT` DIRECT and MARKET sale
        items). It is NOT net of the ONLINE or LIVE_MARKET allocations and not limited to the
        RESERVE/BUFFER share; a DIRECT sale does not decrement any allocation (BR-95i, BR-12 note).
        Sellable = ACTIVE, unexpired (Asia/Kolkata day), non-REJECT batches whose GRN is not
        REJECTED / AWAITING_QC / QC_PENDING. The price is the active
        retail price, else the active fair-price ceiling; a product with neither is not listed (no
        default price). `batchCode` / `storageLocation` name the batch FEFO draws first.
        404 when the warehouse (given or implied by the scope) is unknown, inactive or outside the
        caller's scope (BR-85f), never 403.
      x-permission: sales.sale.create
      x-business-rules: [BR-95, BR-90, BR-85]
      parameters:
        - { name: channel, in: query, required: true, schema: { $ref: '#/components/schemas/SaleChannel' } }
        - { name: q, in: query, required: false, schema: { type: string, minLength: 1, maxLength: 100 } }
        - { name: warehouseId, in: query, required: false, description: 'Spec gap: required for an actor with no assigned warehouse (scope all); a Sub admin may omit it, and another warehouse is 404.', schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/CursorParam' }
        - { $ref: '#/components/parameters/LimitParam' }
      responses:
        '200':
          description: A page of sellable products.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/SaleProduct' } }
                  page: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/sales/quote:
    post:
      tags: [Sales]
      operationId: quoteAdminSale
      summary: Price a sale before taking payment
      description: |
        Checks stock and price and returns the priced lines and totals in integer paise, GST once per
        invoice at `system_config.retail_gst_rate_percent` (BR-89, BR-98). Writes nothing (BR-89f).
        A quantity above available stock is 409 `SALE_STOCK_CHANGED`; available stock is the same
        figure as `GET /admin/sales/products` (DIRECT: all pooled sellable stock minus pending UPI
        holds; MARKET: the LIVE_MARKET allocation capped at the shelf, BR-95). Echo `totals.total` back as
        `expectedTotal` on `POST /admin/sales`. Farm-anonymous (BR-90).
      x-permission: sales.sale.create
      x-business-rules: [BR-89, BR-90, BR-95, BR-98]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaleQuoteRequest' }
      responses:
        '200':
          description: The quote.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaleQuote' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/SaleConflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }
        '501': { $ref: '#/components/responses/SaleChannelNotSupported' }

  /admin/sales:
    post:
      tags: [Sales]
      operationId: createAdminSale
      summary: Create a Direct or Market sale
      description: |
        One transaction: payment, order, items, `SALE` stock ledger rows, invoice number and audit row
        commit together or not at all; the response and any event follow the commit; a failed
        attempt is recorded in `sale_attempts` (BR-87). The sale is stamped with the caller's own
        warehouse (BR-85f). Stock and price are re-checked: 409 `SALE_STOCK_CHANGED` or
        `SALE_PRICE_CHANGED` when they differ from the quote whose total was echoed as
        `expectedTotal` (BR-89). MARKET draws from the LIVE_MARKET allocation, DIRECT from all pooled
        ACTIVE stock minus pending UPI holds, FEFO (BR-95). A DIRECT sale never decrements an
        allocation row, so it may take stock an ONLINE or LIVE_MARKET allocation still shows as
        available; that later consumption is then refused 409 at the stock ledger (BR-95k).

        Buyer: exactly one of `customer` or `walkIn` (BR-86, 422 otherwise). A walk-in paying by
        WALLET is 422 `WALKIN_WALLET_NOT_ALLOWED`. Payment (BR-94): CASH needs `amountReceived >=
        total` (422 `PAYMENT_AMOUNT_INSUFFICIENT`) and returns `totals.changeGiven`; CARD needs a
        non-blank `cardRef`; WALLET is debited by the server inside the transaction (BR-88,
        insufficient balance is 422 `WALLET_INSUFFICIENT`); UPI returns 201 with the sale
        `PENDING_PAYMENT` / payment `PENDING` and no invoice until
        `POST /admin/sales/{saleId}/payments/upi/confirm`. Every other method returns the sale
        `PICKED_UP` / `PAID` with `completedAt` set (BR-85d).

        Channel HORECA or B2B is 501 `SALE_CHANNEL_NOT_SUPPORTED` and writes nothing (BR-13,
        BR-85e). The service also requires `payment.record`; a caller without it is 403 before any
        write (BR-85g). `Idempotency-Key` is required: a missing or blank key is 422
        `VALIDATION_FAILED` (the codebase convention, `requireIdempotencyKey`; 400 is only a body
        that is not JSON). A replay returns the original response and moves money once (BR-88). A
        key replayed after the 24-hour retention, when its sale already exists, is 409
        `IDEMPOTENCY_KEY_REUSED`; nothing is written again.
      x-permission: sales.sale.create
      x-business-rules: [BR-85, BR-86, BR-87, BR-88, BR-89, BR-90, BR-94, BR-95, BR-98, BR-13]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKeyHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaleCreateRequest' }
      responses:
        '201':
          description: Sale created (UPI sales are created pending). An idempotent replay returns this original response.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sale' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/SaleConflict' }
        '422': { $ref: '#/components/responses/SalePaymentInvalid' }
        '500': { $ref: '#/components/responses/ServerError' }
        '501': { $ref: '#/components/responses/SaleChannelNotSupported' }
    get:
      tags: [Sales]
      operationId: listAdminSales
      summary: Sales history
      description: |
        DIRECT and MARKET sales, newest first, including pending UPI sales (filter by
        `paymentStatus`). Confined to the caller's scope (`own` = its warehouse). Farm-anonymous
        allow-list (BR-90); walk-in and customer mobiles are always masked (a sale response never
        carries a full mobile, SaleBuyer, BR-92).
        A sale is dated by the Asia/Kolkata day of `completed_at`, or of `placed_at` while it has
        none (pending or cancelled), so the PAID + PICKED_UP rows of a day equal that day's summary
        (BR-96c). `to` defaults to today and `from` to `to`; when `q` or `customerId` is given with
        neither `from` nor `to`, the search is not date-bounded. Span cap as in `/admin/sales/summary`.
      x-permission: sales.history.view
      x-business-rules: [BR-90, BR-92, BR-85, BR-96]
      parameters:
        - { name: channel, in: query, required: false, schema: { $ref: '#/components/schemas/SaleChannel' } }
        - { name: status, in: query, required: false, description: 'Spec gap (SWA M6 read slice).', schema: { $ref: '#/components/schemas/SaleStatus' } }
        - { name: paymentStatus, in: query, required: false, schema: { $ref: '#/components/schemas/SalePaymentStatus' } }
        - { name: paymentMethod, in: query, required: false, schema: { $ref: '#/components/schemas/SalePaymentMethod' } }
        - { name: customerId, in: query, required: false, description: 'Spec gap (SWA M6 read slice). Registered-customer sales only; the scope still applies.', schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/SalesFromParam' }
        - { $ref: '#/components/parameters/SalesToParam' }
        - { name: q, in: query, required: false, description: 'Sale number, invoice number or walk-in name (substring, case-insensitive), or a buyer mobile (EXACT match only, as typed or with +91 before a 10-digit number, so a masked number cannot be recovered digit by digit, BR-92). Mobile and walk-in name search are a spec gap (SWA M6 read slice).', schema: { type: string, minLength: 1, maxLength: 60 } }
        - { $ref: '#/components/parameters/CursorParam' }
        - { $ref: '#/components/parameters/LimitParam' }
      responses:
        '200':
          description: A page of sales.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/SaleListItem' } }
                  page: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/sales/{saleId}:
    get:
      tags: [Sales]
      operationId: getAdminSale
      summary: Sale detail
      description: |
        404, not 403, when the sale does not exist or is at a warehouse outside the caller's scope.
        Farm-anonymous allow-list at every depth (BR-90); the invoice seller is TOHFA.
      x-permission: sales.history.view
      x-business-rules: [BR-90, BR-92]
      parameters:
        - { $ref: '#/components/parameters/SaleIdPathParam' }
      responses:
        '200':
          description: The sale.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sale' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/sales/{saleId}/payments/upi/confirm:
    post:
      tags: [Sales]
      operationId: confirmAdminSaleUpiPayment
      summary: Confirm a pending UPI sale payment
      description: |
        Verifies the gateway result for the sale's pending UPI payment and, on success, completes the
        sale in one transaction: payment `CONFIRMED`, order `PICKED_UP` / `PAID` with `completedAt`,
        `SALE` stock ledger rows, invoice number and audit row (BR-94, BR-87). A failed or unverified
        gateway result leaves the sale pending (422, attempt logged). Confirming an already confirmed
        sale returns it unchanged with no second effect (BR-88g). A sale that is not a UPI sale, or
        whose payment FAILED, is 409 `CONFLICT`. A UPI reference that already confirmed another
        sale is 409 `CONFLICT` with `meta.reason = UPI_TXN_REF_ALREADY_USED` and the sale stays
        pending: one payment confirms one sale (BR-94, unique `sale_payments.upi_txn_ref`). A
        verified reference is kept on the still-pending payment before the completing transaction
        runs, so a confirm that fails after verification leaves the sale pending WITH its reference
        (BR-94q; `upiTxnRef` is then non-null on a `PENDING` payment); an unverified reference is
        never kept. Stock
        that is no longer on the sale's shelf is 409 `SALE_STOCK_CHANGED`: the sale is cancelled and
        its captured payment is `REFUND_DUE` (refunded at once when `sales.upi_refund_mode = auto`),
        `meta.reason = UPI_REFUND_DUE`. That cancel decides on the sale row locked in its own
        transaction (BR-94l): a sale another request confirmed or cancelled meanwhile is 409
        `CONFLICT` with `meta.reason = SALE_STATE_CHANGED`, nothing is cancelled and nothing is
        refunded. A stock conflict with a UPI reference that already confirmed another sale is
        likewise 409 `CONFLICT` with `meta.reason = UPI_TXN_REF_ALREADY_USED` (BR-94n): the cancel
        rolls back, the sale stays pending and nothing is refunded. `Idempotency-Key` is required:
        missing or blank is 422 `VALIDATION_FAILED`. 404 for a sale outside the caller's scope,
        never 403.
      x-permission: payment.record
      x-business-rules: [BR-94, BR-87, BR-88, BR-90]
      parameters:
        - { $ref: '#/components/parameters/SaleIdPathParam' }
        - { $ref: '#/components/parameters/IdempotencyKeyHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaleUpiConfirmRequest' }
      responses:
        '200':
          description: The completed sale.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sale' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/SaleConflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/sales/{saleId}/cancel:
    post:
      tags: [Sales]
      operationId: cancelAdminSale
      summary: Cancel an unpaid pending UPI sale
      description: |
        Cancels a `PENDING_PAYMENT` DIRECT/MARKET sale whose UPI payment is still `PENDING`: the order
        and its items become `CANCELLED`, the payment `FAILED`, the stock hold is released (BR-94i),
        and one `order_status_history` row and one `order.cancel` audit row are written in the same
        transaction. The decision is made on the sale row locked in that transaction (BR-94l): a sale
        that is not a UPI sale, or is already paid, picked up or cancelled, is 409 `CONFLICT`; a sale
        another request changed while this one was writing is 409 `CONFLICT` with
        `meta.reason = SALE_STATE_CHANGED`; in every 409 case nothing is written. When the pending
        payment carries a UPI reference (kept by a verified confirm whose transaction then failed,
        BR-94q), the gateway is asked first: a captured payment is 409 `CONFLICT` with
        `meta.reason = UPI_PAYMENT_CAPTURED` and the sale stays pending (confirm it instead); a
        payment the gateway does not report captured, or one with no reference, is cancelled as
        above. Cancelling an already cancelled sale with the same key replays the original
        response. `Idempotency-Key` is required: missing or blank is 422 `VALIDATION_FAILED`. 404
        for a sale outside the caller's scope, never 403.
      x-permission: sales.sale.cancel
      x-business-rules: [BR-94, BR-88, BR-90]
      parameters:
        - { $ref: '#/components/parameters/SaleIdPathParam' }
        - { $ref: '#/components/parameters/IdempotencyKeyHeader' }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaleCancelRequest' }
      responses:
        '200':
          description: The cancelled sale (`status = CANCELLED`, `paymentStatus = FAILED`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sale' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/SaleConflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/sales/market-day:
    get:
      tags: [Sales]
      operationId: getAdminSalesMarketDay
      summary: Market-day view
      description: |
        For one Asia/Kolkata day (default today): the LIVE_MARKET allocation per product with sold and
        remaining quantities, the paid-and-completed MARKET totals (BR-96), and a page of that day's
        MARKET sales (BR-95). Confined to the caller's scope; a `warehouseId` outside it is 404.
        Farm-anonymous (BR-90).
      x-permission: sales.market_day.view
      x-business-rules: [BR-95, BR-96, BR-90]
      parameters:
        - { name: date, in: query, required: false, schema: { type: string, format: date } }
        - { name: warehouseId, in: query, required: false, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/CursorParam' }
        - { $ref: '#/components/parameters/LimitParam' }
      responses:
        '200':
          description: The market-day view.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalesMarketDay' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/sales/horeca:
    get:
      tags: [Sales]
      operationId: listAdminSalesHoreca
      summary: Horeca orders (read-only)
      description: |
        Read-only list of HORECA orders in the caller's scope, newest first (BR-85h). There is no
        mutating verb; creating a Horeca sale is 501 (BR-13). Farm-anonymous (BR-90).
      x-permission: sales.horeca.view
      x-business-rules: [BR-85, BR-90, BR-13]
      parameters:
        - { $ref: '#/components/parameters/CursorParam' }
        - { $ref: '#/components/parameters/LimitParam' }
      responses:
        '200':
          description: A page of Horeca orders.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ChannelOrderListItem' } }
                  page: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/sales/b2b:
    get:
      tags: [Sales]
      operationId: listAdminSalesB2b
      summary: B2B orders (read-only)
      description: |
        Read-only list of B2B orders in the caller's scope, newest first (BR-85h). There is no
        mutating verb; creating a B2B sale is 501 (BR-13). Farm-anonymous (BR-90).
      x-permission: sales.b2b.view
      x-business-rules: [BR-85, BR-90, BR-13]
      parameters:
        - { $ref: '#/components/parameters/CursorParam' }
        - { $ref: '#/components/parameters/LimitParam' }
      responses:
        '200':
          description: A page of B2B orders.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ChannelOrderListItem' } }
                  page: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Short-lived RS256 access token from `/auth/login`, `/auth/otp/verify` or
        `/auth/refresh`. Claims: `sub` (user id), `typ` (farmer|customer|admin),
        `roles[]`, `wh` (assigned warehouse id, for Sub Warehouse Admins), `exp`.
        Role and warehouse claims are advisory for the client only — the server always
        re-resolves permissions from `rbac.json` per request.

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    OfferIdParam:
      name: offerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AuditFindingIdParam:
      name: findingId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReportFromParam:
      name: from
      in: query
      required: true
      description: First Asia/Kolkata calendar day of the report, inclusive. A real date, `YYYY-MM-DD`; not after `to`.
      schema: { type: string, format: date }
    ReportToParam:
      name: to
      in: query
      required: true
      description: |
        Last Asia/Kolkata calendar day of the report, inclusive. A real date, `YYYY-MM-DD`. The span
        `to - from` may not exceed `system_config.report_max_range_days` (366 when no row exists), else 422.
      schema: { type: string, format: date }
    ReportWarehouseIdParam:
      name: warehouseId
      in: query
      required: false
      description: |
        Narrow the report to one warehouse. A Sub Warehouse Admin asking for a warehouse other than
        its own gets 404 (BR-64a); a Main Warehouse Admin may name any warehouse.
      schema: { type: string, format: uuid }
    ReportExportFinanceToParam:
      name: to
      in: query
      required: true
      description: |
        Last calendar day of the export, inclusive. A real date, `YYYY-MM-DD`, not before `from`. The span
        `to - from` may not exceed `system_config.finance_report_max_range_days` (366 when no row exists),
        the finance reports' own cap, else 422.
      schema: { type: string, format: date }
    CursorParam:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from the previous page's `page.nextCursor`. Omit for the first page.
      schema: { type: string, maxLength: 512 }
    LimitParam:
      name: limit
      in: query
      required: false
      description: Page size.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Client-generated UUIDv4, unique per logical operation. Required on every
        money-moving or otherwise non-repeatable POST. Replaying the same key
        with an identical body returns the original response; replaying it with a
        different body returns 409 `IDEMPOTENCY_KEY_REUSED`. Keys are retained 24 hours.
      schema: { type: string, format: uuid }

    CustomerIdPathParam:
      name: customerId
      in: path
      required: true
      description: Customer id. Outside the caller's customer scope it is 404, never 403 (BR-91).
      schema: { type: string, format: uuid }
    SaleIdPathParam:
      name: saleId
      in: path
      required: true
      description: Sale (order) id. At a warehouse outside the caller's scope it is 404, never 403.
      schema: { type: string, format: uuid }
    CustomerStatusFilterParam:
      name: status
      in: query
      required: false
      description: |
        Derived, not stored: `ACTIVE` = a completed order or top-up within
        `system_config.active_customer_window_days` (default 90), `INACTIVE` = none in that window,
        `NEW` = created within that window (BR-98).
      schema: { type: string, enum: [ACTIVE, INACTIVE, NEW] }
    SalesFromParam:
      name: from
      in: query
      required: false
      description: First Asia/Kolkata calendar day, inclusive, `YYYY-MM-DD`. Defaults to `to` (so to today when `to` is omitted too); not after `to`.
      schema: { type: string, format: date }
    SalesToParam:
      name: to
      in: query
      required: false
      description: Last Asia/Kolkata calendar day, inclusive, `YYYY-MM-DD`. Defaults to today.
      schema: { type: string, format: date }
  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.tohfa.in/problems/bad-request
            title: Malformed request
            status: 400
            detail: Request body is not valid JSON.
            code: BAD_REQUEST
            traceId: 01J9F1B2C3D4E5F6G7H8J9KB
    Unauthorized:
      description: Missing, expired or invalid credentials.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.tohfa.in/problems/unauthorized
            title: Authentication required
            status: 401
            detail: The access token has expired.
            code: UNAUTHENTICATED
            traceId: 01J9F1B2C3D4E5F6G7H8J9KC
    Forbidden:
      description: Authenticated but not permitted — RBAC or warehouse scope.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    WarehouseStaffForbidden:
      description: |
        `FORBIDDEN`: the caller's roles do not grant this operation's permission. A Sub Warehouse
        Admin ALWAYS gets 403 on every warehouse staff and attendance operation, for its own
        warehouse's staff too: it cannot list staff (`admin.staff.list_view` is `none`), so it holds
        none of the staff or attendance codes (owner decision 2026-10-11, BR-83). Farmers, customers
        and Farmer Admins get 403 as well; a Tohfa Admin gets 403 on the attendance marks.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.tohfa.in/problems/forbidden
            title: Permission denied
            status: 403
            detail: Your role does not hold listing.approve.
            code: FORBIDDEN
            traceId: 01J9F1B2C3D4E5F6G7H8J9KD
    NotFound:
      description: No such resource, or it is outside your scope.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.tohfa.in/problems/not-found
            title: Resource not found
            status: 404
            detail: No listing with id 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d.
            code: NOT_FOUND
            traceId: 01J9F1B2C3D4E5F6G7H8J9KE
    Conflict:
      description: The resource is not in a state that allows this operation.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.tohfa.in/problems/invalid-state-transition
            title: Invalid state transition
            status: 409
            detail: The listing is already approved.
            code: INVALID_STATE_TRANSITION
            traceId: 01J9F1B2C3D4E5F6G7H8J9KF
    UnprocessableEntity:
      description: Well-formed but semantically invalid — field validation or a business rule. Any string in a body, query or path that contains a NUL (U+0000) character is refused here too, with the field path in `errors` (database text cannot hold it).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.tohfa.in/problems/validation-failed
            title: Validation failed
            status: 422
            detail: 2 fields failed validation.
            code: VALIDATION_FAILED
            traceId: 01J9F1B2C3D4E5F6G7H8J9KG
            errors:
              body.askingPricePerKg: [Must be a positive amount with at most 2 decimal places.]
              body.quantityKg: [Must be at least 1.000 kg.]
    TooManyRequests:
      description: Rate limited.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.tohfa.in/problems/rate-limited
            title: Too many requests
            status: 429
            detail: OTP resend is limited to one per 60 seconds.
            code: RATE_LIMITED
            traceId: 01J9F1B2C3D4E5F6G7H8J9KH
    ServerError:
      description: Unexpected server error. Quote the traceId to support.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.tohfa.in/problems/internal-error
            title: Internal server error
            status: 500
            detail: An unexpected error occurred.
            code: INTERNAL
            traceId: 01J9F1B2C3D4E5F6G7H8J9KJ
    ReportExportCsv:
      description: |
        The CSV file (BR-76), `text/csv; charset=utf-8`, shared by every `GET /admin/exports/*`
        operation. It is the same read as the report or finance endpoint it exports (same filters,
        same warehouse scoping, same range-span cap, same numbers), flattened to rows. Only CSV exists:
        PDF, Excel and scheduled or e-mailed exports are not built. Days are the Asia/Kolkata days the
        source report buckets by. Money is a 2-decimal string, never a float. A Sub Warehouse Admin is
        confined to its own warehouse and gets 404 for another warehouse's `warehouseId`; a Main
        Warehouse Admin sees all four and may narrow to one.

        Every text cell is passed through the CSV injection guard (a cell starting with `=`, `+`, `-`,
        `@`, a tab or a CR is prefixed with a single quote) and RFC 4180 quoting (commas, double
        quotes and line breaks; CRLF row endings). No customer name, phone, e-mail, address or
        customer code is ever in a file, and the `expenses` export leaves out the vendor and description
        free text. A file with more data rows than `system_config.export_max_rows` (default 50000) is
        422 on `query.to` (`query.warehouseId` for inventory) asking the caller to narrow the request;
        it is never truncated. Every successful export writes one `audit_log` row (`report.export`) on
        the request transaction, with a masked image (report, warehouse, from, to, row count).

        Permission: `report.export.file` AND the permission of the data being exported (the one the
        source endpoint requires; each operation names it). UNCONFIRMED defaults, not client rules:
        (1) `report.export.file` is `view` for MAIN_WH_ADMIN, and `view` means "read-only, no
        mutation", so a GET is allowed and a Main admin can export; the screens' gating note says to
        enable Export only when the grant is not `view` (docs SPEC_GAPS #11): the owner must decide.
        (2) Requiring the data permission too is how FINAL_LIST row 92 gates reports; without it
        FARMER_ADMIN (`view`), FARMER and CUSTOMER (`own`), who hold `report.export.file`, would reach
        warehouse data. (3) The column layout of each file, the `expenses` column set, `export_max_rows`
        = 50000 and the `_current` name of the inventory snapshot are not in any client document.
      headers:
        Content-Disposition: { $ref: '#/components/headers/ReportExportContentDisposition' }
        Cache-Control: { $ref: '#/components/headers/ReportExportCacheControl' }
      content:
        text/csv:
          schema: { type: string }

    SaleConflict:
      description: |
        `SALE_STOCK_CHANGED`: stock (or, for MARKET, the LIVE_MARKET allocation) is below a line's
        quantity (BR-89, BR-95). `SALE_PRICE_CHANGED`: the server total differs from `expectedTotal`
        (BR-89). `IDEMPOTENCY_KEY_REUSED`: the key was used with a different body, or (create) the
        key already made a sale more than 24 hours ago (BR-88).
        `CONFLICT` with `meta.reason = PRICE_NOT_SET`: the product has neither an active retail
        price nor an active fair-price ceiling, so it cannot be priced (no default price is used).
        UPI confirm: `CONFLICT` with `meta.reason = UPI_TXN_REF_ALREADY_USED` (the reference already
        confirmed another sale, BR-94), plain `CONFLICT` (not a UPI sale, or its payment is not
        pending) and `SALE_STOCK_CHANGED` (the held stock is no longer on the sale's shelf).
        UPI confirm stock conflict and cancel: `CONFLICT` with `meta.reason = SALE_STATE_CHANGED`
        (another request confirmed, cancelled or refunded the sale first; nothing written, BR-94l).
        Cancel: `CONFLICT` with `meta.reason = UPI_PAYMENT_CAPTURED` (the pending payment's kept
        reference is captured at the gateway; nothing written, confirm the sale instead, BR-94q).
        `meta` carries the fresh values so the counter can re-confirm (`meta.lines[]` with
        `requestedQtyKg` / `availableQtyKg` for stock; `meta.expectedTotal` / `meta.currentTotal` /
        `meta.quote` for price). Nothing is written but a `sale_attempts` row (a quote writes nothing).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.tohfa.in/problems/sale-stock-changed
            title: Stock changed since the quote
            status: 409
            detail: Only 1.250 kg of Carrot / GRADE_1 is available now.
            code: SALE_STOCK_CHANGED
            traceId: 01J9F1B2C3D4E5F6G7H8J9KK
    SalePaymentInvalid:
      description: |
        Validation or a payment rule (BR-86, BR-88, BR-94): `VALIDATION_FAILED` (for example both
        or neither of `customer` and `walkIn`, or CARD without `cardRef`),
        `WALKIN_WALLET_NOT_ALLOWED`, `PAYMENT_AMOUNT_INSUFFICIENT` or `WALLET_INSUFFICIENT`.
        Nothing is written but a `sale_attempts` row.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.tohfa.in/problems/payment-amount-insufficient
            title: Amount received is less than the total
            status: 422
            detail: Received 100.00 but the total is 123.45.
            code: PAYMENT_AMOUNT_INSUFFICIENT
            traceId: 01J9F1B2C3D4E5F6G7H8J9KL
    SaleChannelNotSupported:
      description: '`SALE_CHANNEL_NOT_SUPPORTED`: Horeca and B2B sale creation is not available in Track 1 (BR-13, BR-85e).'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.tohfa.in/problems/sale-channel-not-supported
            title: Sales channel not supported yet
            status: 501
            detail: Horeca and B2B sales cannot be created in Track 1.
            code: SALE_CHANNEL_NOT_SUPPORTED
            traceId: 01J9F1B2C3D4E5F6G7H8J9KM
  headers:
    ReportExportContentDisposition:
      description: |
        `attachment; filename="<report>_<warehouse code or all>_<from>_<to>.csv"`. The name holds only
        `A-Z a-z 0-9 _ - .`; the inventory snapshot has no range, so its name ends `_current.csv`.
      schema: { type: string }
    ReportExportCacheControl:
      description: Always `no-store`; report data is never kept by a shared cache.
      schema: { type: string }

  schemas:
    Warehouse:
      type: object
      description: A warehouse holding consolidated farmer inventory (BR-24).
      required: [id, code, name, type, isActive, createdAt]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: WH-CBE-MAIN }
        name: { type: string, example: Coimbatore Main Warehouse }
        type: { type: string, enum: [MAIN, SUB] }
        address: { type: string, nullable: true }
        city: { type: string, nullable: true, example: Coonoor }
        pincode: { type: string, nullable: true, example: '643101' }
        latitude: { type: number, nullable: true, description: Decimal degrees, 6 decimals stored. }
        longitude: { type: number, nullable: true, description: Decimal degrees, 6 decimals stored. }
        capacityKg:
          type: string
          nullable: true
          pattern: '^\d+\.\d{3}$'
          description: Storage capacity in kg, a decimal string with 3 decimals (was a JSON number before BR-66).
          example: '30000.000'
        contactPhone: { type: string, nullable: true }
        operatingHours:
          nullable: true
          description: The stored JSON passed through unchanged. Its format is not specified yet.
        isMarketDayVenue: { type: boolean }
        marketDayOfWeek: { type: integer, nullable: true, minimum: 0, maximum: 6 }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }

    WarehouseCapacity:
      type: object
      description: |
        Capacity of one warehouse and its derived usage (BR-66). `usedKg` is the sum of
        `qty_available` of the warehouse's ACTIVE batches; it is a read-only derivation,
        not a business rule. Nothing is clamped.
      required: [warehouseId, capacityKg, usedKg, availableKg, utilizationPercent]
      properties:
        warehouseId: { type: string, format: uuid }
        capacityKg: { type: string, nullable: true, pattern: '^\d+\.\d{3}$', example: '30000.000' }
        usedKg: { type: string, pattern: '^\d+\.\d{3}$', example: '12500.250' }
        availableKg:
          type: string
          nullable: true
          pattern: '^-?\d+\.\d{3}$'
          description: capacityKg - usedKg; negative when over capacity.
          example: '17499.750'
        utilizationPercent:
          type: number
          nullable: true
          description: usedKg / capacityKg * 100 rounded to 2 decimals; above 100 when over capacity.
          example: 41.67

    OperatingHoursDay:
      description: One weekday of the operating hours (an unconfirmed default format, BR-80).
      oneOf:
        - type: object
          additionalProperties: false
          required: [closed]
          properties:
            closed: { type: boolean, enum: [true] }
        - type: object
          additionalProperties: false
          required: [closed, open, close]
          properties:
            closed: { type: boolean, enum: [false] }
            open: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$', example: '09:00' }
            close: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$', description: '24-hour HH:MM, strictly later than `open`.', example: '18:00' }

    OperatingHours:
      type: object
      description: |
        UNCONFIRMED DEFAULT (BR-80, owner approval pending): all seven weekdays, no other key.
      additionalProperties: false
      required: [mon, tue, wed, thu, fri, sat, sun]
      properties:
        mon: { $ref: '#/components/schemas/OperatingHoursDay' }
        tue: { $ref: '#/components/schemas/OperatingHoursDay' }
        wed: { $ref: '#/components/schemas/OperatingHoursDay' }
        thu: { $ref: '#/components/schemas/OperatingHoursDay' }
        fri: { $ref: '#/components/schemas/OperatingHoursDay' }
        sat: { $ref: '#/components/schemas/OperatingHoursDay' }
        sun: { $ref: '#/components/schemas/OperatingHoursDay' }

    WarehouseProfileUpdate:
      type: object
      description: Contact phone and operating hours only (BR-80). Any other field is 422.
      additionalProperties: false
      minProperties: 1
      properties:
        contactPhone: { type: string, nullable: true, pattern: '^\+[1-9][0-9]{7,14}$', description: E.164; null clears it., example: '+914232441234' }
        operatingHours:
          nullable: true
          description: The OperatingHours shape, or null to clear it.
          allOf:
            - $ref: '#/components/schemas/OperatingHours'

    StorageLocation:
      type: object
      description: A named place stock is kept in, within one warehouse (BR-79).
      required: [id, warehouseId, code, name, locationType, capacityKg, isActive, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        code: { type: string, maxLength: 40, example: CS-A01 }
        name: { type: string, maxLength: 120, example: Cold Storage A }
        locationType: { type: string, nullable: true, maxLength: 40, description: 'Free text, not an enum (the design''s Cold/Dry/Bulk/Staging labels are examples).', example: Cold Storage }
        capacityKg: { type: string, nullable: true, pattern: '^\d+\.\d{3}$', description: Display-only capacity of this one location; no stock movement is checked against it., example: '2000.000' }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time, nullable: true }

    StorageLocationCreate:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code: { type: string, minLength: 1, maxLength: 40, description: 'Unique per warehouse, case-insensitively; immutable.', example: CS-A01 }
        name: { type: string, minLength: 1, maxLength: 120 }
        locationType: { type: string, nullable: true, minLength: 1, maxLength: 40 }
        capacityKg: { type: string, nullable: true, pattern: '^\d{1,9}(\.\d{1,3})?$', description: Decimal string greater than 0., example: '2000' }

    StorageLocationUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        locationType: { type: string, nullable: true, minLength: 1, maxLength: 40 }
        capacityKg: { type: string, nullable: true, pattern: '^\d{1,9}(\.\d{1,3})?$' }
        isActive: { type: boolean, description: false deactivates; true reactivates. }

    StorageLocationList:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/StorageLocation' }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        total: { type: integer }

    WarehousePerformance:
      type: object
      description: |
        Exact counts and sums for one warehouse over the inclusive IST dates `from`..`to` (BR-80).
        No score, rate, target, SLA or ranking is ever included. Status lists hold only the
        statuses that occur, ordered alphabetically.
      required: [warehouseId, from, to, orders, receiving, returns, stockMovements]
      properties:
        warehouseId: { type: string, format: uuid }
        from: { type: string, format: date }
        to: { type: string, format: date }
        orders:
          type: object
          required: [placed, fulfilled, cancelled, byStatus]
          properties:
            placed: { type: integer, description: 'Every order of the warehouse placed in the range, whatever its status.' }
            fulfilled: { type: integer, description: 'Of those, PICKED_UP or DELIVERED.' }
            cancelled: { type: integer, description: 'Of those, CANCELLED.' }
            byStatus:
              type: array
              items:
                type: object
                required: [status, count]
                properties:
                  status: { type: string, enum: [PENDING_PAYMENT, CONFIRMED, PACKED, DISPATCHED, READY_FOR_PICKUP, OUT_FOR_DELIVERY, DELIVERED, PICKED_UP, CANCELLED, RETURNED] }
                  count: { type: integer }
        receiving:
          type: object
          required: [goodsReceipts, byStatus, grossQtyKg, acceptedQtyKg, rejectedQtyKg]
          properties:
            goodsReceipts: { type: integer }
            byStatus:
              type: array
              items:
                type: object
                required: [status, count]
                properties:
                  status: { type: string, enum: [AWAITING_QC, ACCEPTED, PARTIALLY_ACCEPTED, REJECTED, COUNTER_OFFERED, DRAFT, RECEIVED, QC_PENDING, QC_DONE] }
                  count: { type: integer }
            grossQtyKg: { type: string, pattern: '^-?\d+\.\d{3}$', example: '16.500' }
            acceptedQtyKg: { type: string, pattern: '^-?\d+\.\d{3}$', example: '13.500' }
            rejectedQtyKg: { type: string, pattern: '^-?\d+\.\d{3}$', example: '3.000' }
        returns:
          type: object
          required: [requested, byStatus]
          properties:
            requested: { type: integer, description: Return requests created in the range against orders of this warehouse. }
            byStatus:
              type: array
              items:
                type: object
                required: [status, count]
                properties:
                  status: { type: string, enum: [PENDING, INSPECTED, APPROVED, REJECTED, REFUND_PENDING_BANK, REFUNDED] }
                  count: { type: integer }
        stockMovements:
          type: array
          description: Stock-ledger rows of the warehouse in the range, per movement type.
          items:
            type: object
            required: [movementType, entries, qtyKg]
            properties:
              movementType: { type: string, enum: [RECEIPT, SALE, TRANSFER_OUT, TRANSFER_IN, ADJUSTMENT, WASTAGE, RETURN_IN, RESERVATION, RELEASE] }
              entries: { type: integer }
              qtyKg: { type: string, pattern: '^-?\d+\.\d{3}$', description: Signed sum of qty_delta., example: '-21.250' }

    SubWarehouseAdminCreate:
      type: object
      description: |
        No role, email, password, status, admin code or standby flag can be sent: the endpoint
        creates a SUB_WH_ADMIN only (BR-28) and the account sets its password through the
        forgot-password flow.
      additionalProperties: false
      required: [fullName, mobile]
      properties:
        fullName: { type: string, minLength: 1, maxLength: 120 }
        mobile: { type: string, pattern: '^\+[1-9][0-9]{7,14}$', description: E.164; the login identifier; never returned., example: '+919876500001' }
        warehouseId: { type: string, format: uuid, nullable: true, description: 'Required in effect: missing or null is 422 WAREHOUSE_REQUIRED (BR-25).' }

    SubWarehouseAdmin:
      type: object
      description: One live Sub Warehouse Admin assignment. No mobile number or email (BR-81).
      required: [userId, adminCode, fullName, status, warehouseId, assignedAt]
      properties:
        userId: { type: string, format: uuid }
        adminCode: { type: string, nullable: true, description: 'Generated, for example SWA-001; null only for an admin created outside this endpoint without a profile.', example: SWA-001 }
        fullName: { type: string }
        status: { type: string, enum: [PENDING, ACTIVE, DISABLED] }
        warehouseId: { type: string, format: uuid }
        assignedAt: { type: string, format: date-time }

    SubWarehouseAdminList:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SubWarehouseAdmin' }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        total: { type: integer }

    Problem:
      type: object
      description: |
        RFC 9457 problem detail. Every non-2xx response in this API uses this shape with
        media type `application/problem+json`.

        `code` is the stable, machine-readable discriminator — clients switch on it, never
        on `title` or `detail`, which are human-facing and may be reworded or localized.

        Generic codes (the transport-level half of `ProblemCode` in
        `packages/shared-types/src/errors.ts`): `BAD_REQUEST`, `VALIDATION_FAILED`,
        `UNAUTHENTICATED`, `FORBIDDEN`, `NOT_FOUND`, `CONFLICT`, `PAYLOAD_TOO_LARGE`,
        `RATE_LIMITED`, `INTERNAL`.

        Any endpoint that takes a body can also answer `400 BAD_REQUEST` when the body
        cannot be read (invalid JSON, a corrupt compressed body), `415 BAD_REQUEST` for an
        unsupported charset or `Content-Encoding`, and `413 PAYLOAD_TOO_LARGE` when it
        exceeds the 1 MB limit. These are returned before authentication and never echo
        the request body.

        Domain codes — every one of these exists in the `ErrorCode` union in
        `packages/shared-types/src/errors.ts`, and `pnpm spec:drift` fails the build if
        this list and that file disagree:

        * `CERT_EXPIRED` — the farmer holds no verified, unexpired certificate (one has expired, or the farmer's market block is set); listings are blocked (BR-01).
        * `CERT_UNVERIFIED` — the farmer holds no verified, unexpired certificate and an unexpired one is awaiting admin verification (BR-02).
        * `CERT_MISSING` — the farmer holds no verified, unexpired PGS or NPOP certificate and none is pending or expired: no certificate on file, or only rejected ones; listings are blocked (BR-02).
        * `PRICE_ABOVE_CEILING` — a listing price exceeds the fair price ceiling (BR-07).
        * `RETAIL_ABOVE_CEILING` — a retail price exceeds the fair price ceiling (BR-09).
        * `FREE_TIER_LIMIT` — the free-tier listing quota is exhausted; a subscription is required (BR-14).
        * `LISTING_NOT_PENDING` — the listing is no longer editable or actionable.
        * `COUNTER_LIMIT_REACHED` — all 3 counter rounds have been used (BR-11).
        * `COUNTER_OFFER_EXPIRED` — the 24-hour counter-offer window has closed (BR-10).
        * `SELF_APPROVAL_FORBIDDEN` — an actor may not approve their own submission (BR-29, BR-37).
        * `WAREHOUSE_SCOPE_VIOLATION` — a Sub Warehouse Admin reached outside their warehouse (BR-30).
        * `WAREHOUSE_REQUIRED` — a warehouse-scoped role was created without a warehouse (BR-25).
        * `WALLET_INSUFFICIENT` — wallet-first checkout needs a top-up (BR-17).
        * `CASH_LIMIT_EXCEEDED` — cash top-up above INR 10,000 (BR-19).
        * `FISCAL_TAG_REQUIRED` — a cash top-up arrived without its fiscal cash tag (BR-18).
        * `DUAL_APPROVAL_REQUIRED` — a payout above INR 10,000 needs a second approval (BR-31).
        * `SAME_ACTOR_APPROVAL` — the initiator may not also approve (BR-31).
        * `STOCK_UNAVAILABLE` — not enough sellable stock for the requested quantity.
        * `INSUFFICIENT_ALLOCATION` — the channel's allocated quantity is used up (BR-12).
        * `ALLOCATION_SUM_INVALID` — the channel percentages do not sum to 100 (BR-12).
        * `CART_LOCK_EXPIRED` — the 24-hour cart reservation lapsed (BR-22).
        * `OTP_INVALID` — the supplied OTP did not match (BR-20, BR-32).
        * `OTP_EXPIRED` — the OTP challenge is past its validity window (BR-32).
        * `OTP_LOCKED` — three failed attempts; a new challenge is required (BR-32).
        * `OTP_RESEND_TOO_SOON` — a resend was requested inside the 60-second window (BR-32).
        * `OTP_SMS_DELIVERY_FAILED` — the configured SMS provider rejected or failed to send the OTP (BR-32).
        * `AUDIT_QUARTER_TAKEN` — that farmer already has a non-cancelled audit in this fiscal year and quarter (BR-03).
        * `SCORE_OUT_OF_RANGE` — a rating or audit category score is out of range (BR-06).
        * `AUDIT_INCOMPLETE` — an audit cannot be completed because one or more of its 10 category scores is missing; a missing category is incomplete, not zero (BR-06).
        * `FIELD_LOCKED` — Aadhaar or mobile may only be changed by a Super Admin (BR-33).
        * `INVALID_STATE_TRANSITION` — the entity is not in a state that permits this operation.
        * `IDEMPOTENCY_KEY_REUSED` — the key was reused with a different payload.
        * `WEATHER_PROVIDER_ERROR` — the upstream weather provider was unreachable or misconfigured.
        * `OAUTH_TOKEN_INVALID` — Google/Facebook rejected, or could not verify, the provided token (BR-39).
        * `OAUTH_IDENTITY_ALREADY_LINKED` — that provider identity is already linked to a different account (BR-39).
        * `OAUTH_LINK_TOKEN_INVALID` — the `linkToken` passed to `/auth/otp/verify` is expired, malformed or tampered with (BR-39).
        * `DIARY_INVALID_SUB_ACTIVITY` — the sub-activity does not belong to the given activity category (BR-42).
        * `DIARY_NO_ACTIVE_CROP` — the plot has no farm_crops row in status GROWING (BR-42).
        * `DIARY_MINUTES_REQUIRED` — diary entry time-spent minutes is missing or not greater than zero (BR-42).
        * `DIARY_WORKER_HOURS_INVALID` — a diary workforce entry's hoursWorked is not greater than 0 and at most 24 (BR-44).
        * `DIARY_WAGE_RATE_INVALID` — a diary workforce entry's wageRatePaise is not a positive integer number of paise (BR-44).
        * `CROP_PLOT_ALREADY_GROWING` — the plot already has another live crop in status GROWING (BR-46).
        * `LIVESTOCK_ALREADY_EXITED` — the animal already has a lifecycle event recorded; it cannot leave the herd twice (BR-47).
        * `TRAINING_FULL` — the training workshop has reached full capacity (BR-59).
        * `SALE_PRICE_CHANGED` — a sale line price differs from the quote the client echoed back; re-quote and confirm (BR-89). HTTP 409.
        * `SALE_STOCK_CHANGED` — stock or the LIVE_MARKET allocation fell below a sale line quantity since the quote (BR-89, BR-95). HTTP 409.
        * `WALKIN_WALLET_NOT_ALLOWED` — a walk-in sale (no customer record) cannot be paid by WALLET (BR-86). HTTP 422.
        * `PAYMENT_PENDING` — the sale UPI payment is not yet confirmed (BR-94). HTTP 409.
        * `PAYMENT_AMOUNT_INSUFFICIENT` — CASH amount received is below the sale total (BR-94). HTTP 422.
        * `SALE_CHANNEL_NOT_SUPPORTED` — HORECA/B2B sale creation is not available in Track 1 (BR-13, BR-85). HTTP 501.
        * `COUNTER_SALE_NOT_REASSIGNABLE` — a DIRECT or MARKET counter sale (for example a UPI sale still awaiting payment) is bound to the warehouse that made it and cannot be reassigned (BR-85i). HTTP 409.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          description: A URI identifying the problem type; dereferences to human documentation.
          examples: [https://api.tohfa.in/problems/price-above-ceiling]
        title:
          type: string
          description: Short, human-readable summary. Stable per `type`, but not machine-parsed.
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: Repeats the HTTP status code.
        detail:
          type: [string, 'null']
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: [string, 'null']
          format: uri-reference
          description: URI reference identifying the specific occurrence.
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
          description: Machine-readable error code in SCREAMING_SNAKE_CASE. Switch on this.
          examples: [PRICE_ABOVE_CEILING, CART_LOCK_EXPIRED]
        traceId:
          type: string
          description: |
            Request correlation id: the same value the server returns in the `x-correlation-id`
            response header and writes on every log line for the request. Always quote this to
            support. Omitted only for an error rendered outside a request context. (Earlier
            revisions of this spec named this field `correlationId`; the server sends `traceId`,
            see `AppError.toProblem` in `apps/api/src/http/problem.ts`.)
          examples: ['01J9F1B2C3D4E5F6G7H8J9K0']
        errors:
          type: object
          description: |
            Per-field validation failures, present on 422 `VALIDATION_FAILED`. A map, not a list:
            each key is the dotted path of the offending input prefixed with the request part
            (`body.`, `query.`, `params.`), e.g. `body.expiresOn` or `body.items.2.qtyKg` (`body`
            alone when the whole body is wrong); each value is a non-empty list of English,
            human-readable messages for that input. Clients bind errors to form fields by key and
            should treat the message text as a display fallback, never parse it.
          additionalProperties:
            type: array
            minItems: 1
            items: { type: string }
          examples:
            - body.expiresOn: ['Must be a real calendar date in YYYY-MM-DD format']
              body.certNumber: ['String must contain at least 1 character(s)']
        meta:
          type: object
          additionalProperties: true
          description: Extra machine-readable context for some codes, e.g. `ceilingPrice` and `attemptedPrice` on `PRICE_ABOVE_CEILING`.

    PageMeta:
      type: object
      description: Cursor pagination envelope. Cursors are opaque and must not be parsed or constructed by clients.
      required: [nextCursor, hasMore]
      properties:
        nextCursor:
          type: [string, 'null']
          description: Pass back as `cursor` to fetch the next page; null on the last page.
        hasMore: { type: boolean }

    SignUploadRequest:
      type: object
      description: |
        Request body shared by `POST /uploads/sign` (an authenticated user signing an upload)
        and `POST /farmers/applications/{id}/uploads/sign` (its registration-scoped, auth-free
        sibling for an applicant who has no account yet).
      required: [purpose, contentType, sizeBytes]
      properties:
        purpose:
          type: string
          enum: [FARMER_DOCUMENT, CERTIFICATE, LISTING_PHOTO, GRN_PHOTO, QC_PHOTO, POD_PHOTO, PROFILE_PHOTO, ISSUE_PHOTO, DIARY_PHOTO, DIARY_VOICE_NOTE, SOIL_TEST_REPORT, PEST_PHOTO, WORKER_PHOTO, WORKER_ID_PROOF, AUDIT_REPORT, WAREHOUSE_DOCUMENT]
        contentType: { type: string, examples: [image/jpeg, application/pdf] }
        sizeBytes: { type: integer, minimum: 1, maximum: 26214400 }
        fileName: { type: string, maxLength: 200 }

    SignedUploadTarget:
      type: object
      description: |
        A pre-signed direct-upload target, returned by `POST /uploads/sign` and its
        registration-scoped sibling `POST /farmers/applications/{id}/uploads/sign`.
      required: [id, uploadUrl, fileUrl, storageKey, method, expiresAt]
      properties:
        id: { type: string, format: uuid, description: The `uploads` table row id this signed target was recorded against. Pass this back as e.g. `photoUploadId`/`labReportUploadId`/`idProofUploadId` when creating the parent record (a pest detection, a soil test, a worker, etc.) so it can be linked to this upload. }
        uploadUrl: { type: string, format: uri }
        fileUrl: { type: string, format: uri, description: The durable URL to send back to the API once the upload completes. }
        storageKey: { type: string, description: The key this upload was minted under — pass it back to whatever endpoint needs to reference the finished upload (e.g. attaching a diary photo, a listing photo, etc.). }
        method: { type: string, enum: [PUT, POST] }
        headers: { type: object, additionalProperties: { type: string } }
        expiresAt: { type: string, format: date-time }
        resumable: { type: boolean }

    Money:
      type: string
      pattern: '^-?[0-9]{1,10}(\.[0-9]{1,2})?$'
      description: |
        A monetary amount in INR as a **decimal string**, e.g. `"1820.50"`.

        Money is a string, never a JSON number, because IEEE-754 doubles cannot represent
        decimal fractions exactly: JavaScript clients silently turn `0.1 + 0.2` into
        `0.30000000000000004`, and a wallet ledger that must reconcile to the paisa
        cannot tolerate that. Serialising as a string preserves the exact value the
        server computed with `NUMERIC(12,2)` and forces clients to use a decimal library
        rather than accidental float arithmetic. Negative values are permitted only on
        ledger rows, where they denote a debit.
      examples: ['1820.50', '-412.00', '0.00']

    Quantity:
      type: string
      pattern: '^-?[0-9]{1,9}(\.[0-9]{1,3})?$'
      description: A weight in kilograms as a decimal string with up to 3 decimal places. String for the same reason as `Money`.
      examples: ['250.000', '1.500']

    Mobile:
      type: string
      pattern: '^\+91[6-9][0-9]{9}$'
      description: Indian mobile number in E.164.
      examples: ['+919876543210']

    Locale:
      type: string
      enum: [en, ta]
      default: en
      description: English (primary) or Tamil.

    Grade:
      type: string
      enum: [GRADE_1, GRADE_2, GRADE_3, REJECT]
      description: Produce grade. `REJECT` is never sellable and never appears on the customer surface.

    CertificationType:
      type: string
      enum: [PGS, NPOP, OTHER]
      description: |
        PGS Organic, NPOP, or OTHER (any other organic certification — e.g. Jaivik
        Bharat, USDA Organic, EU Organic — entered as free text in `issuingBody`). The
        farmer app's certification-type picker already offered these other schemes
        under `OTHER` before the backend accepted the value; `OTHER` was added here to
        match, not to introduce new client behaviour.

    OrderStatus:
      type: string
      enum: [CONFIRMED, PACKED, DISPATCHED, OUT_FOR_DELIVERY, DELIVERED, CANCELLED]

    CounterOfferStatus:
      type: string
      enum: [PENDING, ACCEPTED, REJECTED, COUNTERED, LAPSED]
      description: A `PENDING` offer becomes `LAPSED` automatically 24 hours after creation (BR-10); a lapse is neither an acceptance nor a rejection.

    ApplicationStatus:
      type: string
      enum: [DRAFT, SUBMITTED, DOCS_REVIEW, FARM_VERIFICATION, AUDIT, INFO_REQUESTED, APPROVED, REJECTED]
      description: The fixed farmer application timeline.

    ListingStatus:
      type: string
      enum: [DRAFT, PENDING_APPROVAL, COUNTER_OFFERED, ACCEPTED, REJECTED, WITHDRAWN, EXPIRED, FULFILLED]

    PurchaseOrderStatus:
      type: string
      enum: [ISSUED, PARTIALLY_RECEIVED, RECEIVED, CANCELLED]

    BatchStatus:
      type: string
      enum: [ACTIVE, DEPLETED, EXPIRED, WRITTEN_OFF]

    StockTxnType:
      type: string
      enum: [RECEIPT, SALE, TRANSFER_OUT, TRANSFER_IN, ADJUSTMENT, WASTAGE, RETURN_IN, RESERVATION, RELEASE]

    WalletTransactionType:
      type: string
      enum: [TOPUP_CASH, TOPUP_DIGITAL, ORDER_DEBIT, ORDER_REFUND, PAYOUT_DEBIT, SALE_CREDIT, SUBSCRIPTION_DEBIT, ADJUSTMENT]

    AllocationChannel:
      type: string
      enum: [ONLINE, LIVE_MARKET, RESERVE, BUFFER]
      description: |
        The four allocation buckets of BR-12 — ONLINE 70%, LIVE_MARKET 10%,
        RESERVE 10% (marriages and functions), BUFFER 10%. B2B and Horeca draw from
        BUFFER and RESERVE; they are sales channels, not allocation buckets.

    SalesChannel:
      type: string
      enum: [ONLINE, MARKET, HORECA, B2B, DIRECT]
      description: '`DIRECT` is an at-counter sale at a sub-warehouse (owner decision D2, BR-85); `MARKET` is a live market-day sale (BR-95).'

    InvoiceType:
      type: string
      enum: [SALE_RETAIL, SALE_B2B, PURCHASE_FARMER, PAYOUT, SUBSCRIPTION]

    PayoutStatus:
      type: string
      enum: [REQUESTED, PENDING_APPROVAL, APPROVED, PROCESSING, PAID, FAILED, REVERSED]

    FulfillmentType:
      type: string
      enum: [HOME_DELIVERY, WAREHOUSE_PICKUP]
      description: Every order supports warehouse pickup (BR-21); delivery is contested — see `docs/rules.md` open contradiction 3.

    DeliverySlot:
      type: string
      enum: [MORNING_8_12, AFTERNOON_12_4, EVENING_4_8]

    PaymentMethod:
      type: string
      enum: [WALLET, UPI, CARD, NETBANKING, COD]
      description: Wallet is the primary method (BR-17). COD availability is configuration-gated.

    CustomerRegistrationRequest:
      type: object
      required: [mobile, fullName, password]
      properties:
        mobile: { $ref: '#/components/schemas/Mobile' }
        fullName: { type: string, minLength: 2, maxLength: 120 }
        email: { type: [string, 'null'], format: email }
        password: { type: string, minLength: 10, maxLength: 128 }
        preferredLocale: { $ref: '#/components/schemas/Locale' }
        preferredWarehouseId: { type: [string, 'null'], format: uuid }

    RegistrationAccepted:
      type: object
      required: [userId, status, otpExpiresAt]
      properties:
        userId: { type: string, format: uuid }
        status: { type: string, enum: [PENDING_OTP] }
        otpExpiresAt: { type: string, format: date-time }
        resendAvailableAt: { type: string, format: date-time }

    OtpSendRequest:
      type: object
      required: [mobile, purpose]
      properties:
        mobile: { $ref: '#/components/schemas/Mobile' }
        purpose: { type: string, enum: [REGISTRATION, LOGIN, PASSWORD_RESET] }

    OtpChallenge:
      type: object
      required: [challengeId, expiresAt, attemptsRemaining]
      properties:
        challengeId: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }
        resendAvailableAt: { type: string, format: date-time, description: 60 seconds after dispatch (BR-32). }
        attemptsRemaining: { type: integer, maximum: 3, description: Lockout at 0 (BR-32). }

    OtpVerifyRequest:
      type: object
      required: [challengeId, code]
      properties:
        challengeId: { type: string, format: uuid }
        code: { type: string, pattern: '^[0-9]{6}$' }
        deviceId: { type: string, maxLength: 120 }
        platform: { type: string, enum: [ios, android, web] }
        linkToken:
          type: string
          description: |
            BR-39, optional. The `linkToken` returned by `POST /auth/oauth/{provider}`'s
            NOT_LINKED response, identifying which verified provider identity to link once this
            OTP verification succeeds. Omitted on a plain mobile+OTP verify.

    OtpVerifyResponse:
      description: |
        `TokenPair`, plus BR-39's additive/optional `oauthProfile` — present only when the
        request carried a `linkToken`, so the mobile client can prefill Step 1 of its
        registration stepper without a second API call.
      allOf:
        - $ref: '#/components/schemas/TokenPair'
        - type: object
          properties:
            oauthProfile: { $ref: '#/components/schemas/OAuthProfile' }

    LoginRequest:
      type: object
      required: [mobile, password]
      properties:
        mobile: { $ref: '#/components/schemas/Mobile' }
        password: { type: string, minLength: 1, maxLength: 128 }
        roleCode:
          type: string
          description: Required on the second call when the account holds multiple admin roles.
          enum: [SUPER_ADMIN, TOHFA_ADMIN, FARMER_ADMIN, MAIN_WH_ADMIN, SUB_WH_ADMIN]
        deviceId: { type: string, maxLength: 120 }
        platform: { type: string, enum: [ios, android, web] }
        rememberDevice: { type: boolean, default: false }

    TokenPair:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: integer, description: Access token lifetime in seconds. }
        requiresRoleSelection: { type: boolean, default: false }
        availableRoles:
          type: array
          items: { $ref: '#/components/schemas/RoleAssignment' }
        user: { $ref: '#/components/schemas/CurrentUser' }

    RoleAssignment:
      type: object
      required: [code]
      properties:
        code:
          type: string
          enum: [SUPER_ADMIN, TOHFA_ADMIN, FARMER_ADMIN, MAIN_WH_ADMIN, SUB_WH_ADMIN]
        warehouseId: { type: [string, 'null'], format: uuid, description: Set, and required, for SUB_WH_ADMIN (BR-30). }
        warehouseName: { type: [string, 'null'] }
        zoneId: { type: [string, 'null'], format: uuid, description: Scopes a Farmer Admin's own-zone grants (e.g. audit.view). }

    CurrentUser:
      type: object
      required: [id, fullName, userType]
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        mobile: { $ref: '#/components/schemas/Mobile' }
        email: { type: [string, 'null'], format: email }
        userType: { type: string, enum: [farmer, customer, admin, delivery_partner] }
        preferredLocale: { $ref: '#/components/schemas/Locale' }
        status: { type: string, enum: [PENDING, ACTIVE, DISABLED], description: Account status (BR-67 additive field). }
        createdAt: { type: string, format: date-time, description: When the account was created (BR-67 additive field). }
        lastLoginAt: { type: [string, 'null'], format: date-time, description: Last successful login; null when the user has never logged in (BR-67 additive field). }
        roles: { type: array, items: { $ref: '#/components/schemas/RoleAssignment' } }
        permissions:
          type: array
          description: Resolved permission codes from rbac.json. Advisory for UI gating only; the server re-checks every request.
          items: { type: string }

    MySession:
      type: object
      description: One of the caller's own live sessions (BR-67). Secrets (token hashes, device ids, push tokens) are never part of this shape.
      required: [id, platform, userAgent, issuedAt, lastSeenAt, lastSeenIp, expiresAt]
      properties:
        id: { type: string, format: uuid }
        platform: { type: [string, 'null'], enum: [ios, android, web, null] }
        userAgent: { type: [string, 'null'] }
        issuedAt: { type: string, format: date-time }
        lastSeenAt: { type: [string, 'null'], format: date-time }
        lastSeenIp: { type: [string, 'null'], description: The caller's own last-seen IP address, as stored. }
        expiresAt: { type: string, format: date-time }

    OAuthProvider:
      type: string
      enum: [google, facebook]
      description: The only two social-login providers TOHFA recognises (BR-39).

    OAuthLoginRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: A Google ID token, or a Facebook access token, depending on the `:provider` path segment.
        deviceId: { type: string, maxLength: 120 }
        platform: { type: string, enum: [ios, android, web] }
        roleCode:
          type: string
          description: Required on the second call when the linked account holds multiple admin roles.
          enum: [SUPER_ADMIN, TOHFA_ADMIN, FARMER_ADMIN, MAIN_WH_ADMIN, SUB_WH_ADMIN]

    OAuthProfile:
      type: object
      description: |
        Whatever of these the provider actually returned. `email` and `photoUrl` are usually
        present; `fullName` usually is; none are guaranteed (BR-39).
      properties:
        fullName: { type: string, nullable: true }
        email: { type: string, format: email, nullable: true }
        photoUrl: { type: string, format: uri, nullable: true }

    OAuthNotLinkedResponse:
      type: object
      description: Returned by `POST /auth/oauth/{provider}` when the verified identity has no linked account yet (BR-39). No account is created; no tokens are issued.
      required: [status, profile, linkToken]
      properties:
        status: { type: string, enum: [NOT_LINKED] }
        profile: { $ref: '#/components/schemas/OAuthProfile' }
        linkToken:
          type: string
          description: Short-lived (10 minute), single-use, server-signed token. Pass to `POST /auth/otp/verify` to complete the link.

    OAuthLinkRequest:
      type: object
      required: [provider, token]
      properties:
        provider: { $ref: '#/components/schemas/OAuthProvider' }
        token:
          type: string
          description: A Google ID token, or a Facebook access token, matching `provider`.

    OAuthIdentity:
      type: object
      required: [provider, linkedAt]
      properties:
        provider: { $ref: '#/components/schemas/OAuthProvider' }
        email: { type: string, format: email, nullable: true }
        linkedAt: { type: string, format: date-time }

    FarmerApplicationStepPayload:
      type: object
      description: |
        Exactly one of the five step objects, matching the `step` path parameter:
        1 `personal`, 2 `farm`, 3 `location`, 4 `documents`, 5 `review`.
      properties:
        personal:
          type: object
          properties:
            fullName: { type: string, maxLength: 120 }
            dob: { type: string, format: date }
            gender: { type: string, enum: [MALE, FEMALE, OTHER] }
            farmingExperienceYears:
              type: integer
              minimum: 0
              maximum: 90
              deprecated: true
              description: |
                Legacy. Experience is collected in step 2 (`farm.experienceYears`); this is
                still accepted and still read on approval so applications that were in
                flight before the move are not silently zeroed.
            address: { type: string, maxLength: 300 }
            # BR-33b / Decision 8 (db/migrations/0003_farmers_and_farms.sql): the full
            # Aadhaar number is never accepted by this API at all -- not stored, not
            # returned, not logged. There is no server-side tokenization step in this
            # codebase; a raw 12-digit `aadhaarNumber` here was legacy/aspirational
            # documentation that no longer matches the implementation (updateStep
            # actively strips it if a client still sends one). Only the last 4 digits,
            # and an opaque token from an external KYC/tokenisation provider (if one is
            # ever integrated upstream of this API), are accepted.
            aadhaarLast4:
              type: string
              pattern: '^[0-9]{4}$'
              writeOnly: true
              description: Last 4 digits only, for human matching in the KYC queue. Never the full number (BR-33b).
            aadhaarToken:
              type: string
              writeOnly: true
              description: |
                Opaque reference from an external KYC/tokenisation provider, if one has
                already tokenized the farmer's Aadhaar upstream of this API. Not a
                reversible encoding of the number; this API never derives it from a raw
                Aadhaar itself (BR-33b).
        farm:
          type: object
          description: |
            The single farming operation — asked once, never repeated per parcel.
          properties:
            farmName:
              type: string
              minLength: 1
              maxLength: 120
              description: |
                The name of the whole farming operation, e.g. "Great Earth Organic". Asked once,
                for the operation. This is NOT a parcel name: each step-3 location carries its own
                `label` ("Home plot", "River plot"), and it is that label — never this — that
                becomes a `farms` row's name on approval. Stored as given in `step2_farm_details`;
                it has no column of its own. Farm-identifying, so it never reaches a customer
                response (BR-16).
            typeOfFarming: { type: string }
            experienceYears:
              type: integer
              minimum: 0
              maximum: 120
              description: |
                Years of farming experience. Collected here, on the operation, and written to
                `farmers.farming_experience_years` on approval.
            totalAreaAcres:
              type: number
              exclusiveMinimum: 0
              description: |
                The farmer's STATED total land holding, typically taken from their patta/chitta
                land records. It may legitimately differ from the sum of the step-3 `locations[].areaAcres`,
                which are measured on the ground: unmarked land, stale records or an inflated
                claim all show up as a gap. The server stores the claim as given — it is never
                derived from, reconciled against, or validated to match the parcel sum, and a
                mismatch never blocks submission. The discrepancy is signal for FARM_VERIFICATION.
            numberOfFarms:
              type: integer
              minimum: 1
              description: |
                The farmer's STATED count of separate plots, taken from the same land records as
                `totalAreaAcres`. It may legitimately differ from the number of step-3 `locations`,
                which are the plots actually marked on the ground — a farmer who states 3 plots but
                has marked 2 is exactly what FARM_VERIFICATION is there to look at. Stored as given
                in `step2_farm_details`: never derived from `locations.length`, never validated to
                match it, and never blocking. It has no column of its own and does not decide how
                many farms are created on approval — that count comes from the step-3 locations.
            waterSource: { type: string }
            primaryCrops: { type: array, items: { type: string } }
        location:
          type: object
          required: [locations]
          properties:
            locations:
              type: array
              minItems: 1
              description: |
                The land locations of the one farming operation — one labelled parcel per
                entry, each with its own acreage and its own GPS/FMB boundary. Their
                `areaAcres` sum is shown beside the farmer's stated `farm.totalAreaAcres`
                so any gap is visible; it never overwrites it.
              items:
                type: object
                required: [id, label, areaAcres]
                properties:
                  id: { type: string, minLength: 1, maxLength: 100, description: Client-generated key for this location. }
                  label: { type: string, minLength: 1, maxLength: 120, description: Farmer-facing name for the parcel, e.g. "Home plot". }
                  areaAcres: { type: number, exclusiveMinimum: 0, description: Farmer-stated acreage of this parcel. }
                  gpsCaptured: { type: boolean, description: False when the farmer fell back to manual lat/lng entry. }
                  latitude: { type: number, minimum: -90, maximum: 90 }
                  longitude: { type: number, minimum: -180, maximum: 180 }
                  calculatedAreaAcres: { type: number, minimum: 0, description: Server-derived from the polygon; overwrites any client value. }
                  calculatedAreaHectares: { type: number, minimum: 0 }
                  fmbPolygon:
                    type: object
                    description: GeoJSON Polygon of the Farm Map Boundary drawn on the map.
                    properties:
                      type: { type: string, enum: [Polygon] }
                      coordinates:
                        type: array
                        items: { type: array, items: { type: array, items: { type: number }, minItems: 2, maxItems: 2 } }
                  village: { type: string }
                  taluk: { type: string }
                  district: { type: string }
        documents:
          type: object
          properties:
            idProofUrl: { type: string, format: uri, description: Mandatory. }
            farmDocUrl: { type: string, format: uri, description: Mandatory. }
            certificateUrl: { type: [string, 'null'], format: uri, description: Optional at application time. }
        review:
          type: object
          properties:
            declarationAccepted: { type: boolean }
            signatureUrl: { type: [string, 'null'], format: uri }

    FarmerApplication:
      type: object
      required: [id, status, mobile, fullName, completedSteps, createdAt]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ApplicationStatus' }
        mobile: { $ref: '#/components/schemas/Mobile' }
        fullName: { type: string }
        tohfaFarmerId: { type: [string, 'null'], description: Issued on approval, format TOHFA-F-YYYY-XXXX. }
        completedSteps: { type: array, items: { type: integer, minimum: 1, maximum: 5 } }
        data: { $ref: '#/components/schemas/FarmerApplicationStepPayload' }
        zoneId: { type: [string, 'null'], format: uuid }
        submittedAt: { type: [string, 'null'], format: date-time }
        decidedAt: { type: [string, 'null'], format: date-time }
        decidedBy: { type: [string, 'null'], format: uuid }
        rejectionReason: { type: [string, 'null'] }
        infoRequest: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }

    FarmerApplicationSummary:
      type: object
      required: [id, status, fullName, submittedAt]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ApplicationStatus' }
        fullName: { type: string }
        village: { type: [string, 'null'] }
        zoneId: { type: [string, 'null'], format: uuid }
        areaAcres: { type: [number, 'null'] }
        submittedAt: { type: [string, 'null'], format: date-time }
        slaDueAt: { type: [string, 'null'], format: date-time, description: 3-5 working days from submission. }
        documentsComplete: { type: boolean }

    ApplicationStatusTimeline:
      type: object
      required: [applicationId, status, steps]
      properties:
        applicationId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ApplicationStatus' }
        submittedAt: { type: [string, 'null'], format: date-time }
        expectedDecisionBy: { type: [string, 'null'], format: date-time }
        steps:
          type: array
          items:
            type: object
            required: [status, reachedAt]
            properties:
              status: { $ref: '#/components/schemas/ApplicationStatus' }
              reachedAt: { type: string, format: date-time }
              note: { type: [string, 'null'] }

    FarmerProfile:
      type: object
      required: [id, tohfaFarmerId, fullName, mobile, kycStatus]
      properties:
        id: { type: string, format: uuid }
        tohfaFarmerId: { type: string, examples: [TOHFA-F-2026-0114] }
        fullName: { type: string }
        mobile:
          allOf: [{ $ref: '#/components/schemas/Mobile' }]
          readOnly: true
          description: Locked field (BR-33).
        aadhaarLast4:
          type: [string, 'null']
          pattern: '^[0-9]{4}$'
          readOnly: true
          description: Locked field; the full number is never returned (BR-33).
        dob: { type: [string, 'null'], format: date, description: Calendar date (YYYY-MM-DD) copied from registration at approval; null if never supplied. }
        gender:
          type: [string, 'null']
          enum: [MALE, FEMALE, OTHER, UNDISCLOSED, null]
          description: Matches the farmers.gender CHECK constraint; null if never supplied.
        farmingExperienceYears: { type: [integer, 'null'] }
        address: { type: [string, 'null'] }
        zoneId: { type: [string, 'null'], format: uuid }
        kycStatus: { type: string, enum: [PENDING, VERIFIED, REJECTED] }
        overallRating: { type: [number, 'null'], description: Farm rating, 10 categories x 10 points. }
        ratingTier: { type: [string, 'null'], enum: [POOR, MODERATE, GOOD, EXCELLENT, null] }
        subscriptionTier: { type: string, enum: [FREE, PAID] }
        subscriptionValidTo: { type: [string, 'null'], format: date }
        isMarketBlocked: { type: boolean, description: True while a certificate is expired or unverified (BR-01, BR-02). }
        marketBlockReason: { type: [string, 'null'] }
        preferredLocale: { $ref: '#/components/schemas/Locale' }

    FarmerBankAccount:
      type: object
      description: |
        A bank account payout destination. Account numbers are always masked to the last 4 digits (BR-53a).
      required: [id, accountHolderName, bankName, isVerified, isDefault, createdAt]
      properties:
        id: { type: string, format: uuid }
        accountHolderName: { type: string }
        accountNumberLast4:
          type: [string, 'null']
          pattern: '^[0-9]{4}$'
          description: Last 4 digits only. Never the full account number.
        ifsc:
          type: [string, 'null']
          pattern: '^[A-Z]{4}0[A-Z0-9]{6}$'
        bankName:
          type: [string, 'null']
          description: Null for a UPI destination, which is not a bank account.
        branchName: { type: [string, 'null'] }
        upiVpa: { type: [string, 'null'] }
        isVerified: { type: boolean }
        isDefault: { type: boolean }
        createdAt: { type: string, format: date-time }

    CreateFarmerBankAccountRequest:
      type: object
      required: [accountHolderName, accountNumber, ifsc, bankName]
      properties:
        accountHolderName: { type: string, minLength: 2, maxLength: 120 }
        accountNumber:
          type: string
          minLength: 9
          maxLength: 18
          pattern: '^[0-9]{9,18}$'
          description: Digits only. Only the last 4 are kept; the full number is never stored or returned.
        ifsc:
          type: string
          pattern: '^[A-Za-z]{4}0[A-Za-z0-9]{6}$'
          description: Case-insensitive; stored and returned upper-case.
        bankName: { type: string, minLength: 2, maxLength: 120 }
        branchName: { type: string, maxLength: 120 }
        isDefault: { type: boolean, default: false }

    UpdateFarmerBankAccountRequest:
      type: object
      properties:
        accountHolderName: { type: string, minLength: 2, maxLength: 120 }
        accountNumber: { type: string, minLength: 9, maxLength: 18, pattern: '^[0-9]{9,18}$' }
        ifsc:
          type: string
          pattern: '^[A-Za-z]{4}0[A-Za-z0-9]{6}$'
          description: Case-insensitive; stored and returned upper-case.
        bankName: { type: string, minLength: 2, maxLength: 120 }
        branchName: { type: [string, 'null'], maxLength: 120 }
        isDefault: { type: boolean }

    FarmerUpiPreference:
      type: object
      required: [id, upiVpa, isVerified, isDefault]
      properties:
        id: { type: string, format: uuid }
        upiVpa: { type: string }
        isVerified: { type: boolean }
        isDefault: { type: boolean }

    UpdateFarmerUpiRequest:
      type: object
      required: [upiVpa]
      properties:
        upiVpa:
          type: string
          pattern: '^[a-zA-Z0-9.\-_]{2,256}@[a-zA-Z]{2,64}$'
        isDefault:
          type: boolean
          description: Applied only when sent. Omitted keeps the current default flag.
    FarmerDocumentItem:
      type: object
      required:
        - docType
        - displayName
        - uploadStatus
        - readUrl
      properties:
        docType:
          type: string
          description: |
            Standard slot (ID_PROOF, LAND_PATTA, CERTIFICATE, SOIL_CARD) or, for any further
            recognised application upload, that upload's own docType.
          example: ID_PROOF
        displayName:
          type: string
          description: Human-readable title of the document.
          example: Aadhaar Card
        uploadStatus:
          type: string
          enum: [VERIFIED, UPLOADED, PENDING, ACTION_NEEDED]
          description: |
            VERIFIED only when a verified record exists for the uploaded file itself (a verified
            farmer_documents row, or a verified certificate with its file). UPLOADED when a file is on
            record but not verified. PENDING when no file is on record. ACTION_NEEDED for the soil card
            slot, which no upload flow can fill yet.
          example: UPLOADED
        readUrl:
          type: [string, 'null']
          format: uri
          description: |
            Short-lived (15 minute) signed read URL, or null when there is no file. Only files
            recorded as this farmer's own are ever signed.
        fileName:
          type: [string, 'null']
          description: The stored file's name, or the name the applicant supplied; null when unknown.
        docSubType:
          type: [string, 'null']
          description: Sub-type recorded with the document (e.g. Patta, or the certificate type); null when none is recorded.
          example: Aadhaar Card
        documentNumberLast4:
          type: [string, 'null']
          pattern: '^[0-9]{4}$'
          description: Masked document number (last 4 digits only, Aadhaar slot).
          example: '4821'
        uploadedAt:
          type: [string, 'null']
          format: date-time
          description: Timestamp when the document was uploaded.
        verifiedAt:
          type: [string, 'null']
          format: date-time
          description: Timestamp when the document was verified by an admin.

