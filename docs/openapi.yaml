      description: >-
        Transitions support ticket state and records history log (BR-60, BR-35). A transition to the ticket's
        current status (including CLOSED -> CLOSED) is rejected with 409 INVALID_STATE_TRANSITION, as is any
        edge outside the allowed matrix. Entering RESOLVED stamps resolvedAt; leaving RESOLVED for IN_PROGRESS
