        - { name: status, in: query, schema: { type: string, enum: [AWAITING_QC, ACCEPTED, PARTIALLY_ACCEPTED, REJECTED, COUNTER_OFFERED] } }
        - { name: purchaseOrderId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Paged goods receipts.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/GoodsReceipt' } }
                  page: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

    post:
      tags: [Purchase]
      operationId: createGoodsReceipt
      summary: Receive goods against a purchase order
      description: |
        Warehouse-side intake. `acceptedQtyKg + rejectedQtyKg` must not exceed
        `grossQtyKg`. The receipt is created in `AWAITING_QC`; stock only enters the
