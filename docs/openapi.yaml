  /farmers/me/plots/{plotId}/crops:
    get:
      tags: [Crops]
      operationId: listMyPlotCrops
      summary: A plot's planting history
      description: |
        Lists the caller's own `farm_crops` rows on the given plot, newest first,
        optionally filtered by status. A `plotId` the caller does not own returns
        an empty page, never a 403 or 404 (the same doctrine as farm-diary's
        BR-40a).
      x-permission: farmer.crops.view_own
      x-business-rules: [BR-46]
      parameters:
        - name: plotId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/FarmCropStatus' }
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paged planting records for the plot.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/FarmCrop' }
                  page: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Crops]
      operationId: createMyPlotCrop
      summary: Plant a new crop on an own plot
      description: |
        Creates a new `farm_crops` row on the given plot in status `PLANNED` (the
        column default). A `plotId` the caller does not own returns 404, never 403.
        `cropMasterId` must reference an existing crop type or the request is 404.
        Moving the new row into status `GROWING` — where BR-46 is checked — happens
        afterward via `PATCH /farmers/me/crops/{farmCropId}`.
      x-permission: farmer.crops.create_own
      x-business-rules: [BR-46]
      parameters:
        - name: plotId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FarmCropCreateRequest' }
      responses:
        '201':
          description: Crop planted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FarmCrop' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

