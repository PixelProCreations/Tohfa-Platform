      x-permission: farmer.workforce.manage_own
      x-business-rules: [BR-36, BR-41]
      parameters:
        - name: farmId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: workerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The worker's recorded payouts.
          content:
            application/json:
              schema:
                type: object
                required: [items]
