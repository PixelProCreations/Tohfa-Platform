        is available only once the audit is COMPLETED (409 `INVALID_STATE_TRANSITION`).
      x-permission: audit.report.generate
      x-business-rules: [BR-36]
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - { name: variant, in: query, schema: { type: string, enum: [generated, agency], default: generated } }
        - { name: redirect, in: query, schema: { type: boolean, default: false } }
        - name: token
          in: query
          description: Signature from a `redirect=true` link (HMAC over audit id, variant, audience and expiry). With `expires`, authorises this one download without a bearer token; never construct it client-side.
          schema: { type: string, maxLength: 128 }
        - name: expires
          in: query
          description: Expiry of a signed link, epoch milliseconds (5 minutes after it was issued).
          schema: { type: integer }
      responses:
        '200':
          description: The report file.
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '302':
          description: Redirect to a signed URL valid for 5 minutes.
          headers:
            Location: { schema: { type: string, format: uri } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farmers/me/diary/plots:
    get:
      tags: [Farm Diary]
      operationId: listMyDiaryPlots
      summary: Own plots available for diary entries
      description: |
        Lists the caller's own plots, for use as the plot picker when starting a new
        diary entry. Scoped to the caller's own farmer_id (BR-40).

        **Deliberate stub.** No plots/farms API exists yet, so this returns the same
        fixed fixture plots for every farmer until the plots module lands
        (farm-diary.service.ts). `POST /entries` does NOT use this fixture — it
        validates plot ownership against the real `plots`/`farms` tables, so a fixture
