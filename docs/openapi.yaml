  /admin/listings/{id}/approve:
    post:
      tags: [Marketing]
      operationId: approveListing
      summary: Approve a listing and raise the purchase order
      description: |
        Approval accepts the listing at its asking price (or at the accepted counter-offer
        price) and issues a purchase order to the destination warehouse. A Farmer Admin
        approving their own listing is refused with 403 `SELF_APPROVAL_FORBIDDEN`; the
        listing is auto-routed to another admin (BR-29).
      x-permission: listing.approve
      x-business-rules: [BR-07, BR-29]
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [warehouseId]
              properties:
                warehouseId: { type: string, format: uuid }
                expectedDeliveryDate: { type: string, format: date }
                note: { type: string, maxLength: 500 }
            example:
              warehouseId: 3f1b7c2e-2a44-4f0e-9b1a-6b0d2f0f1a01
              expectedDeliveryDate: '2026-08-22'
      responses:
        '200':
          description: Approved; the purchase order reference is returned.
          content:
            application/json:
              schema:
                type: object
                required: [listing, purchaseOrder]
                properties:
                  listing: { $ref: '#/components/schemas/Listing' }
                  purchaseOrder: { $ref: '#/components/schemas/PurchaseOrder' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Self-approval refused.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://api.tohfa.in/problems/self-approval-forbidden
                title: Self-approval is not permitted
                status: 403
                detail: A Farmer Admin cannot approve their own listing; it has been routed to another admin.
                code: SELF_APPROVAL_FORBIDDEN
                correlationId: 01J9F1B2C3D4E5F6G7H8J9K2
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/listings/{id}/reject:
    post:
      tags: [Marketing]
      operationId: rejectListing
      summary: Reject a listing
      description: |
        Rejects a pending listing with a reason the farmer sees. A Farmer Admin may not reject
        their own listing — it is auto-routed to another admin (BR-29).
      x-permission: listing.reject
      x-business-rules: [BR-29]
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reasonCode, reason]
              properties:
                reasonCode:
                  type: string
                  enum: [QUALITY_CONCERN, PRICE_UNACCEPTABLE, NO_DEMAND, CERT_ISSUE, DUPLICATE, OTHER]
                reason: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '200':
          description: Rejected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Listing' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/listings/{id}/counter-offers:
    post:
      tags: [Marketing]
      operationId: createCounterOffer
      summary: Send a counter-offer to the farmer
      description: |
        The worked example from the requirements: the farmer lists Grade 1 at INR 100/kg,
        the admin counters INR 75/kg for 75 kg. The farmer has 24 hours to respond
        (BR-10) and the pair may exchange at most 3 rounds (BR-11). A Farmer Admin may
        not counter their own listing (BR-29).
      x-permission: listing.counter_offer.send
      x-business-rules: [BR-07, BR-10, BR-11, BR-29]
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CounterOfferCreate' }
            example:
              pricePerKg: '75.00'
              quantityKg: '75.000'
              message: Grade 1 demand is soft this week; we can take 75 kg at this price.
      responses:
        '201':
          description: Counter-offer sent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CounterOffer' }
              example:
                id: e5f6a7b8-c9d0-4e1f-8a2b-3c4d5e6f7a8b
                listingId: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
                round: 1
                offeredBy: ADMIN
                pricePerKg: '75.00'
                quantityKg: '75.000'
                status: PENDING
                expiresAt: '2026-08-19T06:30:00Z'
                message: Grade 1 demand is soft this week; we can take 75 kg at this price.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: All 3 counter rounds have been used.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://api.tohfa.in/problems/counter-rounds-exhausted
                title: Counter rounds exhausted
                status: 409
                detail: This listing has already been countered 3 times; approve or reject it.
                code: COUNTER_LIMIT_REACHED
                correlationId: 01J9F1B2C3D4E5F6G7H8J9K3
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /listings/{id}/counter-offers/{offerId}/accept:
    post:
      tags: [Marketing]
      operationId: acceptCounterOffer
      summary: Farmer accepts the counter-offer
      description: Accepting fixes the final price and quantity and moves the listing to `ACCEPTED`. Past `expiresAt` this returns 409 `COUNTER_OFFER_EXPIRED` (BR-10).
      x-permission: listing.counter_offer.respond
      x-business-rules: [BR-10]
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - $ref: '#/components/parameters/OfferIdParam'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '200':
          description: Accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Listing' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }

  /listings/{id}/counter-offers/{offerId}/reject:
    post:
      tags: [Marketing]
      operationId: rejectCounterOffer
      summary: Farmer rejects the counter-offer
      description: |
        The farmer declines the counter-offer. The round closes and the listing returns to the
        admin queue for a further decision (BR-10).
      x-permission: listing.counter_offer.respond
      x-business-rules: [BR-10]
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - $ref: '#/components/parameters/OfferIdParam'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                message: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Rejected; the listing returns to the admin queue for a final decision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CounterOffer' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }

  /listings/{id}/counter-offers/{offerId}/counter:
