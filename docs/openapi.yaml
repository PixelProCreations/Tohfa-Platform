                  page: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WarehouseStaffForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/staff-attendance/staff/{staffId}/{date}:
    put:
      tags: [Warehouse Staff]
      operationId: markStaffAttendance
      summary: Mark or correct one staff member's attendance for a day
      description: |
        An upsert keyed by (staff member, day), so replaying it is safe and no Idempotency-Key is
        needed. 201 when this request created the day's row; 200 for a correction or an identical
        replay. A re-mark updates the SAME row in place; every change is kept in an append-only
        history written by the database (`GET .../history`), so nothing is silently lost. An
        identical replay writes no update, no history row and no audit row. A real change writes a
        `staff.attendance.mark` audit row with a masked image (ids, work date and statuses; never a
        name or note) in the same transaction.

        Rules (BR-84): `date` is an Asia/Kolkata calendar date and a FUTURE date is 422; a
        deactivated staff member is 409; a staff member outside the caller's warehouse scope (or
        unknown) is 404. `status` is exactly PRESENT, ABSENT or LEAVE (the three the designed
        screens show; no half day). `checkIn` and `checkOut` are allowed only for PRESENT, a
        `checkOut` needs a `checkIn` and cannot precede it. No edit window is enforced: none is
        stated by the owner.
      x-permission: admin.staff.attendance.mark
      x-business-rules: [BR-84]
      parameters:
        - { name: staffId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: date, in: path, required: true, schema: { type: string, format: date } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffAttendanceMark' }
      responses:
        '200':
          description: Correction or identical replay; the day's row.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffAttendance' }
        '201':
          description: The day's row was created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffAttendance' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WarehouseStaffForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/staff-attendance/staff/{staffId}/{date}/history:
    get:
      tags: [Warehouse Staff]
      operationId: getStaffAttendanceHistory
      summary: Change history of one attendance row
      description: |
        Every creation and change of the day's row, oldest first, with the previous and the new
        values and who changed it. 404 when the staff member has no row for the day or is outside
        the caller's scope (BR-84).
      x-permission: admin.staff.attendance.view
      x-business-rules: [BR-84]
      parameters:
        - { name: staffId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: date, in: path, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: The history.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffAttendanceHistory' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WarehouseStaffForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/staff-attendance/dates/{date}:
    put:
      tags: [Warehouse Staff]
      operationId: markStaffAttendanceBulk
      summary: Mark attendance for many staff members on one day
      description: |
        Applies up to 200 marks for one Asia/Kolkata day in ONE transaction: if any entry fails
        (unknown or out-of-scope staff 404, deactivated staff 409, future date 422) nothing is
        applied (BR-84). A staff member may appear once. Same per-entry semantics, history and audit
