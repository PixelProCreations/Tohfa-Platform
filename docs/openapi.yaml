          schema: { type: string, format: uuid }
        - name: plotId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: detectionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The pest detection.
          content:
