        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiaryCategoryUpdateRequest' }
      responses:
        '200':
          description: Updated category.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiaryCategory' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/diary/categories/{categoryKey}/sub-activities:
    post:
      tags: [Farm Diary]
      operationId: createDiarySubActivity
      summary: Create a sub-activity under a taxonomy category
      description: |
        Adds a new sub-activity beneath an existing category. `key` must be
        `<categoryKey>.<name>` (e.g. `land_prep.ploughing_tilling`) or the request is
        rejected with `VALIDATION_FAILED`; a `key` that already exists returns 409
