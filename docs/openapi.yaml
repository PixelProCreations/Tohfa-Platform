        '500': { $ref: '#/components/responses/ServerError' }

  /farmers/applications:
    post:
      tags: [Farmer Onboarding]
      operationId: createFarmerApplication
      summary: Create a draft farmer application
      description: |
        Creates the empty 5-step draft. Steps are then filled with
        `PATCH /farmers/applications/{id}/steps/{step}` in any order and submitted as a
        whole. A mobile number may hold at most one non-terminal application.
      security: []
      x-permission: public
      x-business-rules: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mobile, fullName]
              properties:
                mobile: { $ref: '#/components/schemas/Mobile' }
                fullName: { type: string, minLength: 2, maxLength: 120 }
                preferredLocale: { $ref: '#/components/schemas/Locale' }
            example: { mobile: '+919812345678', fullName: Murugan S, preferredLocale: ta }
      responses:
        '201':
          description: Draft created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FarmerApplication' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farmers/applications/{id}/steps/{step}:
    patch:
      tags: [Farmer Onboarding]
      operationId: updateFarmerApplicationStep
      summary: Save one step of the 5-step application
      description: |
        `step` is 1..5 — 1 personal, 2 farm details (the one farming operation), 3 location
        (the land locations of that operation: one labelled parcel per entry, each with its
        own acreage and its own GPS/FMB boundary — GPS auto-capture with a manual lat/lng
        fallback), 4 documents, 5 review. Each step is validated independently on save;
        cross-step validation happens at submit.
        Aadhaar and mobile become locked fields once the application is approved (BR-33).
      x-permission: farmer.application.manage_own
      x-business-rules: [BR-33]
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - name: step
          in: path
          required: true
          description: 1 personal, 2 farm, 3 location, 4 documents, 5 review.
          schema: { type: integer, minimum: 1, maximum: 5 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FarmerApplicationStepPayload' }
            example:
              farm:
                # Names the operation as a whole. The parcels below carry their own labels;
                # "Great Earth Organic" is never one of them.
                farmName: Great Earth Organic
                typeOfFarming: Mixed vegetables
                experienceYears: 12
                # Stated from land records. The step-3 parcels below total 3.6 acres;
                # the 0.4-acre gap is kept visible, not corrected away.
                totalAreaAcres: 4.0
                # Same land records say 3 plots, but only 2 are marked in step 3 below.
                # That gap is likewise kept as-is — it is what a verifier goes looking at.
                numberOfFarms: 3
                waterSource: Borewell
                primaryCrops: [Carrot, Cabbage]
              location:
                locations:
                  - id: loc-1
                    label: Home plot
                    areaAcres: 2.4
                    gpsCaptured: true
                    latitude: 11.4102
                    longitude: 76.6950
                    calculatedAreaAcres: 2.43
                    calculatedAreaHectares: 0.98
                    fmbPolygon:
                      type: Polygon
                      coordinates: [[[76.6948, 11.4100], [76.6953, 11.4100], [76.6953, 11.4105], [76.6948, 11.4105], [76.6948, 11.4100]]]
                    village: Ithalar
                    taluk: Ooty
                    district: Nilgiris
                  - id: loc-2
                    label: Kotagiri hill parcel
                    areaAcres: 1.2
                    gpsCaptured: false
                    latitude: 11.4256
                    longitude: 76.7360
                    village: Kotagiri
                    taluk: Kotagiri
                    district: Nilgiris
      responses:
        '200':
          description: Step saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FarmerApplication' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farmers/applications/{id}/uploads/sign:
    post:
      tags: [Farmer Onboarding]
      operationId: signFarmerApplicationUpload
      summary: Get a signed upload URL for a registration document, before an account exists
      description: |
        The registration-scoped sibling of `POST /uploads/sign`. A brand-new applicant filling
        in Step 4 of the 5-step application has no user account yet — that is the entire point
        of registration — so `POST /uploads/sign`'s `requireAuth` can never succeed for them.

        This endpoint is deliberately auth-free: possession of the application's own
        unguessable UUID is the credential, the same pattern `PATCH
        /farmers/applications/{id}/steps/{step}` already uses, and it stays scoped to a live
        (non-terminal) application — once APPROVED or REJECTED a real farmer account exists (or
        never will), and uploads move to the authenticated `POST /uploads/sign` path instead. A
        nonexistent id and a terminal-status id both return an identical 404, so a caller cannot
        enumerate an application's status through this endpoint (the same enumeration-prevention
        convention this module's BR-36 own-data checks use).

        The resulting upload is recorded with `uploadedBy: null`, `entityType:
        farmer_application`, `entityId: <id>` and `isPublic: false` — these are sensitive farm
        documents, ID proofs and certificates, never a public asset.
      security: []
      x-permission: public
      x-business-rules: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignUploadRequest' }
            example: { purpose: FARMER_DOCUMENT, contentType: application/pdf, sizeBytes: 481203, fileName: patta.pdf }
      responses:
        '201':
          description: Signed upload target.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignedUploadTarget' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farmers/applications/{id}/submit:
    post:
      tags: [Farmer Onboarding]
      operationId: submitFarmerApplication
      summary: Submit the application for review
      description: |
        Validates all 5 steps together and moves the application to `DOCS_REVIEW`.
        Mandatory documents are ID proof and farm documents; certification is optional at
        this stage but listings stay blocked until a certificate is verified (BR-02).
        Review SLA is 3-5 working days — an operational target, not a rules.md business rule.
      x-permission: farmer.application.submit_own
      x-business-rules: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '200':
          description: Submitted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FarmerApplication' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farmers/applications/{id}:
    get:
      tags: [Farmer Onboarding]
      operationId: getFarmerApplicationDraft
      summary: Full application draft (steps 1-4 field values)
      description: |
        Returns the application's full stored draft data -- everything saved so far via
        `PATCH /farmers/applications/{id}/steps/{step}` -- not just the lightweight status
        timeline `GET /farmers/applications/{id}/status` returns. A farmer who lost their
        local draft (app reinstalled, storage cleared, new device) uses this to recover it;
        `POST /farmers/applications`'s `409 Conflict` response carries this same
        `applicationId` in its `meta` when a live application already exists for the given
        mobile number, so a client can route straight here.

        Same auth posture as `/status`: possession of the application's own unguessable
        UUID is the credential before an account exists. A nonexistent id and an id owned
        by a different actor both return an identical 404 (BR-36-style enumeration
        prevention).
      x-permission: farmer.application.view_own
      x-business-rules: [BR-36]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Full application draft.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FarmerApplication' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farmers/applications/{id}/status:
    get:
      tags: [Farmer Onboarding]
      operationId: getFarmerApplicationStatus
      summary: Application status timeline
      description: Returns the fixed timeline Submitted -> Docs Review -> Farm Verification -> Audit -> Approved.
      x-permission: farmer.application.view_own
      x-business-rules: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Status timeline.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationStatusTimeline' }
              example:
                applicationId: 5d2c1b0a-9e8f-4d3c-8b7a-6f5e4d3c2b1a
                status: FARM_VERIFICATION
                submittedAt: '2026-08-12T04:10:00Z'
                expectedDecisionBy: '2026-08-19T04:10:00Z'
                steps:
                  - status: SUBMITTED
                    reachedAt: '2026-08-12T04:10:00Z'
                    note: null
                  - status: DOCS_REVIEW
                    reachedAt: '2026-08-13T09:22:00Z'
                    note: ID proof accepted
                  - status: FARM_VERIFICATION
                    reachedAt: '2026-08-15T05:40:00Z'
                    note: Field visit scheduled
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/farmer-applications:
