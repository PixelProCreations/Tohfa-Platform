      description: |
        Name order, cursor pagination. Warehouse-scoped (BR-83): Main, Super Admin and Tohfa Admin
        see all warehouses; `warehouseId` naming a warehouse outside the caller's scope is 404.
        `q` matches the name or the staff code, case-insensitively, with `%` and `_` taken literally.

        `admin.staff.list_view` is `none` for SUB_WH_ADMIN in docs/rbac.json, so a Sub Warehouse
        Admin gets 403 here. Owner decision 2026-10-11: a Sub Warehouse Admin cannot list staff,
        as the rules say (BR-83).
      x-permission: admin.staff.list_view
      x-business-rules: [BR-83]
      parameters:
        - { name: warehouseId, in: query, schema: { type: string, format: uuid } }
