        - $ref: '#/components/parameters/IdParam'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '200':
          description: The transfer, now `IN_TRANSIT`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseTransfer' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /warehouse-transfers/{id}/receive:
    post:
      tags: [Inventory]
      operationId: receiveWarehouseTransfer
      summary: Receive an in-transit transfer at its destination
      description: |
        Requires `transfer.inter_warehouse.receive` and an `Idempotency-Key`. Only from `IN_TRANSIT`
        (else 409 `INVALID_STATE_TRANSITION`), by a scope that reaches the DESTINATION warehouse: a
        Sub Warehouse Admin of the source gets 403 `WAREHOUSE_SCOPE_VIOLATION`, any other Sub admin
        (and an unknown id) 404.

        `lines` must give `qtyReceivedKg` for EVERY line exactly once (422 on `body.lines`, or on
        `body.lines.{i}.itemId` for a line of another transfer), from 0 to `qtySentKg` (more is 422
        on `body.lines.{i}.qtyReceivedKg`). Any short line sets `hasDiscrepancy` and then requires
        `receiptNote` (422 on `body.receiptNote`); the shortfall is not written off. For each line
        with a positive quantity a new `ACTIVE` destination batch is created (same crop, grade,
        cost and expiry as the source batch; code `<source batch code>/<transfer number>`) and one
        `TRANSFER_IN` ledger row adds the quantity. Status becomes `RECEIVED`. One masked
        `transfer.inter_warehouse.receive` audit row (never the receipt note).
      x-permission: transfer.inter_warehouse.receive
      x-business-rules: [BR-30, BR-35, BR-102]
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarehouseTransferReceive' }
      responses:
        '200':
          description: The transfer, now `RECEIVED`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseTransfer' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /warehouse-transfers/{id}/cancel:
    post:
      tags: [Inventory]
      operationId: cancelWarehouseTransfer
      summary: Cancel a transfer that is still waiting for approval
      description: |
        Requires `transfer.inter_warehouse.initiate` (BR-26). Only from `PENDING_APPROVAL`, when no
        stock has moved; an `IN_TRANSIT` or later transfer is 409 `INVALID_STATE_TRANSITION` (once
        dispatched it can only be received). `reason` is required. One masked
        `transfer.inter_warehouse.cancel` audit row (never the reason). An unknown id is 404.
      x-permission: transfer.inter_warehouse.initiate
      x-business-rules: [BR-26, BR-35, BR-102]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarehouseTransferCancel' }
      responses:
        '200':
          description: The transfer, now `CANCELLED`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseTransfer' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /warehouses/{id}/activity:
    get:
      tags: [Inventory]
      operationId: listWarehouseActivity
      summary: A warehouse's activity feed (read-only)
      description: |
        A read-only, newest-first merge of records that already exist for one warehouse (BR-104):
        `STOCK_MOVEMENT` (each stock-ledger row: `reference` = movement type, `qtyKg` = signed kg,
        `actorId` = created_by), `GOODS_RECEIPT` (each goods receipt at `received_at`: `reference` = GRN
        number, `status`, `qtyKg` = gross kg, `actorId` = received_by), `TRANSFER` (each transfer sent
        or received by the warehouse, at creation: `reference` = transfer number, current `status`,
        `direction` OUTBOUND/INBOUND relative to this warehouse, `actorId` = initiated_by), `ISSUE`
        (each BR-103 issue at creation: `reference` = issue number, current `status`, `severity`,
        `actorId` = reported_by), `RETURN` (each return request against the warehouse's orders, at
        creation: `reference` = return request id, `status`; no actor) and `DOCUMENT` (each BR-105
        document at creation: `reference` = document type, `status` = `ARCHIVED` when archived else
        null, `actorId` = uploaded_by). One `UNION ALL` query; there is no activity table.

        Order is `occurredAt DESC, type DESC (byte order), sourceId DESC`; keyset paging through the
        opaque `cursor` never repeats or skips an event. An event never carries a farmer id, customer
        data or free text (titles, notes, reasons).

        Requires `warehouse.activity.view` (Sub Warehouse Admin: own warehouse only). Another and an
        unknown warehouse are the same 404 `NOT_FOUND`. A malformed cursor, an unknown type, a bad
        date, `from` without `to` (or the reverse), `from > to`, a span above
        `system_config.report_max_range_days` (fallback 366), a `limit` outside 1-100 or an unknown
        query parameter is 422 `VALIDATION_FAILED`. Reading writes nothing.
      x-permission: warehouse.activity.view
      x-business-rules: [BR-30, BR-104]
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - name: type
          in: query
          required: false
          description: |
            One comma-separated parameter of one or more event types, e.g. `type=ISSUE,RETURN`
            (duplicates are ignored). A repeated `type` parameter is refused with 422. Omit for all six.
          schema:
            type: string
            pattern: '^(STOCK_MOVEMENT|GOODS_RECEIPT|TRANSFER|ISSUE|RETURN|DOCUMENT)(,(STOCK_MOVEMENT|GOODS_RECEIPT|TRANSFER|ISSUE|RETURN|DOCUMENT))*$'
          example: TRANSFER,ISSUE
        - name: from
          in: query
          required: false
          description: First Asia/Kolkata calendar day, inclusive. Give together with `to`.
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          description: Last Asia/Kolkata calendar day, inclusive. Give together with `from`; `from <= to`.
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: One page of activity events, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseActivityPage' }
              example:
                items:
                  - type: ISSUE
                    sourceId: 6c1d2f3a-7b8c-4d9e-8f01-23456789abcd
                    occurredAt: '2026-10-11T07:00:00.000001Z'
                    reference: ISS-000012
                    status: OPEN
                    severity: HIGH
                    qtyKg: null
                    direction: null
                    actorId: 0a1b2c3d-4e5f-4a6b-8c7d-8e9f0a1b2c3d
                  - type: STOCK_MOVEMENT
                    sourceId: 9f8e7d6c-5b4a-4392-8170-6f5e4d3c2b1a
                    occurredAt: '2026-10-10T08:00:00.000002Z'
                    reference: SALE
                    status: null
                    severity: null
                    qtyKg: '-20.250'
                    direction: null
                    actorId: 0a1b2c3d-4e5f-4a6b-8c7d-8e9f0a1b2c3d
                page: { nextCursor: WyIyMDI2LTEwLTEwVDA4OjAwOjAwLjAwMDAwMloiXQ, hasMore: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /warehouses/{id}/issues:
    get:
      tags: [Inventory]
      operationId: listWarehouseIssues
      summary: List a warehouse's operational issues
      description: |
        The operational issues (equipment, storage, quality, safety, staffing, other) of one
        warehouse, newest first (`createdAt` desc, then `id` desc), optionally filtered by `status`,
        `severity`, `category`, `assignedTo` and free text `q` (case-insensitive substring of the
        title or the issue number; `%` and `_` match literally). Requires `warehouse.issue.view`:
        a Sub Warehouse Admin reads only its own warehouse; another and an unknown warehouse return
        the same 404 `NOT_FOUND`, never 403 (BR-30, BR-103). Reading writes nothing.
      x-permission: warehouse.issue.view
      x-business-rules: [BR-30, BR-103]
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - { name: status, in: query, schema: { type: string, enum: [OPEN, IN_PROGRESS, RESOLVED, CLOSED] } }
        - { name: severity, in: query, schema: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] } }
        - { name: category, in: query, schema: { type: string, enum: [EQUIPMENT, STORAGE, QUALITY, SAFETY, STAFFING, OTHER] } }
        - { name: assignedTo, in: query, schema: { type: string, format: uuid } }
        - { name: q, in: query, schema: { type: string, minLength: 1, maxLength: 160 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: One page of issues.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseIssueList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Inventory]
      operationId: createWarehouseIssue
      summary: Report an operational issue in a warehouse
      description: |
        Creates an `OPEN` issue numbered `WI-000001`, `WI-000002`, ... with the caller as reporter.
        Requires `warehouse.issue.manage` (a Sub Warehouse Admin only in its own warehouse; another
        or an unknown warehouse is 404). An `assignedTo` must be an active user with a live role
        assignment whose role holds `warehouse.issue.manage` (`all` or `own`) and reaches THIS
        warehouse - with today's grants a live `SUPER_ADMIN`, `TOHFA_ADMIN` or `MAIN_WH_ADMIN`
        assignment, or a live `SUB_WH_ADMIN` assignment to THIS warehouse (BR-103 rule 4); anyone
        else (including an unknown user) is 422
        `VALIDATION_FAILED` on `body.assignedTo`. One `warehouse.issue.create` audit row is written
        in the same transaction with a masked image (issue number, category, severity, status,
        assignee id; never the title or description) (BR-35, BR-103).
      x-permission: warehouse.issue.manage
      x-business-rules: [BR-30, BR-35, BR-103]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarehouseIssueCreate' }
      responses:
        '201':
          description: Issue created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseIssue' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /warehouses/{id}/issues/{issueId}:
    get:
      tags: [Inventory]
      operationId: getWarehouseIssue
      summary: One operational issue with its comment thread
      description: |
        The issue and its comments, oldest first. Same scoping as the list: another or an unknown
        warehouse, and an issue id that is not in this warehouse, are 404 `NOT_FOUND` (BR-30, BR-103).
      x-permission: warehouse.issue.view
      x-business-rules: [BR-30, BR-103]
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - { name: issueId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The issue and its comments.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseIssueDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }
    patch:
      tags: [Inventory]
      operationId: updateWarehouseIssue
      summary: Edit, assign, progress, resolve, reopen or close an issue
      description: |
        At least one field is required. Status transitions: `OPEN -> IN_PROGRESS | RESOLVED`;
        `IN_PROGRESS -> OPEN | RESOLVED`; `RESOLVED -> CLOSED | IN_PROGRESS`; `CLOSED` is terminal.
        Any other move is 409 `INVALID_STATE_TRANSITION`, and a `CLOSED` issue accepts no PATCH at
        all (409). Moving to `RESOLVED` requires `resolutionNote` in the same request (422 without
        it) and records the caller as `resolvedBy` with `resolvedAt`. `resolutionNote` is accepted
        only when the issue is, or is being moved to, `RESOLVED` (422 otherwise); on a `RESOLVED`
        issue it corrects the note. Reopening (`RESOLVED -> IN_PROGRESS`) clears `resolvedBy`,
        `resolvedAt` and `resolutionNote`, so a later resolve needs a fresh note. Closing sets
        `closedAt` and keeps the note. `null` clears `description` and unassigns `assignedTo`; a new
        assignee follows the same rule as POST (422 otherwise). Every refusal is decided before
        anything is written. A request that changes nothing (including a same-status "transition")
        writes nothing and audits nothing; otherwise one `warehouse.issue.update` audit row is
        written in the same transaction with masked before/after images and the names of the changed
        fields (title, description and resolutionNote by name only) (BR-35, BR-103).
      x-permission: warehouse.issue.manage
      x-business-rules: [BR-30, BR-35, BR-103]
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - { name: issueId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarehouseIssueUpdate' }
      responses:
        '200':
          description: The issue after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseIssue' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /warehouses/{id}/issues/{issueId}/comments:
    post:
      tags: [Inventory]
      operationId: createWarehouseIssueComment
      summary: Add a comment to an issue
      description: |
        Appends a comment (the caller is the author) to the issue's thread. Comments are append-only:
        the database refuses UPDATE and DELETE, and there is no route to edit or remove one. A
        `CLOSED` issue takes no new comment (409 `INVALID_STATE_TRANSITION`). Same scoping as the
        other issue routes (404). One `warehouse.issue.comment` audit row is written in the same
        transaction with the masked issue image and `changedFields: [comments]`; never the comment
        body (BR-35, BR-103).
      x-permission: warehouse.issue.manage
      x-business-rules: [BR-30, BR-35, BR-103]
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - { name: issueId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarehouseIssueCommentCreate' }
      responses:
        '201':
          description: Comment added.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseIssueComment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /warehouses/{id}/documents:
    get:
      tags: [Inventory]
      operationId: listWarehouseDocuments
      summary: List a warehouse's documents
      description: |
        Compliance and property documents of one warehouse (licence, FSSAI, fire safety, lease,
        insurance, other). `status` is DERIVED at read time, never stored: `ARCHIVED` when archived;
        otherwise `EXPIRED` when `expiryDate` is before today (Asia/Kolkata), `EXPIRING_SOON` when it is
        within `system_config.warehouse_document_expiry_warning_days` days (boundary day included;
        fallback 30 when the row is missing or unusable), else `ACTIVE` (also with no expiry date).
        The `status` filter is applied with the same derivation, the same day and the same window as
        the response, which reports the window as `expiryWarningDays`. Archived documents are excluded
        unless `status=ARCHIVED`. `q` matches title or document number (wildcards are literal).
        Ordered by expiry date (soonest first, no expiry last), then title. List items carry no
        `fileUrl`. Requires `warehouse.document.view`: a Sub Warehouse Admin reads only its own
        warehouse; another and an unknown warehouse are the same 404 `NOT_FOUND` (BR-30, BR-105).
      x-permission: warehouse.document.view
      x-business-rules: [BR-30, BR-105]
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - { name: docType, in: query, schema: { type: string, enum: [LICENSE, FSSAI, FIRE_SAFETY, LEASE, INSURANCE, OTHER] } }
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, EXPIRING_SOON, EXPIRED, ARCHIVED] } }
        - { name: q, in: query, schema: { type: string, minLength: 1, maxLength: 120 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: One page of documents.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseDocumentList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Inventory]
      operationId: createWarehouseDocument
      summary: Add a document to a warehouse
      description: |
        Metadata over a file uploaded through `POST /uploads/sign` with purpose `WAREHOUSE_DOCUMENT`.
        `uploadId` must be a non-deleted upload the caller itself uploaded; an unknown, a deleted and
        another user's upload are the same 422 on `body.uploadId`. One upload backs at most one live
        document (409 `CONFLICT`). Dates are real `YYYY-MM-DD` days and `expiryDate >= issueDate`
        (422). Requires `warehouse.document.manage` (Super, Tohfa and Main Warehouse Admin; a Sub
        Warehouse Admin is 403, UNCONFIRMED). One `warehouse.document.create` audit row is written in
        the same transaction with a masked image (doc type, dates, upload id, archived flag; never the
        title or document number) (BR-35, BR-105).
      x-permission: warehouse.document.manage
      x-business-rules: [BR-30, BR-35, BR-105]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarehouseDocumentCreate' }
      responses:
        '201':
          description: Document created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseDocument' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /warehouses/{id}/documents/{documentId}:
    get:
      tags: [Inventory]
      operationId: getWarehouseDocument
      summary: One warehouse document, with a short-lived signed file URL
      description: |
        Same scoping as the list: another or an unknown warehouse, and a document id that is not in
        this warehouse, are 404 `NOT_FOUND`. The file is never public: `fileUrl` is a signed read URL
        valid for 15 minutes; `fileUrl` and `mimeType` are null when the backing upload has since been
        deleted. Archived documents are still readable (BR-30, BR-105).
      x-permission: warehouse.document.view
      x-business-rules: [BR-30, BR-105]
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The document.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseDocumentDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }
    patch:
      tags: [Inventory]
      operationId: updateWarehouseDocument
      summary: Edit a warehouse document or replace its file
      description: |
        Changes any of `docType`, `title`, `documentNumber`, `issueDate`, `expiryDate` (`null` clears
        the last three) and may replace the file (`uploadId`, a renewal; the same upload rule as POST,
        and the caller becomes `uploadedBy`). At least one field; strict body. The merged result must
        still satisfy `expiryDate >= issueDate` (422 on `body.expiryDate`). An archived document is 409
        `INVALID_STATE_TRANSITION`. A request that changes nothing writes and audits nothing;
        otherwise one `warehouse.document.update` audit row with masked before/after images and the
        names of the changed fields. Requires `warehouse.document.manage` (BR-35, BR-105).
      x-permission: warehouse.document.manage
      x-business-rules: [BR-30, BR-35, BR-105]
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarehouseDocumentUpdate' }
      responses:
        '200':
          description: The document after the edit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseDocument' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /warehouses/{id}/documents/{documentId}/archive:
    post:
      tags: [Inventory]
      operationId: archiveWarehouseDocument
      summary: Archive a warehouse document
      description: |
        Archives once (`archivedAt`, `archivedBy`); a repeat is a 200 no-op that writes and audits
        nothing. There is no delete and no un-archive (UNCONFIRMED). One `warehouse.document.archive`
        audit row with masked images is written in the same transaction. Requires
        `warehouse.document.manage` (BR-35, BR-105).
      x-permission: warehouse.document.manage
      x-business-rules: [BR-30, BR-35, BR-105]
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The archived document.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseDocument' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/sub-warehouse-admins:
    get:
      tags: [Inventory]
      operationId: listSubWarehouseAdmins
      summary: List Sub Warehouse Admin assignments
      description: |
        The live Sub Warehouse Admin assignments (no end, or ending in the future; soft-deleted
        users excluded), ordered by admin code, optionally for one `warehouseId`. A disabled admin is
        listed with status `DISABLED`. No mobile number or email is returned. Requires
        `admin.sub_wh_admin.create`, which the designed Manage Sub Warehouse Admins screen is gated
        on (Super, Tohfa and Main Warehouse Admin). A `warehouseId` outside the caller's scope, and
        an unknown one, are the same 404 `NOT_FOUND` (BR-30, BR-81).
      x-permission: admin.sub_wh_admin.create
      x-business-rules: [BR-25, BR-28, BR-30, BR-81]
      parameters:
        - { name: warehouseId, in: query, schema: { type: string, format: uuid } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: One page of assignments.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubWarehouseAdminList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Inventory]
      operationId: createSubWarehouseAdmin
      summary: Create a Sub Warehouse Admin for one warehouse
      description: |
        Creates a SUB_WH_ADMIN account and its assignment to exactly one warehouse. The role is
        fixed by this endpoint: the body cannot name one (422), so a Super, Tohfa or Main Warehouse
        Admin account cannot be created here (BR-28: Sub Warehouse Admins are created by Super
        Admin, Tohfa Admin or Main Warehouse Admin, `admin.sub_wh_admin.create`; every other role,
        a Sub Warehouse Admin included, is 403).

        A missing or null `warehouseId` is 422 `WAREHOUSE_REQUIRED` (BR-25); an unknown or
        inactive warehouse is 422 `VALIDATION_FAILED` on `body.warehouseId`; a warehouse outside
        the caller's scope is 404. A warehouse holds at most
        `system_config.sub_wh_admin_max_per_warehouse` live admins, disabled ones not counted
        (409 `CONFLICT`). UNCONFIRMED DEFAULT: BR-25 says "5 admins including standby" without
        saying whether the 5 is per warehouse or for the platform; the key is seeded with 5 and read
        per warehouse (the less restrictive reading), the owner decides. A mobile number that is
        already registered is 409 `CONFLICT` and is never echoed: an admin is never attached to an
        existing account.

        The account is created `ACTIVE` with NO password (like an approved farmer) and signs in
        only after the existing `POST /auth/forgot-password` and `POST /auth/reset-password` flow
        sets one. The admin code (`SWA-001` ...) is generated. `mobile` is required because it is
        the login identifier although the designed create wizard shows only name and warehouse.
        Account, admin profile, assignment and ONE `admin.sub_wh_admin.create` audit row (masked: role,
        warehouse and admin code; never the name or the mobile) are one transaction (BR-35, BR-81).
        Deactivation is not offered (the design shows no status-changing action).
      x-permission: admin.sub_wh_admin.create
      x-business-rules: [BR-25, BR-28, BR-30, BR-35, BR-81]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubWarehouseAdminCreate' }
      responses:
        '201':
          description: Sub Warehouse Admin created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubWarehouseAdmin' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farmers/applications:
    post:
      tags: [Farmer Onboarding]
      operationId: createFarmerApplication
      summary: Create a draft farmer application
      description: |
        Creates the empty 5-step draft. Steps are then filled with
        `PATCH /farmers/applications/{id}/steps/{step}` in any order and submitted as a
        whole. A mobile number may hold at most one non-terminal application.
      security: []
      x-permission: public
      x-business-rules: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mobile, fullName]
              properties:
                mobile: { $ref: '#/components/schemas/Mobile' }
                fullName: { type: string, minLength: 2, maxLength: 120 }
                preferredLocale: { $ref: '#/components/schemas/Locale' }
            example: { mobile: '+919812345678', fullName: Murugan S, preferredLocale: ta }
      responses:
        '201':
          description: Draft created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FarmerApplication' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farmers/applications/{id}/steps/{step}:
    patch:
      tags: [Farmer Onboarding]
      operationId: updateFarmerApplicationStep
      summary: Save one step of the 5-step application
      description: |
        `step` is 1..5 — 1 personal, 2 farm details (the one farming operation), 3 location
        (the land locations of that operation: one labelled parcel per entry, each with its
        own acreage and its own GPS/FMB boundary — GPS auto-capture with a manual lat/lng
        fallback), 4 documents, 5 review. Each step is validated independently on save;
        cross-step validation happens at submit.
        Aadhaar and mobile become locked fields once the application is approved (BR-33).
        The body is the step's own object, sent FLAT (the per-step keys in the schema below are
        the five possible bodies, not a wrapper). It is validated strictly (BR-69): an unknown
        key, a malformed `dob` / `aadhaarLast4`, a location without `id`/`label`/`areaAcres`,
        an out-of-range coordinate, an unclosed polygon ring, or an empty `locations` list is
        422 `VALIDATION_FAILED` with the field path, and nothing is saved. A draft may carry
        only some fields of a step.
      x-permission: farmer.application.manage_own
      x-business-rules: [BR-33, BR-69]
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - name: step
          in: path
          required: true
          description: 1 personal, 2 farm, 3 location, 4 documents, 5 review.
          schema: { type: integer, minimum: 1, maximum: 5 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FarmerApplicationStepPayload' }
            example:
              farm:
                # Names the operation as a whole. The parcels below carry their own labels;
                # "Great Earth Organic" is never one of them.
                farmName: Great Earth Organic
                typeOfFarming: Mixed vegetables
                experienceYears: 12
                # Stated from land records. The step-3 parcels below total 3.6 acres;
                # the 0.4-acre gap is kept visible, not corrected away.
                totalAreaAcres: 4.0
                # Same land records say 3 plots, but only 2 are marked in step 3 below.
                # That gap is likewise kept as-is — it is what a verifier goes looking at.
                numberOfFarms: 3
                waterSource: Borewell
                primaryCrops: [Carrot, Cabbage]
              location:
                locations:
                  - id: loc-1
                    label: Home plot
                    areaAcres: 2.4
                    gpsCaptured: true
                    latitude: 11.4102
                    longitude: 76.6950
                    calculatedAreaAcres: 2.43
                    calculatedAreaHectares: 0.98
                    fmbPolygon:
                      type: Polygon
                      coordinates: [[[76.6948, 11.4100], [76.6953, 11.4100], [76.6953, 11.4105], [76.6948, 11.4105], [76.6948, 11.4100]]]
                    village: Ithalar
                    taluk: Ooty
                    district: Nilgiris
                  - id: loc-2
                    label: Kotagiri hill parcel
                    areaAcres: 1.2
                    gpsCaptured: false
                    latitude: 11.4256
                    longitude: 76.7360
                    village: Kotagiri
                    taluk: Kotagiri
                    district: Nilgiris
      responses:
        '200':
          description: Step saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FarmerApplication' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farmers/applications/{id}/uploads/sign:
    post:
      tags: [Farmer Onboarding]
      operationId: signFarmerApplicationUpload
      summary: Get a signed upload URL for a registration document, before an account exists
      description: |
        The registration-scoped sibling of `POST /uploads/sign`. A brand-new applicant filling
        in Step 4 of the 5-step application has no user account yet — that is the entire point
        of registration — so `POST /uploads/sign`'s `requireAuth` can never succeed for them.

        This endpoint is deliberately auth-free: possession of the application's own
        unguessable UUID is the credential, the same pattern `PATCH
        /farmers/applications/{id}/steps/{step}` already uses, and it stays scoped to a live
        (non-terminal) application — once APPROVED or REJECTED a real farmer account exists (or
        never will), and uploads move to the authenticated `POST /uploads/sign` path instead. A
        nonexistent id and a terminal-status id both return an identical 404, so a caller cannot
        enumerate an application's status through this endpoint (the same enumeration-prevention
        convention this module's BR-36 own-data checks use).

        The resulting upload is recorded with `uploadedBy: null`, `entityType:
        farmer_application`, `entityId: <id>` and `isPublic: false` — these are sensitive farm
        documents, ID proofs and certificates, never a public asset.
      security: []
      x-permission: public
      x-business-rules: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignUploadRequest' }
            example: { purpose: FARMER_DOCUMENT, contentType: application/pdf, sizeBytes: 481203, fileName: patta.pdf }
      responses:
        '201':
          description: Signed upload target.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignedUploadTarget' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farmers/applications/{id}/submit:
    post:
      tags: [Farmer Onboarding]
      operationId: submitFarmerApplication
      summary: Submit the application for review
      description: |
        Validates all 5 steps together and moves the application to `DOCS_REVIEW`.
        Mandatory documents are ID proof and farm documents; certification is optional at
        this stage but listings stay blocked until a certificate is verified (BR-02).
        Review SLA is 3-5 working days — an operational target, not a rules.md business rule.
        An application with no farm location carrying a boundary or GPS position in step 3 is
        422 `VALIDATION_FAILED` naming the step (`meta.missingSteps`); stored step-3 data is
        re-validated, not trusted (BR-69).
      x-permission: farmer.application.submit_own
      x-business-rules: [BR-69]
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '200':
          description: Submitted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FarmerApplication' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farmers/applications/{id}:
    get:
      tags: [Farmer Onboarding]
      operationId: getFarmerApplicationDraft
      summary: Full application draft (steps 1-4 field values)
      description: |
        Returns the application's full stored draft data -- everything saved so far via
        `PATCH /farmers/applications/{id}/steps/{step}` -- not just the lightweight status
        timeline `GET /farmers/applications/{id}/status` returns. A farmer who lost their
        local draft (app reinstalled, storage cleared, new device) uses this to recover it;
        `POST /farmers/applications`'s `409 Conflict` response carries this same
        `applicationId` in its `meta` when a live application already exists for the given
        mobile number, so a client can route straight here.

        Same auth posture as `/status`: possession of the application's own unguessable
        UUID is the credential before an account exists. A nonexistent id and an id owned
        by a different actor both return an identical 404 (BR-36-style enumeration
        prevention).
      x-permission: farmer.application.view_own
      x-business-rules: [BR-36]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Full application draft.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FarmerApplication' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farmers/applications/{id}/status:
    get:
      tags: [Farmer Onboarding]
      operationId: getFarmerApplicationStatus
      summary: Application status timeline
      description: Returns the fixed timeline Submitted -> Docs Review -> Farm Verification -> Audit -> Approved.
      x-permission: farmer.application.view_own
      x-business-rules: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Status timeline.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationStatusTimeline' }
              example:
                applicationId: 5d2c1b0a-9e8f-4d3c-8b7a-6f5e4d3c2b1a
                status: FARM_VERIFICATION
                submittedAt: '2026-08-12T04:10:00Z'
                expectedDecisionBy: '2026-08-19T04:10:00Z'
                steps:
                  - status: SUBMITTED
                    reachedAt: '2026-08-12T04:10:00Z'
                    note: null
                  - status: DOCS_REVIEW
                    reachedAt: '2026-08-13T09:22:00Z'
                    note: ID proof accepted
                  - status: FARM_VERIFICATION
                    reachedAt: '2026-08-15T05:40:00Z'
                    note: Field visit scheduled
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/farmer-applications:
    get:
      tags: [Farmer Onboarding]
      operationId: listFarmerApplications
      summary: Admin review queue
      description: Super Admin and TOHFA Admin get full access; a Farmer Admin sees the queue read-only.
      x-permission: farmer.application.list_pending
      x-business-rules: []
      parameters:
