        phosphorusPct: { type: number, minimum: 0, maximum: 100 }
        potassiumPct: { type: number, minimum: 0, maximum: 100 }
        applicationMethod: { type: string, maxLength: 100 }
        costInr: { $ref: '#/components/schemas/CropInputCost' }
