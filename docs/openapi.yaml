      parameters:
        - { $ref: '#/components/parameters/IdParam' }
      responses:
        '200':
          description: The voucher.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseVoucher' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/tasks:
    get:
      tags: [Platform]
      operationId: listAdminTasks
      summary: Open work items for the caller's warehouse scope (derived)
      description: |
        UNCONFIRMED DESIGN (owner decision pending, BR-77): tasks are NOT stored. Each call derives them
        live from existing records inside the caller's warehouse scope (a Sub Warehouse Admin sees only
        their warehouse; Main, Tohfa Admin and Super Admin see all four), so a task disappears the moment
        the underlying record changes state. Sources:
        `RETURN_INSPECTION` (return request `PENDING`), `RETURN_APPROVAL` (`INSPECTED`; BR-61),
        `GOODS_RECEIPT_QC` (goods receipt `AWAITING_QC`), `ORDER_PACK` (order `CONFIRMED`),
        `ORDER_DISPATCH` (order `PACKED`), `ORDER_PICKUP_OTP` (order `READY_FOR_PICKUP`).
        Return requests carry no warehouse of their own; the order they were filed against decides it.
        NOT built, because the data or a rule is missing (owner must decide): tasks for farmer listings and
        counter-offers (a listing has no warehouse until a purchase order exists, so it cannot be scoped to
        one); a priority, an assignee and an "in progress" state (the designs show them but no field or rule
        defines them; no priority is invented). `dueOn` is the order's `delivery_date` where one exists, else
        null: no due date is invented. Titles are stable machine keys (`titleKey`) plus `params`; the client
        translates, and no user-facing English is returned. Newest first (`createdAt`, then `itemKey`),
        cursor pagination. Each task shows this caller's own state only: `OPEN`, or `DONE` with `state=done`.
        A `warehouseId` filter naming a warehouse the caller cannot see, or that does not exist, is 404, never
        an empty list. Listing also forgets this caller's stored state for items whose condition has cleared (BR-78).
        INTERIM permission: `task.own.view` is a spec gap added to docs/rbac.json (owner approval pending).
      x-permission: task.own.view
      x-business-rules: [BR-77, BR-78]
      parameters:
        - { name: type, in: query, schema: { $ref: '#/components/schemas/TaskType' } }
        - { name: warehouseId, in: query, schema: { type: string, format: uuid } }
        - { name: state, in: query, description: '`open` (default) lists tasks the caller has not marked done; `done` lists those it has, while their condition still holds.', schema: { type: string, enum: [open, done], default: open } }
        - { $ref: '#/components/parameters/CursorParam' }
        - { $ref: '#/components/parameters/LimitParam' }
      responses:
        '200':
          description: Paged tasks.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/TaskItem' } }
                  page: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/tasks/summary:
    get:
      tags: [Platform]
      operationId: getAdminTaskSummary
      summary: Count of open tasks per type (badges)
      description: |
        Counts the tasks `GET /admin/tasks` would list with `state=open`, per type, for the caller's scope;
        every type is present, with 0 when none. Tasks the caller marked done are not counted. Same scope,
        derivation and `warehouseId` rules (404 outside the scope) as the list (BR-77). The design shows count
        badges; nothing beyond open counts is invented.
      x-permission: task.own.view
      x-business-rules: [BR-77]
      parameters:
        - { name: warehouseId, in: query, schema: { type: string, format: uuid } }
      responses:
