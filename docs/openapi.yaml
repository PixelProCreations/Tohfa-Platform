      parameters:
        - name: entryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiaryPhotoAttachRequest' }
      responses:
        '201':
          description: Photo attached.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiaryPhoto' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farmers/me/diary/entries/{entryId}/photos/{photoId}:
    delete:
      tags: [Farm Diary]
      operationId: deleteMyDiaryEntryPhoto
