          description: Crop input soft-deleted.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farmers/me/crops/{farmCropId}/milestones:
    get:
      tags: [Crops]
      operationId: listMyCropMilestones
      summary: List growth milestones for a crop
      description: |
        Returns ordered growth milestones and completion progress for a crop. Auto-initializes from templates if uninitialized (BR-57b):
        the crop's own templates if it has any, otherwise the universal ones. That first call is the only GET that writes; it takes the
        farmer lock and writes one `crop_milestone.initialize` audit row, and later calls write nothing (BR-57e).
      x-permission: farmer.crop_milestone.manage_own
      x-business-rules: [BR-57, BR-36]
      parameters:
        - name: farmCropId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: List of crop milestones with progress percentage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CropMilestonesListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farmers/me/crops/{farmCropId}/milestones/initialize:
    post:
      tags: [Crops]
      operationId: initializeMyCropMilestones
      summary: Initialize crop milestones from templates
      description: |
        Explicitly populates the growth milestones a crop is missing from reference templates (BR-57b). It never
        resets or overwrites an existing milestone. Answers 201 and writes one `crop_milestone.initialize` audit
        row only when it inserted milestones; when every stage already exists it answers 200 and writes nothing (BR-57e).
      x-permission: farmer.crop_milestone.manage_own
      x-business-rules: [BR-57, BR-36, BR-35]
      parameters:
        - name: farmCropId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Nothing to initialize; the existing milestones are returned unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CropMilestonesListResponse'
        '201':
          description: Milestones initialized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CropMilestonesListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farmers/me/crops/{farmCropId}/milestones/{id}:
    patch:
      tags: [Crops]
      operationId: updateMyCropMilestone
      summary: Update status or notes for a crop milestone
      description: |
        Marks a milestone as COMPLETED or SKIPPED, recording completion date and notes (BR-57c). A `completedOn` in the
        future (Asia/Kolkata) is 422 `VALIDATION_FAILED` whatever the status (BR-57a); both dates must be real calendar dates.
      x-permission: farmer.crop_milestone.manage_own
      x-business-rules: [BR-57, BR-36, BR-35]
      parameters:
        - name: farmCropId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCropMilestoneRequest'
      responses:
        '200':
          description: Updated milestone.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CropMilestone'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farmers/me/crop-milestone-templates:
    get:
      tags: [Crops]
      operationId: listCropMilestoneTemplates
      summary: List reference milestone templates
      description: |
        Returns available growth milestone templates (BR-57b). With `cropMasterId`, the crop's own templates if it has any,
        otherwise the universal ones (never a mix of both); without it, the universal templates.
      x-permission: farmer.crop_milestone.manage_own
      x-business-rules: [BR-57]
      parameters:
        - name: cropMasterId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: List of milestone templates.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CropMilestoneTemplate'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farmers/me/calendar:
    get:
      tags: [Calendar & Events]
      operationId: getMyFarmerCalendar
      summary: Consolidated farmer operational calendar
      description: |
        Returns chronological events across audits, certificate expiries, crop harvests,
        and published platform events within the specified date range (BR-58).

        `from` and `to` are real calendar dates (`2026-02-30` is 422), `from <= to`, and
        `to` may be at most `system_config.calendar_max_range_days` (seeded 366) days after
        `from`; a wider span is 422 `VALIDATION_FAILED` on `query.to`. Audit days are
        Asia/Kolkata days: an audit at 20:00 UTC on the 9th appears on the 10th.
      x-permission: farmer.calendar.view_own
      x-business-rules: [BR-58, BR-36]
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Consolidated calendar items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/platform-events:
    get:
      tags: [Calendar & Events]
