        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Farm Workforce]
      operationId: createMyWorker
      summary: Add a worker to a farm's roster
      description: |
        Adds a worker to one of the caller's own farms. `payRatePaise` must be a
        positive integer (BR-41a) — never a float. `idProofUploadId`/
        `photoUploadId`, when supplied, must reference an upload
        (`POST /uploads/sign` with `purpose: WORKER_ID_PROOF` / `WORKER_PHOTO`)
