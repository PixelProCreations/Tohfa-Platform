          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinanceExpenseReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/finance/daily-summary:
    get:
      tags: [Finance]
      operationId: getDailyCashSummary
      summary: The computed cash figures of one warehouse day (BR-74)
      description: |
        COMPUTED on every call, not stored. For one warehouse and one Asia/Kolkata calendar day
        (`[date 00:00 IST, next day 00:00 IST)`):

        - `cashSales`: completed, paid orders with payment method CASH (the BR-63 revenue definition,
          restricted to CASH), dated by `completed_at`.
        - `cashTopUps`: successful CASH wallet top-ups processed at this warehouse that day. The
          design's Daily Cash Summary lists them as cash in.
        - `cashExpenses`: every CASH expense dated that day, never soft-deleted. Expenses are only
          recorded (BR-62: there is no approval or cancellation), so no status is excluded.
        - `openingCash`: the counted cash of the latest earlier close of this warehouse (`openingFrom`
          is that close's date), `0.00` and null when there is none.
        - `expectedClosing` = `openingCash + cashSales + cashTopUps - cashExpenses`, in exact decimal
          arithmetic and never typed in by the admin.

        `closed` is the stored close of this warehouse day, or null while the day is open. The design
        also shows "Other cash in / out" and a per-transaction breakdown; no data source defines them,
        so they are not built.

        A Sub Warehouse Admin defaults to their own warehouse (another one is 404); a caller not
        confined to a warehouse (Main, Super Admin, Tohfa Admin) must send `warehouseId` (422), an
        existing active warehouse (422).
      x-permission: finance.cash_close.manage
      x-business-rules: [BR-74]
      parameters:
        - { name: date, in: query, required: true, description: 'A real YYYY-MM-DD date (Asia/Kolkata calendar day).', schema: { type: string, format: date } }
        - { name: warehouseId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The computed figures and the stored close, if any.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DailyCashSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/finance/cash-close:
    post:
      tags: [Finance]
      operationId: createCashClose
      summary: Close a warehouse day with the counted cash (BR-74)
      description: |
        Stores the system figures of `GET /admin/finance/daily-summary` as they stand at this moment
        together with the `countedCash`, `difference = countedCash - expectedClosing` (negative means
        the cash is short), an optional `note` (the design's "Difference Reason") and `closedBy` = the
        caller. The admin types in only the counted cash and the note.

        UNCONFIRMED DEFAULTS (owner approval pending; permission `finance.cash_close.manage` is a
        documented spec gap): the difference is recorded and never judged: there is no tolerance, no
        maximum and no reason requirement, because the design shows none. A day closes ONCE: a second
        close of the same warehouse and date is 409 `CONFLICT`, and a close can never be updated or
        deleted (the table is append-only); how a mistaken close is corrected is for the owner to
        define. A future day (Asia/Kolkata) is 422 on `body.date`. Closing an earlier day after a
        later one is allowed and recorded with its own opening cash.

        Requires `Idempotency-Key` (422 when missing or blank). Replaying the same key with the same
        request returns the original close with 200 and writes no second row or audit row; the same key
        with a different request is 409 `IDEMPOTENCY_KEY_REUSED`. A `finance.cash_close.manage` audit
        row with a masked image (no note text) is written in the same transaction.

        Warehouse rules as for the daily summary.
      x-permission: finance.cash_close.manage
      x-business-rules: [BR-74]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKeyHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CashCloseCreate' }
      responses:
        '200':
          description: Idempotent replay; the original close.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashClose' }
        '201':
          description: Day closed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashClose' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }
    get:
      tags: [Finance]
      operationId: listCashCloses
      summary: Closed warehouse days
      description: |
        Warehouse-scoped like the expenses: a Sub Warehouse Admin sees only their warehouse, Main, Super
        Admin and Tohfa Admin see all four; a `warehouseId` outside the caller's scope yields an empty
        set. Newest day first, cursor pagination; `from` / `to` are inclusive close dates.
      x-permission: finance.cash_close.manage
      x-business-rules: [BR-74]
      parameters:
        - { name: warehouseId, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, description: 'Inclusive close date. Must be <= `to`.', schema: { type: string, format: date } }
        - { name: to, in: query, description: Inclusive close date., schema: { type: string, format: date } }
        - { $ref: '#/components/parameters/CursorParam' }
        - { $ref: '#/components/parameters/LimitParam' }
      responses:
        '200':
          description: Paged closes.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/CashClose' } }
                  page: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/finance/cash-close/{id}:
    get:
      tags: [Finance]
      operationId: getCashClose
      summary: One closed warehouse day
      description: 404, not 403, when the close is absent or belongs to a warehouse outside the caller's scope.
      x-permission: finance.cash_close.manage
      x-business-rules: [BR-74]
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
      responses:
        '200':
          description: The close.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashClose' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/warehouse-staff:
    post:
      tags: [Warehouse Staff]
      operationId: createWarehouseStaff
      summary: Add a warehouse staff member
      description: |
        Creates a floor staff record (BR-83). Staff are NOT users: no login, no password, no role.
        A caller not confined to one warehouse (Main Warehouse Admin, Super Admin, Tohfa Admin) must
        send `warehouseId`, an existing active warehouse (422 otherwise); a caller confined to a
        warehouse defaults to it and naming another is 404. `staffCode` (`STF-0001`...) is assigned
        by the server. `phone` is personal data: it is never written to a log or an audit image.
        A `staff.create` audit row with a masked image (id, staff code, warehouse, status; never
        name, phone or designation) is written in the same transaction.

        A Sub Warehouse Admin gets 403: it cannot list staff, so it cannot add them either (owner
        decision 2026-10-11, BR-83). A Main Warehouse Admin with no assigned warehouse reaches all
        four warehouses (confirmed by the owner 2026-10-11).

        UNCONFIRMED DEFAULTS (the owner has not defined a warehouse staff roster): `admin.staff.manage`
        is a documented spec gap whose grants copy `admin.staff.list_view` (Sub = none); the field
        set is the one the designed Staff screens show; `phone` is 10 to 15 digits with an optional
        leading `+`; there is no payroll, salary or pay-rate field.
      x-permission: admin.staff.manage
      x-business-rules: [BR-83]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarehouseStaffCreate' }
      responses:
        '201':
          description: Staff member created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseStaff' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WarehouseStaffForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }
    get:
      tags: [Warehouse Staff]
      operationId: listWarehouseStaff
