  /admin/goods-receipts/{id}/quality-check:
    post:
      tags: [Purchase]
      operationId: recordQualityCheck
      summary: Record the 5-point quality check
      description: |
        The assigned grade may differ from the listed grade, which triggers a price
        adjustment. On `ACCEPTED` or `PARTIALLY_ACCEPTED` an inventory batch is created
        and a `RECEIPT` row is appended to the stock ledger (BR-37). A `REJECT` grade is
        never sellable.
      x-permission: inventory.quality_check.perform
      x-business-rules: [BR-30, BR-37]
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
        - { $ref: '#/components/parameters/IdempotencyKeyHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QualityCheckCreate' }
            example:
              assignedGrade: GRADE_2
              outcome: PARTIALLY_ACCEPTED
              acceptedQtyKg: '220.000'
              rejectedQtyKg: '30.000'
              moisturePct: 12.4
              visualScore: 7
              defectNotes: Minor surface bruising on 30 kg.
              priceAdjustment: '-4.00'
              storageLocation: A-04-R2
      responses:
        '201':
          description: Quality check recorded; batch created when stock was accepted.
          content:
            application/json:
              schema:
                type: object
                required: [qualityCheck]
                properties:
                  qualityCheck: { $ref: '#/components/schemas/QualityCheck' }
                  batch: { $ref: '#/components/schemas/Batch' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

