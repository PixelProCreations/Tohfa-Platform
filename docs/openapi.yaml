          description: Open task counts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/tasks/{itemKey}/done:
    post:
      tags: [Platform]
      operationId: markAdminTaskDone
      summary: Mark a task done in the caller's own list
      description: |
        UNCONFIRMED DEFAULT (owner decision pending): "done" only hides the work item from THIS user's open
        list (BR-78); it does not change the underlying record, and it is not an audit event (own list
        preference, like marking a message read, BR-65), so no `audit_log` row is written. Replaying it is
        harmless. The mark is forgotten once the task's condition clears, because the record has then moved
        on. `itemKey` is `<TYPE>:<uuid>` exactly as `GET /admin/tasks` returned it, in lower-case canonical
        form; any other shape, or the key of an alert, is 422. 404 (never 403) when the item is not a task
        in the caller's scope right now: another warehouse's, never derived, or already cleared.
        INTERIM permission: `task.own.view` (spec gap, owner approval pending).
      x-permission: task.own.view
      x-business-rules: [BR-77, BR-78]
      parameters:
        - { name: itemKey, in: path, required: true, schema: { type: string, maxLength: 200 } }
      responses:
        '200':
          description: The caller's state for the task.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskAlertState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/alerts:
    get:
      tags: [Platform]
      operationId: listAdminAlerts
      summary: Live warehouse alerts for the caller's scope (derived)
      description: |
        UNCONFIRMED DESIGN (owner decision pending, BR-77): alerts are NOT stored; each call derives the
        current signals inside the caller's warehouse scope (Sub: own warehouse only; Main, Tohfa Admin,
        Super Admin: all four). Types: `BATCH_NEAR_EXPIRY` (an ACTIVE batch with stock left whose
        `expiry_on` is on or before today in Asia/Kolkata plus `system_config.alert_batch_expiry_days`;
        already-expired batches still ACTIVE are included), `LOW_STOCK` (the summed `qty_available` of the
        ACTIVE batches of one warehouse + crop + grade is below `system_config.low_stock_threshold_kg`;
        the grouping is a working default, the key exists but no document defines "low"),
        `CAPACITY_NEAR_FULL` (a warehouse with a capacity whose used share, ACTIVE batches as in
        `GET /warehouses/{id}/capacity`, is at least `system_config.alert_capacity_utilization_percent`).
        `alert_batch_expiry_days` (7) and `alert_capacity_utilization_percent` (90) are PLACEHOLDER values
        added by migration 0052; the client must confirm them. When a threshold row is missing or unusable
        that alert type is not raised; no constant stands in for it. No severity is returned (no document
        defines one). `since` is when the condition began where a timestamp exists (batch alerts), null for
        the point-in-time ones (`LOW_STOCK`, `CAPACITY_NEAR_FULL`). NOT built (owner must decide): an
        expense "approval required" alert (no role may approve expenses, so it could never clear); a goods
        receipt quantity-mismatch alert (needs a tolerance and partial-receipt rule); a cash top-up SMS
        failure alert (no code path ever clears it). Messages are stable machine keys (`messageKey`) plus
        `params`; no user-facing English. Newest `since` first, cursor pagination. Per-caller state:
        `state=active` (default) lists alerts the caller has not dismissed or snoozed, plus those whose
        snooze has ended; `state=snoozed` lists the ones still snoozed; dismissed alerts are in neither.
        A `warehouseId` the caller cannot see, or that does not exist, is 404. Listing forgets this
        caller's stored state for alerts whose condition has cleared, so a condition that returns starts
        un-dismissed (BR-78). INTERIM permission: `alert.own.view` is a spec gap added to docs/rbac.json
        (owner approval pending).
      x-permission: alert.own.view
      x-business-rules: [BR-77, BR-78]
      parameters:
        - { name: type, in: query, schema: { $ref: '#/components/schemas/AlertType' } }
        - { name: warehouseId, in: query, schema: { type: string, format: uuid } }
        - { name: state, in: query, schema: { type: string, enum: [active, snoozed], default: active } }
        - { $ref: '#/components/parameters/CursorParam' }
        - { $ref: '#/components/parameters/LimitParam' }
      responses:
        '200':
          description: Paged alerts.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AlertItem' } }
                  page: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/alerts/{itemKey}/dismiss:
    post:
      tags: [Platform]
      operationId: dismissAdminAlert
      summary: Dismiss an alert in the caller's own list
      description: |
        Hides the alert from THIS user's lists until its condition clears (BR-78); other users still see it.
        Own list preference, so no `audit_log` row is written (like BR-65 read marks). Replaying is harmless;
        dismissing a snoozed alert turns the snooze into a dismissal (the last action wins). `itemKey` is the
        key `GET /admin/alerts` returned (`<TYPE>:<uuid>`, or `LOW_STOCK:<warehouse uuid>:<crop uuid>:<grade>`),
        lower-case canonical; any other shape, or a task key, is 422. 404 (never 403) when the item is not an
        alert in the caller's scope right now.
        INTERIM permission: `alert.own.view` (spec gap, owner approval pending).
      x-permission: alert.own.view
      x-business-rules: [BR-77, BR-78]
      parameters:
        - { name: itemKey, in: path, required: true, schema: { type: string, maxLength: 200 } }
      responses:
        '200':
          description: The caller's state for the alert.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskAlertState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/alerts/{itemKey}/snooze:
    post:
      tags: [Platform]
      operationId: snoozeAdminAlert
      summary: Snooze an alert in the caller's own list until a time
      description: |
        Hides the alert from THIS user's active list until `until` (BR-78); it then returns by itself, and
        `GET /admin/alerts?state=snoozed` lists it meanwhile. `until` must be after now and no more than
        `system_config.alert_snooze_max_hours` hours from now (inclusive), else 422 on `body.until`.
        `alert_snooze_max_hours` is a PLACEHOLDER (168, seeded by migration 0052; the design only shows a
        1-hour snooze) and the service uses 168 when the row is missing or not a positive integer. Own list
        preference, so no `audit_log` row is written. Snoozing again moves the end time; snoozing a dismissed
        alert makes it snoozed (the last action wins). Item key rules and 404 as for dismiss.
        INTERIM permission: `alert.own.view` (spec gap, owner approval pending).
      x-permission: alert.own.view
      x-business-rules: [BR-77, BR-78]
      parameters:
        - { name: itemKey, in: path, required: true, schema: { type: string, maxLength: 200 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [until]
              properties:
                until: { type: string, format: date-time, description: 'End of the snooze, any offset.' }
      responses:
        '200':
          description: The caller's state for the alert.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskAlertState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/finance/revenue:
    get:
      tags: [Finance]
      operationId: listFinanceRevenue
      summary: Revenue (completed paid orders)
      description: |
        Revenue is derived from `orders`. UNCONFIRMED DEFAULT (owner decision pending): an order
        counts when `payment_status = PAID` and `status` is a completed state, `DELIVERED` or
