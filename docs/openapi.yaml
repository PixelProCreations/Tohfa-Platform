        it is not automated advice, a risk model, or a system-generated
        suggestion, and it does not reopen BR-38: nothing here is computed for
        or written to a farmer who has not already logged the underlying rows
        themself (same boundary BR-40 draws for soil's classification labels,
        applied here to counting rather than labelling). A farm id that does
        not exist, or belongs to another farmer, 404s rather than 403 (BR-36).
      x-permission: farmer.pest.manage_own
      x-business-rules: [BR-36, BR-38]
      parameters:
        - name: farmId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The farm's pest analytics summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PestAnalyticsSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

