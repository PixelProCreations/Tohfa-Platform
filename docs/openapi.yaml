        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    patch:
      tags: [Livestock]
      operationId: updateMyLivestockAnimal
      summary: Edit an own animal
      description: |
        Partially updates an own `livestock_animals` row. `lifecycleStatus` is
        NOT present — it only ever changes as the side effect of
        `POST .../lifecycle-events` (BR-47). A `tag` changed to one already in
        use elsewhere in the caller's own herd returns 409.
      x-permission: farmer.livestock.edit_own
      x-business-rules: [BR-47]
      parameters:
        - name: animalId
          in: path
          required: true
