  /farms/{farmId}/plots/{plotId}/soil-amendments/{amendmentId}:
    patch:
      tags: [Soil Management]
      operationId: updateMySoilAmendment
      summary: Update a soil amendment
      description: |
        Partial update of an amendment logged under one of the caller's own zones; only
        the fields present in the body change. This is a plain mutable row, not one of
        root CLAUDE.md's four named append-only ledgers. A farm, plot or amendment id
        that does not exist, or belongs to another farmer, 404s rather than 403 (BR-36).
      x-permission: farmer.soil.manage_own
      x-business-rules: [BR-36]
      parameters:
        - name: farmId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: plotId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: amendmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SoilAmendmentUpdate' }
            example:
              quantityKg: 75
      responses:
        '200':
          description: Updated soil amendment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SoilAmendment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [Soil Management]
      operationId: deleteMySoilAmendment
      summary: Remove a soil amendment
      description: |
        Hard-deletes an amendment logged under one of the caller's own zones. A farm,
        plot or amendment id that does not exist, or belongs to another farmer, 404s
        rather than 403 (BR-36).
      x-permission: farmer.soil.manage_own
      x-business-rules: [BR-36]
      parameters:
        - name: farmId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: plotId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: amendmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Soil amendment removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

