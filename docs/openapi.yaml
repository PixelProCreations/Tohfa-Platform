      security: []
      x-permission: public
      x-business-rules: []
      responses:
        '200':
          description: The process is alive.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
                  version: { type: string }
              example: { status: ok, version: 1.0.0 }

  /readyz:
    get:
      tags: [Platform]
      operationId: readyz
      summary: Readiness probe
      description: Reports the health of every downstream dependency. Returns 503 while any required dependency is down.
      security: []
      x-permission: public
      x-business-rules: []
      responses:
        '200':
          description: Ready to serve traffic.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
              example:
                status: ready
                checks:
                  - { name: postgres, status: up, latencyMs: 3 }
                  - { name: redis, status: up, latencyMs: 1 }
                  - { name: razorpay, status: up, latencyMs: 118 }
                  - { name: blob-storage, status: up, latencyMs: 42 }
        '503':
          description: Not ready.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }

