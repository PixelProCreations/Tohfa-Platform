  /admin/customers:
    get:
      tags: [Customers]
      operationId: listAdminCustomers
      summary: List customers
      description: |
        Name order, cursor pagination. Scope (BR-91): an actor whose `customer.list.view` resolves to
        `own` sees only customers with an order or a top-up at its warehouse, or whose
        `preferred_warehouse_id` is that warehouse; anything else is simply absent (never 403). The
        filters and `q` cannot widen the scope. `summary` (`total`, `active`, `new`) counts the whole
        visible set, not just this page; "active" and "new" use
        `system_config.active_customer_window_days` (default 90, BR-98).

        Masking (BR-92): for an `own` actor every item carries `piiMasked: true`, `mobileMasked` and
        no `mobile` or `email` key at all. Scope `all` actors get the full values. Masking is driven
        by the resolved scope, never by a role check. See `q` for search.
      x-permission: customer.list.view
      x-business-rules: [BR-91, BR-92, BR-98]
      parameters:
        - name: q
          in: query
          description: |
            Trimmed first; the trimmed value must be 1 to 100 characters, so a whitespace-only `q`
            is 422 `VALIDATION_FAILED`. Matches a case-insensitive substring of the customer's name
            or customer code (`%` and `_` are literal, not wildcards). Mobile search applies only to
            an actor whose scope is `all` (unmasked) AND only when `q` contains at least 3 digits:
            the digits of `q` (every non-digit removed) are then matched as a substring of the
            stored mobile's digits. An `own` (masked) actor can never match on the mobile, so a
            full number cannot be recovered digit by digit through the filter (BR-92).
          schema: { type: string, minLength: 1, maxLength: 100 }
