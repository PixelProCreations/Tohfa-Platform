openapi: 3.1.0
info:
  title: TOHFA Platform API
  version: 1.0.0
  summary: Golden-thread API for the TOHFA farmer / customer / admin platform.
  description: |
    # TOHFA Platform API

    This document is **the contract**. Every client — the Farmer mobile app, the Customer
    mobile app, the Admin web/mobile app, and every internal service SDK — is generated
    from this file. Nothing that is not described here is part of the v1 surface. If a
    client needs a field, it is added here first, reviewed, and only then implemented.

    The "golden thread" is the end-to-end path that carries value through the platform:

    `farmer onboarding -> certification verification -> fair price ceiling -> produce
    listing -> admin approval / counter-offer -> purchase order -> goods receipt +
    quality check -> inventory batch -> channel allocation -> farm-anonymous catalog ->
    cart -> wallet-first checkout -> order -> warehouse fulfilment + OTP -> invoice ->
    farmer payout`

    Every endpoint below is annotated with two vendor extensions:

    * `x-permission` — the permission code from `docs/rbac.json` that the
      gateway checks before the handler runs. `public` means the endpoint is
      unauthenticated (it also carries `security: []`).
    * `x-additional-permissions` (rare) — further codes the route ALSO requires, checked before
      `x-permission`; the operation description says why. `pnpm spec:drift` checks they exist in
      `docs/rbac.json`.
    * `x-business-rules` — the client-locked business rules the handler enforces
      server-side. Rules are never enforced only in the client.

    ## Business rules

    `docs/rules.md` is the authority for business rules: it holds the rule text, the
    failure mode and the test contract for each ID. This document never renumbers or
    restates a rule — it only cites the ID. `pnpm spec:drift` fails the build if an
    `x-business-rules` entry here names an ID that `docs/rules.md` does not define.

    The IDs cited below are the ones this contract touches; `docs/rules.md` also carries
    rules that no v1 endpoint enforces yet.

    | ID | Rule |
    |----|------|
    | BR-01 | Expired certificate blocks market listings |
    | BR-02 | Unverified certificate blocks market listings; verification is manual |
    | BR-03 | Four audits per year, one per quarter |
    | BR-04 | Audit rating scale and compliance tiers (read from `rating_tier_config`) |
    | BR-05 | Major violation count red-flag threshold (CONTESTED: stored, never derived) |
    | BR-06 | Farm rating is 10 categories x 10 points |
    | BR-07 | Listing price must not exceed the fair price ceiling |
    | BR-08 | Fair price ceiling is set by Super Admin only |
    | BR-09 | Retail price must be at or below the ceiling |
    | BR-10 | Counter-offer response window is 24 hours |
    | BR-11 | Counter-offers may be countered back at most 3 times |
    | BR-12 | Reserve allocation is 70 / 10 / 10 / 10 |
    | BR-14 | Farmer subscription is Rs 500/year with a free tier |
    | BR-15 | Four sales channels |
    | BR-16 | Customer view is farm-anonymous |
    | BR-17 | Wallet-first checkout |
    | BR-18 | Cash top-up credits the wallet server-side after the fiscal cash tag |
    | BR-19 | Cash top-up is capped at Rs 10,000 per transaction |
    | BR-20 | Handover requires a 4-digit OTP |
    | BR-21 | Every order supports warehouse pickup |
    | BR-22 | Cart items are locked for 24 hours |
    | BR-24 | Warehouses hold consolidated inventory across all farmers |
    | BR-25 | Each warehouse has its own Sub Warehouse Admin |
    | BR-27 | Customers may pick up from any warehouse |
    | BR-29 | Farmer Admin cannot act on their own listings |
    | BR-30 | Sub Warehouse Admin is scoped to one warehouse |
    | BR-31 | Payouts over Rs 10,000 require dual approval |
    | BR-32 | OTP hardening: 6-digit, 60s resend, 3-attempt lockout |
    | BR-33 | Aadhaar and mobile are locked fields |
    | BR-35 | The audit trail is append-only |
    | BR-36 | Own-data ownership for farmers and customers |
    | BR-37 | Stock movements are ledger-first; adjustments need separate approval |
    | BR-38 | No automated processes (manual data entry only); no advisory/recommendation content |
    | BR-40 | Soil parameter classification bands are server-configured, not client-literal |
    | BR-48 | Certificate entry is strictly validated; a lapsed certificate may be recorded only within `cert_expiry_max_past_days` |
    | BR-61 | A return is approved only after inspection, and refunded at most once |

    ## Conventions

    * All money is a **decimal string** (see the `Money` schema) — never a JSON number.
    * All timestamps are RFC 3339 UTC (`2026-08-18T06:30:00Z`).
    * All list endpoints are cursor-paginated and return a `page` object.
    * All errors are `application/problem+json` per RFC 9457 and carry a `traceId` (also sent as the `x-correlation-id` header).
    * Quantities are kilograms with 3 decimal places.
  contact:
    name: TOHFA Platform Engineering
    email: platform@tohfa.in
  license:
    name: Proprietary
    identifier: LicenseRef-TOHFA-Internal

servers:
  - url: http://localhost:3000/v1
    description: Local development
  - url: https://api-staging.tohfa.in/v1
    description: Staging

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Registration, OTP, login, sessions.
  - name: Farmer Onboarding
    description: The 5-step farmer application and the admin review queue.
  - name: Farmer Profile & Certifications
    description: Farmer self-service profile and PGS/NPOP certification lifecycle.
  - name: Farm Rating
    description: |
      The 10-category, 0-100 farm rating (BR-06), READ-ONLY over HTTP. Since the
      2026-10-01 product decision a rating is created only by completing an INTERNAL
      audit (`POST /admin/audits/{id}/complete`); there is no manual rating write.
      Admin review and the farmer's own view both read the newest rating; older
      ratings are kept as history.
  - name: Audits
    description: |
      Quarterly farm audits (BR-03: four per farmer per April-March fiscal year, one
      per quarter, internal and external mixed), scored on the same 10 categories as
      the farm rating (BR-06, 0-100, tier from `rating_tier_config` per BR-04),
      findings, the manual red flag (BR-05b), compliance reporting (BR-03b), and the
      farmer's own read-only audit history (BR-36). External audits are records an
      admin enters from an outside agency's report; there is no agency login. Audit
      results change nothing automatically.
  - name: Farm Diary
    description: |
      The farmer's own day-by-day field activity log (BR-40, BR-41, BR-42): plots,
      active crops, the admin-manageable activity taxonomy, diary entries with
      workforce/wage detail, and entry photos. Never customer-visible (BR-41).
  - name: Farms & Zones
    description: |
      A farmer's own land locations (`farms`) and their sub-divisions into zones
      (`plots` — "zones" in the farm diary). Farm-anonymous: see BR-16.
  - name: Crops
    description: |
      What is planted where (`farm_crops`) and the crop taxonomy (`crop_master`):
      planting, status transitions, harvest recording, seed/grade detail, the crop
      type picker, and a plot's planting/rotation history. A plot cannot have two
      live crops in status GROWING at once (BR-46).
  - name: Farm Assets
    description: |
      The maintenance-tracked tool/equipment/machinery register (`farm_assets`):
      one unified table for the three near-identical mock screens (Machinery/
      Tools/Equipment), distinguished by `category`. Service-due status is
      computed at read time, never stored.
  - name: Livestock
    description: |
      A farmer's own animals (`livestock_animals`), daily produce logging across
      the fixed 8-product dairy/poultry catalog (`livestock_production_logs`),
      and lifecycle events recording an animal leaving the herd
      (`livestock_lifecycle_events`). An animal can exit the herd at most once
      (BR-47). Read-only admin visibility into any farmer's herd, for
      organic-certification audit purposes.
  - name: Soil Management
    description: |
      A farmer's soil diary (FR-F06) for a zone: lab test records (with BR-40
      server-computed classification labels), amendments, moisture and erosion
      observations, and the crop rotation plan. BR-36 own-data ownership applies
      throughout; BR-38 bounds this feature to farmer-entered data only — no
      generated advisory text, risk model or automated suggestion.
  - name: Pest Management
    description: |
      A farmer's pest/disease log for a zone (FR-F07): detections, organic
      treatment applications and follow-up reminders, plus the global pest
      reference library and admin-authored regional weather risk notes.
      BR-36 own-data ownership applies to the farmer-owned tables; BR-38
      bounds this feature to farmer-entered data and static admin-curated
      reference content only — no scheduled reminder job, computed risk
      model or system-generated treatment suggestion.
  - name: Farm Workforce
    description: |
      A farmer's worker roster, daily attendance, advances and payouts for a
      farm (farm-scoped, not plot-scoped — see db/migrations/0025_workforce.sql).
      BR-36 own-data ownership applies throughout; BR-41 requires gross/net
      pay to be computed at read time from raw rows, never stored, and
      extends BR-38's no-automation boundary to attendance and payouts —
      both are exclusively farmer-initiated writes.
  - name: Tree Plantings
    description: |
      A farmer's own tree and perennial plantings (`tree_plantings`). Tracks species, tree counts,
      planting dates, and plot associations with server-side positive counts and date checks (BR-55).
  - name: Calendar & Events
    description: |
      Consolidated operational calendar for farmers (audits, crop harvests, certificate expiries,
      and platform events) along with admin management of platform workshops and events (BR-58).
  - name: Learning Hub
    description: |
      Educational knowledge base (articles, videos, training workshops) and community groups
      with farmer enrollment and group memberships (BR-59).
  - name: Support Tickets
    description: |
      Farmer support inquiries, append-only message threads, and administrator ticket lifecycle management (BR-60).
  - name: Pricing
    description: Super-Admin fair price ceilings and admin retail prices.
  - name: Marketing
    description: Produce listings, admin approval queue, counter-offer rounds.
  - name: Purchase
    description: Purchase orders, goods receipts, quality checks.
  - name: Inventory
    description: Batches, append-only stock ledger, adjustments, channel allocation.
  - name: Catalog
    description: Farm-anonymous customer browse surface. See BR-16.
  - name: Cart & Orders
    description: Cart lock, wallet-first checkout, order tracking.
  - name: Fulfilment
    description: Warehouse-side packing, dispatch and OTP verification.
  - name: Returns
    description: |
      Returns & Issues (RMA): customer/admin return request, warehouse inspection,
      admin approve/reject, and refund via instant wallet credit or a manual
      bank hand-off restricted to SA/TA. See BR-61.
  - name: Reports
    description: |
      Read-only, warehouse-scoped aggregates for the Sub and Main Warehouse Admin (BR-64).
      Counts and sums only; revenue and expense reports belong to Finance.
  - name: Finance
    description: |
      Warehouse Finance (Module 11): expense recording and warehouse-scoped revenue and expense
      reads. Raw sums and counts only: no profit/loss, no thresholds, no scores. Revenue is
      derived from orders, never stored. See BR-62 and BR-63.
  - name: Warehouse Staff
    description: |
      Warehouse Staff and Attendance (Module 14): the floor-staff roster of each warehouse and
      their daily attendance. Staff are not users. No payroll, salary or payout exists for them.
      The permission codes beyond `admin.staff.list_view` are documented spec gaps. See BR-83 and BR-84.
  - name: Customers
    description: |
      Customers (Sub Warehouse Module 7): the admin customer list, profile, purchases, orders,
      read-only wallet, issues and support history. For an actor whose permission resolves to
      scope `own` (Sub Warehouse Admin; Main Warehouse Admin) only customers linked to the actor's
      warehouse are visible (BR-91; out of scope is an empty list or 404, never 403), and PII is
      masked: name, masked mobile and customer code only (BR-92). The permission codes beyond
      `customer.list.view` and `support.ticket.respond` are documented spec gaps (SWA M6/M7,
      pending owner approval). See BR-91 to BR-93 and BR-97.
  - name: Sales
    description: |
      Direct (at-counter) and Market-day sales (Sub Warehouse Module 6). A sale is one atomic
      transaction (BR-87), re-validated at quote and create (BR-89), farm-anonymous (BR-90), paid
      by CASH, WALLET, CARD or UPI (BR-94), with integer-paise totals and a GST rate from
      `system_config` (BR-98). Horeca and B2B are read-only here; creating one is 501 (BR-13,
      BR-85). The `sales.*` and `payment.record` codes are documented spec gaps (SWA M6/M7, pending
      owner approval). See BR-85 to BR-90 and BR-94 to BR-98.
  - name: Wallet
    description: Customer wallet,Razorpay top-ups, cash top-ups at a warehouse.
  - name: Payouts & Invoices
    description: Farmer settlement with dual approval, and invoice retrieval.
  - name: Platform
    description: Notifications, audit log, health probes, upload signing.

paths:
  /auth/register/customer:
    post:
      tags: [Auth]
      operationId: registerCustomer
      summary: Self-register as a customer
      description: |
        Customers self-register and are activated instantly once their mobile OTP is
        verified — no admin review. Farmers cannot use this endpoint; they submit an
        application (see Farmer Onboarding).
      security: []
      x-permission: public
      x-business-rules: [BR-32]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerRegistrationRequest' }
            example:
              mobile: '+919876543210'
              fullName: Priya Raman
              email: priya@example.com
              password: 'C0rrect-Horse-9'
              preferredLocale: en
              preferredWarehouseId: 3f1b7c2e-2a44-4f0e-9b1a-6b0d2f0f1a01
      responses:
        '201':
          description: Registration accepted; an OTP has been dispatched to the mobile number.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistrationAccepted' }
              example:
                userId: 8c0f0f6a-6f1a-4f1e-8d5a-2b7c9e0a1122
                status: PENDING_OTP
                otpExpiresAt: '2026-08-18T06:35:00Z'
                resendAvailableAt: '2026-08-18T06:31:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /auth/otp/send:
    post:
      tags: [Auth]
      operationId: sendOtp
      summary: Send a 6-digit OTP
      description: 6-digit code, 60-second resend timer, 3-attempt lockout (BR-32).
      security: []
      x-permission: public
      x-business-rules: [BR-32]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpSendRequest' }
            example: { mobile: '+919876543210', purpose: LOGIN }
      responses:
        '202':
          description: OTP dispatched.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpChallenge' }
              example:
                challengeId: 0b2d0f2e-8b1c-4c1a-9f0a-9d3e6c1b2a30
                expiresAt: '2026-08-18T06:35:00Z'
                resendAvailableAt: '2026-08-18T06:31:00Z'
                attemptsRemaining: 3
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /auth/otp/verify:
    post:
      tags: [Auth]
      operationId: verifyOtp
      summary: Verify an OTP and mint a token pair
      description: |
        Exchanges the challenge id and the 6-digit code for an access/refresh token pair. A
        wrong code decrements `attemptsRemaining`; the third failure locks the challenge and a
        new one must be requested (BR-32).

        Optionally carries a BR-39 `linkToken` (from `POST /auth/oauth/{provider}`'s
        NOT_LINKED response) to complete an OAuth link atomically, in the same transaction as
        this OTP verification: an existing mobile number gets the identity linked to that
        account; a brand-new number gets the account created (straight to ACTIVE) and then
        linked. The response then also carries `oauthProfile` so the client can prefill Step 1
        of registration.
      security: []
      x-permission: public
      x-business-rules: [BR-32, BR-39]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpVerifyRequest' }
            example:
              challengeId: 0b2d0f2e-8b1c-4c1a-9f0a-9d3e6c1b2a30
              code: '482915'
      responses:
        '200':
          description: OTP accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpVerifyResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in with mobile + password
      description: |
        An account may hold multiple admin roles. When more than one role is active the
        response sets `requiresRoleSelection` and lists `availableRoles`; the client shows
        the multi-role selector and repeats the call with `roleCode`.
      security: []
      x-permission: public
      x-business-rules: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example:
              mobile: '+919876543210'
              password: 'C0rrect-Horse-9'
              deviceId: 6f2a-android-pixel7
              platform: android
      responses:
        '200':
          description: Authenticated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
              example:
                accessToken: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI4YzBmMGY2YSJ9.sig
                refreshToken: 9c1d0b7a4f5e4a3c8d2b1e0f6a7b8c9d
                tokenType: Bearer
                expiresIn: 900
                requiresRoleSelection: false
                user:
                  id: 8c0f0f6a-6f1a-4f1e-8d5a-2b7c9e0a1122
                  fullName: Priya Raman
                  userType: customer
                  roles: []
                  preferredLocale: en
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: Exchange a refresh token for a new token pair
      description: |
        Rotates the pair: the presented refresh token is invalidated as the new one is issued,
        so a replayed refresh token is treated as theft and revokes the whole session family.
      security: []
      x-permission: public
      x-business-rules: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: New token pair issued; the presented refresh token is rotated out.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current session
      description: |
        Revokes the refresh token behind the current session. Access tokens already issued stay
        valid until they expire, so clients must also drop their in-memory copy.
      x-permission: auth.session.revoke_own
      x-business-rules: []
      responses:
        '204': { description: Session revoked. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /auth/forgot-password:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Start a password reset via mobile OTP
      description: |
        Sends a password-reset OTP to the registered mobile number. The response is identical
        whether or not the number is registered, so this cannot be used to enumerate accounts
        (BR-32).
      security: []
      x-permission: public
      x-business-rules: [BR-32]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mobile]
              properties:
                mobile: { $ref: '#/components/schemas/Mobile' }
      responses:
        '202':
          description: If the mobile number exists, an OTP has been dispatched. Always 202 to avoid account enumeration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpChallenge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /auth/reset-password:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Complete a password reset
      description: |
        Sets a new password once the reset OTP has been verified, and terminates every other
        active session for that account (BR-32).
      security: []
      x-permission: public
      x-business-rules: [BR-32]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId, code, newPassword]
              properties:
                challengeId: { type: string, format: uuid }
                code: { type: string, pattern: '^[0-9]{6}$' }
                newPassword: { type: string, minLength: 10, maxLength: 128 }
      responses:
        '204': { description: Password reset; all existing sessions are revoked. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /auth/me/change-password:
    post:
      tags: [Auth]
      operationId: changeOwnPassword
      summary: Change your own password
      description: |
        Sets a new password for the authenticated caller after verifying their current
        password, and terminates every active session for that account — including the
        caller's own current session, exactly like `/auth/reset-password` — so every device
        must re-authenticate with the new password.
      x-permission: auth.password.change_own
      x-business-rules: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, minLength: 1 }
                newPassword: { type: string, minLength: 10, maxLength: 128 }
      responses:
        '204': { description: Password changed; all sessions for this account are revoked. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /auth/sessions/{id}/terminate:
    post:
      tags: [Auth]
      operationId: terminateSession
      summary: Terminate another admin's session
      description: Super Admin only. Terminating your own session is a logout, not this call.
      x-permission: auth.session.terminate_other
      x-business-rules: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '204': { description: Session terminated. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Current principal, roles and effective permissions
      description: |
        Returns the authenticated principal with its roles, warehouse or zone scope and
        effective permission codes — the payload every client shell reads to decide what to
        render.
      x-permission: auth.principal.view_own
      x-business-rules: []
      responses:
        '200':
          description: The authenticated principal.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
              example:
                id: 2a9f0d1b-7c3e-4a55-9f0b-1e2d3c4b5a60
                fullName: Anand Kumar
                mobile: '+919812345678'
                userType: admin
                preferredLocale: ta
                status: ACTIVE
                createdAt: '2026-09-01T09:30:00.000Z'
                lastLoginAt: '2026-10-08T06:15:00.000Z'
                roles:
                  - code: SUB_WH_ADMIN
                    warehouseId: 3f1b7c2e-2a44-4f0e-9b1a-6b0d2f0f1a01
                    warehouseName: Coonoor
                permissions: [goods_receipt.create, order.verify_otp, wallet.cash_topup]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
    patch:
      tags: [Auth]
      operationId: updateCurrentUserProfile
      summary: Edit own display name and preferred language (admin roles)
      description: |
        The admin User Profile edit. Only `fullName` (2 to 120 characters, trimmed) and
        `preferredLocale` (`en` or `ta`) can be changed; send either or both. The user is taken
        from the access token only.

        `mobile` and `email` are the locked identity fields of BR-33: sending either key, with any
        value, is `403 FIELD_LOCKED` and NOTHING in the request is applied. There is deliberately
        no change-mobile or change-email endpoint. Any other key (`status`, `roles`, `userType`,
        `permissions`, `id`, ...) is a 422, as is an empty body.

        A request that repeats the current values succeeds without writing or auditing anything.
        A real change writes one `auth.profile.update_own` audit row in the same transaction,
        listing the changed field NAMES only (never the name itself). The response has exactly the
        `GET /auth/me` shape. There is no avatar upload: it needs file storage.

        Granted to the five admin roles only. A farmer edits through `PATCH /farmers/me` and no
        customer profile route exists yet, so both get 403 here. Unconfirmed default: the
        2..120 character name bounds reuse the registration rule.
      x-permission: auth.profile.edit_own
      x-business-rules: [BR-33, BR-82]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCurrentUserRequest' }
            example: { fullName: Suresh Kumar, preferredLocale: ta }
      responses:
        '200':
          description: The updated principal, same shape as `GET /auth/me`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /auth/me/sessions:
    get:
      tags: [Auth]
      operationId: listMySessions
      summary: The caller's own live sessions
      description: |
        Lists the authenticated user's own sessions that are neither revoked nor expired,
        newest first, capped at 50. The owner is taken only from the access token; there is
        no way to ask for another user's sessions, and a user with no live session gets an
        empty array. Refresh-token hashes, device ids and push tokens are never returned.

        `isCurrent` is not returned: the access token carries no session id, so the server
        cannot honestly say which session the caller is on.
      x-permission: auth.principal.view_own
      x-business-rules: [BR-67]
      responses:
        '200':
          description: The caller's live sessions, newest first.
          content:
            application/json:
              schema:
                type: array
                maxItems: 50
                items: { $ref: '#/components/schemas/MySession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /auth/oauth/{provider}:
    post:
      tags: [Auth]
      operationId: loginWithOAuth
      summary: Log in with a verified Google/Facebook identity (BR-39)
      description: |
        OAuth is an alternate login method for an already mobile-verified account, or a
        data-prefill convenience during first-time registration — it is NEVER a way to create
        or activate an account without mobile+OTP (BR-39).

        The server verifies `token` against the provider (Google ID token signature/audience,
        or a Facebook Graph API `/me` call) and looks it up by `(provider, providerSubjectId)`:

        * **Linked already** — logs in exactly like `/auth/login`, including
          `requiresRoleSelection` when the account holds more than one role.
        * **Not linked** — 200 `NOT_LINKED` with whatever profile fields the provider gave
          (`fullName`, `email`, `photoUrl` — none guaranteed) and a `linkToken`: a short-lived
          (10 minute), single-use, server-signed token. No account is created and no tokens are
          issued. The client runs the normal `/auth/otp/send` + `/auth/otp/verify` flow and
          passes `linkToken` to `/auth/otp/verify` to complete the link.
      security: []
      x-permission: public
      x-business-rules: [BR-39]
      parameters:
        - name: provider
          in: path
          required: true
          schema: { $ref: '#/components/schemas/OAuthProvider' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OAuthLoginRequest' }
            example:
              token: eyJhbGciOiJSUzI1NiIsImtpZCI6IjazEyMyJ9.eyJzdWIiOiIxMDc2NTQzMjEwIn0.sig
              deviceId: 6f2a-android-pixel7
              platform: android
      responses:
        '200':
          description: Either an authenticated session (identity already linked) or a NOT_LINKED profile + linkToken.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TokenPair'
                  - $ref: '#/components/schemas/OAuthNotLinkedResponse'
              example:
                status: NOT_LINKED
                profile:
                  fullName: Priya Raman
                  email: priya@example.com
                  photoUrl: https://lh3.googleusercontent.com/a/photo.jpg
                linkToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ0eXAiOiJvYXV0aF9saW5rIn0.sig
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /auth/me/oauth/link:
    post:
      tags: [Auth]
      operationId: linkOwnOAuthIdentity
      summary: Link a Google/Facebook identity to your own account (BR-39)
      description: |
        Self-service linking for an already-authenticated caller: verifies `token` against the
        named provider and attaches the resulting identity to the caller's own account.
        Rejects with `OAUTH_IDENTITY_ALREADY_LINKED` if that identity is already linked to a
        DIFFERENT account. Linking an identity already linked to the caller's own account is a
        no-op that returns the existing link.
      x-permission: auth.oauth.link_own
      x-business-rules: [BR-39]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OAuthLinkRequest' }
            example: { provider: google, token: eyJhbGciOiJSUzI1NiJ9.eyJzdWIiOiIxMDc2NTQzMjEwIn0.sig }
      responses:
        '200':
          description: Identity linked (or already linked to this same account).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthIdentity' }
              example:
                provider: google
                email: priya@example.com
                linkedAt: '2026-09-17T06:35:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /auth/me/oauth/{provider}:
    delete:
      tags: [Auth]
      operationId: unlinkOwnOAuthIdentity
      summary: Unlink a Google/Facebook identity from your own account (BR-39)
      description: Removes the caller's own linked identity for the given provider, if one exists.
      x-permission: auth.oauth.unlink_own
      x-business-rules: [BR-39]
      parameters:
        - name: provider
          in: path
          required: true
          schema: { $ref: '#/components/schemas/OAuthProvider' }
      responses:
        '204': { description: Identity unlinked. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /warehouses:
    get:
      tags: [Inventory]
      operationId: listWarehouses
      summary: List warehouses
      description: |
        Master list of warehouses that hold consolidated farmer inventory (BR-24).
        Requires `warehouse.all.view`, which a Sub Warehouse Admin does not hold: a Sub
        token receives 403 here and reads its own warehouse through
        `GET /warehouses/{id}` (BR-66). Super Admin, Tohfa Admin and Main Warehouse Admin
        see all four warehouses (BR-23). `capacityKg` is a decimal string with 3 decimals;
        `operatingHours` is the stored JSON passed through unchanged (no format is
        specified yet).
      x-permission: warehouse.all.view
      x-business-rules: [BR-23, BR-24, BR-66]
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 120 }
          description: Free-text match on warehouse name or code.
        - name: type
          in: query
          required: false
          schema: { type: string, enum: [MAIN, SUB] }
        - name: isActive
          in: query
          required: false
          schema: { type: string, enum: ['true', 'false'] }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Paginated warehouse list.
          content:
            application/json:
              schema:
                type: object
                required: [items, page, pageSize, total]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Warehouse' }
                  page: { type: integer, minimum: 1 }
                  pageSize: { type: integer, minimum: 1 }
                  total: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /warehouses/{id}:
    get:
      tags: [Inventory]
      operationId: getWarehouse
      summary: One warehouse by id
      description: |
        Fetches a single warehouse by its UUID. Super Admin, Tohfa Admin and Main
        Warehouse Admin receive any warehouse; a Sub Warehouse Admin receives only its own.
        Any other id (another warehouse, or one that does not exist) returns the same 404
        `NOT_FOUND`, never 403, so the response does not confirm the warehouse exists
        (BR-30, BR-66).
      x-permission: warehouse.own.view
      x-business-rules: [BR-30, BR-66]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: The warehouse.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Warehouse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

    patch:
      tags: [Inventory]
      operationId: updateWarehouseProfile
      summary: Edit a warehouse's contact phone and operating hours
      description: |
        Edits `contactPhone` and `operatingHours` and NOTHING else: the body is strict, so name,
        code, type, city, address, coordinates, capacity and status are rejected with 422. `null`
        clears a value; at least one field is required. Requires `warehouse.profile.edit`
        (Super, Tohfa and Main Warehouse Admin; a Sub Warehouse Admin is 403 even for its own
        warehouse: the designed Warehouse Contact and Operating Information screens are read-only
        for it). That grant is an unconfirmed default (owner approval pending). Capacity stays on
        `PATCH /warehouses/{id}/capacity` (BR-66). The four warehouses are fixed: there is no
        create or delete (BR-23). An unknown warehouse is 404 `NOT_FOUND`.

        UNCONFIRMED DEFAULT: `operatingHours` had no defined format. The API accepts exactly one
        shape: all seven weekdays (`mon`..`sun`), each `{ "closed": true }` or `{ "closed": false,
        "open": "HH:MM", "close": "HH:MM" }` (24-hour clock, `open` strictly before `close`; an
        overnight shift is not representable). `contactPhone` is E.164.

        A request that changes nothing writes nothing and audits nothing. Otherwise one
        `warehouse.profile.edit` audit row is written in the same transaction with a masked image:
        whether a phone and hours are set, and the names of the fields that changed; never the
        phone number or the hours (BR-35, BR-80).
      x-permission: warehouse.profile.edit
      x-business-rules: [BR-23, BR-30, BR-35, BR-80]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarehouseProfileUpdate' }
      responses:
        '200':
          description: The warehouse after the edit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Warehouse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /warehouses/{id}/capacity:
    get:
      tags: [Inventory]
      operationId: getWarehouseCapacity
      summary: Warehouse capacity and current usage
      description: |
        `usedKg` is the sum of `qty_available` over the ACTIVE inventory batches of this
        warehouse (every crop stores kg). It is a read-only derivation of existing stock,
        not a business rule: no limit is enforced anywhere in the API.
        `availableKg = capacityKg - usedKg` and is returned as computed, negative when the
        warehouse holds more than its capacity (it is never clamped).
        `utilizationPercent = usedKg / capacityKg * 100`, rounded to 2 decimals.
        Quantities are decimal strings with 3 decimals. While no capacity is set
        (`capacityKg` null), `availableKg` and `utilizationPercent` are null too.
        Scoping is as for `GET /warehouses/{id}`: a Sub Warehouse Admin sees only its own
        warehouse; any other id is 404 `NOT_FOUND`, never 403 (BR-30, BR-66).
      x-permission: warehouse.own.view
      x-business-rules: [BR-30, BR-66]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Capacity and usage.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseCapacity' }
              example:
                warehouseId: 3f1b7c2e-2a44-4f0e-9b1a-6b0d2f0f1a01
                capacityKg: '30000.000'
                usedKg: '12500.250'
                availableKg: '17499.750'
                utilizationPercent: 41.67
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    patch:
      tags: [Inventory]
      operationId: setWarehouseCapacity
      summary: Set a warehouse's capacity
      description: |
        Sets `capacityKg` (a decimal string greater than 0, at most 9 integer digits and
        3 decimals). Requires `warehouse.capacity.set`, which a Sub Warehouse Admin does
        not hold (403). Other warehouses are never created or removed: BR-23 fixes the
        four. The new capacity is NOT checked against current stock (a value below
        `usedKg` is accepted and reports negative `availableKg`); this is an open owner
        question. Changing capacity never writes to batches or the stock ledger. One
        `warehouse.capacity.set` audit row is written in the same transaction, with
        before/after images holding `capacityKg` only (BR-35, BR-66).
        Whether Main Warehouse Admin may set capacity is an open contradiction (Chapter 6
        says yes, the permission matrix says Super Admin only); Chapter 6 is implemented.
      x-permission: warehouse.capacity.set
      x-business-rules: [BR-23, BR-35, BR-66]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [capacityKg]
              properties:
                capacityKg:
                  type: string
                  pattern: '^\d{1,9}(\.\d{1,3})?$'
                  description: Decimal string, greater than 0, within numeric(12,3).
                  example: '30000.000'
      responses:
        '200':
          description: The updated capacity and usage.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseCapacity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /warehouses/{id}/storage-locations:
    get:
      tags: [Inventory]
      operationId: listStorageLocations
      summary: List a warehouse's storage locations
      description: |
        The named places stock is kept in (cold storage, dry storage ...) for one warehouse, ordered
        by code, optionally filtered by `isActive` and by free text `q` (code, name or type).
        Requires `inventory.batch.view` (the designed Storage Location Detail screen is gated on it):
        a Sub Warehouse Admin reads only its own warehouse; any other warehouse and an unknown
        warehouse return the same 404 `NOT_FOUND`, never 403 and never an empty list (BR-30, BR-79).
        `inventory_batches.storage_location` is free text and is NOT linked to these rows.
      x-permission: inventory.batch.view
      x-business-rules: [BR-30, BR-79]
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - { name: q, in: query, schema: { type: string, minLength: 1, maxLength: 120 } }
        - { name: isActive, in: query, schema: { type: string, enum: ['true', 'false'] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: One page of storage locations.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StorageLocationList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Inventory]
      operationId: createStorageLocation
      summary: Create a storage location in a warehouse
      description: |
        Requires `warehouse.storage_location.manage` (Super, Tohfa and Main Warehouse Admin; a Sub
        Warehouse Admin is 403: the designed storage screens are read-only for it and say capacity
        is never editable by it. That grant is an unconfirmed default, owner approval pending).
        The `code` is unique within the warehouse, case-insensitively (409 `CONFLICT`), and
        immutable afterwards. `capacityKg` is a positive decimal string, display-only: no stock
        movement is checked against it. An unknown warehouse is 404. One
        `warehouse.storage_location.create` audit row is written in the same transaction with a
        masked image (code, type, capacity, status; never the name) (BR-35, BR-79).
      x-permission: warehouse.storage_location.manage
      x-business-rules: [BR-30, BR-35, BR-79]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StorageLocationCreate' }
      responses:
        '201':
          description: Storage location created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StorageLocation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /warehouses/{id}/storage-locations/{locationId}:
    get:
      tags: [Inventory]
      operationId: getStorageLocation
      summary: One storage location
      description: |
        Same scoping as the list: another or an unknown warehouse, and a location id that is not in
        this warehouse, are 404 `NOT_FOUND` (BR-30, BR-79). A deactivated location is still readable.
      x-permission: inventory.batch.view
      x-business-rules: [BR-30, BR-79]
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - { name: locationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The storage location.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StorageLocation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }
    patch:
      tags: [Inventory]
      operationId: updateStorageLocation
      summary: Edit, deactivate or reactivate a storage location
      description: |
        Changes `name`, `locationType`, `capacityKg` (`null` clears the last two) and `isActive`
        (`false` deactivates, `true` reactivates). The code is immutable (422 when sent) and nothing
        is ever deleted. At least one field is required. A request that changes nothing writes
        nothing and audits nothing; otherwise one `warehouse.storage_location.update` audit row is
        written in the same transaction with masked before/after images (code, type, capacity,
        status; never the name) and the real names of the changed fields. Requires
        `warehouse.storage_location.manage` (a Sub Warehouse Admin is 403, see POST) (BR-35, BR-79).
      x-permission: warehouse.storage_location.manage
      x-business-rules: [BR-30, BR-35, BR-79]
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - { name: locationId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StorageLocationUpdate' }
      responses:
        '200':
          description: The storage location after the edit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StorageLocation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /warehouses/{id}/performance:
    get:
      tags: [Inventory]
      operationId: getWarehousePerformance
      summary: Warehouse performance figures for a date range
      description: |
        Read-only, exact derivations from existing rows for one warehouse over the inclusive IST
        dates `from`..`to` (the same day window as the reports): orders placed in the range and
        their statuses (`fulfilled` = PICKED_UP or DELIVERED, `cancelled` = CANCELLED), goods
        receipts by status with gross/accepted/rejected kg, return requests created against the
        warehouse's orders by status, and the stock-ledger movements by type (`qtyKg` is the signed
        sum of `qty_delta`). NOT in the response, because no column or owner rule makes them an
        exact figure: scores, rates, percentages, targets, SLAs, rankings, on-time handover,
        putaway time, stock turnover.

        The span `to - from` may not exceed `system_config.report_max_range_days` (fallback 366
        when the row is missing): 422 `VALIDATION_FAILED` on `query.to`.

        Requires `warehouse.all.view`, the code the designed Warehouse Performance screen is gated
        on: Super, Tohfa and Main Warehouse Admin; a Sub Warehouse Admin is 403 (unconfirmed
        default, owner approval pending). An unknown warehouse is 404 `NOT_FOUND`.
      x-permission: warehouse.all.view
      x-business-rules: [BR-30, BR-80]
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - { name: from, in: query, required: true, description: 'Inclusive IST date, a real YYYY-MM-DD date. Must be <= `to`.', schema: { type: string, format: date } }
        - { name: to, in: query, required: true, description: 'Inclusive IST date, a real YYYY-MM-DD date.', schema: { type: string, format: date } }
      responses:
        '200':
          description: The figures.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehousePerformance' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /warehouse-transfers:
    get:
      tags: [Inventory]
      operationId: listWarehouseTransfers
      summary: List inter-warehouse transfers
      description: |
        Newest first (`createdAt` DESC, then id). Requires `transfer.inter_warehouse.view`: Super,
        Tohfa and Main Warehouse Admin see every transfer; a Sub Warehouse Admin only transfers whose
        source OR destination is its warehouse, and a `warehouseId` of another warehouse is an empty
        page, never 403 (BR-30, BR-102). Filters: `status`; `warehouseId` (either side); `direction`
        (`INBOUND` = `warehouseId` is the destination, `OUTBOUND` = it is the source), which requires
        `warehouseId` (422 without it). Strict query. List items carry the transfer header only
        (no `lines`); read one transfer for its lines.
      x-permission: transfer.inter_warehouse.view
      x-business-rules: [BR-30, BR-102]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [PENDING_APPROVAL, IN_TRANSIT, RECEIVED, CANCELLED] } }
        - { name: warehouseId, in: query, schema: { type: string, format: uuid } }
        - { name: direction, in: query, description: 'Relative to warehouseId, which it then requires.', schema: { type: string, enum: [INBOUND, OUTBOUND] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: One page of transfers (headers only).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseTransferList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Inventory]
      operationId: createWarehouseTransfer
      summary: Initiate an inter-warehouse transfer
      description: |
        Requires `transfer.inter_warehouse.initiate` (Super Admin and Main Warehouse Admin only;
        TOHFA Admin and Sub Warehouse Admin are 403, BR-26) and an `Idempotency-Key` (a replay returns
        the original 201 response and moves nothing twice; the same key with another body is 409
        `IDEMPOTENCY_KEY_REUSED`).

        The source and destination must differ (422) and both exist and be active (422 on
        `body.fromWarehouseId` / `body.toWarehouseId`); a caller whose scope does not reach the
        source gets 404. 1-50 lines with distinct batches; every batch must exist, be `ACTIVE` and be
        in the source warehouse (422 on `body.lines.{i}.batchId`), and `qtyKg` may not exceed the
        batch's free shelf (`qty_available` minus cart holds and pending UPI counter sales, BR-100),
        else 409 `STOCK_UNAVAILABLE`. The batches are row-locked for the check.

        Each line snapshots the batch's `cost_per_kg`; its value is `round(qtyKg x cost x 100)`
        integer paise computed in SQL numeric. When the total is at or above
        `system_config.transfer_high_value_threshold_paise` (fallback Rs 50,000) or any line has no
        cost, the transfer is created `PENDING_APPROVAL` and no stock moves. Otherwise it is
        dispatched in the same transaction: one `TRANSFER_OUT` ledger row per line and status
        `IN_TRANSIT`. One masked `transfer.inter_warehouse.initiate` audit row is written in the same
        transaction (ids, status, warehouses, line count, total paise; never notes or vehicle).
      x-permission: transfer.inter_warehouse.initiate
      x-business-rules: [BR-26, BR-35, BR-100, BR-102]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarehouseTransferCreate' }
      responses:
        '201':
          description: The transfer, `PENDING_APPROVAL` or `IN_TRANSIT`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseTransfer' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /warehouse-transfers/{id}:
    get:
      tags: [Inventory]
      operationId: getWarehouseTransfer
      summary: One inter-warehouse transfer with its lines
      description: |
        A Sub Warehouse Admin reads only a transfer whose source or destination is its warehouse;
        any other transfer and an unknown id are the same 404 `NOT_FOUND` (BR-30, BR-102). Lines
        carry batch id and code, crop id, grade, quantities, cost, value and the destination batch,
        never a farmer id (BR-16).
      x-permission: transfer.inter_warehouse.view
      x-business-rules: [BR-16, BR-30, BR-102]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
