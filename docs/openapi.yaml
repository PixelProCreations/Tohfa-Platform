      description: |
        Sub-divides one of the caller's own land locations into a zone. A farm id that
        does not exist, or belongs to another farmer, 404s rather than 403 (BR-36); a
        zone name repeated on the same farm 409s (`plots_name_unique_per_farm`).
      x-permission: farmer.farm.manage_own
