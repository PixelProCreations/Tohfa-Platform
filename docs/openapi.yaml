  /admin/finance/reports/expenses:
    get:
      tags: [Finance]
      operationId: getFinanceExpenseReport
      summary: Expense totals per day, category and payment method
      description: |
        Raw aggregates over non-deleted expenses in the caller's warehouse scope, in every status.
