      operationId: createMyErosionNote
      summary: Log an erosion risk / conservation practice note
      description: |
        Logs an erosion risk assessment and/or conservation practice note for one of the
        caller's own zones. `riskLevel` is a farmer self-assessment, entered from a fixed
        mobile option list — it is NOT a server-computed risk model. Wiring this to
        weather or GIS data would be exactly the automated risk-indicator territory BR-38
        blocks pending client resolution. A farm or plot id that does not exist, or
        belongs to another farmer, 404s rather than 403 (BR-36).
      x-permission: farmer.soil.manage_own
      x-business-rules: [BR-36, BR-38]
      parameters:
        - name: farmId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: plotId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ErosionConservationNoteCreate' }
            example:
              riskLevel: Moderate Risk
              practiceNotes: Contour bunding installed on the upper terrace.
      responses:
        '201':
          description: Erosion / conservation note logged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErosionConservationNote' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farms/{farmId}/plots/{plotId}/crop-rotation:
    get:
      tags: [Soil Management]
      operationId: getMyCropRotation
      summary: Get a zone's crop rotation plan
      description: |
        Returns the ordered crop rotation sequence plus the current/most relevant cover
        crop window (if any) for one of the caller's own zones. Both are 100%
        farmer-entered planning — never system-suggested — which is the BR-38 boundary
        this endpoint sits on. A farm or plot id that does not exist, or belongs to
        another farmer, 404s rather than 403 (BR-36).
      x-permission: farmer.soil.manage_own
      x-business-rules: [BR-36, BR-38]
      parameters:
        - name: farmId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: plotId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The zone's crop rotation plan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CropRotationPlan' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    put:
      tags: [Soil Management]
      operationId: putMyCropRotation
      summary: Replace a zone's crop rotation sequence
      description: |
        Replaces the caller's whole ordered crop rotation sequence for one of their own
        zones in one call (delete-then-insert inside one transaction) — the simplest
        correct model for "the farmer edits their whole plan at once". Does not touch
        the cover crop window. 100% farmer-entered planning, never system-suggested
        (BR-38). A farm or plot id that does not exist, or belongs to another farmer,
        404s rather than 403 (BR-36).
      x-permission: farmer.soil.manage_own
      x-business-rules: [BR-36, BR-38]
      parameters:
        - name: farmId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: plotId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sequence]
              properties:
                sequence:
                  type: array
                  items: { $ref: '#/components/schemas/CropRotationEntryInput' }
            example:
              sequence:
                - sequenceOrder: 1
                  cropName: Carrot
                  status: CURRENT
                - sequenceOrder: 2
                  cropName: Beans
                  plannedDate: '2026-08-01'
                  status: NEXT
      responses:
        '200':
          description: The replaced crop rotation plan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CropRotationPlan' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farms/{farmId}/plots/{plotId}/cover-crop-windows:
    post:
      tags: [Soil Management]
      operationId: createMyCoverCropWindow
      summary: Log a cover crop window
      description: |
        Logs a cover-crop planting window (date range + crop type) for one of the
        caller's own zones, tracked alongside but separately from the ordered crop
        rotation sequence. 100% farmer-entered planning, never system-suggested (BR-38).
        A farm or plot id that does not exist, or belongs to another farmer, 404s rather
