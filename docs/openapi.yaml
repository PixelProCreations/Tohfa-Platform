      operationId: checkout
      summary: Place an order (wallet-first checkout)
      description: |
        Converts the locked cart into an order. Wallet is the primary payment method
        (BR-17); an insufficient balance returns 422 `WALLET_INSUFFICIENT` with
        the shortfall so the client can prompt a top-up. An expired cart lock returns 409
        `CART_LOCK_EXPIRED` (BR-22). Every order supports warehouse pickup (BR-21); the delivery half of the model is
        unresolved — see `docs/rules.md` open contradiction 3. Money-moving — `Idempotency-Key` required; a replay never writes a second wallet debit (BR-17).
      x-permission: order.place
      x-business-rules: [BR-17, BR-21, BR-22]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKeyHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckoutRequest' }
            example:
              fulfillmentType: HOME_DELIVERY
              warehouseId: 3f1b7c2e-2a44-4f0e-9b1a-6b0d2f0f1a01
              deliveryAddressId: 8a7b6c5d-4e3f-4a2b-8c1d-0e9f8a7b6c5d
              deliveryDate: '2026-08-20'
              deliverySlot: MORNING_8_12
              paymentMethod: WALLET
      responses:
        '201':
          description: Order confirmed; the wallet has been debited and the delivery OTP issued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402':
          description: Wallet balance insufficient (BR-17a).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://docs.tohfa.in/problems/wallet-insufficient
                title: Wallet balance is insufficient
                status: 402
                detail: Order total is INR 412.50 and the wallet holds INR 180.00.
                code: WALLET_INSUFFICIENT
                traceId: 01J9F1B2C3D4E5F6G7H8J9K5
        '409':
          description: |
            `STOCK_UNAVAILABLE`: the batch behind a cart line no longer holds the reserved quantity,
            e.g. because a DIRECT counter sale drew it (DIRECT sales do not decrement allocations,
            BR-95k). Nothing is written: no debit, no order, no ledger row.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }
    get:
      tags: [Cart & Orders]
      operationId: listOrders
      summary: Own order history
      description: |
        Lists the caller's own orders, newest first. There is no cross-customer visibility in
        either direction (BR-36).
      x-permission: order.view_own
      x-business-rules: [BR-36]
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
        - { name: status, in: query, schema: { $ref: '#/components/schemas/OrderStatus' } }
      responses:
        '200':
          description: Paged orders, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/OrderSummary' } }
                  page: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /orders/{id}:
    get:
      tags: [Cart & Orders]
      operationId: getOrder
      summary: Order detail
      description: Line items carry the grade and certification badges only — never the source farm (BR-16).
      x-permission: order.view_own
      x-business-rules: [BR-16, BR-36]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '200':
          description: Order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /orders/{id}/tracking:
    get:
      tags: [Cart & Orders]
      operationId: getOrderTracking
      summary: Order tracking timeline
      description: Confirmed -> Packed -> Dispatched -> Out for delivery -> Delivered. Poll this, or subscribe to `/orders/{id}/events` for pushes.
      x-permission: order.view_own
      x-business-rules: [BR-21, BR-36]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '200':
          description: Tracking timeline.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderTracking' }
              example:
                orderId: 5a4b3c2d-1e0f-4a9b-8c7d-6e5f4a3b2c1d
                status: OUT_FOR_DELIVERY
                otpRequired: true
                estimatedArrival: '2026-08-20T05:30:00Z'
                events:
                  - { status: CONFIRMED, at: '2026-08-18T06:31:00Z', note: null }
                  - { status: PACKED, at: '2026-08-19T02:10:00Z', note: Packed at Coonoor }
                  - { status: DISPATCHED, at: '2026-08-20T01:05:00Z', note: TN43AB1234 }
                  - { status: OUT_FOR_DELIVERY, at: '2026-08-20T04:40:00Z', note: null }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /orders/{id}/events:
    get:
      tags: [Cart & Orders]
      operationId: streamOrderEvents
      summary: Live order events (SSE)
      description: |
        Server-Sent Events stream. Each event is `event: order.status` with a JSON
        `OrderTrackingEvent` payload; a `: keepalive` comment is emitted every 20 seconds.
        The stream closes once the order reaches `DELIVERED` or `CANCELLED`. Clients
        resume with the standard `Last-Event-ID` header.
      x-permission: order.view_own
      x-business-rules: [BR-36]
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
        - { name: Last-Event-ID, in: header, required: false, schema: { type: string } }
      responses:
        '200':
          description: Event stream opened.
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE frames; the `data:` field of each frame is an `OrderTrackingEvent` JSON object.
              example: |
                event: order.status
                id: 42
                data: {"status":"PACKED","at":"2026-08-19T02:10:00Z","note":"Packed at Coonoor"}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /orders/{id}/reorder:
    post:
      tags: [Cart & Orders]
      operationId: reorder
      summary: One-tap reorder
      description: Rebuilds the cart from a past order, skipping anything unavailable today; skipped lines are reported in `unavailable`.
      x-permission: order.reorder_own
      x-business-rules: [BR-12, BR-22]
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
        - { $ref: '#/components/parameters/IdempotencyKeyHeader' }
      responses:
        '200':
          description: Cart rebuilt.
          content:
            application/json:
              schema:
                type: object
                required: [cart, unavailable]
                properties:
                  cart: { $ref: '#/components/schemas/Cart' }
                  unavailable:
                    type: array
                    items:
                      type: object
                      properties:
                        productId: { type: string, format: uuid }
                        name: { type: string }
                        reason: { type: string, enum: [OUT_OF_STOCK, DELISTED, INSUFFICIENT_ALLOCATION] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /orders/{orderId}/returns:
    post:
      tags: [Returns]
      operationId: createReturnRequest
      summary: File a return against an order
      description: |
        Creates a return request (status `PENDING`) against one or more lines of an
        already-placed order, plus its initial append-only status-history row. The order
        must be visible to the caller — a customer may only return their own order; a
        cross-scope order is 404, never 403 (BR-36).
      x-permission: rma.request.process
      x-business-rules: [BR-61]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReturnRequestCreate' }
            example:
              reason: Produce arrived spoiled
              items: [{ orderItemId: 6b5a4c3d-2e1f-4a09-8b7c-6d5e4f3a2b1c, qty: '2.000' }]
              note: Two of the four crates were moldy on opening.
      responses:
        '201':
          description: Return request created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReturnRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/returns:
    get:
      tags: [Returns]
      operationId: listReturnRequests
      summary: Return request queue
      description: |
        Paginated, filterable by status. `return_requests` carries no warehouse_id of its
        own — scoping is derived from the linked order's warehouse, so a Sub Warehouse
        Admin sees only returns against orders fulfilled from their own warehouse; a Main
        Warehouse Admin sees all (BR-30).
      x-permission: rma.request.process
      x-business-rules: [BR-30, BR-61]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [PENDING, INSPECTED, APPROVED, REJECTED, REFUND_PENDING_BANK, REFUNDED] } }
        - { $ref: '#/components/parameters/CursorParam' }
        - { $ref: '#/components/parameters/LimitParam' }
      responses:
        '200':
          description: Paged return requests.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ReturnRequestSummary' } }
                  page: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/returns/{id}:
    get:
      tags: [Returns]
      operationId: getReturnRequest
      summary: Return request detail
      description: Includes per-item requested/accepted/damaged quantity and condition. 404, not 403, outside the caller's warehouse scope (BR-30).
      x-permission: rma.request.process
      x-business-rules: [BR-30, BR-61]
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
      responses:
        '200':
          description: Return request detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReturnRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/returns/{id}/inspect:
    post:
      tags: [Returns]
      operationId: inspectReturnRequest
      summary: Record the warehouse inspection of a returned product
      description: Per-item condition (GOOD/DAMAGED/SPOILED), accepted and damaged quantity. Moves `PENDING` -> `INSPECTED`; 409 otherwise.
      x-permission: inventory.quality_check.perform
      x-business-rules: [BR-61]
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReturnInspectionCreate' }
      responses:
        '200':
          description: Inspection recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReturnRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/returns/{id}/approve:
    post:
      tags: [Returns]
      operationId: approveReturnRequest
      summary: Approve an inspected return
      description: Requires status `INSPECTED` (409 `INVALID_STATE_TRANSITION` otherwise). Marks the returned order_items `RETURNED` in the same transaction (BR-61).
      x-permission: rma.refund.approve
      x-business-rules: [BR-61]
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
      responses:
        '200':
          description: Return approved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReturnRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/returns/{id}/reject:
    post:
      tags: [Returns]
      operationId: rejectReturnRequest
      summary: Reject a return request
      description: Requires a non-empty `reason`. Valid from `PENDING` or `INSPECTED` only.
      x-permission: rma.refund.approve
      x-business-rules: [BR-61]
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReturnRejectCreate' }
      responses:
        '200':
          description: Return rejected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReturnRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/returns/{id}/refund/wallet:
    post:
      tags: [Returns]
      operationId: refundReturnRequestToWallet
      summary: Instant wallet refund
      description: |
        Requires status `APPROVED`. Credits the customer's wallet (`wallet.move`,
        `type: ORDER_REFUND`) and moves the return to `REFUNDED`, in one transaction.
        Replaying this call — with the same or a different `Idempotency-Key` — returns
        the same result and never credits twice (BR-61).
      x-permission: rma.refund.wallet_process
      x-business-rules: [BR-61]
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
        - { $ref: '#/components/parameters/IdempotencyKeyHeader' }
      responses:
        '200':
          description: Wallet refund processed (or replayed).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReturnRefundResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/returns/{id}/refund/bank:
    post:
      tags: [Returns]
      operationId: refundReturnRequestToBank
      summary: Initiate a manual bank refund (2-4 days)
      description: |
        Requires status `APPROVED`. SUPER_ADMIN/TOHFA_ADMIN only — MAIN_WH_ADMIN and
        SUB_WH_ADMIN hold `none` on `rma.refund.bank_process` (the resolved default for
        the "Bank refunds for MW/SW" open contradiction; see docs/rules.md). No ledger
        write happens here: this records that a bank refund was initiated and moves the
        return to `REFUND_PENDING_BANK` for SA/TA to action manually outside TOHFA.
      x-permission: rma.refund.bank_process
      x-business-rules: [BR-61]
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
        - { $ref: '#/components/parameters/IdempotencyKeyHeader' }
      responses:
        '200':
          description: Bank refund initiated (or replayed).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReturnRefundResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/returns/{id}/history:
    get:
      tags: [Returns]
      operationId: getReturnRequestHistory
      summary: Return status history
      description: The append-only `return_request_status_history` trail for one return, oldest first.
      x-permission: rma.request.process
      x-business-rules: [BR-35, BR-61]
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
      responses:
        '200':
          description: Status history, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ReturnStatusHistoryEntry' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/orders:
    get:
      tags: [Fulfilment]
      operationId: listAdminOrders
      summary: Warehouse order queue
      description: |
        Confined by the caller's resolved scope in SQL (BR-101). Scope `all` (SUPER_ADMIN,
        TOHFA_ADMIN, MAIN_WH_ADMIN) sees every warehouse; a Sub Warehouse Admin sees only orders
        assigned to its warehouse. `warehouseId` only narrows the scope: naming another warehouse
        (or an unknown id) returns 200 with an empty page, never 403 (BR-30). CUSTOMER, FARMER and
        FARMER_ADMIN hold `none` on this code and get 403 `FORBIDDEN` (customers read their orders
        through `/orders`). In addition, the warehouse scope fails closed for any non-warehouse
        scope (`scopeDimension` outside warehouse). A Sub Warehouse Admin with no warehouse assigned gets 403
        `WAREHOUSE_SCOPE_VIOLATION` (a provisioning error, from requirePermission). Items carry no
        farm identity and no buyer PII. Paging is keyset on (`placedAt`, `id`) at microsecond
        precision; a `cursor` this endpoint did not return is 422 `VALIDATION_FAILED`.
      x-permission: order.list.view_all
      x-business-rules: [BR-101, BR-30]
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
        - { name: status, in: query, schema: { $ref: '#/components/schemas/OrderStatus' } }
        - { name: warehouseId, in: query, schema: { type: string, format: uuid } }
        - { name: channel, in: query, schema: { $ref: '#/components/schemas/SalesChannel' } }
        - { name: deliveryDate, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Paged orders.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/OrderSummary' } }
                  page: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/orders/{orderId}:
    get:
      tags: [Fulfilment]
      operationId: getAdminOrderDetail
      summary: Admin order detail (any channel)
      description: |
        Spec gap (owner decision 2026-10-11): the general admin order detail. Returns an order of
        any channel (ONLINE, DIRECT, MARKET, HORECA, B2B); `GET /admin/sales/{saleId}` remains the
        DIRECT/MARKET sale view. A Sub Warehouse Admin sees only its own warehouse: an order at
        another warehouse is 404 with the same body as an unknown id, never 403 (BR-30). CUSTOMER,
        FARMER and FARMER_ADMIN hold `none` on this code and get 403 `FORBIDDEN` on this admin
        route (BR-101). Farm-anonymous allow-list, no handover OTP, masked buyer mobile (BR-99). Read-only:
        no audit row.
      x-permission: order.list.view_all
      x-business-rules: [BR-99, BR-30, BR-16, BR-20, BR-90, BR-92]
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOrderDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/orders/{id}/assign-warehouse:
    post:
      tags: [Fulfilment]
      operationId: assignOrderWarehouse
      summary: Assign or reassign an order to a warehouse
      description: |
        Assigns or reassigns the fulfilling warehouse for an order — a customer may collect from
        any of the four warehouses (BR-27). A Sub Warehouse Admin cannot assign orders to its
        own warehouse. A DIRECT or MARKET counter sale (including a UPI sale still
        `PENDING_PAYMENT`) stays at the warehouse that made it: 409 `COUNTER_SALE_NOT_REASSIGNABLE`
        (BR-85i); any other order outside `CONFIRMED` / `PENDING_PAYMENT` is 409
        `INVALID_STATE_TRANSITION`. These checks are made on the order row locked inside the
        reassign transaction (BR-85j), so a pack or cancel that commits first makes the reassign
        409 `INVALID_STATE_TRANSITION`; an update that changes no row is 409 `CONFLICT`. Either
        way nothing is written (no history row, no audit row).
      x-permission: order.warehouse.assign
      x-business-rules: [BR-21, BR-27, BR-85]
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
        - { $ref: '#/components/parameters/IdempotencyKeyHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [warehouseId]
              properties:
                warehouseId: { type: string, format: uuid }
                reason: { type: string, maxLength: 300 }
      responses:
        '200':
          description: Assigned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/orders/{id}/pack:
    post:
      tags: [Fulfilment]
      operationId: packOrder
      summary: Mark the order packed
      description: Consumes the reserved batches FEFO and appends `SALE` rows to the stock ledger (BR-37). Only valid from `CONFIRMED`.
      x-permission: order.mark_packed
      x-business-rules: [BR-30, BR-37]
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
        - { $ref: '#/components/parameters/IdempotencyKeyHeader' }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                packedLines:
                  type: array
                  items:
                    type: object
                    required: [orderItemId, fulfilledQtyKg]
                    properties:
                      orderItemId: { type: string, format: uuid }
                      fulfilledQtyKg: { $ref: '#/components/schemas/Quantity' }
      responses:
        '200':
          description: Packed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The order is not in a state that allows packing.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://api.tohfa.in/problems/invalid-state-transition
                title: Invalid state transition
                status: 409
                detail: Cannot pack an order in status DISPATCHED.
                code: INVALID_STATE_TRANSITION
                traceId: 01J9F1B2C3D4E5F6G7H8J9K7
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/orders/{id}/dispatch:
    post:
      tags: [Fulfilment]
      operationId: dispatchOrder
      summary: Dispatch a packed order
      description: |
        Transitions a packed order to `OUT_FOR_DELIVERY`. Track 1 fulfils every order by
        warehouse pickup (BR-21), so this path is specified but not enabled — see
        `docs/rules.md` open contradiction 3.
      x-permission: order.dispatch
      x-business-rules: [BR-21]
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
        - { $ref: '#/components/parameters/IdempotencyKeyHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                vehicleNumber: { type: string, maxLength: 20 }
                deliveryPartnerId: { type: string, format: uuid }
                expectedArrival: { type: string, format: date-time }
            example: { vehicleNumber: TN43AB1234, expectedArrival: '2026-08-20T05:30:00Z' }
      responses:
        '200':
          description: Dispatched.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/orders/{id}/verify-otp:
    post:
      tags: [Fulfilment]
      operationId: verifyOrderOtp
      summary: Verify the 4-digit handover OTP
      description: |
        Used for both doorstep delivery and warehouse pickup (BR-20, BR-21). Success moves
        the order to `DELIVERED` and releases the settlement due to the farmer. Three
        wrong codes lock the OTP and require it to be reissued.
      x-permission: order.pickup_otp.verify
      x-business-rules: [BR-20, BR-21, BR-30]
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
        - { $ref: '#/components/parameters/IdempotencyKeyHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [otp]
              properties:
                otp: { type: string, pattern: '^[0-9]{4}$' }
                podPhotoUrl: { type: string, format: uri }
            example: { otp: '4821' }
      responses:
        '200':
          description: Verified; the order is delivered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: The OTP did not match.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://api.tohfa.in/problems/invalid-otp
                title: Invalid OTP
                status: 422
                detail: 2 attempts remaining before this OTP is locked.
                code: OTP_INVALID
                traceId: 01J9F1B2C3D4E5F6G7H8J9K8
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /wallets/me:
    get:
      tags: [Wallet]
      operationId: getMyWallet
      summary: Own wallet balance
      description: The balance is derived from the append-only ledger, never edited directly.
      x-permission: wallet.own.view
      x-business-rules: [BR-36]
      responses:
        '200':
          description: Wallet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wallet' }
              example:
                id: c3d4e5f6-a7b8-4901-8234-56789abcdef0
                ownerType: CUSTOMER
                balance: '1820.50'
                currency: INR
                status: ACTIVE
                updatedAt: '2026-08-18T06:31:00Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /wallets/me/transactions:
    get:
      tags: [Wallet]
      operationId: listMyWalletTransactions
      summary: Own wallet ledger
      description: |
        Returns the caller's own append-only wallet ledger, newest first. Balances are derived
        from these rows and are never edited in place (BR-36). Ordered by `(created_at, id)`
        descending; the opaque `cursor` carries both columns, so paging never skips or repeats a
        row. A `cursor` this endpoint did not issue is 422 `VALIDATION_FAILED`.
      x-permission: wallet.own.view
      x-business-rules: [BR-36]
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
        - { name: type, in: query, schema: { $ref: '#/components/schemas/WalletTransactionType' } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: tab, in: query, schema: { type: string, enum: [all, credits, debits, refunds], default: all }, description: '`credits`/`debits` filter by direction; `refunds` = ORDER_REFUND rows.' }
      responses:
        '200':
          description: Paged ledger rows, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/WalletTransaction' } }
                  page: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /wallets/me/topups:
    post:
      tags: [Wallet]
      operationId: createTopup
      summary: Start a digital top-up (Razorpay)
      description: |
        Creates a Razorpay order and returns the parameters the mobile SDK needs. The
        wallet is **not** credited here — it is credited when the signed
        `payment.captured` webhook arrives. Money-moving, so `Idempotency-Key`
        is required.
      x-permission: wallet.topup.digital
      x-business-rules: []
      parameters: [{ $ref: '#/components/parameters/IdempotencyKeyHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, mode]
              properties:
                amount: { $ref: '#/components/schemas/Money' }
                mode: { type: string, enum: [UPI, CARD, NETBANKING] }
            example: { amount: '1000.00', mode: UPI }
      responses:
        '201':
          description: Gateway order created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopupIntent' }
              example:
                topupId: d4e5f6a7-b8c9-4012-8345-6789abcdef01
                gateway: RAZORPAY
                gatewayOrderId: order_QhX2mK9pLr4tZa
                amount: '1000.00'
                currency: INR
                status: PENDING
                razorpayKeyId: rzp_test_1DP5mmOlF5G5ag
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /webhooks/razorpay:
    post:
      tags: [Wallet]
      operationId: razorpayWebhook
      summary: Razorpay webhook receiver
      description: |
        Public but authenticated by HMAC — the raw body is verified against
        `X-Razorpay-Signature` before parsing. Events are deduplicated on the Razorpay
        event id, so redelivery is safe. An invalid signature returns 401.
      security: []
      x-permission: public
      x-business-rules: []
      parameters:
        - { name: X-Razorpay-Signature, in: header, required: true, schema: { type: string } }
        - { name: X-Razorpay-Event-Id, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event, payload]
              properties:
                event: { type: string, examples: [payment.captured, payment.failed, payout.processed] }
                created_at: { type: integer }
                payload: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Accepted (also returned for a duplicate event id).
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: { type: boolean }
                  duplicate: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/wallets/{customerId}/cash-topup:
    post:
      tags: [Wallet]
      operationId: createCashTopup
      summary: Process a cash top-up at a warehouse
      description: |
        The customer hands cash to the warehouse admin, who records the fiscal cash tag.
        The wallet is credited server-side and an SMS is sent (BR-18). The cap is
        INR 10,000 per transaction — above it the call fails 422
        `CASH_LIMIT_EXCEEDED`. Only admins assigned to that warehouse may process it
        (BR-30).

        Idempotent (BR-18d): the `Idempotency-Key` is claimed before anything is written.
        Replaying it with the same body returns the original 201 body and writes nothing; the
        same key with a different body is 409 `IDEMPOTENCY_KEY_REUSED`; no key is 422
        `VALIDATION_FAILED`. A fiscal cash tag already used by another request is 409 `CONFLICT`.
      x-permission: wallet.cash_topup.process
      x-business-rules: [BR-18, BR-19, BR-30]
      parameters:
        - { name: customerId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKeyHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CashTopupCreate' }
            example:
              amount: '5000.00'
              warehouseId: 3f1b7c2e-2a44-4f0e-9b1a-6b0d2f0f1a01
              fiscalCashTag: OOTY-2026-08-18-0042
              remarks: Cash received at counter 2.
      responses:
        '201':
          description: Wallet credited; the ledger row is returned. A replay of the same key and body returns this same body (BR-18d).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalletTransaction' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: Cap exceeded, or the Idempotency-Key header is missing (`VALIDATION_FAILED`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://api.tohfa.in/problems/cash-topup-cap-exceeded
                title: Cash top-up cap exceeded
                status: 422
                detail: Cash top-up is capped at INR 10,000.00 per transaction.
                code: CASH_LIMIT_EXCEEDED
                traceId: 01J9F1B2C3D4E5F6G7H8J9K9
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/wallets/cash-topup/customers/lookup:
    get:
      tags: [Wallet]
      operationId: lookupCashTopupCustomer
      summary: Find the customer at the counter for a cash top-up
      description: |
        Spec gap (2026-10-14, BR-91i). Exactly one of `mobile` or `code` (422 otherwise, and for any
        other parameter such as `q`). `mobile` matches on the last 10 digits; `code` is
        case-insensitive exact. There is no name or partial search.

        Unlike `GET /admin/sales/customers/lookup`, the BR-91 warehouse-history predicate is NOT
        applied: a customer making their first top-up at this warehouse has no order, top-up or
        preferred warehouse here yet, and the successful top-up is what makes them BR-91-visible
        afterwards. The customer list, detail and the sales counter lookup keep BR-91 unchanged.
        Gated by `wallet.cash_topup.process` (Main and Sub Warehouse Admin both hold it), not by
        `sales.sale.create`. The response is the same allow-list as the sales counter lookup: the
        mobile is always masked (BR-92g), no e-mail or address. No match is an empty `items`.
      x-permission: wallet.cash_topup.process
      x-business-rules: [BR-91, BR-92, BR-18]
      parameters:
        - { name: mobile, in: query, required: false, schema: { type: string, pattern: '^\+?[0-9]{10,15}$' } }
        - { name: code, in: query, required: false, schema: { type: string, minLength: 1, maxLength: 40 } }
      responses:
        '200':
          description: Matching customers (zero or more).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/SaleCustomerMatch' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/payout-dues:
    get:
      tags: [Payouts & Invoices]
      operationId: listPayoutDues
      summary: Farmer payout dues, aged
      description: Dues arise once goods are accepted at quality check. Ageing buckets are 7 / 15 / 30 days.
      x-permission: payout.dues.view
      x-business-rules: []
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
        - { name: farmerId, in: query, schema: { type: string, format: uuid } }
        - { name: ageBucket, in: query, schema: { type: string, enum: [D0_7, D8_15, D16_30, D30_PLUS] } }
      responses:
        '200':
          description: Paged dues.
          content:
            application/json:
              schema:
                type: object
                required: [items, page, totals]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/PayoutDue' } }
                  page: { $ref: '#/components/schemas/PageMeta' }
                  totals:
                    type: object
                    properties:
                      totalDue: { $ref: '#/components/schemas/Money' }
                      farmerCount: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/payouts:
    post:
      tags: [Payouts & Invoices]
      operationId: createPayout
      summary: Initiate a farmer payout
      description: |
        Payouts up to INR 10,000 are released on a single approval. Above that the payout
        is created in `PENDING_APPROVAL` and needs a second, Super Admin approval
        (BR-31); attempting to release it directly returns 403 `DUAL_APPROVAL_REQUIRED`.
        Money-moving — `Idempotency-Key` required.

        When `bankAccountId` is given it must be an active (not deleted) payout destination
        of the farmer being paid (BR-70). Otherwise the response is 404 `NOT_FOUND` with the
        same body whether the id does not exist, belongs to another farmer, or was deleted,
        and nothing is written.

        Replay-safe (BR-72): a missing or blank `Idempotency-Key` is 422 `VALIDATION_FAILED`
        (any non-blank value up to 255 characters is accepted, a UUID is not required).
        Replaying a key with the same request by the same admin returns the original 201
        payout and writes no second payout, audit row or notification; the same key with a
        different request is 409 `IDEMPOTENCY_KEY_REUSED`. A refused attempt is not
        remembered. Keys are per admin and kept 24 hours. Payout numbers (`PO-YYYY-NNNNNN`)
        are unique under concurrent creation and never reused.
      x-permission: payout.farmer.initiate
      x-business-rules: [BR-31, BR-70, BR-72]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKeyHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayoutCreate' }
            example:
              farmerId: 9f8e7d6c-5b4a-4392-8180-7f6e5d4c3b2a
              amount: '18400.00'
              mode: IMPS
              bankAccountId: 2b3c4d5e-6f70-4812-8934-5a6b7c8d9e0f
              dueIds: [7a6b5c4d-3e2f-4108-8927-6b5a4c3d2e1f]
      responses:
        '201':
          description: Payout created. `requiresDualApproval` tells the client whether a second approval is outstanding.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payout' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/payouts/{id}/approve:
    post:
      tags: [Payouts & Invoices]
      operationId: approvePayout
      summary: Approve a payout
      description: |
        The initiator may never be an approver (BR-31, 403 `SAME_ACTOR_APPROVAL`), and
        the two approvers must be different people. For amounts above INR 10,000 the
        second approver must hold the Super Admin role (BR-31). Once both approvals are
        in, the payout is submitted to RazorpayX.

        Replay-safe (BR-72): `Idempotency-Key` is required (missing or blank is 422
        `VALIDATION_FAILED`). Replaying a key with the same request by the same approver
        returns the original 200 body and records no second approval, audit row or
        notification; the same key with a different note is 409 `IDEMPOTENCY_KEY_REUSED`.
        Two approvers racing: one succeeds and the other gets 409 `INVALID_STATE_TRANSITION`.
      x-permission: payout.approve_above_10k
      x-business-rules: [BR-31, BR-72]
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
        - { $ref: '#/components/parameters/IdempotencyKeyHeader' }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Approval recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payout' }
              example:
                id: 3c4d5e6f-7081-4923-8a45-6b7c8d9e0f12
                payoutNumber: PO-2026-000871
                farmerId: 9f8e7d6c-5b4a-4392-8180-7f6e5d4c3b2a
                amount: '18400.00'
                mode: IMPS
                status: APPROVED
                requiresDualApproval: true
                initiatedBy: 2a9f0d1b-7c3e-4a55-9f0b-1e2d3c4b5a60
                approvedBy: [6c5d4e3f-2a19-4087-8b76-5c4d3e2f1a09, 4d3c2b1a-0f9e-4d8c-9b7a-6e5d4c3b2a19]
                approvedAt: '2026-08-18T07:02:00Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Self-approval of a payout is refused.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://api.tohfa.in/problems/self-approval-of-payout
                title: Self-approval of a payout is not permitted
                status: 403
                detail: You initiated payout PO-2026-000871; a different approver is required.
                code: SAME_ACTOR_APPROVAL
                traceId: 01J9F1B2C3D4E5F6G7H8J9KA
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /invoices:
    get:
      tags: [Payouts & Invoices]
      operationId: listInvoices
      summary: Own invoices
      description: |
        Farmers see purchase invoices, customers see sale invoices, admins see everything in scope. GST invoices exist only for B2B and Horeca, which are out of scope in Track 1 (BR-15).
        Scope follows the `invoice.view_own` grant: SUPER_ADMIN, TOHFA_ADMIN and MAIN_WH_ADMIN (`all`) see every invoice; a farmer sees invoices issued to their own farmer profile and a customer those issued to their own customer profile (BR-36); a Sub Warehouse Admin sees invoices of orders placed at its assigned warehouse (BR-30). An invoice with no order (purchase or payout invoice) has no warehouse, so no Sub Warehouse Admin sees it (unconfirmed default, 2026-10-11). FARMER_ADMIN holds no grant (403). `GET /invoices/{id}` and `/invoices/{id}/download` return exactly the invoices this list returns.
      x-permission: invoice.view_own
      x-business-rules: [BR-16, BR-30, BR-36]
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
        - { name: type, in: query, schema: { $ref: '#/components/schemas/InvoiceType' } }
        - { name: fromDate, in: query, schema: { type: string, format: date } }
        - { name: toDate, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Paged invoices.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Invoice' } }
                  page: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /invoices/{id}:
    get:
      tags: [Payouts & Invoices]
      operationId: getInvoice
      summary: Invoice detail with lines
      description: |
        Returns one invoice with its line items. A farmer or customer sees only their own, and a
        customer invoice names TOHFA as the seller, never the farm (BR-16, BR-36).
        Visible to exactly the callers whose `GET /invoices` returns it (same scope rules). Another
        owner's invoice, or one outside a Sub Warehouse Admin's warehouse, is 404 `NOT_FOUND` with
        the same body as an id that does not exist, never 403 (BR-30, BR-36). 401 without a bearer
        token; 403 for a role without `invoice.view_own` (FARMER_ADMIN).
      x-permission: invoice.view_own
      x-business-rules: [BR-16, BR-30, BR-36]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '200':
          description: Invoice.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /invoices/{id}/download:
    get:
      tags: [Payouts & Invoices]
      operationId: downloadInvoice
      summary: Download the invoice PDF
      description: |
        Returns the PDF inline, or a 302 to a short-lived signed URL when `redirect=true`.
        With a bearer token the caller needs `invoice.view_own` (403 for FARMER_ADMIN) and sees
        exactly the invoices `GET /invoices` returns them; any other id is 404 `NOT_FOUND` with the
        same body as an id that does not exist, never 403 (BR-30, BR-36). `redirect=true` mints the
        signed link only after that same check (404 otherwise).
        A request carrying `token` is a signed link: it needs no bearer token, `token` and `expires`
        must verify (403 `FORBIDDEN` when tampered, expired, missing `expires` or minted for another
        invoice). Without a bearer token and without `token` the response is 401.
      x-permission: invoice.view_own
      x-business-rules: [BR-16, BR-30, BR-36]
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
        - { name: redirect, in: query, schema: { type: boolean, default: false } }
        - name: token
          in: query
          description: Signature from a `redirect=true` link (HMAC over invoice id and expiry). With `expires`, authorises this one download without a bearer token; never construct it client-side.
          schema: { type: string }
        - name: expires
          in: query
          description: Expiry of a signed link, epoch milliseconds (5 minutes after it was issued).
          schema: { type: integer }
      responses:
        '200':
          description: The invoice PDF.
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '302':
          description: Redirect to a signed URL valid for 5 minutes.
          headers:
            Location: { schema: { type: string, format: uri } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /notifications:
    get:
      tags: [Platform]
      operationId: listNotifications
      summary: Own notifications
      description: |
        Lists the caller's own notifications, unread first.
      x-permission: notification.own.view
      x-business-rules: []
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
        - { name: unreadOnly, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Paged notifications.
          content:
            application/json:
              schema:
                type: object
                required: [items, page, unreadCount]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Notification' } }
                  page: { $ref: '#/components/schemas/PageMeta' }
                  unreadCount: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /notifications/{id}/read:
    post:
      tags: [Platform]
      operationId: markNotificationRead
      summary: Mark a notification read
      description: |
        Marks one of the caller's own notifications as read. Repeating the call is a no-op, not
        an error.
      x-permission: notification.own.mark_read
      x-business-rules: []
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '200':
          description: Marked read.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /notifications/read-all:
    post:
      tags: [Platform]
      operationId: markAllNotificationsRead
      summary: Mark all own notifications read
      description: |
        Marks every unread in-app notification of the caller read in one statement. Only the
        caller's own rows are touched. Idempotent: repeating the call changes nothing and
        returns `updated: 0`. Writes no audit row, same as marking one notification read.
      x-permission: notification.own.mark_read
      x-business-rules: [BR-65]
      responses:
        '200':
          description: Number of notifications that changed from unread to read.
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /notifications/{id}:
    get:
      tags: [Platform]
      operationId: getNotification
      summary: One own notification
      description: |
        Returns one of the caller's own in-app notifications, in the same shape as the list.
        Another user's notification id, a non-in-app row and an unknown id are all `404`, so
        the existence of someone else's row is never confirmed.
      x-permission: notification.own.view
      x-business-rules: [BR-65]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '200':
          description: The notification.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /notifications/device-tokens:
    post:
      tags: [Platform]
      operationId: registerDeviceToken
      summary: Register device token for push notifications
      description: |
        Registers or updates an FCM device token for the authenticated user (S-50).
      x-permission: notification.own.view
      x-business-rules: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, platform, app]
              properties:
                token: { type: string, minLength: 1, maxLength: 512 }
                platform: { type: string, enum: [android, ios, web] }
                app: { type: string, enum: [farmer-mobile, customer-mobile, admin-web] }
                locale: { type: string, enum: [en, ta], default: en }
      responses:
        '201':
          description: Device token registered.
          content:
            application/json:
              schema:
                type: object
                required: [id, token, platform, app, locale, revoked, lastSeen]
                properties:
                  id: { type: string, format: uuid }
                  token: { type: string }
                  platform: { type: string }
                  app: { type: string }
                  locale: { type: string }
                  revoked: { type: boolean }
                  lastSeen: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /notifications/device-tokens/{token}:
    delete:
      tags: [Platform]
      operationId: revokeDeviceToken
      summary: Revoke a registered device token
      description: |
        Revokes an FCM device token so no further push notifications are routed to it (S-50).
      x-permission: notification.own.view
      x-business-rules: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Revocation result.
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /system-messages:
    get:
      tags: [Platform]
      operationId: listSystemMessages
      summary: System messages visible to the caller
      description: |
        Lists announcements the caller may see, newest `startsAt` first. An announcement is
        visible when it is not deleted, `startsAt <= now`, `endsAt` is null or in the future,
        and its scope matches the caller: `SYSTEM_WIDE` always; `WAREHOUSE` when it targets a
        warehouse the caller is assigned to (a caller with no assigned warehouse, such as a
        Main Warehouse admin, sees every warehouse's messages; farmers and customers see none);
        `ROLE` when it targets a role the caller holds. `ZONE` announcements are not shown.
        The message history is this list with `status=read`.
        INTERIM permission: there is no dedicated system-message code in docs/rbac.json, so the
        own-notification code is reused.
      x-permission: notification.own.view
      x-business-rules: [BR-65]
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [unread, read, all], default: all }
      responses:
        '200':
          description: Paged system messages.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/SystemMessage' } }
                  page: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /system-messages/{id}:
    get:
      tags: [Platform]
      operationId: getSystemMessage
      summary: One visible system message
      description: |
        Same visibility rule as the list. A message that is hidden, expired, not yet started,
        deleted, zone-scoped or aimed at another warehouse or role is `404`.
      x-permission: notification.own.view
      x-business-rules: [BR-65]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '200':
          description: The system message.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /system-messages/{id}/read:
    post:
      tags: [Platform]
      operationId: markSystemMessageRead
      summary: Mark a system message read
      description: |
        Records that the caller has read a message they can see. Read state is per user.
        Idempotent: repeating the call keeps the first `readAt`. A message the caller cannot
        see is `404`. Writes no audit row.
        INTERIM permission: reuses the own-notification mark-read code.
      x-permission: notification.own.mark_read
      x-business-rules: [BR-65]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '200':
          description: The message, with `isRead` true.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /notification-preferences:
    get:
      tags: [Platform]
      operationId: listNotificationPreferences
      summary: Own notification-category preferences
      description: |
        Returns the caller's push-notification category toggles (farmer app Settings, screen 73).
        Always all five categories, in a fixed order; a category the caller has never changed is
        reported as `enabled: true` (no stored row means enabled). A disabled category suppresses
        only the PUSH alert for the events mapped to it; the in-app (Notifications Center) and SMS
        notifications are still created (BR-52). Events that map to no category are unaffected.
      x-permission: notification.own.view
      x-business-rules: [BR-52]
      responses:
        '200':
          description: All five category preferences.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    minItems: 5
                    maxItems: 5
                    items: { $ref: '#/components/schemas/NotificationPreference' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /notification-preferences/{category}:
    patch:
      tags: [Platform]
      operationId: updateNotificationPreference
      summary: Turn one notification category on or off
      description: |
        Sets the caller's own preference for one category. Idempotent: repeating the same value is
        a no-op, not an error. An unknown category is a validation failure (422), like any other
        malformed path parameter.
      x-permission: notification.own.view
      x-business-rules: [BR-52]
      parameters:
        - name: category
          in: path
          required: true
          schema: { $ref: '#/components/schemas/NotificationCategory' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: The stored preference.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreference' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /notification-preferences/admin:
    get:
      tags: [Platform]
      operationId: listAdminNotificationPreferences
      summary: Own admin notification-category preferences
      description: |
        The toggles of the admin Notification Settings screen: the master in-app switch
        (`IN_APP_MASTER`), then Operational, Order, Wallet & Payout and System categories. Always
        all 14, in screen order; a category never changed is `enabled: true` (no stored row means
        enabled, as BR-52). The five original categories are NOT in this list and their defaults and
        endpoints are unchanged.

        Unconfirmed defaults: every admin category defaults ON (no rule or design says otherwise);
        `IN_APP_MASTER` is stored like any other toggle and the client greys the rest when it is off;
        no admin domain event maps to these categories yet, so today they are stored preferences
        that the notification dispatcher does not consult. There is no bulk "Reset to default"
        endpoint: the client sets each category to true.

        Farmers and customers hold no grant for these (403).
      x-permission: notification.own.admin_preferences
      x-business-rules: [BR-82]
      responses:
        '200':
          description: All 14 admin category preferences.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    minItems: 14
                    maxItems: 14
                    items: { $ref: '#/components/schemas/AdminNotificationPreference' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /notification-preferences/admin/{category}:
    patch:
      tags: [Platform]
      operationId: updateAdminNotificationPreference
      summary: Turn one admin notification category on or off
      description: |
        Sets the caller's own preference for one admin category. Idempotent. A category outside the
        admin list (including the five original ones) is a validation failure (422); farmers and
        customers get 403.
      x-permission: notification.own.admin_preferences
      x-business-rules: [BR-82]
      parameters:
        - name: category
          in: path
          required: true
          schema: { $ref: '#/components/schemas/AdminNotificationCategory' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: The stored preference.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminNotificationPreference' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/help:
    get:
      tags: [Platform]
      operationId: readAdminHelp
      summary: Published Help & Support articles and contact channels
      description: |
        The admin Help & Support screen: the PUBLISHED FAQ articles for one locale (`locale`,
        default `en`), optionally one `category`, ordered by category, `sortOrder`, then id; the
        category names that have a published article in that locale (for the filter chips); and
        the contact channels. Drafts are never returned here. Content is admin-managed plain text
        and nothing is seeded, so a fresh system returns empty `items` and `categories`.

        `contact.phone` and `contact.email` come from `system_config` (`help.contact.phone`,
        `help.contact.email`) and are `null` until a Super Admin or TOHFA Admin sets them: no number
        or address is invented. Lists are not paginated (curated content, capped at 500 rows).

        Readable by all five admin roles; farmers and customers get 403. Unconfirmed defaults:
        the `en` default locale, no fall-back from `ta` to `en`, and the 500-row cap.
      x-permission: help.article.view
      x-business-rules: [BR-82]
      parameters:
        - name: locale
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Locale' }
        - name: category
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 60 }
      responses:
        '200':
          description: Published articles, categories and contact channels.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HelpResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/help/articles:
    get:
      tags: [Platform]
      operationId: listAdminHelpArticles
      summary: All Help & Support articles including drafts (content managers)
      description: |
        Every article, drafts included, optionally filtered by `locale`, `category` and
        `isPublished`. Super Admin and TOHFA Admin only; capped at 500 rows.
      x-permission: help.article.manage
      x-business-rules: [BR-82]
      parameters:
        - name: locale
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Locale' }
        - name: category
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 60 }
        - name: isPublished
          in: query
          required: false
          schema: { type: string, enum: ['true', 'false'] }
      responses:
        '200':
          description: The articles.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/HelpArticle' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Platform]
      operationId: createAdminHelpArticle
      summary: Create a Help & Support article (always a draft)
      description: |
        Creates an unpublished article. Text is plain: `<` followed by a letter, `/`, `!` or `?`
        (a tag, comment or declaration) is a 422, while `>` and a lone `<` are fine. Limits:
        category 1..60, title 1..200, body 1..4000 characters (trimmed), `sortOrder` 0..100000
        (default 0); these limits are unconfirmed defaults. One `help.article.create` audit row
        in the same transaction, masked (id, category, locale; never title or body).
        Super Admin and TOHFA Admin only.
      x-permission: help.article.manage
      x-business-rules: [BR-82]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateHelpArticleRequest' }
      responses:
        '201':
          description: The created draft.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HelpArticle' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/help/articles/{id}:
    patch:
      tags: [Platform]
      operationId: updateAdminHelpArticle
      summary: Edit a Help & Support article
      description: |
        Changes only the fields sent (at least one; unknown keys and `isPublished` are 422, use the
        publish endpoints). A request that changes nothing is a 200 without an audit row; a real
        change writes one `help.article.update` row listing the changed field names only.
        Super Admin and TOHFA Admin only.
      x-permission: help.article.manage
      x-business-rules: [BR-82]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateHelpArticleRequest' }
      responses:
        '200':
          description: The article after the edit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HelpArticle' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/help/articles/{id}/publish:
    post:
      tags: [Platform]
      operationId: publishAdminHelpArticle
      summary: Publish a Help & Support article
      description: |
        Makes the article visible to every admin reader. Publishing an already published article is
        a 200 no-op without an audit row; a real change writes one `help.article.publish` row.
        Super Admin and TOHFA Admin only.
      x-permission: help.article.manage
      x-business-rules: [BR-82]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The published article.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HelpArticle' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/help/articles/{id}/unpublish:
    post:
      tags: [Platform]
      operationId: unpublishAdminHelpArticle
      summary: Unpublish a Help & Support article
      description: |
        Hides the article from readers again (it stays available to content managers as a draft).
        Already a draft is a 200 no-op without an audit row; a real change writes one
        `help.article.unpublish` row. Super Admin and TOHFA Admin only.
      x-permission: help.article.manage
      x-business-rules: [BR-82]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The unpublished article.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HelpArticle' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/help/contact:
    patch:
      tags: [Platform]
      operationId: updateAdminHelpContact
      summary: Set the Help & Support contact channels
      description: |
        Sets `phone` and/or `email` (stored in `system_config` keys `help.contact.phone` and
        `help.contact.email`); `null` clears a channel, an absent key leaves it alone, at least one
        key is required. The phone accepts digits, spaces, `( ) -` and an optional leading `+`
        (5..32 characters); the e-mail must be a valid address up to 254 characters (both limits are
        unconfirmed defaults). A real change writes one `help.contact.update` audit row listing the
        changed channel names only, never the number or address. Super Admin and TOHFA Admin only.
      x-permission: help.article.manage
      x-business-rules: [BR-82]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateHelpContactRequest' }
      responses:
        '200':
          description: The contact channels after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HelpContact' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/reports/sales:
    get:
      tags: [Reports]
      operationId: getSalesReport
      summary: Sales report
      description: |
        Orders placed in the range (by `placed_at`, bucketed by Asia/Kolkata day): count, total,
        average order value, per day, per channel and per status. Every order status is included,
        cancelled and unpaid ones too. A channel, status or day with no orders is absent, never a
        zero row (BR-64c). The average is computed from the exact sum and count and rounded half up.
        A Sub Warehouse Admin sees its own warehouse only; a Main Warehouse Admin sees all four: an
        `own` grant with no assigned warehouse means all warehouses. Confirmed by the owner
        2026-10-11: a Main Warehouse Admin sees all four warehouses (BR-64).
      x-permission: order.list.view_all
      x-business-rules: [BR-64]
      parameters:
        - { $ref: '#/components/parameters/ReportFromParam' }
        - { $ref: '#/components/parameters/ReportToParam' }
        - { $ref: '#/components/parameters/ReportWarehouseIdParam' }
        - name: channel
          in: query
          required: false
          schema: { type: string, enum: [ONLINE, MARKET, HORECA, B2B] }
      responses:
        '200':
          description: The sales aggregates.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalesReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/reports/receiving:
    get:
      tags: [Reports]
      operationId: getReceivingReport
      summary: Goods receiving report
      description: |
        Goods receipts in the range (by `received_at`, Asia/Kolkata day): the count per status per
        day. Only combinations that have rows appear. Scoped by the receipt's warehouse; a Sub
        Warehouse Admin is confined to its own warehouse even though the permission is granted at
        scope `all` (BR-64a).
      x-permission: inventory.goods_receipt.record
      x-business-rules: [BR-64]
      parameters:
        - { $ref: '#/components/parameters/ReportFromParam' }
        - { $ref: '#/components/parameters/ReportToParam' }
        - { $ref: '#/components/parameters/ReportWarehouseIdParam' }
      responses:
        '200':
          description: The receiving aggregates.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceivingReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/reports/inventory:
    get:
      tags: [Reports]
      operationId: getInventoryReport
      summary: Current stock report
      description: |
        A snapshot of the ACTIVE inventory batches right now, per crop: total quantity and batch
        count. No thresholds, low-stock flags or valuation. `from` and `to` are not used by a
        snapshot, so they are optional here; when sent they must be real dates (`from` not after
        `to`) and are echoed, otherwise they are null. Quantities are in kilograms, the unit
        `qty_available` is stored in. A Sub Warehouse Admin sees its own warehouse only (BR-64a).
      x-permission: inventory.batch.view
      x-business-rules: [BR-64]
      parameters:
