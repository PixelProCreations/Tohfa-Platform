        - { name: to, in: query, description: 'Inclusive Asia/Kolkata day of completion, a real YYYY-MM-DD date.', schema: { type: string, format: date } }
        - { name: channel, in: query, schema: { type: string, enum: [ONLINE, MARKET, HORECA, B2B] } }
        - { name: paymentMethod, in: query, schema: { type: string, enum: [WALLET, UPI, CARD, NETBANKING, CASH] } }
        - { $ref: '#/components/parameters/CursorParam' }
