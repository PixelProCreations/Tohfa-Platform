          content:
            application/json:
              schema: { $ref: '#/components/schemas/FarmerAuditDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farmers/me/audits/{id}/report:
    get:
      tags: [Audits]
      operationId: downloadMyAuditReport
      summary: Download own audit report
      description: |
        Same file as `GET /admin/audits/{id}/report` (same `variant` and `redirect`
        parameters), for the caller's own audit only. Another farmer's audit is 404 on
