          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: category
          in: query
          schema: { $ref: '#/components/schemas/FarmAssetCategory' }
        - name: dueOnly
          in: query
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paged farm assets for the given farmer.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/FarmAsset' }
                  page: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farmers/me/livestock/animals:
    get:
