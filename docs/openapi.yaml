  /farms/{farmId}/plots/{plotId}/pest-detections:
    get:
      tags: [Pest Management]
      operationId: listMyPestDetections
      summary: List a zone's pest detections
      description: |
        Lists pest/disease sightings logged for one of the caller's own zones,
        newest `detectedOn` first. A farm or plot id that does not exist, or
        belongs to another farmer, 404s rather than 403 (BR-36).
      x-permission: farmer.pest.manage_own
      x-business-rules: [BR-36, BR-38]
      parameters:
        - name: farmId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: plotId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The zone's pest detections.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PestDetection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Pest Management]
      operationId: createMyPestDetection
      summary: Log a pest detection
      description: |
        Logs a pest/disease sighting for one of the caller's own zones. `pestName`/
        `scientificName` are captured as free text at log time (not only a
        `pestLibraryId` reference) so a farmer can record a sighting the catalog
        does not yet cover. `photoUploadId`, when supplied, must reference an
        upload (`POST /uploads/sign` with `purpose: PEST_PHOTO`) the caller
        themself created — an upload id that does not exist, or was created by
        someone else, is rejected as `VALIDATION_FAILED` rather than silently
        linked. Farmer-entered observation only, never a system-detected alert
        (BR-38). A farm or plot id that does not exist, or belongs to another
        farmer, 404s rather than 403 (BR-36).
      x-permission: farmer.pest.manage_own
      x-business-rules: [BR-36, BR-38]
      parameters:
        - name: farmId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: plotId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PestDetectionCreate' }
            example:
              pestName: Powdery Mildew
              scientificName: Erysiphales
              severity: Low
              detectedOn: '2026-09-20'
              notes: White powdery patches on the older beetroot leaves.
      responses:
        '201':
          description: Pest detection logged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PestDetection' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

