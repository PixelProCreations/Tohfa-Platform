        - name: farmId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkerCreate' }
            example:
              name: Muthu Selvam
              roleTitle: Field Worker
              payType: daily
              payRatePaise: 60000
      responses:
        '201':
          description: Worker created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Worker' }
