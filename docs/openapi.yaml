      x-permission: admin.staff.attendance.mark
      x-business-rules: [BR-84]
      parameters:
        - { name: date, in: path, required: true, schema: { type: string, format: date } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffAttendanceBulkMark' }
      responses:
        '200':
          description: All entries applied.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffAttendanceBulkResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WarehouseStaffForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /uploads/mock/*:
