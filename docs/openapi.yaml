      x-permission: farmer.crop_input.manage_own
      x-business-rules: [BR-56, BR-36]
      parameters:
        - name: farmCropId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Cumulative NPK contribution totals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CropNpkContributionResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farmers/me/crops/{farmCropId}/inputs/{id}:
    get:
      tags: [Crops]
      operationId: getMyCropInput
      summary: Get details of an input application
      description: |
