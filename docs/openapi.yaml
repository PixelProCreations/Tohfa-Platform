        The farmer setting `status: Overdue` by hand is the only way this value
        changes; no job compares `dueDate` against the clock and writes to this
        table (BR-38). A farm, plot or reminder id that does not exist, or
        belongs to another farmer, 404s rather than 403 (BR-36).
      x-permission: farmer.pest.manage_own
      x-business-rules: [BR-36, BR-38]
      parameters:
        - name: farmId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: plotId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: reminderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PestTreatmentReminderUpdate' }
            example:
              status: Completed
      responses:
        '200':
          description: Updated pest treatment reminder.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PestTreatmentReminder' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farms/{farmId}/pest-analytics/summary:
    get:
      tags: [Pest Management]
      operationId: getMyPestAnalyticsSummary
      summary: Pest analytics summary across a farm's own logged data
      description: |
        Aggregates the caller's own pest detections and treatment logs across
        every zone on one of their own farms: counts of detections by season,
        the crops most frequently affected, and a per-treatment effectiveness
        tally derived from `pest_detections.resolutionEffective` on detections
        the farmer marked resolved after applying that treatment. This is a
        read-only aggregate purely over the farmer's own already-logged data —
        it is not automated advice, a risk model, or a system-generated
        suggestion, and it does not reopen BR-38: nothing here is computed for
        or written to a farmer who has not already logged the underlying rows
        themself (same boundary BR-40 draws for soil's classification labels,
        applied here to counting rather than labelling). A farm id that does
        not exist, or belongs to another farmer, 404s rather than 403 (BR-36).
      x-permission: farmer.pest.manage_own
      x-business-rules: [BR-36, BR-38]
      parameters:
        - name: farmId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The farm's pest analytics summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PestAnalyticsSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farms/{farmId}/workers:
    get:
      tags: [Farm Workforce]
      operationId: listMyWorkers
      summary: List a farm's worker roster
      description: |
        Lists workers on one of the caller's own farms, excluding soft-deleted
        rows. Farm-scoped, not plot-scoped: a worker is hired by the farm as a
        whole (BR-41, db/migrations/0025_workforce.sql). A farm id that does
        not exist, or belongs to another farmer, 404s rather than 403 (BR-36).
      x-permission: farmer.workforce.manage_own
      x-business-rules: [BR-36, BR-41]
      parameters:
