        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/expenses:
    post:
      tags: [Finance]
      operationId: createExpense
      summary: Record a warehouse expense
      description: |
        Records an expense with status `RECORDED`, `recordedBy` = the caller. There is no approve,
        reject, edit, cancel or delete endpoint (BR-62, owner decision 2026-10-11: expenses are only
        recorded). A Sub Warehouse Admin records for their own warehouse (a
        `warehouseId` they are not assigned to is 404); a caller not confined to a warehouse (Main
        Warehouse Admin, Super Admin, Tohfa Admin) must send `warehouseId`, an existing active
        warehouse (422 otherwise). `categoryId` must be an ACTIVE category (422). `expenseDate` is a
        real calendar date. `amount` is a positive Money string of at most 10 integer digits.

        Requires `Idempotency-Key` (422 when missing or blank). Replaying the same key with the same
        request returns the original expense with 200 and writes no second row and no second audit
        row; the same key with a different request, or by a different admin, is 409
        `IDEMPOTENCY_KEY_REUSED`. A `finance.expense.log` audit row with a masked image (no vendor or
        description text) is written in the same transaction.
      x-permission: finance.expense.log
      x-business-rules: [BR-62]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKeyHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseCreate' }
      responses:
        '200':
          description: Idempotent replay; the original expense.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        '201':
          description: Expense recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }
    get:
      tags: [Finance]
      operationId: listExpenses
      summary: List expenses
      description: |
        Warehouse-scoped: a Sub Warehouse Admin sees only their own warehouse; Main, Super Admin and
        Tohfa Admin see all (BR-63). A `warehouseId` filter outside the caller's scope yields an empty
        set, never another warehouse's rows. Newest expense date first, cursor pagination.
        `summary` covers the whole filtered set, not just the page. (`finance.expense.log` also
        guarding this read is a deliberate stretch: no separate read code exists.)
      x-permission: finance.expense.log
      x-business-rules: [BR-62, BR-63]
      parameters:
        - { name: categoryId, in: query, schema: { type: string, format: uuid } }
        - { name: paymentMethod, in: query, schema: { type: string, enum: [CASH, UPI, BANK] } }
        - { name: status, in: query, schema: { type: string, enum: [RECORDED, APPROVED, REJECTED] } }
        - { name: from, in: query, description: 'Inclusive expense date, a real YYYY-MM-DD date. Must be <= `to`.', schema: { type: string, format: date } }
        - { name: to, in: query, description: 'Inclusive expense date, a real YYYY-MM-DD date.', schema: { type: string, format: date } }
        - { name: warehouseId, in: query, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/CursorParam' }
        - { $ref: '#/components/parameters/LimitParam' }
      responses:
        '200':
          description: Paged expenses with the summary of the filtered set.
          content:
            application/json:
              schema:
                type: object
                required: [items, summary, page]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Expense' } }
                  summary: { $ref: '#/components/schemas/FinanceTotal' }
                  page: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/expenses/{id}:
    get:
      tags: [Finance]
      operationId: getExpense
      summary: Expense detail
      description: 404, not 403, when the expense is absent, deleted or outside the caller's warehouse scope (BR-63).
      x-permission: finance.expense.log
      x-business-rules: [BR-62, BR-63]
