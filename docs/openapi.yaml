                    farmerId: f1a2b3c4-d5e6-4f70-8899-aabbccddeeff
                    certType: PGS
                    customTypeName: null
                    certNumber: PGS-TN-2025-00871
                    issuingBody: PGS Organic India Council
                    issuedOn: '2025-04-01'
                    expiresOn: '2026-03-31'
                    verificationStatus: VERIFIED
                    daysToExpiry: -140
                    blocksListings: true
                    createdAt: '2025-04-01T06:12:00.000Z'
                page: { nextCursor: null, hasMore: false }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Farmer Profile & Certifications]
      operationId: createCertification
      summary: Manually enter a certification and attach its document
      description: |
        The farmer keys in the certificate details and attaches a document previously
        uploaded through `POST /uploads/sign`. The record starts `UNVERIFIED`, which
        blocks market listings until an admin verifies it (BR-02). An `OTHER`
        certificate is recorded and may be verified, but never qualifies the farmer
        to list; only a verified, unexpired PGS or NPOP certificate does (BR-02).

        Validation (BR-48) answers 422 `VALIDATION_FAILED` with one entry per failing
        field in `errors`, keyed `body.<field>` (e.g. `body.expiresOn`):
        * `issuedOn` and `expiresOn` are required real calendar dates, exactly
          `YYYY-MM-DD` (no time; `2026-02-30` is rejected), and `expiresOn` must be
          strictly after `issuedOn`.
        * `issuedOn` must not be after today (Asia/Kolkata).
        * `expiresOn` may already have passed — a lapsed certificate may be recorded —
          but not by more than `system_config.cert_expiry_max_past_days` days (seeded
          365; exposed as `certExpiryMaxPastDays` by `GET /config/farmer`): with 365,
          exactly 365 days before today is accepted, 366 is rejected.
        * `expiresOn` may not lie more than `system_config.cert_expiry_max_future_days`
          days after today (seeded 730, 2 years; exposed as
          `certExpiryMaxFutureDays`): exactly 730 days ahead is accepted, 731 is
          rejected (BR-48h).
        * `certNumber` / `issuingBody` are trimmed and must be 1-80 / 1-160 characters;
          `certType` must be `PGS`, `NPOP` or `OTHER`.
        * `customTypeName` (BR-48i) is required when `certType` is `OTHER` (the scheme's
          name, trimmed, 1-80 characters) and must be null or omitted for `PGS` and
          `NPOP`; either violation is reported on `body.customTypeName`.
        * `certType` + `certNumber` (after trimming) must not already belong to a live
          certificate — the caller's own or any other farmer's (BR-48j). This is
          reported on `body.certNumber` with one generic message ("This certificate
          number can't be used. Check the number and try again.") that is identical
          whoever holds the number and never names the holder. A number freed by
          `DELETE` may be recorded again; the same number under another `certType` is
          not a duplicate. Two concurrent requests for one number get one 201 and one
          422, never a 409 or 500.

        One `certification.create` audit row records the certificate as created, with
        the farmer as actor, in the same transaction (BR-35).
      x-permission: certification.manage_own
      x-business-rules: [BR-02, BR-35, BR-48]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CertificationCreate' }
            example:
              certType: NPOP
              certNumber: NPOP/TN/2026/44120
              issuingBody: Indian Organic Certification Agency
              issuedOn: '2026-04-01'
              expiresOn: '2027-03-31'
              documentUrl: https://cdn.tohfa.in/docs/8f1c/npop-2026.pdf
      responses:
        '201':
          description: Certification recorded, pending admin verification.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Certification' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: |
            `VALIDATION_FAILED`, one entry per failing field keyed `body.<field>` (BR-48),
            including `body.certNumber` when the `certType` + `certNumber` is already on
            record for a live certificate, whoever holds it (BR-48j).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://api.tohfa.in/problems/validation-failed
                title: Validation failed
                status: 422
                detail: One or more fields are invalid.
                code: VALIDATION_FAILED
                traceId: 01J9F1B2C3D4E5F6G7H8J9KG
                errors:
                  body.certNumber: ["This certificate number can't be used. Check the number and try again."]
        '500': { $ref: '#/components/responses/ServerError' }

  /farmers/me/certifications/{id}:
    patch:
      tags: [Farmer Profile & Certifications]
      operationId: updateMyCertification
      summary: Edit an own certification
      description: |
        Partially updates one of the caller's own certificates. Send any of `certType`,
        `customTypeName`, `certNumber`, `issuingBody`, `issuedOn`, `expiresOn`,
        `documentUrl`; at least one is required (an empty body is 422 keyed `body`).
        `farmerId`, `verificationStatus` and other unknown keys are ignored — the
        owner comes from the caller's token, never the body.

        The stored certificate with this patch applied must pass exactly the
        validation `POST /farmers/me/certifications` applies (BR-48, both expiry
        windows included), with errors keyed `body.<field>` even for a field the
        patch did not send (BR-49c). Moving a certificate away from `OTHER` therefore
        requires `customTypeName: null`; moving it to `OTHER` requires a
        `customTypeName`. A new `documentUrl` records a new certificate document and
        points the certificate at it (the old document is kept). Moving the
        certificate onto a `certType` + `certNumber` that another live certificate
        already has — the caller's own or any other farmer's — is 422 on
        `body.certNumber` with the same generic message `POST` uses, and nothing
        changes (BR-48j); keeping its own number is never a conflict.

        Verification reset (BR-49a): any change to a field above sends the
        certificate back for verification — `verificationStatus` becomes
        `UNVERIFIED` and `verifiedAt`, `verifiedBy`, `verificationNotes` and
        `portalCheckedUrl` are cleared, whether it was `VERIFIED` or `REJECTED` —
        and the farmer's market block is recomputed in the same transaction. A
        patch whose values all equal the stored ones is a no-op: 200 with the
        certificate unchanged and its verification kept (BR-49b).

        Another farmer's certificate, a deleted one and an unknown id all return
        404, never 403 (BR-36, BR-49d).
      x-permission: certification.manage_own
      x-business-rules: [BR-36, BR-48, BR-49]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CertificationUpdate' }
            example:
              certType: OTHER
              customTypeName: Jaivik Bharat
              certNumber: JAIVIK/TN/2026/0042
      responses:
        '200':
          description: The updated certification (UNVERIFIED after any real change).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Certification' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: |
            `VALIDATION_FAILED` on the merged result (BR-48, BR-49c), keyed `body.<field>`,
            including `body.certNumber` when the edit would give the certificate a
            `certType` + `certNumber` another live certificate already has, whoever holds
            it (BR-48j).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://api.tohfa.in/problems/validation-failed
                title: Validation failed
                status: 422
                detail: One or more fields are invalid.
                code: VALIDATION_FAILED
                traceId: 01J9F1B2C3D4E5F6G7H8J9KG
                errors:
                  body.certNumber: ["This certificate number can't be used. Check the number and try again."]
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [Farmer Profile & Certifications]
      operationId: deleteMyCertification
      summary: Delete an own certification
      description: |
        Soft delete (BR-50): the row and its document are kept, `deleted_at` is set.
        The certificate disappears from `GET /farmers/me/certifications`, the admin
        list and detail, admin verify/unverify (404), listing eligibility and the
        market-block recompute, which runs in the same transaction — deleting the
        only qualifying certificate blocks the farmer from listing. The same
        `certType` + `certNumber` may be recorded again afterwards.

        Another farmer's certificate, an already-deleted one and an unknown id all
        return 404, never 403 (BR-36).
      x-permission: certification.manage_own
      x-business-rules: [BR-36, BR-50]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '204': { description: Certification deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /config/farmer:
    get:
      tags: [Farmer Profile & Certifications]
      operationId: getFarmerConfig
      summary: Farmer-facing global platform config
      description: |
        Global, non-farmer-specific config thresholds the farmer app needs client-side
        (the certificate-expiry warning window, and how long ago a recorded certificate
        may have expired). Not scoped to the caller's own farm — this is platform-wide
        config, not farm data, so no BR-16 concern applies.

        Backed by `system_config`. `certExpiryWarningDays` is a specification-gap placeholder
        (30) pending client confirmation — see db/seed/001_reference.sql.
        `certExpiryMaxPastDays` is `cert_expiry_max_past_days` (seeded 365) and
        `certExpiryMaxFutureDays` is `cert_expiry_max_future_days` (seeded 730): the
        BR-48 windows `POST /farmers/me/certifications` and
        `PATCH /farmers/me/certifications/{id}` enforce. They are exposed so the app can
        pre-check its form; the server check is the enforcement.
      x-permission: farmer.config.view
      x-business-rules: [BR-48]
      responses:
        '200':
          description: Farmer-facing config values.
          content:
            application/json:
              schema:
                type: object
                required: [certExpiryWarningDays, certExpiryMaxPastDays, certExpiryMaxFutureDays]
                properties:
                  certExpiryWarningDays:
                    type: integer
                    minimum: 1
                  certExpiryMaxPastDays:
                    type: integer
                    minimum: 0
                    description: An expiresOn more than this many days before today (Asia/Kolkata) is rejected on create and edit (BR-48).
                  certExpiryMaxFutureDays:
                    type: integer
                    minimum: 0
                    description: An expiresOn more than this many days after today (Asia/Kolkata) is rejected on create and edit (BR-48h).
              example:
                certExpiryWarningDays: 30
                certExpiryMaxPastDays: 365
                certExpiryMaxFutureDays: 730
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farmers/me/rating:
    get:
      tags: [Farm Rating]
      operationId: getMyFarmRating
      summary: Own farm rating
      description: |
        Returns the caller's own current (newest) rating: all 10 categories, in sort
        order. Ratings are derived from completed INTERNAL audits (`source: AUDIT`);
        legacy manual ratings read as `source: MANUAL`. A farmer who has never been
        rated gets all-null scores, `status: DRAFT` and `source: null` — never a 404
        (BR-06).
      x-permission: farmer.rating.view
      x-business-rules: [BR-06]
      responses:
        '200':
          description: The caller's farm rating.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FarmRating' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farmers/me/weather:
    get:
      tags: [Farmer Profile & Certifications]
      operationId: getMyFarmWeather
      summary: Weather at own farm
      description: |
        Current conditions, the next 24 hours in 3-hour steps, and a multi-day outlook for the
        caller's own primary farm centroid (BR-36). Always served by the real OpenWeatherMap
        API — there is no mock/offline mode.

        Returns 404 when the caller has no farm with a recorded centroid, and 502
        (`WEATHER_PROVIDER_ERROR`) when the upstream provider is unreachable or misconfigured.

        This response carries farm name, village and GPS coordinates, so it is granted to the
        owning farmer only and is never reachable by a customer (BR-16).
      x-permission: farmer.weather.view_own
      x-business-rules: [BR-36]
      responses:
        '200':
          description: Weather snapshot for the farm's registered location.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FarmWeather' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
        '502':
          description: The upstream weather provider failed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /farmers/me/bank-accounts:
    get:
      tags: [Farmer Profile & Certifications]
      operationId: listMyBankAccounts
      summary: List own bank accounts
      description: |
        Returns the farmer's active bank accounts. Account numbers are always masked to the
        last 4 digits (BR-53a). UPI ids are not bank accounts and are never listed here; they
        live under `/farmers/me/upi`.
      x-permission: farmer.bank_account.manage_own
      x-business-rules: [BR-53]
      responses:
        '200':
          description: List of bank accounts.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FarmerBankAccount' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

    post:
      tags: [Farmer Profile & Certifications]
      operationId: createMyBankAccount
      summary: Add bank account
      description: |
        Adds a new bank account destination for payouts. IFSC and account number format are validated
        server-side (BR-53b). Verification status is initialized to UNVERIFIED (BR-53c). Only the last
        4 digits of the account number are stored; no token is stored for it. The farmer's first payout
        destination, of either kind (bank account or UPI), becomes the default automatically.
      x-permission: farmer.bank_account.manage_own
      x-business-rules: [BR-53]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateFarmerBankAccountRequest' }
      responses:
        '201':
          description: Bank account created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FarmerBankAccount' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farmers/me/bank-accounts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Farmer Profile & Certifications]
      operationId: updateMyBankAccount
      summary: Update bank account
      description: |
        Updates bank account fields. If account number or IFSC changes, verification status resets to UNVERIFIED (BR-53c).
        Only bank accounts are addressable here: the id of a UPI destination, or of another farmer's
        account, returns 404 (BR-36, BR-53f).
      x-permission: farmer.bank_account.manage_own
      x-business-rules: [BR-53]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateFarmerBankAccountRequest' }
      responses:
        '200':
          description: Bank account updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FarmerBankAccount' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

    delete:
      tags: [Farmer Profile & Certifications]
      operationId: deleteMyBankAccount
      summary: Delete bank account
      description: |
        Soft-deletes the bank account; the row is never hard-deleted, so settled payouts keep their
        history (BR-53e). Refused with 409 `INVALID_STATE_TRANSITION` while a payout that has not
        settled (REQUESTED, PENDING_APPROVAL, APPROVED or PROCESSING) references it. Deleting the
        default destination promotes the most recently created remaining destination (bank account or UPI).
      x-permission: farmer.bank_account.manage_own
      x-business-rules: [BR-53]
      responses:
        '204':
          description: Bank account deleted.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farmers/me/bank-accounts/{id}/default:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Farmer Profile & Certifications]
      operationId: setDefaultBankAccount
      summary: Set primary bank account
      description: |
        Sets the specified payout destination as the primary default (BR-53d). Accepts either kind
        of the farmer's own destinations, a bank account or the UPI id; for a UPI id `bankName`,
        `ifsc` and `accountNumberLast4` are null.
      x-permission: farmer.bank_account.manage_own
      x-business-rules: [BR-53]
      responses:
        '200':
          description: Bank account set as default.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FarmerBankAccount' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farmers/me/upi:
    get:
      tags: [Farmer Profile & Certifications]
      operationId: getMyUpiPreference
      summary: Get UPI payout destination
      description: |
        Retrieves the farmer's registered UPI ID payout destination (BR-53). 404 when none is registered.
      x-permission: farmer.bank_account.manage_own
      x-business-rules: [BR-53]
      responses:
        '200':
          description: UPI details.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FarmerUpiPreference' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

    put:
      tags: [Farmer Profile & Certifications]
      operationId: setMyUpiPreference
      summary: Register or update UPI payout destination
      description: |
        Registers or updates the farmer's UPI ID. VPA format is validated (BR-53b); a changed id is
        UNVERIFIED (BR-53c). The account holder is the farmer's own name; 422 `VALIDATION_FAILED` if the
        farmer has none on file. `isDefault` is only applied when sent: the first payout destination of
        either kind becomes the default automatically, and updating an existing UPI id without
        `isDefault` keeps its current default flag.
      x-permission: farmer.bank_account.manage_own
      x-business-rules: [BR-53]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateFarmerUpiRequest' }
      responses:
        '200':
          description: UPI preference saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FarmerUpiPreference' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

    delete:
      tags: [Farmer Profile & Certifications]
      operationId: deleteMyUpiPreference
      summary: Remove UPI payout destination
      description: |
        Soft-deletes the registered UPI destination (BR-53). 404 when none is registered. Same
        409 `INVALID_STATE_TRANSITION` guard and default promotion as deleting a bank account.
      x-permission: farmer.bank_account.manage_own
      x-business-rules: [BR-53]
      responses:
        '204':
          description: UPI destination removed.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farms:
    get:
      tags: [Farms & Zones]
      operationId: listMyFarms
      summary: List own land locations
      description: |
        Lists the caller's own land locations (`farms` rows), each with the number of
        zones (`plots`) drawn under it. Ordered primary-first, then by creation order.
        Cross-farmer rows are never returned, not even a count (BR-36).
      x-permission: farmer.farm.manage_own
      x-business-rules: [BR-36]
      responses:
        '200':
          description: The caller's own land locations.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/FarmListItem' }
              example:
                items:
                  - id: 7a1b2c3d-4e5f-4071-8899-aabbccddeeff
                    name: Home plot
                    surveyNumber: null
                    areaAcres: 2.5
                    centroidLat: 11.4102
                    centroidLng: 76.695
                    boundary: null
                    boundaryAreaAcres: null
                    boundaryDrawnBy: null
                    boundaryDrawnAt: null
                    boundaryVersion: 0
                    address: null
                    village: Kodanad
                    taluk: Kotagiri
                    district: The Nilgiris
                    isPrimary: true
                    waterSources: [Borewell]
                    landBoundaryContext: [stand_alone]
                    notes: null
                    plotCount: 2
                    createdAt: '2026-04-01T06:00:00Z'
                    updatedAt: null
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Farms & Zones]
      operationId: createMyFarm
      summary: Add a land location
      description: |
        Registers another land location for the caller's one farming operation (a
        farmer is one operation with land in multiple locations, not several farms).
        `isPrimary` is never settable here: only the farmer-application approval-time
        backfill (farmer-applications.service.ts) sets the first location primary, and
        `uq_farms_primary` rejects a second `is_primary = true` row outright.
      x-permission: farmer.farm.manage_own
      x-business-rules: [BR-36]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FarmCreate' }
            example:
              name: Second parcel
              areaAcres: 1.2
              village: Kodanad
              taluk: Kotagiri
              district: The Nilgiris
      responses:
        '201':
          description: Land location created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Farm' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farms/{farmId}:
    patch:
      tags: [Farms & Zones]
      operationId: updateMyFarm
      summary: Update a land location
      description: |
        Partial update of one of the caller's own land locations; only the fields
        present in the body change. A farm id that does not exist, or belongs to
        another farmer, 404s rather than 403 (BR-36).

        When `boundary` is supplied as a GeoJSON Polygon, `boundaryAreaAcres` is taken
        from `calculatedAreaAcres` in the same body (named to match `Step3Location.tsx`
        / farmer-applications.schema.ts's `fmbPolygon` capture), `boundaryDrawnBy` is
        set to the caller and `boundaryDrawnAt` to now, and `boundaryVersion` is
        incremented. Sending `boundary: null` clears the boundary (and everything
        derived from it) the same way; omitting `boundary` entirely leaves it untouched.
      x-permission: farmer.farm.manage_own
      x-business-rules: [BR-36]
      parameters:
        - name: farmId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FarmUpdate' }
            example:
              boundary:
                type: Polygon
                coordinates:
                  - - [76.69, 11.41]
                    - [76.7, 11.41]
                    - [76.7, 11.42]
                    - [76.69, 11.42]
                    - [76.69, 11.41]
              calculatedAreaAcres: 2.63
      responses:
        '200':
          description: Updated land location.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Farm' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
