    get:
      tags: [Farm Diary]
      operationId: getMyDiaryEntriesCalendar
      summary: Per-day entry counts for a month
      description: |
        Returns, for every day in `month` on which the caller logged at least one diary
        entry, the date and how many entries were logged that day — for the calendar
        view's day markers. Scoped to the caller's own farmer_id (BR-40).
      x-permission: farmer.diary.view_own
      x-business-rules: [BR-40]
      parameters:
        - name: month
          in: query
          required: true
          description: 'Format YYYY-MM.'
          schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
      responses:
        '200':
          description: Per-day entry counts for the month.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiaryCalendar' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farmers/me/diary/entries/{entryId}:
    get:
      tags: [Farm Diary]
      operationId: getMyDiaryEntry
      summary: Own diary entry detail
      description: |
        Returns one own diary entry with its full workforce and photo detail. An
        `entryId` belonging to another farmer, guessed or passed explicitly, returns 404
        — indistinguishable from a nonexistent id (BR-40, BR-40a).
      x-permission: farmer.diary.view_own
      x-business-rules: [BR-40]
      parameters:
        - name: entryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The diary entry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiaryEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    patch:
      tags: [Farm Diary]
      operationId: updateMyDiaryEntry
      summary: Edit an own diary entry
      description: |
        Partially updates an own diary entry. `plotId` and `farmCropId` are not
        editable — moving an entry to a different plot or crop cycle is a
        delete-and-recreate, not an edit. When `categoryKey`/`subActivityKey` changes,
        the pair is re-validated exactly as at creation (`DIARY_INVALID_SUB_ACTIVITY`);
        when `minutes` is supplied it is re-checked (`DIARY_MINUTES_REQUIRED`); when
        `workers` is supplied it fully replaces the existing set and each worker is
        re-validated (`DIARY_WORKER_HOURS_INVALID`, `DIARY_WAGE_RATE_INVALID`).
        Succeeds regardless of how old the entry's `activityOn` is (BR-43c).
      x-permission: farmer.diary.edit_own
      x-business-rules: [BR-42, BR-43, BR-44]
      parameters:
        - name: entryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiaryEntryUpdateRequest' }
      responses:
        '200':
          description: Updated diary entry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiaryEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [Farm Diary]
      operationId: deleteMyDiaryEntry
      summary: Delete an own diary entry
      description: Deletes an own diary entry and its workforce/photo detail (BR-43).
      x-permission: farmer.diary.delete_own
      x-business-rules: [BR-43]
      parameters:
        - name: entryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farmers/me/diary/entries/{entryId}/photos:
    post:
      tags: [Farm Diary]
      operationId: addMyDiaryEntryPhoto
      summary: Attach a photo to an own diary entry
      description: |
        Attaches a photo previously uploaded through `POST /uploads/sign` (purpose
        `DIARY_PHOTO`) to an own diary entry. EXIF is stripped before `storageKey` is
        written, exactly as for produce photos (BR-16, BR-41).
      x-permission: farmer.diary.edit_own
      x-business-rules: [BR-41]
      parameters:
        - name: entryId
          in: path
