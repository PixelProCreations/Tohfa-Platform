      x-permission: admin.diary_taxonomy.manage
      x-business-rules: [BR-45]
      parameters:
        - name: categoryKey
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiarySubActivityCreateRequest' }
      responses:
        '201':
          description: Sub-activity created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiarySubActivity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/diary/sub-activities/{key}:
    patch:
      tags: [Farm Diary]
      operationId: updateDiarySubActivity
      summary: Edit or retire a sub-activity
      description: |
        Partially updates a sub-activity, including retiring it via `isActive: false`,
