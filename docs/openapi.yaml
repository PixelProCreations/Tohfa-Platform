openapi: 3.1.0
info:
  title: TOHFA Platform API
  version: 1.0.0
  summary: Golden-thread API for the TOHFA farmer / customer / admin platform.
  description: |
    # TOHFA Platform API

    This document is **the contract**. Every client — the Farmer mobile app, the Customer
    mobile app, the Admin web/mobile app, and every internal service SDK — is generated
    from this file. Nothing that is not described here is part of the v1 surface. If a
    client needs a field, it is added here first, reviewed, and only then implemented.

    The "golden thread" is the end-to-end path that carries value through the platform:

    `farmer onboarding -> certification verification -> fair price ceiling -> produce
    listing -> admin approval / counter-offer -> purchase order -> goods receipt +
    quality check -> inventory batch -> channel allocation -> farm-anonymous catalog ->
    cart -> wallet-first checkout -> order -> warehouse fulfilment + OTP -> invoice ->
    farmer payout`

    Every endpoint below is annotated with two vendor extensions:

    * `x-permission` — the permission code from `docs/rbac.json` that the
      gateway checks before the handler runs. `public` means the endpoint is
      unauthenticated (it also carries `security: []`).
    * `x-business-rules` — the client-locked business rules the handler enforces
      server-side. Rules are never enforced only in the client.

    ## Business rules

    `docs/rules.md` is the authority for business rules: it holds the rule text, the
    failure mode and the test contract for each ID. This document never renumbers or
    restates a rule — it only cites the ID. `pnpm spec:drift` fails the build if an
    `x-business-rules` entry here names an ID that `docs/rules.md` does not define.

    The IDs cited below are the ones this contract touches; `docs/rules.md` also carries
    rules that no v1 endpoint enforces yet.

    | ID | Rule |
    |----|------|
    | BR-01 | Expired certificate blocks market listings |
    | BR-02 | Unverified certificate blocks market listings; verification is manual |
    | BR-03 | Four audits per year, one per quarter |
    | BR-06 | Farm rating is 10 categories x 10 points |
    | BR-07 | Listing price must not exceed the fair price ceiling |
    | BR-08 | Fair price ceiling is set by Super Admin only |
    | BR-09 | Retail price must be at or below the ceiling |
    | BR-10 | Counter-offer response window is 24 hours |
    | BR-11 | Counter-offers may be countered back at most 3 times |
    | BR-12 | Reserve allocation is 70 / 10 / 10 / 10 |
    | BR-14 | Farmer subscription is Rs 500/year with a free tier |
    | BR-15 | Four sales channels |
    | BR-16 | Customer view is farm-anonymous |
    | BR-17 | Wallet-first checkout |
    | BR-18 | Cash top-up credits the wallet server-side after the fiscal cash tag |
    | BR-19 | Cash top-up is capped at Rs 10,000 per transaction |
    | BR-20 | Handover requires a 4-digit OTP |
    | BR-21 | Every order supports warehouse pickup |
    | BR-22 | Cart items are locked for 24 hours |
    | BR-24 | Warehouses hold consolidated inventory across all farmers |
    | BR-25 | Each warehouse has its own Sub Warehouse Admin |
    | BR-27 | Customers may pick up from any warehouse |
    | BR-29 | Farmer Admin cannot act on their own listings |
    | BR-30 | Sub Warehouse Admin is scoped to one warehouse |
    | BR-31 | Payouts over Rs 10,000 require dual approval |
    | BR-32 | OTP hardening: 6-digit, 60s resend, 3-attempt lockout |
    | BR-33 | Aadhaar and mobile are locked fields |
    | BR-35 | The audit trail is append-only |
    | BR-36 | Own-data ownership for farmers and customers |
    | BR-37 | Stock movements are ledger-first; adjustments need separate approval |

    ## Conventions

    * All money is a **decimal string** (see the `Money` schema) — never a JSON number.
    * All timestamps are RFC 3339 UTC (`2026-08-18T06:30:00Z`).
    * All list endpoints are cursor-paginated and return a `page` object.
    * All errors are `application/problem+json` per RFC 9457 and carry a `correlationId`.
    * Quantities are kilograms with 3 decimal places.
  contact:
    name: TOHFA Platform Engineering
    email: platform@tohfa.in
  license:
    name: Proprietary
    identifier: LicenseRef-TOHFA-Internal

servers:
  - url: http://localhost:3000/v1
    description: Local development
  - url: https://api-staging.tohfa.in/v1
    description: Staging

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Registration, OTP, login, sessions.
  - name: Farmer Onboarding
    description: The 5-step farmer application and the admin review queue.
  - name: Farmer Profile & Certifications
    description: Farmer self-service profile and PGS/NPOP certification lifecycle.
  - name: Pricing
    description: Super-Admin fair price ceilings and admin retail prices.
  - name: Marketing
    description: Produce listings, admin approval queue, counter-offer rounds.
  - name: Purchase
    description: Purchase orders, goods receipts, quality checks.
  - name: Inventory
    description: Batches, append-only stock ledger, adjustments, channel allocation.
  - name: Catalog
    description: Farm-anonymous customer browse surface. See BR-16.
  - name: Cart & Orders
    description: Cart lock, wallet-first checkout, order tracking.
  - name: Fulfilment
    description: Warehouse-side packing, dispatch and OTP verification.
  - name: Wallet
    description: Customer wallet, Razorpay top-ups, cash top-ups at a warehouse.
  - name: Payouts & Invoices
    description: Farmer settlement with dual approval, and invoice retrieval.
  - name: Platform
    description: Notifications, audit log, health probes, upload signing.

paths:
  /auth/register/customer:
    post:
      tags: [Auth]
      operationId: registerCustomer
      summary: Self-register as a customer
      description: |
        Customers self-register and are activated instantly once their mobile OTP is
        verified — no admin review. Farmers cannot use this endpoint; they submit an
        application (see Farmer Onboarding).
      security: []
      x-permission: public
      x-business-rules: [BR-32]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerRegistrationRequest' }
            example:
              mobile: '+919876543210'
              fullName: Priya Raman
              email: priya@example.com
              password: 'C0rrect-Horse-9'
              preferredLocale: en
              preferredWarehouseId: 3f1b7c2e-2a44-4f0e-9b1a-6b0d2f0f1a01
      responses:
        '201':
          description: Registration accepted; an OTP has been dispatched to the mobile number.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistrationAccepted' }
              example:
                userId: 8c0f0f6a-6f1a-4f1e-8d5a-2b7c9e0a1122
                status: PENDING_OTP
                otpExpiresAt: '2026-08-18T06:35:00Z'
                resendAvailableAt: '2026-08-18T06:31:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /auth/otp/send:
    post:
      tags: [Auth]
      operationId: sendOtp
      summary: Send a 6-digit OTP
      description: 6-digit code, 60-second resend timer, 3-attempt lockout (BR-32).
      security: []
      x-permission: public
      x-business-rules: [BR-32]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpSendRequest' }
            example: { mobile: '+919876543210', purpose: LOGIN }
      responses:
        '202':
          description: OTP dispatched.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpChallenge' }
              example:
                challengeId: 0b2d0f2e-8b1c-4c1a-9f0a-9d3e6c1b2a30
                expiresAt: '2026-08-18T06:35:00Z'
                resendAvailableAt: '2026-08-18T06:31:00Z'
                attemptsRemaining: 3
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /auth/otp/verify:
    post:
      tags: [Auth]
      operationId: verifyOtp
      summary: Verify an OTP and mint a token pair
      description: |
        Exchanges the challenge id and the 6-digit code for an access/refresh token pair. A
        wrong code decrements `attemptsRemaining`; the third failure locks the challenge and a
        new one must be requested (BR-32).
      security: []
      x-permission: public
      x-business-rules: [BR-32]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpVerifyRequest' }
            example:
              challengeId: 0b2d0f2e-8b1c-4c1a-9f0a-9d3e6c1b2a30
              code: '482915'
      responses:
        '200':
          description: OTP accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in with mobile + password
      description: |
        An account may hold multiple admin roles. When more than one role is active the
        response sets `requiresRoleSelection` and lists `availableRoles`; the client shows
        the multi-role selector and repeats the call with `roleCode`.
      security: []
      x-permission: public
      x-business-rules: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example:
              mobile: '+919876543210'
              password: 'C0rrect-Horse-9'
              deviceId: 6f2a-android-pixel7
              platform: android
      responses:
        '200':
          description: Authenticated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
              example:
                accessToken: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI4YzBmMGY2YSJ9.sig
                refreshToken: 9c1d0b7a4f5e4a3c8d2b1e0f6a7b8c9d
                tokenType: Bearer
                expiresIn: 900
                requiresRoleSelection: false
                user:
                  id: 8c0f0f6a-6f1a-4f1e-8d5a-2b7c9e0a1122
                  fullName: Priya Raman
                  userType: customer
                  roles: []
                  preferredLocale: en
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: Exchange a refresh token for a new token pair
      description: |
        Rotates the pair: the presented refresh token is invalidated as the new one is issued,
        so a replayed refresh token is treated as theft and revokes the whole session family.
      security: []
      x-permission: public
      x-business-rules: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: New token pair issued; the presented refresh token is rotated out.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current session
      description: |
        Revokes the refresh token behind the current session. Access tokens already issued stay
        valid until they expire, so clients must also drop their in-memory copy.
      x-permission: auth.session.revoke_own
      x-business-rules: []
      responses:
        '204': { description: Session revoked. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /auth/forgot-password:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Start a password reset via mobile OTP
      description: |
        Sends a password-reset OTP to the registered mobile number. The response is identical
        whether or not the number is registered, so this cannot be used to enumerate accounts
        (BR-32).
      security: []
      x-permission: public
      x-business-rules: [BR-32]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mobile]
              properties:
                mobile: { $ref: '#/components/schemas/Mobile' }
      responses:
        '202':
          description: If the mobile number exists, an OTP has been dispatched. Always 202 to avoid account enumeration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpChallenge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /auth/reset-password:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Complete a password reset
      description: |
        Sets a new password once the reset OTP has been verified, and terminates every other
        active session for that account (BR-32).
      security: []
      x-permission: public
      x-business-rules: [BR-32]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId, code, newPassword]
              properties:
                challengeId: { type: string, format: uuid }
                code: { type: string, pattern: '^[0-9]{6}$' }
                newPassword: { type: string, minLength: 10, maxLength: 128 }
      responses:
        '204': { description: Password reset; all existing sessions are revoked. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /auth/sessions/{id}/terminate:
    post:
      tags: [Auth]
      operationId: terminateSession
      summary: Terminate another admin's session
      description: Super Admin only. Terminating your own session is a logout, not this call.
      x-permission: auth.session.terminate_other
      x-business-rules: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '204': { description: Session terminated. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Current principal, roles and effective permissions
      description: |
        Returns the authenticated principal with its roles, warehouse or zone scope and
        effective permission codes — the payload every client shell reads to decide what to
        render.
      x-permission: auth.principal.view_own
      x-business-rules: []
      responses:
        '200':
          description: The authenticated principal.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
              example:
                id: 2a9f0d1b-7c3e-4a55-9f0b-1e2d3c4b5a60
                fullName: Anand Kumar
                mobile: '+919812345678'
                userType: admin
                preferredLocale: ta
                roles:
                  - code: SUB_WH_ADMIN
                    warehouseId: 3f1b7c2e-2a44-4f0e-9b1a-6b0d2f0f1a01
                    warehouseName: Coonoor
                permissions: [goods_receipt.create, order.verify_otp, wallet.cash_topup]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /warehouses:
    get:
      tags: [Inventory]
      operationId: listWarehouses
      summary: List warehouses
      description: |
        Master list of warehouses that hold consolidated farmer inventory (BR-24).
        A Sub Warehouse Admin token sees only its own warehouse; everyone else sees
        the full consolidated view per their scope.
      x-permission: warehouse.all.view
      x-business-rules: [BR-24]
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 120 }
          description: Free-text match on warehouse name or code.
        - name: type
          in: query
          required: false
          schema: { type: string, enum: [MAIN, SUB] }
        - name: isActive
          in: query
          required: false
          schema: { type: string, enum: ['true', 'false'] }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Paginated warehouse list.
          content:
            application/json:
              schema:
                type: object
                required: [items, page, pageSize, total]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Warehouse' }
                  page: { type: integer, minimum: 1 }
                  pageSize: { type: integer, minimum: 1 }
                  total: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /warehouses/{id}:
    get:
      tags: [Inventory]
      operationId: getWarehouse
      summary: One warehouse by id
      description: Fetches a single warehouse by its UUID. Scoped per RBAC — a Sub
        Warehouse Admin receives its own warehouse; other roles receive any warehouse
        their scope permits.
      x-permission: warehouse.all.view
      x-business-rules: [BR-24]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: The warehouse.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Warehouse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farmers/applications:
    post:
      tags: [Farmer Onboarding]
      operationId: createFarmerApplication
      summary: Create a draft farmer application
      description: |
        Creates the empty 5-step draft. Steps are then filled with
        `PATCH /farmers/applications/{id}/steps/{step}` in any order and submitted as a
        whole. A mobile number may hold at most one non-terminal application.
      security: []
      x-permission: public
      x-business-rules: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mobile, fullName]
              properties:
                mobile: { $ref: '#/components/schemas/Mobile' }
                fullName: { type: string, minLength: 2, maxLength: 120 }
                preferredLocale: { $ref: '#/components/schemas/Locale' }
            example: { mobile: '+919812345678', fullName: Murugan S, preferredLocale: ta }
      responses:
        '201':
          description: Draft created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FarmerApplication' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farmers/applications/{id}/steps/{step}:
    patch:
      tags: [Farmer Onboarding]
      operationId: updateFarmerApplicationStep
      summary: Save one step of the 5-step application
      description: |
        `step` is 1..5 — 1 personal, 2 farm details, 3 location (GPS auto-capture with a
        manual lat/lng fallback and the FMB polygon), 4 documents, 5 review. Each step is
        validated independently on save; cross-step validation happens at submit.
        Aadhaar and mobile become locked fields once the application is approved (BR-33).
      x-permission: farmer.application.manage_own
      x-business-rules: [BR-33]
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - name: step
          in: path
          required: true
          description: 1 personal, 2 farm, 3 location, 4 documents, 5 review.
          schema: { type: integer, minimum: 1, maximum: 5 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FarmerApplicationStepPayload' }
            example:
              location:
                gpsCaptured: true
                latitude: 11.4102
                longitude: 76.6950
                fmbPolygon:
                  type: Polygon
                  coordinates: [[[76.6948, 11.4100], [76.6953, 11.4100], [76.6953, 11.4105], [76.6948, 11.4105], [76.6948, 11.4100]]]
                village: Ithalar
                taluk: Ooty
                district: Nilgiris
      responses:
        '200':
          description: Step saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FarmerApplication' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farmers/applications/{id}/submit:
    post:
      tags: [Farmer Onboarding]
      operationId: submitFarmerApplication
      summary: Submit the application for review
      description: |
        Validates all 5 steps together and moves the application to `DOCS_REVIEW`.
        Mandatory documents are ID proof and farm documents; certification is optional at
        this stage but listings stay blocked until a certificate is verified (BR-02).
        Review SLA is 3-5 working days — an operational target, not a rules.md business rule.
      x-permission: farmer.application.submit_own
      x-business-rules: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '200':
          description: Submitted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FarmerApplication' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farmers/applications/{id}/status:
    get:
      tags: [Farmer Onboarding]
      operationId: getFarmerApplicationStatus
      summary: Application status timeline
      description: Returns the fixed timeline Submitted -> Docs Review -> Farm Verification -> Audit -> Approved.
      x-permission: farmer.application.view_own
      x-business-rules: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Status timeline.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationStatusTimeline' }
              example:
                applicationId: 5d2c1b0a-9e8f-4d3c-8b7a-6f5e4d3c2b1a
                status: FARM_VERIFICATION
                submittedAt: '2026-08-12T04:10:00Z'
                expectedDecisionBy: '2026-08-19T04:10:00Z'
                steps:
                  - status: SUBMITTED
                    reachedAt: '2026-08-12T04:10:00Z'
                    note: null
                  - status: DOCS_REVIEW
                    reachedAt: '2026-08-13T09:22:00Z'
                    note: ID proof accepted
                  - status: FARM_VERIFICATION
                    reachedAt: '2026-08-15T05:40:00Z'
                    note: Field visit scheduled
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/farmer-applications:
    get:
      tags: [Farmer Onboarding]
      operationId: listFarmerApplications
      summary: Admin review queue
      description: Super Admin and TOHFA Admin get full access; a Farmer Admin sees the queue read-only.
      x-permission: farmer.application.list_pending
      x-business-rules: []
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ApplicationStatus' }
        - name: zoneId
          in: query
          schema: { type: string, format: uuid }
        - name: submittedAfter
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Paged applications.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/FarmerApplicationSummary' }
                  page: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/farmer-applications/{id}:
    get:
      tags: [Farmer Onboarding]
      operationId: getFarmerApplication
      summary: Full application detail for review
      description: |
        Returns all five steps of one application with its uploaded documents and review
        history, for an admin deciding on it.
      x-permission: farmer.application.view
      x-business-rules: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Application detail including documents and FMB geometry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FarmerApplication' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/farmer-applications/{id}/approve:
    post:
      tags: [Farmer Onboarding]
      operationId: approveFarmerApplication
      summary: Approve an application
      description: Issues the TOHFA farmer ID (`TOHFA-F-YYYY-XXXX`) and activates the farmer account. Super Admin / TOHFA Admin only.
      x-permission: farmer.application.approve
      x-business-rules: [BR-33]
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                zoneId: { type: string, format: uuid }
                note: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Approved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FarmerApplication' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/farmer-applications/{id}/reject:
    post:
      tags: [Farmer Onboarding]
      operationId: rejectFarmerApplication
      summary: Reject an application
      description: |
        Rejects the application with a reason shown to the applicant. Rejection is terminal: the
        applicant starts a new application rather than editing this one.
      x-permission: farmer.application.reject
      x-business-rules: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reasonCode, reason]
              properties:
                reasonCode:
                  type: string
                  enum: [DOCUMENTS_INVALID, LAND_NOT_VERIFIED, DUPLICATE_APPLICANT, OUTSIDE_SERVICE_AREA, OTHER]
                reason: { type: string, minLength: 5, maxLength: 500 }
            example: { reasonCode: LAND_NOT_VERIFIED, reason: Survey number does not match the FMB polygon. }
      responses:
        '200':
          description: Rejected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FarmerApplication' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/farmer-applications/{id}/request-info:
    post:
      tags: [Farmer Onboarding]
      operationId: requestFarmerApplicationInfo
      summary: Ask the applicant for more information
      description: Moves the application back to the applicant and pauses the 3-5 working day SLA clock.
      x-permission: farmer.application.request_info
      x-business-rules: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, minLength: 5, maxLength: 1000 }
                requiredSteps:
                  type: array
                  items: { type: integer, minimum: 1, maximum: 5 }
            example: { message: Please re-upload the ID proof, the scan is unreadable., requiredSteps: [4] }
      responses:
        '200':
          description: Information requested.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FarmerApplication' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farmers/me:
    get:
      tags: [Farmer Profile & Certifications]
      operationId: getMyFarmerProfile
      summary: Own farmer profile
      description: |
        Returns the caller's own farmer profile, farms and zone assignment. A farmer can never
        read another farmer's profile through this route (BR-36).
      x-permission: farmer.profile.view_own
      x-business-rules: [BR-36]
      responses:
        '200':
          description: Farmer profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FarmerProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    patch:
      tags: [Farmer Profile & Certifications]
      operationId: updateMyFarmerProfile
      summary: Update own farmer profile
      description: |
        Aadhaar and mobile are locked (BR-33). Sending either field returns 422 with
        `INVALID_STATE_TRANSITION`; changing them requires an admin-driven re-verification.
      x-permission: farmer.profile.edit_own
      x-business-rules: [BR-33]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FarmerProfileUpdate' }
            example:
              fullName: Murugan Selvam
              farmingExperienceYears: 18
              address: 12/3 Ithalar Post, Ooty
              preferredLocale: ta
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FarmerProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farmers/me/certifications:
    get:
      tags: [Farmer Profile & Certifications]
      operationId: listMyCertifications
      summary: Own PGS / NPOP certifications
      description: |
        Lists the caller's own PGS/NPOP certification records with verification state and expiry
        countdown (BR-36).
      x-permission: certification.manage_own
      x-business-rules: [BR-36]
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paged certifications with expiry countdown.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Certification' }
                  page: { $ref: '#/components/schemas/PageMeta' }
              example:
                items:
                  - id: c1a2b3c4-d5e6-4f70-8899-aabbccddeeff
                    certType: PGS
                    certNumber: PGS-TN-2025-00871
                    issuingBody: PGS Organic India Council
                    issuedOn: '2025-04-01'
                    expiresOn: '2026-03-31'
                    verificationStatus: VERIFIED
                    daysToExpiry: -140
                    blocksListings: true
                page: { nextCursor: null, hasMore: false }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Farmer Profile & Certifications]
      operationId: createCertification
      summary: Manually enter a certification and attach its document
      description: |
        The farmer keys in the certificate details and attaches a document previously
        uploaded through `POST /uploads/sign`. The record starts `UNVERIFIED`, which
        blocks market listings until an admin verifies it (BR-02).
      x-permission: certification.manage_own
      x-business-rules: [BR-02]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CertificationCreate' }
            example:
              certType: NPOP
              certNumber: NPOP/TN/2026/44120
              issuingBody: Indian Organic Certification Agency
              issuedOn: '2026-04-01'
              expiresOn: '2027-03-31'
              documentUrl: https://cdn.tohfa.in/docs/8f1c/npop-2026.pdf
      responses:
        '201':
          description: Certification recorded, pending admin verification.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Certification' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/certifications/{id}/verify:
    post:
      tags: [Farmer Profile & Certifications]
      operationId: verifyCertification
      summary: Mark a certification verified
      description: |
        The admin checks the certificate against the issuing body's portal and records the
        outcome manually. Verifying lifts the listing block, unless the certificate is
        already expired (BR-01 still applies).
      x-permission: certification.mark_verified
      x-business-rules: [BR-01, BR-02]
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                portalReference: { type: string, maxLength: 120 }
                note: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Verified.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Certification' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/certifications/{id}/unverify:
    post:
      tags: [Farmer Profile & Certifications]
      operationId: unverifyCertification
      summary: Revoke verification and block listings
      description: Immediately re-blocks the farmer's market listings (BR-02) and withdraws any listing still pending approval.
      x-permission: certification.mark_verified
      x-business-rules: [BR-02]
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '200':
          description: Verification revoked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Certification' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /fair-prices:
    get:
      tags: [Pricing]
      operationId: listFairPrices
      summary: Effective fair price ceilings
      description: Visible to every authenticated role. Farmers use this to bound the price on a new listing (BR-07).
      x-permission: pricing.fair_price.view
      x-business-rules: [BR-07, BR-08]
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: cropId
          in: query
          schema: { type: string, format: uuid }
        - name: grade
          in: query
          schema: { $ref: '#/components/schemas/Grade' }
        - name: effectiveOn
          in: query
          description: Defaults to today.
          schema: { type: string, format: date }
      responses:
        '200':
          description: Paged ceilings.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/FairPrice' }
                  page: { $ref: '#/components/schemas/PageMeta' }
              example:
                items:
                  - id: aa11bb22-cc33-4d44-8e55-9f6677889900
                    cropId: 11112222-3333-4444-5555-666677778888
                    cropName: Carrot
                    grade: GRADE_1
                    ceilingPrice: '48.00'
                    frequency: WEEKLY
                    effectiveFrom: '2026-08-17'
                    effectiveTo: null
                page: { nextCursor: null, hasMore: false }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Pricing]
      operationId: createFairPrice
      summary: Set a fair price ceiling (Super Admin only)
      description: |
        BR-08 — only the Super Admin sets ceilings. Windows for a given crop+grade may not
        overlap; posting a new window closes the open one on the day before
        `effectiveFrom`. Every write is retained, so the history endpoint is free.
      x-permission: pricing.fair_price.set
      x-business-rules: [BR-08]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FairPriceCreate' }
            example:
              cropId: 11112222-3333-4444-5555-666677778888
              grade: GRADE_1
              ceilingPrice: '52.00'
              frequency: WEEKLY
              effectiveFrom: '2026-08-24'
              notes: Monsoon supply dip
      responses:
        '201':
          description: Ceiling set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FairPrice' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /fair-prices/bulk:
    post:
      tags: [Pricing]
      operationId: bulkUpsertFairPrices
      summary: Bulk price update (Super Admin only)
      description: All-or-nothing. If any row fails validation the whole batch is rejected and reported per index in `Problem.errors`.
      x-permission: pricing.fair_price.bulk_update
      x-business-rules: [BR-08]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { $ref: '#/components/schemas/FairPriceCreate' }
      responses:
        '200':
          description: Batch applied.
          content:
            application/json:
              schema:
                type: object
                required: [applied, items]
                properties:
                  applied: { type: integer }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/FairPrice' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /fair-prices/history:
    get:
      tags: [Pricing]
      operationId: getFairPriceHistory
      summary: Price history for a crop + grade
      description: |
        Returns every ceiling window recorded for one crop and grade, newest first, so a
        disputed listing price can be checked against the ceiling that was in force on the day
        (BR-08).
      x-permission: pricing.fair_price.view
      x-business-rules: [BR-08]
      parameters:
        - name: cropId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: grade
          in: query
          schema: { $ref: '#/components/schemas/Grade' }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Historic ceilings, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/FairPrice' }
                  page: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /retail-prices:
    get:
      tags: [Pricing]
      operationId: listRetailPrices
      summary: Customer-facing retail prices
      description: |
        Returns the customer-facing retail prices in force, each of which is at or below the
        fair price ceiling for its crop and grade (BR-09).
      x-permission: pricing.retail_price.view
      x-business-rules: [BR-09]
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: cropId
          in: query
          schema: { type: string, format: uuid }
        - name: grade
          in: query
          schema: { $ref: '#/components/schemas/Grade' }
      responses:
        '200':
          description: Paged retail prices.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RetailPrice' }
                  page: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Pricing]
      operationId: createRetailPrice
      summary: Set a retail price (Super Admin / TOHFA Admin)
      description: |
        BR-09 — the retail price must not exceed the fair price ceiling in force for the
        crop and grade on `effectiveFrom`. Violations return 422 `PRICE_ABOVE_CEILING`.
      x-permission: pricing.retail_price.set
      x-business-rules: [BR-09]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RetailPriceCreate' }
            example:
              cropId: 11112222-3333-4444-5555-666677778888
              grade: GRADE_1
              price: '69.00'
              markupPct: 32.7
              gstInclusive: true
              effectiveFrom: '2026-08-19'
      responses:
        '201':
          description: Retail price set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetailPrice' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: Price above the fair price ceiling.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://api.tohfa.in/problems/price-above-ceiling
                title: Retail price exceeds the fair price ceiling
                status: 422
                detail: Ceiling for Carrot GRADE_1 effective 2026-08-19 is INR 48.00.
                code: PRICE_ABOVE_CEILING
                correlationId: 01J9F1B2C3D4E5F6G7H8J9K0
        '500': { $ref: '#/components/responses/ServerError' }

  /listings:
    post:
      tags: [Marketing]
      operationId: createListing
      summary: Create a produce listing
      description: |
        Server-side gates, in order: expired certificate (BR-01, `CERT_EXPIRED`),
        unverified certificate (BR-02, `CERT_UNVERIFIED`), free-tier listing quota
        (BR-14, `FREE_TIER_LIMIT`), and price ceiling (BR-07, `PRICE_ABOVE_CEILING`).
        A `REJECT` grade may not be listed.
      x-permission: listing.create_own
      x-business-rules: [BR-01, BR-02, BR-07, BR-14]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ListingCreate' }
            example:
              farmId: 7c3e1a2b-4d5f-4a6b-8c9d-0e1f2a3b4c5d
              cropId: 11112222-3333-4444-5555-666677778888
              grade: GRADE_1
              quantityKg: '250.000'
              askingPricePerKg: '46.50'
              availableFrom: '2026-08-21'
              photos: [https://cdn.tohfa.in/listings/9a8b/1.jpg]
      responses:
        '201':
          description: Listing created and queued for admin approval.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Listing' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Listings blocked by certificate state.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://api.tohfa.in/problems/cert-expired
                title: Certification expired
                status: 403
                detail: NPOP certificate NPOP/TN/2025/11902 expired on 2026-03-31.
                code: CERT_EXPIRED
                correlationId: 01J9F1B2C3D4E5F6G7H8J9K1
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }
    get:
      tags: [Marketing]
      operationId: listMyListings
      summary: Own listings
      description: |
        Lists the caller's own listings across every status, newest first (BR-36).
      x-permission: listing.view_own
      x-business-rules: [BR-36]
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ListingStatus' }
      responses:
        '200':
          description: Paged listings.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Listing' }
                  page: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /listings/{id}:
    patch:
      tags: [Marketing]
      operationId: updateListing
      summary: Edit a pending listing
      description: Only a listing in `PENDING_APPROVAL` may be edited; anything else returns 409 `LISTING_NOT_PENDING`.
      x-permission: listing.update_own
      x-business-rules: [BR-07]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ListingUpdate' }
            example: { quantityKg: '180.000', askingPricePerKg: '45.00' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
