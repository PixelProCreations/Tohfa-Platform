              coverCropType: Sunn hemp
              windowStart: '2026-06-01'
              windowEnd: '2026-07-01'
      responses:
        '201':
          description: Cover crop window logged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoverCropWindow' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /pest-library:
    get:
      tags: [Pest Management]
      operationId: listPestLibrary
      summary: List the pest/disease reference library
      description: |
        Lists the global pest/disease/weed/deficiency reference catalog (FR-F07),
        optionally filtered by a free-text query (matched against name/scientific
        name) and/or a host crop. Unscoped — not farmer- or zone-specific — every
        caller reads the same static, admin-curated catalog (BR-38: no generated
        advisory text, this is reference content, not per-farmer advice).
      x-permission: pest_library.view
      x-business-rules: [BR-38]
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string, maxLength: 120 }
          description: Free-text match against name and scientificName.
        - name: crop
          in: query
          required: false
          schema: { type: string, maxLength: 60 }
          description: Filter to entries whose crops array contains this crop.
      responses:
        '200':
          description: The pest reference library.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PestLibraryEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /pest-library/{pestLibraryId}:
    get:
      tags: [Pest Management]
      operationId: getPestLibraryEntry
      summary: Get one pest/disease reference library entry
      description: |
        Fetches one entry from the global pest reference catalog (FR-F07).
        Unscoped — not farmer- or zone-specific. A pestLibraryId that does not
        exist 404s.
      x-permission: pest_library.view
      x-business-rules: [BR-38]
      parameters:
        - name: pestLibraryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The pest reference library entry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PestLibraryEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /weather-risk-notes:
    get:
      tags: [Pest Management]
      operationId: listWeatherRiskNotes
      summary: List admin-authored regional weather risk notes
      description: |
        Lists admin-authored, region-scoped weather/risk advisory notes (FR-F07 —
        the Pest Library screen's weather banner). This is static hand-typed
        content an admin sets, never a computed risk model wired to a live
        weather feed (BR-38). Unscoped by farm/zone; a future release may add a
        `region` filter once the admin authoring UI exists.
      x-permission: pest_library.view
      x-business-rules: [BR-38]
      responses:
        '200':
          description: Currently valid weather risk notes.
