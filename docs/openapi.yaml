        created by someone else, is rejected as `VALIDATION_FAILED` rather than
        silently linked. A farm id that does not exist, or belongs to another
        farmer, 404s rather than 403 (BR-36).
      x-permission: farmer.workforce.manage_own
      x-business-rules: [BR-36, BR-41]
