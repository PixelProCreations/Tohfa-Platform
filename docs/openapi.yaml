                  page: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Livestock]
      operationId: createMyLivestockProductionLog
      summary: Log a production entry
      description: |
        Creates a `livestock_production_logs` row on the caller's primary
