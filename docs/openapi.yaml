  /fair-prices:
    get:
      tags: [Pricing]
      operationId: listFairPrices
      summary: Effective fair price ceilings
      description: Visible to every authenticated role. Farmers use this to bound the price on a new listing (BR-07).
      x-permission: pricing.fair_price.view
      x-business-rules: [BR-07, BR-08]
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: cropId
          in: query
          schema: { type: string, format: uuid }
        - name: grade
          in: query
          schema: { $ref: '#/components/schemas/Grade' }
        - name: effectiveOn
          in: query
          description: Defaults to today.
          schema: { type: string, format: date }
      responses:
        '200':
          description: Paged ceilings.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/FairPrice' }
                  page: { $ref: '#/components/schemas/PageMeta' }
              example:
                items:
                  - id: aa11bb22-cc33-4d44-8e55-9f6677889900
                    cropId: 11112222-3333-4444-5555-666677778888
                    cropName: Carrot
                    grade: GRADE_1
                    ceilingPrice: '48.00'
                    frequency: WEEKLY
                    effectiveFrom: '2026-08-17'
                    effectiveTo: null
                page: { nextCursor: null, hasMore: false }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Pricing]
      operationId: createFairPrice
      summary: Set a fair price ceiling (Super Admin only)
      description: |
        BR-08 — only the Super Admin sets ceilings. Windows for a given crop+grade may not
        overlap; posting a new window closes the open one on the day before
        `effectiveFrom`. Every write is retained, so the history endpoint is free.
      x-permission: pricing.fair_price.set
      x-business-rules: [BR-08]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FairPriceCreate' }
            example:
              cropId: 11112222-3333-4444-5555-666677778888
              grade: GRADE_1
              ceilingPrice: '52.00'
              frequency: WEEKLY
              effectiveFrom: '2026-08-24'
              notes: Monsoon supply dip
      responses:
        '201':
          description: Ceiling set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FairPrice' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /fair-prices/bulk:
    post:
      tags: [Pricing]
      operationId: bulkUpsertFairPrices
      summary: Bulk price update (Super Admin only)
      description: All-or-nothing. If any row fails validation the whole batch is rejected and reported per index in `Problem.errors`.
      x-permission: pricing.fair_price.bulk_update
      x-business-rules: [BR-08]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { $ref: '#/components/schemas/FairPriceCreate' }
      responses:
        '200':
          description: Batch applied.
          content:
            application/json:
              schema:
                type: object
                required: [applied, items]
                properties:
                  applied: { type: integer }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/FairPrice' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /fair-prices/history:
    get:
      tags: [Pricing]
      operationId: getFairPriceHistory
      summary: Price history for a crop + grade
      description: |
        Returns every ceiling window recorded for one crop and grade, newest first, so a
        disputed listing price can be checked against the ceiling that was in force on the day
        (BR-08).
      x-permission: pricing.fair_price.view
      x-business-rules: [BR-08]
      parameters:
        - name: cropId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: grade
          in: query
          schema: { $ref: '#/components/schemas/Grade' }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Historic ceilings, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/FairPrice' }
                  page: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /retail-prices:
    get:
      tags: [Pricing]
      operationId: listRetailPrices
      summary: Customer-facing retail prices
      description: |
        Returns the customer-facing retail prices in force, each of which is at or below the
        fair price ceiling for its crop and grade (BR-09).
      x-permission: pricing.retail_price.view
      x-business-rules: [BR-09]
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: cropId
          in: query
          schema: { type: string, format: uuid }
        - name: grade
          in: query
          schema: { $ref: '#/components/schemas/Grade' }
      responses:
        '200':
          description: Paged retail prices.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RetailPrice' }
                  page: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Pricing]
      operationId: createRetailPrice
      summary: Set a retail price (Super Admin / TOHFA Admin)
      description: |
        BR-09 — the retail price must not exceed the fair price ceiling in force for the
        crop and grade on `effectiveFrom`. Violations return 422 `PRICE_ABOVE_CEILING`.
      x-permission: pricing.retail_price.set
      x-business-rules: [BR-09]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RetailPriceCreate' }
            example:
              cropId: 11112222-3333-4444-5555-666677778888
              grade: GRADE_1
              price: '69.00'
              markupPct: 32.7
              gstInclusive: true
              effectiveFrom: '2026-08-19'
      responses:
        '201':
          description: Retail price set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetailPrice' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: Price above the fair price ceiling.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://api.tohfa.in/problems/price-above-ceiling
                title: Retail price exceeds the fair price ceiling
                status: 422
                detail: Ceiling for Carrot GRADE_1 effective 2026-08-19 is INR 48.00.
                code: PRICE_ABOVE_CEILING
                traceId: 01J9F1B2C3D4E5F6G7H8J9K0
        '500': { $ref: '#/components/responses/ServerError' }

  /listings:
    post:
      tags: [Marketing]
      operationId: createListing
      summary: Create a produce listing
      description: |
        Server-side gates, in order: certificate eligibility (BR-01, BR-02), free-tier
        listing quota (BR-14, `FREE_TIER_LIMIT`), and price ceiling (BR-07,
        `PRICE_ABOVE_CEILING`). A `REJECT` grade may not be listed.

        Certificate eligibility is decided for the farmer, not per certificate. Holding
        any one verified, unexpired PGS or NPOP certificate is enough; other expired,
        unverified or rejected certificates never block. A certificate stays valid
        through its `expiresOn` date (Asia/Kolkata). If no certificate qualifies, the
        response is `CERT_UNVERIFIED` when an unexpired certificate is awaiting admin
        verification, `CERT_EXPIRED` otherwise when one has expired, and `CERT_MISSING`
        when the farmer has no certificate at all or only unexpired rejected ones. This
        check does not depend on `farmers.is_market_blocked`. A farmer whose market block
        is set also gets `CERT_EXPIRED`, checked after certificate eligibility. All
        three are 422.

        `Idempotency-Key` is required (BR-68): a missing or blank key is 422 `VALIDATION_FAILED`.
        Replaying a key with the same request by the same farmer returns the original 201
        listing and creates no second row; the same key with a different request is 409
        `IDEMPOTENCY_KEY_REUSED`. A refused attempt (any 4xx/5xx) is not remembered, so the key
        can be reused after the cause is fixed. Keys are per farmer and kept 24 hours.

        The `listingNumber` (`LST-YYYY-NNNN`) is unique even when many farmers create at the
        same moment, and a number is never reused (BR-71); concurrent creates never fail on it.
      x-permission: listing.create_own
      x-business-rules: [BR-01, BR-02, BR-07, BR-14, BR-68, BR-71]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ListingCreate' }
            example:
              farmId: 7c3e1a2b-4d5f-4a6b-8c9d-0e1f2a3b4c5d
              cropId: 11112222-3333-4444-5555-666677778888
              grade: GRADE_1
              quantityKg: '250.000'
              askingPricePerKg: '46.50'
              availableFrom: '2026-08-21'
              photos: [https://cdn.tohfa.in/listings/9a8b/1.jpg]
      responses:
        '201':
          description: Listing created and queued for admin approval.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Listing' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: |
            Refused with 422 in every case: field validation (`VALIDATION_FAILED`, also for a
            `REJECT` grade, and a missing or blank `Idempotency-Key`), certificate eligibility (`CERT_MISSING`, `CERT_UNVERIFIED`,
            `CERT_EXPIRED`; BR-01, BR-02 — see the operation description), free-tier quota
            (`FREE_TIER_LIMIT`; BR-14) or price ceiling (`PRICE_ABOVE_CEILING`; BR-07). Only PGS
            and NPOP certificates are considered: a farmer holding only `OTHER` certificates gets
            `CERT_MISSING`, and an `OTHER` certificate is never the one named as pending or expired.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                certMissing:
                  summary: No PGS or NPOP certificate on file (none, only OTHER ones, or only rejected ones)
                  value:
                    type: https://api.tohfa.in/problems/cert-missing
                    title: No qualifying certificate on file
                    status: 422
                    detail: No verified PGS or NPOP certificate on file. Add one and have it verified to list produce.
                    code: CERT_MISSING
                    traceId: 01J9F1B2C3D4E5F6G7H8J9K1
                certUnverified:
                  summary: Nothing qualifies, and an unexpired PGS or NPOP certificate awaits admin verification
                  value:
                    type: https://api.tohfa.in/problems/cert-unverified
                    title: Certification is not verified
                    status: 422
                    detail: Certificate PGS/TN/2026/0042 is pending verification.
                    code: CERT_UNVERIFIED
                    traceId: 01J9F1B2C3D4E5F6G7H8J9K1
                certExpired:
                  summary: Nothing qualifies or pending, and a PGS or NPOP certificate has expired
                  value:
                    type: https://api.tohfa.in/problems/cert-expired
                    title: Certification has expired
                    status: 422
                    detail: NPOP certificate NPOP/TN/2025/11902 expired on 2026-03-31.
                    code: CERT_EXPIRED
                    traceId: 01J9F1B2C3D4E5F6G7H8J9K1
                priceAboveCeiling:
                  summary: Asking price above the fair price ceiling
                  value:
                    type: https://api.tohfa.in/problems/price-above-ceiling
                    title: Price exceeds the fair price ceiling
                    status: 422
                    detail: Asking price ₹52.01 exceeds fair price ceiling of ₹52.00.
                    code: PRICE_ABOVE_CEILING
                    meta: { ceilingPrice: '52.00', attemptedPrice: '52.01' }
                    traceId: 01J9F1B2C3D4E5F6G7H8J9K1
        '500': { $ref: '#/components/responses/ServerError' }
    get:
      tags: [Marketing]
      operationId: listMyListings
      summary: Own listings
      description: |
        Lists the caller's own listings across every status, newest first (BR-36).
      x-permission: listing.view_own
      x-business-rules: [BR-36]
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ListingStatus' }
      responses:
        '200':
          description: Paged listings.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Listing' }
                  page: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /listings/{id}:
    patch:
      tags: [Marketing]
      operationId: updateListing
      summary: Edit a pending listing
      description: Only a listing in `PENDING_APPROVAL` may be edited; anything else returns 409 `LISTING_NOT_PENDING`.
      x-permission: listing.update_own
      x-business-rules: [BR-07]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ListingUpdate' }
            example: { quantityKg: '180.000', askingPricePerKg: '45.00' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Listing' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /listings/{id}/withdraw:
    post:
      tags: [Marketing]
      operationId: withdrawListing
      summary: Withdraw own listing
      description: |
        Withdraws the caller's own listing while it is still pending approval; an approved
        listing cannot be withdrawn and returns 409.
        `Idempotency-Key` is required (BR-68): a missing or blank key is 422 `VALIDATION_FAILED`;
        replaying a key with the same request returns the original response and changes nothing
        again; the same key with a different request is 409 `IDEMPOTENCY_KEY_REUSED`.
      x-permission: listing.withdraw_own
      x-business-rules: [BR-68]
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '200':
          description: Withdrawn.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Listing' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/listings:
    get:
      tags: [Marketing]
      operationId: listPendingListings
      summary: Admin approval queue
      description: |
        A Farmer Admin sees the queue with their own listings flagged
        `routedAway: true` — those rows are read-only for them (BR-29).
      x-permission: listing.queue.view_pending
      x-business-rules: [BR-29]
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ListingStatus' }
        - name: cropId
          in: query
          schema: { type: string, format: uuid }
        - name: zoneId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Paged queue.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AdminListing' }
                  page: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/listings/{id}/approve:
    post:
      tags: [Marketing]
      operationId: approveListing
      summary: Approve a listing and raise the purchase order
      description: |
        Approval accepts the listing at its asking price (or at the accepted counter-offer
        price) and issues a purchase order to the destination warehouse. A Farmer Admin
        approving their own listing is refused with 403 `SELF_APPROVAL_FORBIDDEN`; the
        listing is auto-routed to another admin (BR-29).
      x-permission: listing.approve
      x-business-rules: [BR-07, BR-29]
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [warehouseId]
              properties:
                warehouseId: { type: string, format: uuid }
                expectedDeliveryDate: { type: string, format: date }
                note: { type: string, maxLength: 500 }
            example:
              warehouseId: 3f1b7c2e-2a44-4f0e-9b1a-6b0d2f0f1a01
              expectedDeliveryDate: '2026-08-22'
      responses:
        '200':
          description: Approved; the purchase order reference is returned.
          content:
            application/json:
              schema:
                type: object
                required: [listing, purchaseOrder]
                properties:
                  listing: { $ref: '#/components/schemas/Listing' }
                  purchaseOrder: { $ref: '#/components/schemas/PurchaseOrder' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Self-approval refused.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://api.tohfa.in/problems/self-approval-forbidden
                title: Self-approval is not permitted
                status: 403
                detail: A Farmer Admin cannot approve their own listing; it has been routed to another admin.
                code: SELF_APPROVAL_FORBIDDEN
                traceId: 01J9F1B2C3D4E5F6G7H8J9K2
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/listings/{id}/reject:
    post:
      tags: [Marketing]
      operationId: rejectListing
      summary: Reject a listing
      description: |
        Rejects a pending listing with a reason the farmer sees. A Farmer Admin may not reject
        their own listing — it is auto-routed to another admin (BR-29).
      x-permission: listing.reject
      x-business-rules: [BR-29]
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reasonCode, reason]
              properties:
                reasonCode:
                  type: string
                  enum: [QUALITY_CONCERN, PRICE_UNACCEPTABLE, NO_DEMAND, CERT_ISSUE, DUPLICATE, OTHER]
                reason: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '200':
          description: Rejected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Listing' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/listings/{id}/counter-offers:
    post:
      tags: [Marketing]
      operationId: createCounterOffer
      summary: Send a counter-offer to the farmer
      description: |
        The worked example from the requirements: the farmer lists Grade 1 at INR 100/kg,
        the admin counters INR 75/kg for 75 kg. The farmer has 24 hours to respond
        (BR-10) and the pair may exchange at most 3 rounds (BR-11). A Farmer Admin may
        not counter their own listing (BR-29).
      x-permission: listing.counter_offer.send
      x-business-rules: [BR-07, BR-10, BR-11, BR-29]
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CounterOfferCreate' }
            example:
              pricePerKg: '75.00'
              quantityKg: '75.000'
              message: Grade 1 demand is soft this week; we can take 75 kg at this price.
      responses:
        '201':
          description: Counter-offer sent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CounterOffer' }
              example:
                id: e5f6a7b8-c9d0-4e1f-8a2b-3c4d5e6f7a8b
                listingId: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
                round: 1
                offeredBy: ADMIN
                pricePerKg: '75.00'
                quantityKg: '75.000'
                status: PENDING
                expiresAt: '2026-08-19T06:30:00Z'
                message: Grade 1 demand is soft this week; we can take 75 kg at this price.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: All 3 counter rounds have been used.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://api.tohfa.in/problems/counter-rounds-exhausted
                title: Counter rounds exhausted
                status: 409
                detail: This listing has already been countered 3 times; approve or reject it.
                code: COUNTER_LIMIT_REACHED
                traceId: 01J9F1B2C3D4E5F6G7H8J9K3
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /listings/{id}/counter-offers/{offerId}/accept:
    post:
      tags: [Marketing]
      operationId: acceptCounterOffer
      summary: Farmer accepts the counter-offer
      description: |
        Accepting fixes the final price and quantity and moves the listing to `ACCEPTED`. Past `expiresAt` this returns 409 `COUNTER_OFFER_EXPIRED` (BR-10).
        When the offer is a quality counter-offer sent at goods receipt, accepting it also stocks that receipt
        as one inventory batch in the same transaction, if it is not stocked yet (BR-106; see
        `createGoodsReceiptCounterOffer`). The response is still the farmer's `Listing`: the batch is
        warehouse data and is read on the goods receipt (`GoodsReceipt.batchId`).
        `Idempotency-Key` is required (BR-68): a missing or blank key is 422 `VALIDATION_FAILED`;
        replaying a key with the same request returns the original response and changes nothing
        again; the same key with a different request is 409 `IDEMPOTENCY_KEY_REUSED`.
      x-permission: listing.counter_offer.respond
      x-business-rules: [BR-10, BR-68, BR-106]
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - $ref: '#/components/parameters/OfferIdParam'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '200':
          description: Accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Listing' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /listings/{id}/counter-offers/{offerId}/reject:
    post:
      tags: [Marketing]
      operationId: rejectCounterOffer
      summary: Farmer rejects the counter-offer
      description: |
        The farmer declines the counter-offer. The round closes and the listing returns to the
        admin queue for a further decision (BR-10).
        `Idempotency-Key` is required (BR-68): a missing or blank key is 422 `VALIDATION_FAILED`;
        replaying a key with the same request returns the original response and changes nothing
        again; the same key with a different request is 409 `IDEMPOTENCY_KEY_REUSED`.
      x-permission: listing.counter_offer.respond
      x-business-rules: [BR-10, BR-68]
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - $ref: '#/components/parameters/OfferIdParam'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                message: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Rejected; the listing returns to the admin queue for a final decision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CounterOffer' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /listings/{id}/counter-offers/{offerId}/counter:
    post:
      tags: [Marketing]
      operationId: counterBackCounterOffer
      summary: Farmer counters back
      description: |
        Opens round N+1. Refused with 409 `COUNTER_LIMIT_REACHED` once round 3 has closed (BR-11).
        `Idempotency-Key` is required (BR-68): a missing or blank key is 422 `VALIDATION_FAILED`;
        replaying a key with the same request returns the original response and changes nothing
        again; the same key with a different request is 409 `IDEMPOTENCY_KEY_REUSED`.
      x-permission: listing.counter_offer.respond
      x-business-rules: [BR-07, BR-10, BR-11, BR-68]
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - $ref: '#/components/parameters/OfferIdParam'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CounterOfferCreate' }
            example: { pricePerKg: '85.00', quantityKg: '100.000', message: I can do 100 kg at 85. }
      responses:
        '201':
          description: Counter round opened.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CounterOffer' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/purchase-orders:
    get:
      tags: [Purchase]
      operationId: listPurchaseOrders
      summary: Purchase orders raised to farmers
      description: Sub Warehouse Admins see only their own warehouse (BR-30).
      x-permission: purchase.order.view
      x-business-rules: [BR-30]
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
        - { name: status, in: query, schema: { $ref: '#/components/schemas/PurchaseOrderStatus' } }
        - { name: warehouseId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Paged purchase orders.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/PurchaseOrder' } }
                  page: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/purchase-orders/{id}:
    get:
      tags: [Purchase]
      operationId: getPurchaseOrder
      summary: Purchase order detail with receipts
      description: |
        Returns one purchase order with its goods receipts and settlement state. A Sub Warehouse
        Admin sees only orders for its own warehouse (BR-30).
      x-permission: purchase.order.view
      x-business-rules: [BR-30]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '200':
          description: Purchase order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrderDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/goods-receipts:
    get:
      tags: [Purchase]
      operationId: listGoodsReceipts
      summary: List goods receipts
      description: |
        Lists goods receipts with warehouse scoping (BR-30). A caller with an assigned warehouse (a
        Sub Warehouse Admin, whose grant here is `all`, or a Main admin confined to one warehouse)
        sees only its assigned warehouses; a Main, Super or Tohfa admin with no assigned warehouse
        sees all four. A `warehouseId` naming a warehouse the caller cannot reach is an empty
        page (200), the same as an unknown warehouse: a cross-scope list is an empty result set,
        never a 403 and never a leak; only a read or write BY ID is 404.
      x-permission: inventory.goods_receipt.record
      x-business-rules: [BR-30]
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
        - { name: warehouseId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [AWAITING_QC, ACCEPTED, PARTIALLY_ACCEPTED, REJECTED, COUNTER_OFFERED] } }
        - { name: purchaseOrderId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Paged goods receipts.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/GoodsReceipt' } }
                  page: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

    post:
      tags: [Purchase]
      operationId: createGoodsReceipt
      summary: Receive goods against a purchase order
      description: |
        Warehouse-side intake. `acceptedQtyKg + rejectedQtyKg` must not exceed
        `grossQtyKg`. The receipt is created in `AWAITING_QC`; stock only enters the
        ledger once the quality check passes. Scoped to the caller's warehouse (BR-30).
        A caller confined to assigned warehouses who names another warehouse, or a purchase order
        destined for another warehouse, gets the same 404 as for an id that does not exist, and
        nothing is written.
      x-permission: inventory.goods_receipt.record
      x-business-rules: [BR-30, BR-37]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKeyHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoodsReceiptCreate' }
            example:
              purchaseOrderId: 6b5a4c3d-2e1f-4a09-8b7c-6d5e4f3a2b1c
              warehouseId: 3f1b7c2e-2a44-4f0e-9b1a-6b0d2f0f1a01
              grossQtyKg: '250.000'
              vehicleNumber: TN43AB1234
              photos: [https://cdn.tohfa.in/grn/2026/aug/2b1c-1.jpg]
      responses:
        '201':
          description: Goods receipt note created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GoodsReceipt' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/goods-receipts/{id}:
    get:
      tags: [Purchase]
      operationId: getGoodsReceipt
      summary: Get goods receipt detail
      description: |
        Returns goods receipt by ID with warehouse scoping (BR-30). Another warehouse's receipt is
        the same 404 as an id that does not exist, also for a Sub Warehouse Admin whose grant is
        `all`.
      x-permission: inventory.goods_receipt.record
      x-business-rules: [BR-30]
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
      responses:
        '200':
          description: Goods receipt details.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GoodsReceipt' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/goods-receipts/{id}/quality-check:
    post:
      tags: [Purchase]
      operationId: recordQualityCheck
      summary: Record the 5-point quality check
      description: |
        The assigned grade may differ from the listed grade, which triggers a price
        adjustment. On `ACCEPTED` or `PARTIALLY_ACCEPTED` with an accepted quantity above zero
        the accepted goods are stocked as ONE inventory batch, in the same transaction as the
        check (BR-106): code `BATCH-<year>-<6 digits>`; grade = `assignedGrade` (not the listed
        grade); `qtyReceivedKg` = `acceptedQtyKg` only (never the rejected part); `costPerKg` =
        the purchase order's agreed price as-is (`priceAdjustment` is recorded on the check but
        not applied); `expiryOn` and `storageLocation` copied from the request, `expiryOn` null
        when not given. One `RECEIPT` row is appended to the stock ledger (BR-37), the batch is
        allocated across the channels (BR-12), and one `inventory.batch.assign` audit row is
        written. A `REJECT` grade is never sellable, so it is never stocked; a `REJECTED`
        outcome stocks nothing. `batch` is then `null`. A receipt that is already stocked is
        409 `CONFLICT` and nothing is written. Another warehouse's receipt is the same 404 as
        an id that does not exist, and nothing is written (BR-30).
      x-permission: inventory.quality_check.perform
      x-business-rules: [BR-30, BR-37, BR-12, BR-106]
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
        - { $ref: '#/components/parameters/IdempotencyKeyHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QualityCheckCreate' }
            example:
              assignedGrade: GRADE_2
              outcome: PARTIALLY_ACCEPTED
              acceptedQtyKg: '220.000'
              rejectedQtyKg: '30.000'
              moisturePct: 12.4
              visualScore: 7
              defectNotes: Minor surface bruising on 30 kg.
              priceAdjustment: '-4.00'
              storageLocation: A-04-R2
      responses:
        '201':
          description: Quality check recorded; `batch` is the batch created when stock was accepted, else `null` (BR-106).
          content:
            application/json:
              schema:
                type: object
                required: [qualityCheck, batch]
                properties:
                  qualityCheck: { $ref: '#/components/schemas/QualityCheck' }
                  batch:
                    oneOf:
                      - { $ref: '#/components/schemas/Batch' }
                      - { type: 'null' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/goods-receipts/{id}/counter-offer:
    post:
      tags: [Purchase]
      operationId: createGoodsReceiptCounterOffer
      summary: Counter-offer to the farmer on a quality shortfall
      description: |
        Offers a revised price for the delivered lot when the quality check downgrades it. Another
        warehouse's receipt is the same 404 as an id that does not exist, and nothing is written (BR-30).

        Unconfirmed default (owner decision pending; docs/rules.md BR-10 lists the quality counter-offer
        as a second surface that is not specified yet): the offer is a round of the negotiation on the
        listing behind the receipt's purchase order. It is stored in `counter_offers` with that
        `listingId`, `offeredBy: ADMIN` and this receipt as `goodsReceiptId`; it takes the listing's next
        round under the same ceiling as the listing counter-offers (`system_config.max_counter_rounds` + 1,
        BR-11); it expires `system_config.counter_offer_window_hours` after creation (BR-10, read on every
        request; an unset or invalid value is a 500, there is no literal fallback); the listing moves from
        ACCEPTED to COUNTER_OFFERED and the receipt to COUNTER_OFFERED (its quantities and rejection
        reason are kept). The farmer is notified as for a listing counter-offer and answers it with
        `POST /listings/{id}/counter-offers/{offerId}/accept|reject|counter`. Accepting sets the listing's
        final price and quantity to the offer; a farmer reject or an expiry returns the listing to ACCEPTED
        (its state before this offer), never to PENDING_APPROVAL. Sending the offer stocks nothing
        (BR-106): when the farmer ACCEPTS it, a receipt that is not stocked yet is stocked as one batch in
        the accept's transaction (the inspector's grade, expiry and storage location from this receipt's
        quality check; the offer quantity capped at the receipt's gross quantity; the purchase order's
        price as the cost); a reject or a lapse stocks nothing. A receipt already stocked by its quality
        check, or with no quality check, is not stocked by the accept. What happens next to the receipt
        status, the purchase order and the payout is not specified and is not changed by this endpoint.
      x-permission: inventory.quality.counter_offer
      x-business-rules: [BR-10, BR-11, BR-30, BR-106]
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
        - { $ref: '#/components/parameters/IdempotencyKeyHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CounterOfferCreate' }
      responses:
        '201':
          description: Counter-offer sent. `listingId`, `goodsReceiptId` and `offeredByUserId` are always set on this endpoint.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CounterOffer' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `CONFLICT`: a counter-offer on the lot's listing is still PENDING (a second quality
            counter-offer on the same receipt, or a farmer counter waiting for an answer), or a concurrent
            request won the round. `COUNTER_LIMIT_REACHED`: the listing has used every round (BR-11).
            `INVALID_STATE_TRANSITION`: the lot's listing is not ACCEPTED. Nothing is written.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://api.tohfa.in/problems/counter-rounds-exhausted
                title: No counter-offer rounds remain
                status: 409
                code: COUNTER_LIMIT_REACHED
                detail: This lot's listing has no counter-offer rounds left.
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

