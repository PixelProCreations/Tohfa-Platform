  /farmers/me/farm-assets:
    get:
      tags: [Farm Assets]
      operationId: listMyFarmAssets
      summary: List own tools/equipment/machinery
      description: |
        Lists the caller's own `farm_assets` rows across every one of their
        `farms` (land locations), newest first, optionally filtered by
        `category` or `dueOnly`. `status` and `dueNote` are computed on every
        read from `nextServiceDueOn` vs today (Asia/Kolkata) — they are never
        stored. `dueOnly=true` returns DUE_SOON and OVERDUE rows only, the
        same combined "due" count FarmInventoryScreen.tsx's per-category
        badge shows.
      x-permission: farmer.assets.view_own
      parameters:
        - name: category
          in: query
          schema: { $ref: '#/components/schemas/FarmAssetCategory' }
        - name: dueOnly
          in: query
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paged farm assets.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/FarmAsset' }
                  page: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Farm Assets]
      operationId: createMyFarmAsset
      summary: Register a new tool/equipment/machinery item
      description: |
        Creates a new `farm_assets` row on the given `farmId`. A `farmId` the
        caller does not own returns 404, never 403. `nextServiceDueOn` is
        never accepted in the request — it is a database-generated column
        computed from `purchasedOn`/`lastServicedOn`/`serviceIntervalDays`
        (see `FarmAsset`'s description).
      x-permission: farmer.assets.create_own
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FarmAssetCreateRequest' }
      responses:
        '201':
          description: Farm asset registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FarmAsset' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farmers/me/farm-assets/{assetId}:
    get:
      tags: [Farm Assets]
      operationId: getMyFarmAsset
      summary: Own farm asset detail
      description: |
        Returns one own `farm_assets` row. An `assetId` belonging to another
        farmer, guessed or passed explicitly, returns 404 — indistinguishable
        from a nonexistent id.
      x-permission: farmer.assets.view_own
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The farm asset.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FarmAsset' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    patch:
      tags: [Farm Assets]
      operationId: updateMyFarmAsset
      summary: Edit an own farm asset
      description: |
        Partially updates an own `farm_assets` row, including recording that a
        service happened (`lastServicedOn`) — `nextServiceDueOn` recomputes
        itself (a generated column) the moment this write lands. `farmId` and
        `category` are NOT present — re-pointing an asset at a different land
        location or re-categorising it is a delete-and-recreate, not an edit.
      x-permission: farmer.assets.edit_own
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FarmAssetUpdateRequest' }
      responses:
        '200':
          description: Updated farm asset.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FarmAsset' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [Farm Assets]
      operationId: deleteMyFarmAsset
      summary: Retire an own farm asset (soft delete)
      description: |
        Soft-deletes an own `farm_assets` row (sets `deletedAt`) — a farmer
        retiring a broken tool, not a sale record. An `assetId` belonging to
        another farmer returns 404.
      x-permission: farmer.assets.edit_own
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Farm asset retired.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/farmers/{farmerId}/farm-assets:
    get:
      tags: [Farm Assets]
      operationId: listFarmAssetsForFarmer
      summary: A farmer's tools/equipment/machinery (admin)
      description: |
        Lists one farmer's `farm_assets` rows across every one of their
        `farms`. Read-only: there is no admin-manageable asset taxonomy,
        unlike crops' crop_master.
