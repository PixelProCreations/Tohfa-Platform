      responses:
        '201':
          description: Category created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiaryCategory' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/diary/categories/{key}:
    patch:
      tags: [Farm Diary]
      operationId: updateDiaryCategory
      summary: Edit or retire an activity taxonomy category
      description: |
        Partially updates a category, including retiring it via `isActive: false`. A
        retired category is excluded from the farmer-facing taxonomy and from new-entry
        validation, but is never hard-deleted — existing diary entries referencing it
        remain valid (BR-45).
      x-permission: admin.diary_taxonomy.manage
      x-business-rules: [BR-45]
      parameters:
        - name: key
          in: path
          required: true
          description: 'Category key, e.g. land_prep.'
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiaryCategoryUpdateRequest' }
      responses:
        '200':
          description: Updated category.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiaryCategory' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/diary/categories/{categoryKey}/sub-activities:
    post:
      tags: [Farm Diary]
      operationId: createDiarySubActivity
      summary: Create a sub-activity under a taxonomy category
      description: |
        Adds a new sub-activity beneath an existing category. `key` must be
        `<categoryKey>.<name>` (e.g. `land_prep.ploughing_tilling`) or the request is
        rejected with `VALIDATION_FAILED`; a `key` that already exists returns 409
        (BR-45).
      x-permission: admin.diary_taxonomy.manage
      x-business-rules: [BR-45]
      parameters:
        - name: categoryKey
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiarySubActivityCreateRequest' }
      responses:
        '201':
          description: Sub-activity created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiarySubActivity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/diary/sub-activities/{key}:
    patch:
      tags: [Farm Diary]
      operationId: updateDiarySubActivity
      summary: Edit or retire a sub-activity
      description: |
        Partially updates a sub-activity, including retiring it via `isActive: false`,
        following the same never-hard-delete rule as its parent category (BR-45).
      x-permission: admin.diary_taxonomy.manage
      x-business-rules: [BR-45]
      parameters:
        - name: key
          in: path
          required: true
          description: 'Sub-activity key, e.g. land_prep.ploughing_tilling.'
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiarySubActivityUpdateRequest' }
      responses:
        '200':
          description: Updated sub-activity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiarySubActivity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farmers/me/crop-master:
    get:
      tags: [Crops]
      operationId: listMyCropMaster
      summary: Active crop types
      description: |
        Lists the active crop taxonomy (`crop_master`), for use as the crop type
        picker when planting a new crop. Inactive crop types are excluded, the
        same way the farm diary taxonomy hides retired categories.
      x-permission: farmer.crops.view_own
      responses:
        '200':
          description: Active crop types.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CropMaster' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farmers/me/crop-planning-insight:
    get:
      tags: [Crops]
      operationId: getCropPlanningInsight
      summary: Read-only crop planning insight aggregator
      description: |
        Consolidates active plantings, expected yields, acreage, seasonal availability,
        and plot rotation history for the caller farmer without automated advisory (BR-38, BR-36).
      x-permission: farmer.crops.view_own
      x-business-rules: [BR-38, BR-36]
      responses:
        '200':
          description: Consolidated crop planning insights.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CropPlanningInsightResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farmers/me/plots/{plotId}/crops:
    get:
      tags: [Crops]
      operationId: listMyPlotCrops
      summary: A plot's planting history
      description: |
        Lists the caller's own `farm_crops` rows on the given plot, newest first,
        optionally filtered by status. A `plotId` the caller does not own returns
        an empty page, never a 403 or 404 (the same doctrine as farm-diary's
        BR-40a).
      x-permission: farmer.crops.view_own
      x-business-rules: [BR-46]
      parameters:
        - name: plotId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/FarmCropStatus' }
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paged planting records for the plot.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/FarmCrop' }
                  page: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Crops]
      operationId: createMyPlotCrop
      summary: Plant a new crop on an own plot
      description: |
        Creates a new `farm_crops` row on the given plot in status `PLANNED` (the
        column default). A `plotId` the caller does not own returns 404, never 403.
        `cropMasterId` must reference an existing crop type or the request is 404.
        Moving the new row into status `GROWING` — where BR-46 is checked — happens
        afterward via `PATCH /farmers/me/crops/{farmCropId}`.
      x-permission: farmer.crops.create_own
      x-business-rules: [BR-46]
      parameters:
        - name: plotId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FarmCropCreateRequest' }
      responses:
        '201':
          description: Crop planted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FarmCrop' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farmers/me/plots/{plotId}/crop-rotation:
    get:
      tags: [Crops]
      operationId: getMyPlotCropRotation
      summary: A plot's crop rotation history
      description: |
        Most-recent-first planting history for one plot — every live (non-deleted)
        `farm_crops` row planted on it, for the crop rotation timeline view. A
        `plotId` the caller does not own returns an empty history, never a 403 or
        404.
      x-permission: farmer.crops.view_own
      parameters:
        - name: plotId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The plot's rotation history.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlotRotationHistory' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farmers/me/crops/{farmCropId}:
    get:
      tags: [Crops]
      operationId: getMyFarmCrop
      summary: Own crop detail
      description: |
        Returns one own `farm_crops` row. A `farmCropId` belonging to another
        farmer, guessed or passed explicitly, returns 404 — indistinguishable from
        a nonexistent id.
      x-permission: farmer.crops.view_own
      parameters:
        - name: farmCropId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The crop.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FarmCrop' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    patch:
      tags: [Crops]
      operationId: updateMyFarmCrop
      summary: Edit an own crop
      description: |
        Partially updates an own `farm_crops` row: status transitions, recording a
        harvest (`actualHarvestOn`/`actualYieldKg`), or editing seed/grade detail.
        `plotId` and `cropMasterId` are NOT present — re-pointing a planting record
        at a different plot or crop type is a delete-and-recreate, not an edit.
        Moving `status` to `GROWING` when the plot already has another live
        `GROWING` crop is rejected with 409 `CROP_PLOT_ALREADY_GROWING` (BR-46).
      x-permission: farmer.crops.edit_own
      x-business-rules: [BR-46]
      parameters:
        - name: farmCropId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FarmCropUpdateRequest' }
      responses:
        '200':
          description: Updated crop.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FarmCrop' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farmers/me/crops/{farmCropId}/inputs:
    get:
      tags: [Crops]
      operationId: listMyCropInputs
      summary: List inputs applied to a crop
      description: |
        Returns paginated input applications (fertilizer, manure, bio-inputs, pesticides) for the specified crop (BR-56).
      x-permission: farmer.crop_input.manage_own
      x-business-rules: [BR-56, BR-36]
      parameters:
        - name: farmCropId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated list of crop inputs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CropInputsListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Crops]
      operationId: createMyCropInput
      summary: Record an input application
      description: |
        Logs a fertilizer, manure, pesticide or bio-input application for an own crop (BR-56).
      x-permission: farmer.crop_input.manage_own
      x-business-rules: [BR-56, BR-36, BR-35]
      parameters:
        - name: farmCropId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCropInputRequest'
      responses:
        '201':
          description: Created crop input record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CropInput'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farmers/me/crops/{farmCropId}/npk-contribution:
    get:
      tags: [Crops]
      operationId: getMyCropNpkContribution
      summary: Cumulative NPK nutrient totals for a crop
      description: |
