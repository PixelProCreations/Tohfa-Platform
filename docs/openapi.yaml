          description: The transfer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseTransfer' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /warehouse-transfers/{id}/approve:
    post:
      tags: [Inventory]
      operationId: approveWarehouseTransfer
      summary: Approve a high-value transfer, which dispatches it
      description: |
        Requires `transfer.high_value.approve` (Super Admin only) and an `Idempotency-Key`. Only a
        `PENDING_APPROVAL` transfer (else 409 `INVALID_STATE_TRANSITION`); the initiator may not
        approve it (403 `SELF_APPROVAL_FORBIDDEN`, also a DB CHECK). In one transaction the batches
        are row-locked, the free-shelf check is repeated (409 `STOCK_UNAVAILABLE`, nothing written),
        one `TRANSFER_OUT` ledger row per line is written and the status becomes `IN_TRANSIT` with
        `approvedBy`/`approvedAt`/`dispatchedAt`. One masked `transfer.high_value.approve` audit row.
        No request body.
      x-permission: transfer.high_value.approve
      x-business-rules: [BR-35, BR-100, BR-102]
