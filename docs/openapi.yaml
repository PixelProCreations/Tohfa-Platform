        phosphorusPct: { type: [number, 'null'], minimum: 0, maximum: 100 }
        potassiumPct: { type: [number, 'null'], minimum: 0, maximum: 100 }
        applicationMethod: { type: [string, 'null'], maxLength: 100 }
        costInr:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        notes: { type: [string, 'null'], maxLength: 2000 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }

    CropInputCost:
