      tags: [Farm Assets]
      operationId: getMyFarmAsset
      summary: Own farm asset detail
      description: |
        Returns one own `farm_assets` row. An `assetId` belonging to another
        farmer, guessed or passed explicitly, returns 404 — indistinguishable
        from a nonexistent id.
      x-permission: farmer.assets.view_own
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The farm asset.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FarmAsset' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    patch:
      tags: [Farm Assets]
      operationId: updateMyFarmAsset
      summary: Edit an own farm asset
      description: |
        Partially updates an own `farm_assets` row, including recording that a
        service happened (`lastServicedOn`) — `nextServiceDueOn` recomputes
        itself (a generated column) the moment this write lands. `farmId` and
        `category` are NOT present — re-pointing an asset at a different land
        location or re-categorising it is a delete-and-recreate, not an edit.
      x-permission: farmer.assets.edit_own
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FarmAssetUpdateRequest' }
      responses:
        '200':
          description: Updated farm asset.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FarmAsset' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [Farm Assets]
      operationId: deleteMyFarmAsset
      summary: Retire an own farm asset (soft delete)
      description: |
        Soft-deletes an own `farm_assets` row (sets `deletedAt`) — a farmer
        retiring a broken tool, not a sale record. An `assetId` belonging to
        another farmer returns 404.
      x-permission: farmer.assets.edit_own
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Farm asset retired.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/farmers/{farmerId}/farm-assets:
    get:
      tags: [Farm Assets]
      operationId: listFarmAssetsForFarmer
      summary: A farmer's tools/equipment/machinery (admin)
      description: |
        Lists one farmer's `farm_assets` rows across every one of their
        `farms`. Read-only: there is no admin-manageable asset taxonomy,
        unlike crops' crop_master.
      x-permission: admin.assets.view_all
      parameters:
        - name: farmerId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: category
          in: query
          schema: { $ref: '#/components/schemas/FarmAssetCategory' }
        - name: dueOnly
          in: query
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paged farm assets for the given farmer.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/FarmAsset' }
                  page: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farmers/me/livestock/animals:
    get:
      tags: [Livestock]
      operationId: listMyLivestockAnimals
      summary: Own herd, active by default
      description: |
        Lists the caller's own `livestock_animals` rows. Omitting
        `lifecycleStatus` returns only `ACTIVE` animals (an animal that has
        exited the herd via a lifecycle event drops off this default list,
        BR-47c); pass it explicitly (e.g. `lifecycleStatus=SOLD`) to see
        history.
      x-permission: farmer.livestock.view_own
      x-business-rules: [BR-47]
      parameters:
        - name: species
          in: query
          schema: { $ref: '#/components/schemas/AnimalSpecies' }
        - name: lifecycleStatus
          in: query
          schema: { $ref: '#/components/schemas/LifecycleStatus' }
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paged animals.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Animal' }
                  page: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Livestock]
      operationId: createMyLivestockAnimal
      summary: Register a new animal
      description: |
        Creates a new `livestock_animals` row on the caller's primary farm (a
        farmer's operation can have land in multiple locations, root
        CLAUDE.md's farm-land-locations doctrine; livestock is not
        plot-scoped, so there is no farm/plot picker in the request). New
        animals always start `lifecycleStatus: ACTIVE`. A `tag` that already
        exists in the caller's own herd returns 409; the same tag may be used
        by a different farmer (unique per farm, not globally).
      x-permission: farmer.livestock.create_own
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnimalCreateRequest' }
      responses:
        '201':
          description: Animal registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Animal' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farmers/me/livestock/animals/{animalId}:
    get:
      tags: [Livestock]
      operationId: getMyLivestockAnimal
