    post:
      tags: [Purchase]
      operationId: createGoodsReceipt
      summary: Receive goods against a purchase order
      description: |
        Warehouse-side intake. `acceptedQtyKg + rejectedQtyKg` must not exceed
        `grossQtyKg`. The receipt is created in `AWAITING_QC`; stock only enters the
        ledger once the quality check passes. Scoped to the caller's warehouse (BR-30).
