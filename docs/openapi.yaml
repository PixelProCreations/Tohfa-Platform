      x-permission: farmer.diary.view_own
      x-business-rules: [BR-40]
      responses:
        '200':
          description: The caller's own plots.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/DiaryPlot' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farmers/me/diary/plots/{plotId}/active-crops:
    get:
      tags: [Farm Diary]
      operationId: listMyDiaryPlotActiveCrops
      summary: Active (GROWING) crops on an own plot
      description: |
        Lists the crop cycles currently in status `GROWING` on the given plot, for use
        as the crop picker when starting a new diary entry (BR-42b). A `plotId` the
        caller does not own returns an empty list, never a 403 or 404 (BR-40, BR-40a).

        **Deliberate stub.** Returns the same single fixture crop for any plot id until
        the plots/farm_crops module lands (farm-diary.service.ts). `POST /entries` does
        NOT use this fixture — it checks the real `farm_crops` table for BR-42b.
      x-permission: farmer.diary.view_own
      x-business-rules: [BR-40, BR-42]
      parameters:
        - name: plotId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Active crops on the plot.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/DiaryActiveCrop' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farmers/me/diary/taxonomy:
    get:
      tags: [Farm Diary]
      operationId: getMyDiaryTaxonomy
      summary: Activity category / sub-activity taxonomy
      description: |
        The current, active-only activity taxonomy (categories and their nested
        sub-activities) used to populate the diary entry form. Backed by the
        admin-manageable `diary_activity_categories` / `diary_sub_activities` tables,
        not a fixed seed (BR-42a).
      x-permission: farmer.diary.view_own
      x-business-rules: [BR-42]
      responses:
        '200':
          description: The active diary taxonomy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiaryTaxonomy' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farmers/me/diary/entries:
    get:
      tags: [Farm Diary]
      operationId: listMyDiaryEntries
      summary: Own diary entries
      description: |
        Lists the caller's own diary entries, newest first, optionally filtered by day,
        month, plot or activity category. Scoped to the caller's own farmer_id; there is
        no cross-farmer visibility in either direction (BR-40, BR-40a).
      x-permission: farmer.diary.view_own
      x-business-rules: [BR-40]
      parameters:
        - name: date
          in: query
          description: ISO date (YYYY-MM-DD). Returns entries logged on this day only.
          schema: { type: string, format: date }
        - name: month
          in: query
          description: 'Returns entries logged in this month, format YYYY-MM.'
          schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        - name: plotId
          in: query
          schema: { type: string, format: uuid }
        - name: categoryKey
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: |
            Paged diary entries. Each item is a summary (`workerCount`/`photoCount`
            rather than the full `workers`/`photos` arrays) — fetch
            `GET /farmers/me/diary/entries/{entryId}` for full detail.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/DiaryEntrySummary' }
                  page: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Farm Diary]
      operationId: createMyDiaryEntry
      summary: Log a new diary entry
      description: |
        Records one field activity against an own plot and its currently active
        (`GROWING`) crop cycle, with optional workforce/wage detail (BR-40, BR-42, BR-44).

        A `plotId` the caller does not own returns 404, never 403 (BR-40a). A 422 is
