          description: The active diary taxonomy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiaryTaxonomy' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farmers/me/diary/entries:
    get:
      tags: [Farm Diary]
      operationId: listMyDiaryEntries
      summary: Own diary entries
      description: |
        Lists the caller's own diary entries, newest first, optionally filtered by day,
        month, plot or activity category. Scoped to the caller's own farmer_id; there is
        no cross-farmer visibility in either direction (BR-40, BR-40a).
      x-permission: farmer.diary.view_own
      x-business-rules: [BR-40]
      parameters:
        - name: date
          in: query
          description: ISO date (YYYY-MM-DD). Returns entries logged on this day only.
          schema: { type: string, format: date }
        - name: month
          in: query
          description: 'Returns entries logged in this month, format YYYY-MM.'
          schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        - name: plotId
          in: query
          schema: { type: string, format: uuid }
        - name: categoryKey
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: |
            Paged diary entries. Each item is a summary (`workerCount`/`photoCount`
            rather than the full `workers`/`photos` arrays) — fetch
            `GET /farmers/me/diary/entries/{entryId}` for full detail.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/DiaryEntrySummary' }
                  page: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Farm Diary]
      operationId: createMyDiaryEntry
      summary: Log a new diary entry
      description: |
        Records one field activity against an own plot and its currently active
        (`GROWING`) crop cycle, with optional workforce/wage detail (BR-40, BR-42, BR-44).

        A `plotId` the caller does not own returns 404, never 403 (BR-40a). A 422 is
        returned with one of: `DIARY_INVALID_SUB_ACTIVITY` (the sub-activity does not
        belong to the given category), `DIARY_NO_ACTIVE_CROP` (the plot, or the given
        `farmCropId`, has no crop in status `GROWING`), `DIARY_MINUTES_REQUIRED`
        (`minutes` missing or not greater than zero), `DIARY_WORKER_HOURS_INVALID`
        (a worker's `hoursWorked` is not in `(0, 24]`), or `DIARY_WAGE_RATE_INVALID` (a
        worker's `wageRatePaise` is not a positive whole number of paise).
      x-permission: farmer.diary.create_own
      x-business-rules: [BR-40, BR-42, BR-44]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiaryEntryCreateRequest' }
      responses:
        '201':
          description: Diary entry created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiaryEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

