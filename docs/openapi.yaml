      operationId: getMyLivestockAnimal
      summary: Own animal detail
      description: |
        Returns one own `livestock_animals` row. An `animalId` belonging to
        another farmer, guessed or passed explicitly, returns 404 —
        indistinguishable from a nonexistent id.
      x-permission: farmer.livestock.view_own
      parameters:
        - name: animalId
