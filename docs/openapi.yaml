          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformEventsListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Calendar & Events]
      operationId: createPlatformEvent
      summary: Create a platform event
      description: Creates a new workshop, training or event announcement (BR-58).
      x-permission: platform.event.manage
      x-business-rules: [BR-58, BR-35]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlatformEventRequest'
      responses:
        '201':
          description: Event created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformEvent'
