  /farms/{farmId}/attendance:
    get:
      tags: [Farm Workforce]
      operationId: listMyFarmAttendanceForDate
      summary: List every worker's attendance for one day
      description: |
        Returns the attendance row for every worker on one of the caller's own
        farms for a single `date`, so the mobile "mark attendance" screen can
        render the whole roster in one call. Workers with no logged row for
        that date are omitted, not backfilled with a synthetic absent record.
        A farm id that does not exist, or belongs to another farmer, 404s
        rather than 403 (BR-36).
      x-permission: farmer.workforce.manage_own
      x-business-rules: [BR-36, BR-41]
      parameters:
        - name: farmId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: One day's attendance across the farm's roster.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AttendanceRecord' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Farm Workforce]
      operationId: upsertMyFarmAttendance
      summary: Bulk upsert one day's attendance across the farm's roster
      description: |
        Records attendance for one or more workers on one of the caller's own
        farms for a single date, one call per day. Each item upserts against
        the `(worker_id, work_date)` unique constraint (db/migrations/0025_
        workforce.sql), so replaying the same day's submission edits the same
        rows rather than duplicating them. `hoursWorked`, when present, must
        fall in `(0, 24]` (BR-41b) — rejected by the database CHECK
        independent of this validation. Written exclusively by the farmer
        making this call; no scheduled job ever writes an attendance row
        (BR-38, extended by BR-41d). Every `workerId` in the body must belong
        to this farm's own roster, and a farm id that does not exist, or
        belongs to another farmer, 404s rather than 403 (BR-36).
      x-permission: farmer.workforce.manage_own
      x-business-rules: [BR-36, BR-41]
      parameters:
        - name: farmId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, items]
              properties:
                date: { type: string, format: date }
                items:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/AttendanceUpsertItem' }
            example:
              date: '2026-09-29'
              items:
                - workerId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  present: true
                  activity: Weeding
                  hoursWorked: 8
                - workerId: 9b2e1c34-1234-4a1b-9abc-1234567890ab
                  present: false
      responses:
        '200':
          description: The upserted attendance rows for the day.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AttendanceRecord' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farms/{farmId}/workers/{workerId}/attendance:
    get:
      tags: [Farm Workforce]
      operationId: listMyWorkerAttendance
      summary: List one worker's attendance history
      description: |
        Lists attendance rows for one worker on one of the caller's own farms,
        newest `workDate` first, optionally narrowed to one calendar `month`
        (`YYYY-MM`) and/or one `farmCropId`. A farm or worker id that does not
