      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SoilTestRecordCreate' }
            example:
              testDate: '2026-04-01'
              nextDueDate: '2026-10-01'
              organicCarbonPct: 0.6
              ph: 6.8
              ecDsPerM: 0.5
              tdsPpm: 300
