      summary: Dev/test-only receiving end of a mock signed upload URL
      description: |
        Not a real API endpoint for clients to call directly — it exists only because
        `POST /uploads/sign` returns a real `uploadUrl` clients PUT the file bytes to next,
        and in dev/test (`AZURE_STORAGE_CONNECTION_STRING` unset) that URL points back at
        this app instead of a real Azure/Cloudinary host, since `createBlobStorage()` falls
        back to `InMemoryBlobStorage`. A production deployment with real storage credentials
        never mounts a URL under this path — the signed URL points at the real provider.
        No auth: this stands in for a third-party storage provider whose real security is
        the pre-signed URL's own time-limited secrecy, not this app's session.
      x-permission: public
      x-business-rules: []
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
