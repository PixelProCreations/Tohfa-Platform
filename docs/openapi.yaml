        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/diary/categories:
    post:
      tags: [Farm Diary]
      operationId: createDiaryCategory
      summary: Create an activity taxonomy category
      description: |
        Adds a new top-level activity category to the admin-manageable diary taxonomy.
        A `key` that already exists returns 409 (BR-45).
      x-permission: admin.diary_taxonomy.manage
      x-business-rules: [BR-45]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiaryCategoryCreateRequest' }
      responses:
        '201':
          description: Category created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiaryCategory' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/diary/categories/{key}:
    patch:
      tags: [Farm Diary]
      operationId: updateDiaryCategory
      summary: Edit or retire an activity taxonomy category
      description: |
        Partially updates a category, including retiring it via `isActive: false`. A
        retired category is excluded from the farmer-facing taxonomy and from new-entry
        validation, but is never hard-deleted — existing diary entries referencing it
        remain valid (BR-45).
      x-permission: admin.diary_taxonomy.manage
      x-business-rules: [BR-45]
      parameters:
        - name: key
          in: path
          required: true
          description: 'Category key, e.g. land_prep.'
          schema: { type: string }
