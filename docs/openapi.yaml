    get:
      tags: [Farmer Profile & Certifications]
      operationId: adminGetCertification
      summary: Fetch a single certification by ID
      description: |
        Fetches a certification regardless of which farmer it belongs to. Not
        scope-restricted beyond the `certification.view` permission check (BR-16 context
        notes still apply — `farmerId` on the response is admin-only).
      x-permission: certification.view
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: The certification.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Certification' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    patch:
      tags: [Farmer Profile & Certifications]
      operationId: adminUpdateCertification
      summary: Edit any farmer's certification (TOHFA staff)
      description: |
        Lets TOHFA staff correct a farmer's certificate record (BR-51). Same request
        body, validation and effects as `PATCH /farmers/me/certifications/{id}`: the
        stored certificate with the patch applied must pass all of BR-48 (both expiry
        windows, `issuedOn` not in the future, date order, the `customTypeName`
        coupling), errors keyed `body.<field>` (BR-49c); a `certType` + `certNumber`
        another live certificate already has is 422 on `body.certNumber` with the
        generic message (BR-48j).

        Any real change sends the certificate back for verification — `UNVERIFIED`,
        verifier fields cleared — exactly as the farmer's own edit does (BR-49a), so an
        edit can never stand in for a verification; a patch equal to the stored values
        is a no-op that keeps the verification (BR-49b). The market block is
        recomputed in the same transaction for the farmer who OWNS the certificate,
        read from the stored row; `farmerId` and other unknown keys in the body are
        ignored. One `certification.admin_update` audit row names the admin as actor,
        with before/after images (BR-35).

        An unknown or deleted id is 404.
      x-permission: certification.manage_any
      x-business-rules: [BR-35, BR-48, BR-49, BR-51]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CertificationUpdate' }
            example:
              certNumber: PGS/TN/2026/00872
      responses:
        '200':
          description: The updated certification (UNVERIFIED after any real change).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Certification' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: |
            `VALIDATION_FAILED` on the merged result (BR-48, BR-49c), keyed `body.<field>`,
            including `body.certNumber` when the edit would give the certificate a
            `certType` + `certNumber` another live certificate already has (BR-48j); also
            a malformed id (`params.id`) or an empty body (`body`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [Farmer Profile & Certifications]
      operationId: adminDeleteCertification
      summary: Remove any farmer's certification (TOHFA staff)
      description: |
        Soft delete of a farmer's certificate by TOHFA staff (BR-51), with the effects of
        the farmer's own `DELETE /farmers/me/certifications/{id}` (BR-50): the row and its
        document are kept with `deleted_at` set; the certificate disappears from the
        farmer's list, the admin list and detail, verify/unverify, listing eligibility and
        the market-block recompute, which runs in the same transaction for the farmer who
        owns the certificate. The same `certType` + `certNumber` may be recorded again.
        One `certification.admin_delete` audit row names the admin as actor (BR-35).

        An unknown or already-deleted id is 404.
      x-permission: certification.manage_any
      x-business-rules: [BR-35, BR-50, BR-51]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '204': { description: Certification deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/certifications/{id}/verify:
    post:
      tags: [Farmer Profile & Certifications]
      operationId: verifyCertification
      summary: Mark a certification verified
      description: |
        The admin checks the certificate against the issuing body's portal and records the
        outcome manually. Verifying lifts the listing block, unless the certificate is
        already expired (BR-01 still applies). One `certification.verify` audit row
        records the verification state before and after (note and portal reference
        included), with the admin as actor, in the same transaction (BR-35).
      x-permission: certification.mark_verified
      x-business-rules: [BR-01, BR-02, BR-35]
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                portalReference: { type: string, maxLength: 120 }
                note: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Verified.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Certification' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/certifications/{id}/unverify:
    post:
      tags: [Farmer Profile & Certifications]
      operationId: unverifyCertification
      summary: Revoke verification and block listings
      description: |
        Immediately re-blocks the farmer's market listings (BR-02) and withdraws any listing
        still pending approval. One `certification.unverify` audit row records the
        verification state before and after (the reason included), with the admin as
        actor, in the same transaction (BR-35).
      x-permission: certification.mark_verified
      x-business-rules: [BR-02, BR-35]
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '200':
          description: Verification revoked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Certification' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/farmers/{id}/rating:
    get:
      tags: [Farm Rating]
      operationId: getFarmerRating
      summary: Farm rating detail for admin review
      description: |
        Returns the farmer's current (newest) rating: all 10 categories, in sort order,
        with `source` (`AUDIT` when derived from a completed INTERNAL audit, `MANUAL` for
        a legacy row) and `sourceAuditId`. There is no write on this path: the manual
        PUT was removed on 2026-10-01 (BR-06). A farmer never rated gets all-null
        scores, `status: DRAFT` and `source: null` — never a 404 for that reason alone. 404 means the
        farmer does not exist, or exists outside the caller's scope (root CLAUDE.md
        §2.1 — a cross-scope read must not be distinguishable from a nonexistent row).
      x-permission: farmer.rating.view
      x-business-rules: [BR-06]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Farm rating detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FarmRating' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/audits:
    get:
      tags: [Audits]
      operationId: listAudits
      summary: Audit calendar / list
      description: |
        Cursor-paginated audits with filters, for the audit calendar, a farmer's audit
        history and the compliance drill-downs. A Farmer Admin sees only audits of
        farmers in their own zone(s) (OWN_ZONE_ONLY, filtered on the farmer's current
        zone); rows outside the caller's scope are simply absent, never 403. `tier` is
        resolved at read time from `rating_tier_config` (BR-04a), never stored.
        `overdue=true` returns SCHEDULED/IN_PROGRESS audits whose `scheduledFor` is in
        the past. `hasOpenMajorFindings=true` returns audits with at least one
        unresolved MAJOR finding.
      x-permission: audit.view
      x-business-rules: [BR-03, BR-04, BR-36]
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
        - { name: farmerId, in: query, schema: { type: string, format: uuid } }
        - { name: zoneId, in: query, schema: { type: string, format: uuid } }
        - name: status
          in: query
          description: One or more statuses, comma-separated (e.g. `SCHEDULED,IN_PROGRESS`).
          schema: { type: string, examples: ['SCHEDULED,IN_PROGRESS'] }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/AuditType' } }
        - { name: fiscalYear, in: query, schema: { $ref: '#/components/schemas/FiscalYear' } }
        - { name: quarter, in: query, schema: { type: integer, minimum: 1, maximum: 4 } }
        - { name: scheduledFrom, in: query, schema: { type: string, format: date-time } }
        - { name: scheduledTo, in: query, schema: { type: string, format: date-time } }
        - { name: redFlagged, in: query, schema: { type: boolean } }
        - { name: overdue, in: query, schema: { type: boolean } }
        - { name: hasOpenMajorFindings, in: query, schema: { type: boolean } }
        - name: sort
          in: query
          description: '`scheduledFor` ascending (calendar) or `-scheduledFor` descending (history).'
          schema: { type: string, enum: [scheduledFor, -scheduledFor], default: -scheduledFor }
      responses:
        '200':
          description: Paged audits.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AuditSummary' }
                  page: { $ref: '#/components/schemas/PageMeta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Audits]
      operationId: scheduleAudit
      summary: Schedule an internal or external audit
      description: |
        Creates a SCHEDULED audit. `fiscalYear` (April-March, e.g. `2026-27`) and
        `quarter` (Q1 Apr-Jun ... Q4 Jan-Mar) are derived server-side from
        `scheduledFor` in Asia/Kolkata — the client never sends them. A second
        non-cancelled audit for the same (farmer, fiscalYear, quarter) is refused with
        409 `AUDIT_QUARTER_TAKEN` (BR-03a); a CANCELLED audit frees its quarter.
        EXTERNAL requires `externalAgencyName` and forbids nothing else; INTERNAL
        forbids `externalAgencyName` and may leave `auditorUserId` unassigned until
        start. `farmId`, when sent, must belong to the farmer. Writes an `audit_log`
        row (`audit.schedule`) in the same transaction.
      x-permission: audit.schedule
      x-business-rules: [BR-03]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuditCreate' }
            example:
              farmerId: 3f0c1d52-8d4e-4a51-9a63-0d8f7a1b2c3d
              auditType: EXTERNAL
              scheduledFor: '2026-11-05T04:30:00Z'
              externalAgencyName: PGS Regional Council
      responses:
        '201':
          description: Scheduled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/audits/compliance:
    get:
      tags: [Audits]
      operationId: getAuditCompliance
      summary: Compliance alerts and fiscal-year summary
      description: |
        Dashboard counts plus a cursor-paginated per-farmer compliance list for one
        fiscal year (default: the current one). BR-03b: a farmer with fewer than 4
        COMPLETED audits once the fiscal year has ended is `NON_COMPLIANT` — never
        silently passed. Before year end such a farmer is `PENDING`. "4" is the number
        of fiscal quarters (one audit per quarter, BR-03 LOCKED and enforced by the
        unique index), not a tunable threshold. The population is approved,
        non-deleted farmers in the caller's scope (a Farmer Admin: own zone(s) only).
        Counts are computed at read time; nothing is stored or derived into other
        tables, and nothing here red-flags anyone (BR-05b).
      x-permission: audit.view
      x-business-rules: [BR-03, BR-05]
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
        - { name: fiscalYear, in: query, schema: { $ref: '#/components/schemas/FiscalYear' } }
        - { name: zoneId, in: query, schema: { type: string, format: uuid } }
        - name: complianceStatus
          in: query
          description: Filters the `farmers` page only; `counts` always cover the whole population.
          schema: { $ref: '#/components/schemas/AuditComplianceStatus' }
      responses:
        '200':
          description: Compliance summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditComplianceSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/audits/bulk-reschedule:
    post:
      tags: [Audits]
      operationId: bulkRescheduleAudits
      summary: Reschedule several audits at once
      description: |
        Moves each listed audit to `newScheduledFor`, or shifts its current
        `scheduledFor` by `shiftDays` (exactly one of the two). Each audit is processed
        in its own transaction with its own `audit_log` row (`audit.reschedule`), so
        the batch may partially succeed; the response reports every item. An item
        fails with `NOT_FOUND` (missing or outside the caller's scope),
        `INVALID_STATE_TRANSITION` (not SCHEDULED), `AUDIT_QUARTER_TAKEN` (the new date
        falls in a quarter that already has a live audit for that farmer, BR-03a) or
        `CONFLICT` (`expectedScheduledFor` was sent and no longer matches — this is
        what makes replaying a `shiftDays` request safe instead of shifting twice).
      x-permission: audit.schedule
      x-business-rules: [BR-03]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuditBulkRescheduleRequest' }
            example:
              items:
                - { auditId: 0b6a2f9e-1c3d-4e5f-8a7b-9c0d1e2f3a4b, expectedScheduledFor: '2026-10-14T04:30:00Z' }
              shiftDays: 7
              reason: Heavy rainfall
      responses:
        '200':
          description: Per-audit outcome.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditBulkRescheduleResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/audits/{id}:
    get:
      tags: [Audits]
      operationId: getAudit
      summary: Audit detail
      description: |
        One audit with all 10 category scores (in `rating_categories.sort_order`, a null
        `score` for any category not yet scored — missing is incomplete, not zero,
        BR-06) and its findings. 404 when the audit does not exist or is outside the
        caller's scope (indistinguishable on purpose).
      x-permission: audit.view
      x-business-rules: [BR-04, BR-06]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Audit detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    patch:
      tags: [Audits]
      operationId: updateAudit
      summary: Reschedule or reassign a scheduled audit
      description: |
        Allowed only while SCHEDULED (otherwise 409 `INVALID_STATE_TRANSITION`). A new
        `scheduledFor` re-derives `fiscalYear`/`quarter`; moving into a quarter that
        already has a live audit for the farmer is 409 `AUDIT_QUARTER_TAKEN` (BR-03a).
        `auditType` cannot change — cancel and schedule a new audit instead. Writes an
        `audit_log` row (`audit.reschedule`) in the same transaction, carrying `reason`.
      x-permission: audit.schedule
      x-business-rules: [BR-03]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuditUpdate' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/audits/{id}/cancel:
    post:
      tags: [Audits]
      operationId: cancelAudit
      summary: Cancel an audit
      description: |
        SCHEDULED or IN_PROGRESS -> CANCELLED (otherwise 409
        `INVALID_STATE_TRANSITION`). Cancelling frees the (farmer, fiscalYear, quarter)
        slot for a replacement audit (BR-03a). The row, its scores and findings are kept
        as history. Writes an `audit_log` row (`audit.cancel`).
      x-permission: audit.schedule
      x-business-rules: [BR-03]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '200':
          description: Cancelled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/audits/{id}/start:
    post:
      tags: [Audits]
      operationId: startAudit
      summary: Start an audit (SCHEDULED -> IN_PROGRESS)
      description: |
        SCHEDULED -> IN_PROGRESS, stamping `startedAt` (otherwise 409
        `INVALID_STATE_TRANSITION`). An INTERNAL audit must have an auditor: send
        `auditorUserId` here or assign it earlier, else 422 `VALIDATION_FAILED` on
        `auditorUserId`. For an EXTERNAL audit this opens the record so an admin can
        enter the agency's scores and findings. `audit.conduct` is conditional for a
        Farmer Admin under SUPPORT_ONLY, which forbids state transitions, so a Farmer
        Admin gets 403 here. Writes an `audit_log` row (`audit.start`).
      x-permission: audit.conduct
      x-business-rules: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                auditorUserId: { type: string, format: uuid }
      responses:
        '200':
          description: Started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/audits/{id}/scores:
    put:
      tags: [Audits]
      operationId: setAuditScores
      summary: Enter category scores (all or some)
      description: |
        Upserts 1-10 category scores while the audit is IN_PROGRESS (otherwise 409
        `INVALID_STATE_TRANSITION`); a score sheet may be built up across several
        calls. Categories are the 10 seeded `rating_categories` (BR-06b); an unknown
        `categoryCode` is 422 `VALIDATION_FAILED`. A score that is not 0-10 is 422
        `SCORE_OUT_OF_RANGE` (BR-06a) — the request schema checks integer-ness only so
        the domain code, not the generic one, is returned. Optional `summary` and
        `reportStorageKey` (an upload with purpose `AUDIT_REPORT`, typically the
        external agency's own report) may be saved in the same call. Nothing is
        totalled or tiered until completion. Writes an `audit_log` row (`audit.score`).
      x-permission: audit.score.categories
      x-business-rules: [BR-06]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuditScoresUpdate' }
            example:
              scores:
                - { categoryCode: CERTIFICATION, score: 8 }
                - { categoryCode: SOIL_LAND, score: 7, remarks: Mulching inconsistent on the east plot. }
      responses:
        '200':
          description: Updated audit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/audits/{id}/findings:
    post:
      tags: [Audits]
      operationId: createAuditFinding
      summary: Log a finding
      description: |
        Adds a MAJOR / MINOR / OBSERVATION finding while the audit is IN_PROGRESS
        (otherwise 409 `INVALID_STATE_TRANSITION`). MAJOR findings are counted into
        `majorViolationsCount` on completion (BR-05a); logging one never red-flags the
        farm (BR-05b). Writes an `audit_log` row (`audit.finding.create`).
      x-permission: audit.findings.log
      x-business-rules: [BR-05]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuditFindingCreate' }
      responses:
        '201':
          description: Finding created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditFinding' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/audits/{id}/findings/{findingId}:
    patch:
      tags: [Audits]
      operationId: updateAuditFinding
      summary: Edit or resolve a finding
      description: |
        While the audit is IN_PROGRESS every field may change, and `resolved` may be set
        or cleared. Once the audit is COMPLETED only resolution is allowed:
        `resolved: true` (with optional `resolutionNote`) stamps `resolvedAt`/
        `resolvedBy`; any other field, or `resolved: false`, is 409
        `INVALID_STATE_TRANSITION`. Nothing may change on a CANCELLED audit. Resolving
        does not change `majorViolationsCount` (it records what was found) or the red
        flag. Writes an `audit_log` row (`audit.finding.update`).
      x-permission: audit.findings.log
      x-business-rules: [BR-05]
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - $ref: '#/components/parameters/AuditFindingIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuditFindingUpdate' }
      responses:
        '200':
          description: Updated finding.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditFinding' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/audits/{id}/complete:
    post:
      tags: [Audits]
      operationId: completeAudit
      summary: Complete an audit (IN_PROGRESS -> COMPLETED)
      description: |
        IN_PROGRESS -> COMPLETED (otherwise 409 `INVALID_STATE_TRANSITION`). Requires a
        score for all 10 categories; any missing one is 422 `AUDIT_INCOMPLETE` with the
        missing category codes in `errors[]` — a missing category is incomplete, never
        zero (BR-06). In one transaction it persists `totalScore` (direct sum, 0-100),
        `majorViolationsCount` (number of MAJOR findings, BR-05a) and `completedAt`,
        and writes an `audit_log` row (`audit.complete`). The tier in the response is
        resolved from `rating_tier_config` (BR-04a).

        FARM RATING (product decision 2026-10-01, BR-06). Completing an INTERNAL audit
        also creates, in the SAME transaction, a new COMPLETE farm rating for the farmer:
        the audit's 10 category scores (and remarks), the direct-sum total, the tier
        from `rating_tier_config`, period `<fiscalYear> Q<quarter>`, linked by
        `sourceAuditId`, with its own `audit_log` row (`farm_rating.create_from_audit`).
        It becomes the farmer's current rating; earlier ratings are kept unchanged as
        history. If the rating cannot be written, the audit is NOT completed. An
        EXTERNAL audit creates no rating. Completion changes nothing else — no
        certification, payout, market-block or red-flag effect (BR-05b). A Farmer
        Admin gets 403 (SUPPORT_ONLY forbids finalising).
      x-permission: audit.conduct
      x-business-rules: [BR-04, BR-05, BR-06]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuditCompleteRequest' }
      responses:
        '200':
          description: Completed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/audits/{id}/red-flag:
    post:
      tags: [Audits]
      operationId: redFlagAudit
      summary: Red-flag a completed audit
      description: |
        The ONLY way `redFlagged` becomes true (BR-05b): an explicit admin action with a
        reason. Allowed on a COMPLETED audit that is not already flagged (otherwise 409
        `INVALID_STATE_TRANSITION`). No rule derives it from `majorViolationsCount` —
        BR-05 is CONTESTED. Changes nothing else. Writes an `audit_log` row
        (`audit.red_flag`).
      x-permission: audit.red_flag.manage
      x-business-rules: [BR-05]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '200':
          description: Red-flagged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/audits/{id}/clear-red-flag:
    post:
      tags: [Audits]
      operationId: clearAuditRedFlag
      summary: Clear an audit's red flag
      description: |
        Explicit admin action (BR-05b). 409 `INVALID_STATE_TRANSITION` when the audit is
        not flagged. Clears `redFlagged`, `redFlagReason`, `redFlaggedBy` and
        `redFlaggedAt`; the flag's history lives in `audit_log` (`audit.red_flag.clear`,
        with the before-image and `note`).
      x-permission: audit.red_flag.manage
      x-business-rules: [BR-05]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                note: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Cleared.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/audits/{id}/report:
    get:
      tags: [Audits]
      operationId: downloadAuditReport
      summary: Download the audit report
      description: |
        `variant=generated` (default) renders the TOHFA audit report PDF for a COMPLETED
        audit (409 `INVALID_STATE_TRANSITION` before completion): farmer, audit type,
        agency or auditor, dates, the 10 category scores, total /100, tier from
        `rating_tier_config`, findings and summary. `variant=agency` returns the
        uploaded agency report file (`reportUpload`), 404 when none was attached.
        `redirect=true` returns a 302 to a short-lived signed URL instead of the bytes,
        as `/invoices/{id}/download` does. Same scope rules as `GET /admin/audits/{id}`:
        the route also requires `audit.view`, so a Farmer Admin (whose
        `audit.report.generate` grant is `all`) is limited to their own zone(s) and
        gets 404 outside them.
      x-permission: audit.report.generate
      x-business-rules: [BR-04, BR-06]
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - { name: variant, in: query, schema: { type: string, enum: [generated, agency], default: generated } }
        - { name: redirect, in: query, schema: { type: boolean, default: false } }
        - name: token
          in: query
          description: Signature from a `redirect=true` link (HMAC over audit id, variant, audience and expiry). With `expires`, authorises this one download without a bearer token; never construct it client-side.
          schema: { type: string, maxLength: 128 }
        - name: expires
          in: query
          description: Expiry of a signed link, epoch milliseconds (5 minutes after it was issued).
          schema: { type: integer }
      responses:
        '200':
          description: The report file (`application/pdf` for `generated`; the upload's own type for `agency`).
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '302':
          description: Redirect to a signed URL valid for 5 minutes.
          headers:
            Location: { schema: { type: string, format: uri } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farmers/me/audits:
    get:
      tags: [Audits]
      operationId: listMyAudits
      summary: Own audit history and upcoming audits
      description: |
        The caller's own audits only (BR-36), read-only, newest `scheduledFor` first by
        default. Includes upcoming (SCHEDULED) and CANCELLED audits so the app can show
        "next audit" and "n of 4 done this year" by filtering on `fiscalYear`/`status`.
        Never exposes red-flag or internal admin fields (the schema is an allow-list).
      x-permission: audit.view
      x-business-rules: [BR-03, BR-04, BR-36]
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
        - { name: fiscalYear, in: query, schema: { $ref: '#/components/schemas/FiscalYear' } }
        - name: status
          in: query
          description: One or more statuses, comma-separated.
          schema: { type: string, examples: [COMPLETED] }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/AuditType' } }
        - name: sort
          in: query
          schema: { type: string, enum: [scheduledFor, -scheduledFor], default: -scheduledFor }
      responses:
        '200':
          description: Paged own audits.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/FarmerAuditSummary' }
                  page: { $ref: '#/components/schemas/PageMeta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farmers/me/audits/{id}:
    get:
      tags: [Audits]
      operationId: getMyAudit
      summary: Own audit result
      description: |
        One of the caller's own audits (BR-36). Another farmer's audit id returns 404 —
        indistinguishable from a nonexistent one (BR-36a). Category scores and findings
        are returned only once the audit is COMPLETED; before that `categoryScores`
        carries null scores and `findings` is empty, so a farmer never sees a
