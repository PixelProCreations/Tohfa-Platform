      parameters:
        - name: cropId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: grade
          in: query
          schema: { $ref: '#/components/schemas/Grade' }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Historic ceilings, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/FairPrice' }
                  page: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /retail-prices:
    get:
      tags: [Pricing]
      operationId: listRetailPrices
      summary: Customer-facing retail prices
      description: |
        Returns the customer-facing retail prices in force, each of which is at or below the
        fair price ceiling for its crop and grade (BR-09).
      x-permission: pricing.retail_price.view
      x-business-rules: [BR-09]
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: cropId
          in: query
          schema: { type: string, format: uuid }
        - name: grade
          in: query
          schema: { $ref: '#/components/schemas/Grade' }
      responses:
        '200':
          description: Paged retail prices.
          content:
            application/json:
              schema:
