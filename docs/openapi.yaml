      required: [categoryCode, subject, description]
      properties:
        categoryCode: { type: string, minLength: 1, maxLength: 64 }
        subject: { type: string, minLength: 1, maxLength: 250 }
        description: { type: string, minLength: 1, maxLength: 2000 }
        attachmentUrl: { type: string }

    SupportTicketMessage:
      description: Admin view of a message (includes the sender id and the raw sender role code).
      type: object
      required: [id, ticketId, senderUserId, senderRole, message, createdAt]
      properties:
        id: { type: string, format: uuid }
        ticketId: { type: string, format: uuid }
        senderUserId: { type: string, format: uuid }
        senderRole: { type: string }
        message: { type: string }
        attachmentUrl: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }

    SendTicketMessageRequest:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 2000 }
        attachmentUrl: { type: string }

    SupportTicketStatusHistory:
      type: object
      required: [id, ticketId, fromStatus, toStatus, changedByUserId, createdAt]
      properties:
        id: { type: string, format: uuid }
        ticketId: { type: string, format: uuid }
        fromStatus: { type: [string, 'null'], enum: [OPEN, IN_PROGRESS, RESOLVED, CLOSED, null], description: 'NULL on the first row (ticket creation: NULL -> OPEN).' }
        toStatus: { type: string, enum: [OPEN, IN_PROGRESS, RESOLVED, CLOSED] }
        changedByUserId: { type: string, format: uuid }
        reason: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }

    FarmerSupportTicketSummary:
      description: Farmer view of a ticket - the admin view without `assignedToUserId`.
      type: object
      required: [id, ticketNumber, farmerId, categoryCode, subject, status, priority, messageCount, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        ticketNumber: { type: string }
        farmerId: { type: string, format: uuid }
        categoryCode: { type: string }
        subject: { type: string }
        description: { type: string }
        attachmentUrl: { type: [string, 'null'] }
        status: { type: string, enum: [OPEN, IN_PROGRESS, RESOLVED, CLOSED] }
        priority: { type: string, enum: [LOW, NORMAL, HIGH, URGENT] }
        messageCount: { type: integer }
        resolvedAt: { type: [string, 'null'], format: date-time }
        closedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    FarmerSupportTicketsListResponse:
      type: object
      required: [items, total, page, limit]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/FarmerSupportTicketSummary' } }
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }

    FarmerSupportTicketMessage:
      description: >-
        Farmer view of a message. No `senderUserId`; `senderRole` is `FARMER` for the caller's own messages and
        `SUPPORT` for every staff message, whatever the staff member's role.
      type: object
      required: [id, ticketId, senderRole, message, createdAt]
      properties:
        id: { type: string, format: uuid }
        ticketId: { type: string, format: uuid }
        senderRole: { type: string, enum: [FARMER, SUPPORT] }
        message: { type: string }
        attachmentUrl: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }

    FarmerSupportTicketDetailResponse:
      type: object
      required: [ticket, messages]
      properties:
        ticket: { $ref: '#/components/schemas/FarmerSupportTicketSummary' }
        messages: { type: array, items: { $ref: '#/components/schemas/FarmerSupportTicketMessage' } }

    AdminSupportTicketDetailResponse:
      type: object
      required: [ticket, messages, statusHistory]
      properties:
        ticket: { $ref: '#/components/schemas/SupportTicketSummary' }
        messages: { type: array, items: { $ref: '#/components/schemas/SupportTicketMessage' } }
        statusHistory: { type: array, items: { $ref: '#/components/schemas/SupportTicketStatusHistory' } }

    TransitionTicketStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [OPEN, IN_PROGRESS, RESOLVED, CLOSED] }
        reason: { type: string, maxLength: 500 }

    AssignTicketRequest:
      type: object
      properties:
        assignedToUserId: { type: [string, 'null'], format: uuid }

    CropPlanningInsightItem:
      type: object
      required: [cropMasterId, cropName, category, youGrow, inSeason, activePlots, totalAcreageGrown, expectedYieldKg, pastHarvestCount, lastHarvestedOn, hasConsecutivePlanting, consecutivePlotNames]
      properties:
        cropMasterId: { type: string, format: uuid }
        cropName: { type: string }
        category: { type: string }
        youGrow: { type: boolean }
        inSeason: { type: [boolean, 'null'] }
        activePlots: { type: array, items: { type: string } }
        totalAcreageGrown: { type: number }
        expectedYieldKg: { type: [number, 'null'] }
        pastHarvestCount: { type: integer }
        lastHarvestedOn: { type: [string, 'null'], format: date }
        hasConsecutivePlanting: { type: boolean }
        consecutivePlotNames: { type: array, items: { type: string } }

    CropPlanningInsightResponse:
      type: object
      required: [generatedAt, crops]
      properties:
        generatedAt: { type: string, format: date-time }
        crops: { type: array, items: { $ref: '#/components/schemas/CropPlanningInsightItem' } }

    Readiness:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ready, degraded, not_ready] }
        checks:
          type: array
          items:
            type: object
            required: [name, status]
            properties:
              name: { type: string }
              status: { type: string, enum: [up, down] }
              latencyMs: { type: integer }
              error: { type: [string, 'null'] }
