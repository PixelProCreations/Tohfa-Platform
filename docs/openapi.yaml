    post:
      tags: [Farm Workforce]
      operationId: createMyWorkerPayout
      summary: Record a payroll payout for a worker's pay period
      description: |
        Records a payout for one worker on one of the caller's own farms for a
        `periodStart`/`periodEnd` pair. `amountPaise` must be a positive
        integer (root CLAUDE.md §2.2). The `UNIQUE (worker_id, period_start,
        period_end)` database constraint (db/migrations/0025_workforce.sql) is
        defense in depth alongside the required `Idempotency-Key` header:
        replaying the same key returns the original payout rather than
        creating a second one. Written exclusively by the farmer making this
        call — no scheduled job ever runs payroll (BR-38, extended by
