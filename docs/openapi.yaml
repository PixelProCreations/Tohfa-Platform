            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/expenses/{id}/voucher:
    get:
      tags: [Finance]
      operationId: getExpenseVoucher
      summary: The payment voucher of an expense (derived, read-only)
      description: |
        UNCONFIRMED DEFAULT (owner approval pending, BR-75): the design shows an expense voucher as a
        printable "PAYMENT VOUCHER" for an expense, with no approval process of its own. It is DERIVED
        from the expense and never stored: the same expense always yields the same document. The
        `voucherNumber` is `VCH-<expense date YYYYMMDD>-<first 8 hex digits of the expense id, upper
        case>`; the design's sequential number (e.g. VCH-000821) would need a stored sequence, which is
        not invented here. The document carries the expense fields and the recorder's name; there is
        no "Authorized By": expenses have no approval workflow (BR-62, owner decision 2026-10-11). Only
        the recorder's name leaves, never their phone or e-mail. Revenue vouchers are not built: the
        design offers them but does not define them.

        Interim permission gate `finance.expense.log` (SPEC_GAPS: no voucher code exists). 404, not 403,
        for an expense that is absent, deleted or outside the caller's warehouse scope.
      x-permission: finance.expense.log
