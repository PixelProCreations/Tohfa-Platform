        inputType:
          type: string
          enum: [FERTILIZER, MANURE, BIO_INPUT, PESTICIDE, OTHER]
        inputName: { type: string, maxLength: 200 }
        appliedOn:
          type: string
          format: date
          description: A real calendar date (2026-02-30 is rejected), not in the future in Asia/Kolkata (BR-56b).
        quantity: { type: number, exclusiveMinimum: 0, maximum: 99999999.99 }
        unit:
          type: string
          enum: [KG, LITRE, GRAM, ML, BAG, TONNE, OTHER]
