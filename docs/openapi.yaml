        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farmers/me/livestock/animals/{animalId}/lifecycle-events:
    post:
      tags: [Livestock]
      operationId: recordMyLivestockLifecycleEvent
      summary: Record an animal leaving the herd (sold/transferred/culled/deceased)
      description: |
        Records a `livestock_lifecycle_events` row and, in the same
        transaction, flips the animal's `lifecycleStatus` to match
        `eventType` (BR-47b). An animal that already has a lifecycle event
        cannot have a second one recorded — the animal has already left the
        herd (BR-47a, 409 `LIVESTOCK_ALREADY_EXITED`). Returns the updated
        animal.
      x-permission: farmer.livestock.edit_own
      x-business-rules: [BR-47]
      parameters:
        - name: animalId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LifecycleEventCreateRequest' }
      responses:
        '201':
          description: Event recorded; the animal's updated state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Animal' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /farmers/me/livestock/production-logs:
