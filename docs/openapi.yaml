        priceAdjustment: { $ref: '#/components/schemas/Money', description: 'Signed per-kg adjustment when the assigned grade differs from the listed grade.' }
        storageLocation: { type: string, maxLength: 40, description: 'Copied to the batch the accepted goods are stocked as (BR-106).' }
        expiryOn: { type: string, format: date, description: 'A real calendar date, else 422. Copied to the batch (BR-106); the batch expiry is null when omitted.' }

    QualityCheck:
      type: object
      required: [id, goodsReceiptId, assignedGrade, outcome, checkedAt]
      properties:
        id: { type: string, format: uuid }
        goodsReceiptId: { type: string, format: uuid }
        assignedGrade: { $ref: '#/components/schemas/Grade' }
        outcome: { type: string, enum: [ACCEPTED, PARTIALLY_ACCEPTED, REJECTED] }
        acceptedQtyKg: { $ref: '#/components/schemas/Quantity' }
        rejectedQtyKg: { $ref: '#/components/schemas/Quantity' }
        moisturePct: { type: [number, 'null'] }
        visualScore: { type: [integer, 'null'] }
        defectNotes: { type: [string, 'null'] }
        photos: { type: array, items: { type: string, format: uri } }
        priceAdjustment: { $ref: '#/components/schemas/Money' }
        checkedBy: { type: string, format: uuid }
        checkedAt: { type: string, format: date-time }

    RejectedGoodsDisposal:
      type: object
      description: Record of disposal for rejected goods from quality check or intake.
      required: [id, goodsReceiptId, warehouseId, quantityKg, disposalMethod, reason, disposedBy, disposedAt]
      properties:
        id: { type: string, format: uuid }
        goodsReceiptId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        quantityKg: { $ref: '#/components/schemas/Quantity' }
        disposalMethod: { type: string, enum: [COMPOST, DISCARD, RETURN_TO_FARMER, BIO_WASTE] }
        reason: { type: string }
        photos: { type: array, items: { type: string, format: uri } }
        disposedBy: { type: string, format: uuid }
        disposedAt: { type: string, format: date-time }

    Batch:
      type: object
      description: An inventory batch. `sourceFarmerId` exists for traceability and is admin-only; it must never be projected onto a customer response (BR-16).
      required: [id, batchCode, warehouseId, cropId, grade, qtyAvailableKg, status]
      properties:
        id: { type: string, format: uuid }
        batchCode: { type: string, description: 'Batches stocked from a goods receipt are `BATCH-<year>-<6 digits>` (BR-106).', examples: [BATCH-2026-000123] }
        warehouseId: { type: string, format: uuid }
        cropId: { type: string, format: uuid }
        cropName: { type: string }
        grade: { $ref: '#/components/schemas/Grade' }
        goodsReceiptId: { type: [string, 'null'], format: uuid }
        sourceFarmerId: { type: [string, 'null'], format: uuid }
        qtyReceivedKg: { $ref: '#/components/schemas/Quantity' }
        qtyAvailableKg: { $ref: '#/components/schemas/Quantity' }
        qtyReservedKg: { $ref: '#/components/schemas/Quantity' }
        costPerKg: { $ref: '#/components/schemas/Money' }
        storageLocation: { type: [string, 'null'] }
        receivedOn: { type: string, format: date }
        expiryOn: { type: [string, 'null'], format: date }
        status: { $ref: '#/components/schemas/BatchStatus' }

    StockLedgerEntry:
      type: object
      description: An append-only ledger row. Rows are immutable; corrections are new rows (BR-37).
      required: [id, batchId, warehouseId, txnType, qtyDeltaKg, balanceAfterKg, performedAt]
      properties:
        id: { type: string, format: uuid }
        batchId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        txnType: { $ref: '#/components/schemas/StockTxnType' }
        qtyDeltaKg: { $ref: '#/components/schemas/Quantity', description: 'Signed: negative for outflows.' }
        balanceAfterKg: { $ref: '#/components/schemas/Quantity' }
        refType: { type: [string, 'null'], examples: [order_item, stock_adjustment] }
        refId: { type: [string, 'null'], format: uuid }
        performedBy: { type: [string, 'null'], format: uuid }
        performedAt: { type: string, format: date-time }
        remarks: { type: [string, 'null'] }

    StockAdjustmentCreate:
      type: object
      required: [batchId, adjustmentType, qtyDeltaKg, reason]
      properties:
        batchId: { type: string, format: uuid }
        adjustmentType: { type: string, enum: [DAMAGE, SHRINKAGE, COUNT_CORRECTION, EXPIRY] }
        qtyDeltaKg: { $ref: '#/components/schemas/Quantity' }
        reason: { type: string, minLength: 5, maxLength: 500 }

    StockAdjustment:
      type: object
      required: [id, batchId, adjustmentType, qtyDeltaKg, status, adjustedAt]
      properties:
        id: { type: string, format: uuid }
        batchId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        adjustmentType: { type: string, enum: [DAMAGE, SHRINKAGE, COUNT_CORRECTION, EXPIRY] }
        qtyDeltaKg: { $ref: '#/components/schemas/Quantity' }
        reason: { type: string }
        status: { type: string, enum: [PENDING_APPROVAL, APPROVED, REJECTED] }
        ledgerEntryId: { type: [string, 'null'], format: uuid }
        adjustedBy: { type: string, format: uuid }
        approvedBy: { type: [string, 'null'], format: uuid }
        adjustedAt: { type: string, format: date-time }

    Allocation:
      type: object
      required: [id, warehouseId, cropId, grade, allocationDate, channel, allocatedQtyKg]
      properties:
        id: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        cropId: { type: string, format: uuid }
        grade: { $ref: '#/components/schemas/Grade' }
        allocationDate: { type: string, format: date }
        channel: { $ref: '#/components/schemas/AllocationChannel' }
        allocatedQtyKg: { $ref: '#/components/schemas/Quantity' }
        consumedQtyKg: { $ref: '#/components/schemas/Quantity' }
        reservedQtyKg:
          $ref: '#/components/schemas/Quantity'
          description: Stored quantity held by customer carts (BR-22).
        availableQtyKg:
          $ref: '#/components/schemas/Quantity'
          description: |
            Effective availability (BR-100): allocated − consumed − reserved, capped by the batch's
            unclaimed shelf (`qty_available` minus all cart reservations on the batch and pending UPI
            DIRECT/MARKET holds). A DIRECT counter sale draws the batch without decrementing any
            allocation (BR-95), so this can be below allocated − consumed − reserved; it never exceeds
            what is on the shelf.
        computedBy: { type: string, enum: [AUTO, MANUAL] }
        overriddenBy: { type: [string, 'null'], format: uuid }

    AllocationConfigUpdate:
      type: object
      required: [effectiveFrom, channels]
      properties:
        effectiveFrom: { type: string, format: date }
        channels:
          type: array
          minItems: 4
          maxItems: 4
          description: All four channels must be present and the percentages must sum to exactly 100 (BR-12).
          items:
            type: object
            required: [channel, percentage]
            properties:
              channel: { $ref: '#/components/schemas/AllocationChannel' }
              percentage: { type: number, minimum: 0, maximum: 100 }

    AllocationConfig:
      type: object
      required: [effectiveFrom, channels]
      properties:
        effectiveFrom: { type: string, format: date }
        channels:
          type: array
          items:
            type: object
            properties:
              channel: { $ref: '#/components/schemas/AllocationChannel' }
              percentage: { type: number }
        setBy: { type: string, format: uuid }
        setAt: { type: string, format: date-time }

    Category:
      type: object
      required: [id, name, slug]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        imageUrl: { type: [string, 'null'], format: uri }
        sortOrder: { type: integer }
        productCount: { type: integer }

    Product:
      type: object
      description: |
        FARM-ANONYMOUS. This schema is an allow-list. Never add farmerId, farmName,
        farmLocation, gps, or fmb fields. See BR-16.

        Customers see grade, certification badges and TOHFA branding only. Traceability
        back to the source farm lives on `Batch`, which is admin-only. `additionalProperties`
        is false so a serializer leak fails contract tests instead of shipping.
      required: [id, name, categoryId, grade, pricePerKg, availableQty, unit]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        categoryId: { type: string, format: uuid }
        grade: { $ref: '#/components/schemas/Grade' }
        pricePerKg: { $ref: '#/components/schemas/Money' }
        availableQty:
          $ref: '#/components/schemas/Quantity'
          description: |
            Pooled ONLINE availability (BR-24): each batch's ONLINE allocation capped by that batch's
            unclaimed shelf (BR-100), so it never offers stock a DIRECT counter sale already took.
        unit: { type: string, enum: [kg] }
        photos: { type: array, items: { type: string, format: uri } }
        certificationBadges: { type: array, items: { $ref: '#/components/schemas/CertificationType' } }
        warehouseIds:
          type: array
          description: Warehouses where this product can be collected or dispatched from. Warehouse identity is TOHFA's, not the farm's, so it is safe to expose.
          items: { type: string, format: uuid }

    CatalogHome:
      type: object
      required: [categories, featured]
      properties:
        banners:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              imageUrl: { type: string, format: uri }
              deeplink: { type: [string, 'null'] }
        categories: { type: array, items: { $ref: '#/components/schemas/Category' } }
        featured: { type: array, items: { $ref: '#/components/schemas/Product' } }
        nearestWarehouseId: { type: [string, 'null'], format: uuid }

    Cart:
      type: object
      required: [id, items, subtotal, status]
      properties:
        id: { type: string, format: uuid }
        warehouseId: { type: [string, 'null'], format: uuid }
        status: { type: string, enum: [ACTIVE, LOCKED, CONVERTED, EXPIRED] }
        items:
          type: array
          items:
            type: object
            required: [id, productId, name, grade, qtyKg, unitPrice, lineTotal]
            properties:
              id: { type: string, format: uuid }
              productId: { type: string, format: uuid }
              name: { type: string }
              grade: { $ref: '#/components/schemas/Grade' }
              qtyKg: { $ref: '#/components/schemas/Quantity' }
              unitPrice: { $ref: '#/components/schemas/Money' }
              lineTotal: { $ref: '#/components/schemas/Money' }
              certificationBadges: { type: array, items: { $ref: '#/components/schemas/CertificationType' } }
        subtotal: { $ref: '#/components/schemas/Money' }
        lockedAt: { type: [string, 'null'], format: date-time }
        lockExpiresAt: { type: [string, 'null'], format: date-time, description: Locked plus 24 hours (BR-22). }

    CartReplace:
      type: object
      required: [items]
      properties:
        warehouseId: { type: string, format: uuid }
        items:
          type: array
          items: { $ref: '#/components/schemas/CartItemCreate' }

    CartItemCreate:
      type: object
      required: [productId, qtyKg]
      properties:
        productId: { type: string, format: uuid }
        grade: { $ref: '#/components/schemas/Grade' }
        qtyKg: { $ref: '#/components/schemas/Quantity' }

    CheckoutRequest:
      type: object
      required: [fulfillmentType, warehouseId, paymentMethod]
      properties:
        fulfillmentType: { $ref: '#/components/schemas/FulfillmentType' }
        warehouseId: { type: string, format: uuid }
        deliveryAddressId: { type: [string, 'null'], format: uuid, description: Required when fulfillmentType is HOME_DELIVERY. }
        deliveryDate: { type: string, format: date }
        deliverySlot: { $ref: '#/components/schemas/DeliverySlot' }
        paymentMethod: { $ref: '#/components/schemas/PaymentMethod' }
        notes: { type: string, maxLength: 300 }

    OrderSummary:
      type: object
      required: [id, orderNumber, status, totalAmount, placedAt]
      properties:
        id: { type: string, format: uuid }
        orderNumber: { type: string, examples: [TOH-2026-0084412] }
        status: { $ref: '#/components/schemas/OrderStatus' }
        channel: { $ref: '#/components/schemas/SalesChannel' }
        fulfillmentType: { $ref: '#/components/schemas/FulfillmentType' }
        warehouseId: { type: string, format: uuid }
        itemCount: { type: integer }
        totalAmount: { $ref: '#/components/schemas/Money' }
        paymentStatus: { type: string, enum: [PENDING, PAID, PARTIALLY_PAID, REFUNDED, FAILED] }
        deliveryDate: { type: [string, 'null'], format: date }
        placedAt: { type: string, format: date-time }

    Order:
      allOf:
        - $ref: '#/components/schemas/OrderSummary'
        - type: object
          required: [items, subtotal]
          properties:
            items:
              type: array
              description: Line items are farm-anonymous for customers (BR-16).
              items:
                type: object
                required: [id, productId, name, grade, qtyKg, unitPrice, lineTotal]
                properties:
                  id: { type: string, format: uuid }
                  productId: { type: string, format: uuid }
                  name: { type: string }
                  grade: { $ref: '#/components/schemas/Grade' }
                  qtyKg: { $ref: '#/components/schemas/Quantity' }
                  fulfilledQtyKg: { $ref: '#/components/schemas/Quantity' }
                  unitPrice: { $ref: '#/components/schemas/Money' }
                  gstRate: { type: number }
                  gstAmount: { $ref: '#/components/schemas/Money' }
                  lineTotal: { $ref: '#/components/schemas/Money' }
            subtotal: { $ref: '#/components/schemas/Money' }
            deliveryCharge: { $ref: '#/components/schemas/Money' }
            discount: { $ref: '#/components/schemas/Money' }
            gstAmount: { $ref: '#/components/schemas/Money' }
            paymentMethod: { $ref: '#/components/schemas/PaymentMethod' }
            deliverySlot: { $ref: '#/components/schemas/DeliverySlot' }
            deliveryAddressId: { type: [string, 'null'], format: uuid }
            otpRequired: { type: boolean, description: 4-digit handover OTP (BR-20). The code itself is never returned by the API. }
            invoiceId: { type: [string, 'null'], format: uuid }
            cancellationReason: { type: [string, 'null'] }
            deliveredAt: { type: [string, 'null'], format: date-time }

    OrderTrackingEvent:
      type: object
      required: [status, at]
      properties:
        status: { $ref: '#/components/schemas/OrderStatus' }
        at: { type: string, format: date-time }
        note: { type: [string, 'null'] }

    OrderTracking:
      type: object
      required: [orderId, status, events]
      properties:
        orderId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/OrderStatus' }
        otpRequired: { type: boolean }
        estimatedArrival: { type: [string, 'null'], format: date-time }
        events: { type: array, items: { $ref: '#/components/schemas/OrderTrackingEvent' } }

    Wallet:
      type: object
      required: [id, ownerType, balance, currency, status]
      properties:
        id: { type: string, format: uuid }
        ownerType: { type: string, enum: [CUSTOMER, FARMER] }
        balance: { $ref: '#/components/schemas/Money', description: 'Derived from the ledger; never written directly.' }
        currency: { type: string, enum: [INR] }
        status: { type: string, enum: [ACTIVE, FROZEN] }
        updatedAt: { type: string, format: date-time }

    WalletTransaction:
      type: object
      description: 'Serialized by one function (`toWalletTransactionResponse`) everywhere: every key is always present, null where noted.'
      required: [id, walletId, txnType, amount, balanceAfter, refType, refId, fiscalCashTag, warehouseId, performedBy, performedAt, remarks]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        walletId: { type: string, format: uuid }
        txnType: { $ref: '#/components/schemas/WalletTransactionType' }
        amount: { $ref: '#/components/schemas/Money', description: 'Signed: negative for debits.' }
        balanceAfter: { $ref: '#/components/schemas/Money' }
        refType: { type: [string, 'null'], examples: [order, topup, payout] }
        refId: { type: [string, 'null'], format: uuid }
        fiscalCashTag: { type: [string, 'null'], description: Present on cash top-ups (BR-18). }
        warehouseId: { type: [string, 'null'], format: uuid }
        performedBy: { type: [string, 'null'], format: uuid }
        performedAt: { type: string, format: date-time }
        remarks: { type: [string, 'null'] }

    TopupIntent:
      type: object
      required: [topupId, gateway, gatewayOrderId, amount, currency, status]
      properties:
        topupId: { type: string, format: uuid }
        gateway: { type: string, enum: [RAZORPAY] }
        gatewayOrderId: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
        currency: { type: string, enum: [INR] }
        status: { type: string, enum: [PENDING, SUCCESS, FAILED] }
        razorpayKeyId: { type: string, description: Publishable key for the client SDK. }

    CashTopupCreate:
      type: object
      required: [amount, warehouseId, fiscalCashTag]
      properties:
        amount: { $ref: '#/components/schemas/Money', description: 'Maximum INR 10,000.00 per transaction (BR-19).' }
        warehouseId: { type: string, format: uuid }
        fiscalCashTag: { type: string, minLength: 3, maxLength: 60 }
        remarks: { type: string, maxLength: 300 }

    PayoutDue:
      type: object
      required: [id, farmerId, amountDue, ageDays]
      properties:
        id: { type: string, format: uuid }
        farmerId: { type: string, format: uuid }
        tohfaFarmerId: { type: string }
        farmerName: { type: string }
        purchaseOrderId: { type: string, format: uuid }
        goodsReceiptId: { type: [string, 'null'], format: uuid }
        amountDue: { $ref: '#/components/schemas/Money' }
        dueSince: { type: string, format: date }
        ageDays: { type: integer }
        ageBucket: { type: string, enum: [D0_7, D8_15, D16_30, D30_PLUS] }

    PayoutCreate:
      type: object
      required: [farmerId, amount, mode]
      properties:
        farmerId: { type: string, format: uuid }
        amount: { $ref: '#/components/schemas/Money' }
        mode: { type: string, enum: [UPI, IMPS, NEFT] }
        bankAccountId: { type: string, format: uuid }
        dueIds: { type: array, items: { type: string, format: uuid } }
        remarks: { type: string, maxLength: 300 }

    Payout:
      type: object
      required: [id, payoutNumber, farmerId, amount, status, requiresDualApproval]
      properties:
        id: { type: string, format: uuid }
        payoutNumber: { type: string, examples: [PO-2026-000871] }
        farmerId: { type: string, format: uuid }
        amount: { $ref: '#/components/schemas/Money' }
        mode: { type: string, enum: [UPI, IMPS, NEFT] }
        status: { $ref: '#/components/schemas/PayoutStatus' }
        requiresDualApproval: { type: boolean, description: True when the amount exceeds INR 10,000 (BR-31). }
        initiatedBy: { type: string, format: uuid }
        approvedBy:
          type: array
          description: Distinct approver user ids. Never contains `initiatedBy` (BR-31).
          items: { type: string, format: uuid }
        approvedAt: { type: [string, 'null'], format: date-time }
        gatewayPayoutId: { type: [string, 'null'] }
        failureReason: { type: [string, 'null'] }
        paidAt: { type: [string, 'null'], format: date-time }

    Invoice:
      type: object
      required: [id, invoiceNumber, invoiceType, issueDate, totalAmount, status]
      properties:
        id: { type: string, format: uuid }
        invoiceNumber: { type: string, examples: ['TOH/2026-27/R/004412'] }
        invoiceType: { $ref: '#/components/schemas/InvoiceType' }
        orderId: { type: [string, 'null'], format: uuid }
        purchaseOrderId: { type: [string, 'null'], format: uuid }
        issueDate: { type: string, format: date }
        taxableAmount: { $ref: '#/components/schemas/Money' }
        totalAmount: { $ref: '#/components/schemas/Money' }
        gstApplicable: { type: boolean, description: True only for B2B and Horeca (BR-15). }
        status: { type: string, enum: [DRAFT, ISSUED, CANCELLED, CREDIT_NOTED] }
        pdfUrl: { type: [string, 'null'], format: uri }

    InvoiceDetail:
      allOf:
        - $ref: '#/components/schemas/Invoice'
        - type: object
          properties:
            placeOfSupply: { type: [string, 'null'] }
            cgst: { $ref: '#/components/schemas/Money' }
            sgst: { $ref: '#/components/schemas/Money' }
            igst: { $ref: '#/components/schemas/Money' }
            gstInclusive: { type: boolean }
            lines:
              type: array
              items:
                type: object
                properties:
                  description: { type: string }
                  hsnCode: { type: [string, 'null'] }
                  qty: { $ref: '#/components/schemas/Quantity' }
                  unitPrice: { $ref: '#/components/schemas/Money' }
                  gstRate: { type: number }
                  taxable: { $ref: '#/components/schemas/Money' }
                  tax: { $ref: '#/components/schemas/Money' }
                  total: { $ref: '#/components/schemas/Money' }

    Notification:
      type: object
      required: [id, title, body, createdAt]
      properties:
        id: { type: string, format: uuid }
        channel: { type: string, enum: [PUSH, SMS, EMAIL, IN_APP] }
        title: { type: string }
        body: { type: string }
        locale: { $ref: '#/components/schemas/Locale' }
        data: { type: object, additionalProperties: true, description: Deep-link payload. }
        readAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }

    SystemMessage:
      type: object
      description: An announcement as seen by one caller. Carries no warehouse, zone or role id.
      required: [id, scope, title, body, locale, startsAt, endsAt, createdAt, isRead, readAt]
      properties:
        id: { type: string, format: uuid }
        scope: { type: string, enum: [SYSTEM_WIDE, WAREHOUSE, ROLE] }
        title: { type: string }
        body: { type: string }
        locale: { $ref: '#/components/schemas/Locale' }
        startsAt: { type: string, format: date-time }
        endsAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        isRead: { type: boolean }
        readAt: { type: [string, 'null'], format: date-time }

    NotificationCategory:
      type: string
      enum: [WEATHER, FARM, MARKETING, PAYROLL, COMMUNITY]
      description: |
        Farmer-app Settings notification categories. WEATHER = frost/heavy rain/heat wave
        warnings; FARM = fertigation, pest-check, vaccination and deworming reminders;
        MARKETING = counter-offers and listing status changes; PAYROLL = attendance reminders
        and payout confirmations; COMMUNITY = Learning Hub posts and new content.

    NotificationPreference:
      type: object
      required: [category, enabled]
      properties:
        category: { $ref: '#/components/schemas/NotificationCategory' }
        enabled: { type: boolean }

    AdminNotificationCategory:
      type: string
      description: Category of the admin Notification Settings screen (BR-82), in screen order. Disjoint from NotificationCategory.
      enum:
        - IN_APP_MASTER
        - GOODS_RECEIVING
        - INVENTORY_ALERTS
        - WAREHOUSE_OPERATIONS
        - TASK_ALERTS
        - EXCEPTION_ALERTS
        - ORDER_CONFIRMED
        - ORDER_DISPATCHED
        - ORDER_DELIVERED
        - WALLET_CREDITED
        - PAYOUT_RELEASED
        - SYSTEM_MESSAGES
        - MAINTENANCE_MESSAGES
        - SECURITY_ALERTS

    AdminNotificationPreference:
      type: object
      required: [category, enabled]
      properties:
        category: { $ref: '#/components/schemas/AdminNotificationCategory' }
        enabled: { type: boolean }

    UpdateCurrentUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        Own-profile edit (BR-82). `mobile` and `email` are listed ONLY to document that they are
        locked (BR-33): sending either, with any value, is 403 FIELD_LOCKED and nothing is applied.
        Any other key is 422.
      properties:
        fullName: { type: string, minLength: 2, maxLength: 120 }
        preferredLocale: { $ref: '#/components/schemas/Locale' }
        mobile: { description: Locked field (BR-33). Always 403 FIELD_LOCKED. }
        email: { description: Locked field (BR-33). Always 403 FIELD_LOCKED. }

    HelpArticleReader:
      type: object
      required: [id, category, locale, title, body, sortOrder]
      properties:
        id: { type: string, format: uuid }
        category: { type: string }
        locale: { $ref: '#/components/schemas/Locale' }
        title: { type: string }
