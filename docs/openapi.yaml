            example:
              purchaseOrderId: 6b5a4c3d-2e1f-4a09-8b7c-6d5e4f3a2b1c
              warehouseId: 3f1b7c2e-2a44-4f0e-9b1a-6b0d2f0f1a01
              grossQtyKg: '250.000'
              vehicleNumber: TN43AB1234
              photos: [https://cdn.tohfa.in/grn/2026/aug/2b1c-1.jpg]
      responses:
        '201':
          description: Goods receipt note created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GoodsReceipt' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/goods-receipts/{id}:
    get:
      tags: [Purchase]
      operationId: getGoodsReceipt
      summary: Get goods receipt detail
      description: Returns goods receipt by ID with warehouse scoping (BR-30).
