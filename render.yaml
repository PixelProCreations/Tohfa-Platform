# Render Blueprint: a TEST deployment of the TOHFA API (not production).
# Render → New → Blueprint → pick this repo. It creates the database, Redis and the API.
#
# NODE_ENV=development on purpose: production mode refuses mock SMS / mock payments /
# no SMTP. With SMS_PROVIDER=mock the OTP code comes back in the login response, so
# testers can sign in without real SMS.
databases:
  - name: tohfa-db
    region: singapore
    plan: free
    databaseName: tohfa
    user: tohfa

services:
  - type: keyvalue
    name: tohfa-redis
    region: singapore
    plan: free
    ipAllowList: [] # only reachable from inside Render

  - type: web
    name: tohfa-api-test
    runtime: node
    region: singapore
    plan: free
    branch: wip/admin-modules-nov16 # switch to Dev once PR #192 is merged
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter "@tohfa/api..." build
    # Migrations and reference seeds are idempotent, so they are safe on every start.
    startCommand: pnpm db:migrate && pnpm db:seed && pnpm --filter @tohfa/api start
    healthCheckPath: /readyz
    envVars:
      - key: NODE_ENV
        value: development
      - key: DATABASE_URL
        fromDatabase:
          name: tohfa-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: tohfa-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SMS_PROVIDER
        value: mock
      - key: PAYMENT_PROVIDER
        value: mock
      - key: LOG_LEVEL
        value: info
