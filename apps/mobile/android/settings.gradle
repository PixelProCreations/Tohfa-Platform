rootProject.name = 'in.tohfa.mobile'

def getPackagePath(String packageName) {
    def mobileDir = new File(rootDir, '..').getAbsolutePath().replace('\\', '/')
    def script = "require.resolve('${packageName}/package.json', { paths: [require.resolve('react-native/package.json', { paths: ['${mobileDir}'] })] })"
    def proc = ['node', '--print', script].execute(null, rootDir)
    proc.waitFor()
    if (proc.exitValue() != 0) {
        throw new GradleException("Failed to find ${packageName}: " + proc.err.text.trim())
    }
    return new File(proc.in.text.trim()).parentFile
}

def cliPlatformAndroid = getPackagePath('@react-native-community/cli-platform-android')
def gradlePlugin = getPackagePath('@react-native/gradle-plugin')

apply from: new File(cliPlatformAndroid, 'native_modules.gradle'); applyNativeModulesSettingsGradle(settings)
include ':app'
includeBuild(gradlePlugin)
