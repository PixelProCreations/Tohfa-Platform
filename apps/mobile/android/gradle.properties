android.useAndroidX=true
android.enableJetifier=true
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
hermesEnabled=true
newArchEnabled=false
org.gradle.vfs.watch=false

# @rnmapbox/maps' Mapbox maven repo (see android/build.gradle's
# allprojects.repositories block) reads its secret downloads token from the
# RNMAPBOX_MAPS_DOWNLOAD_TOKEN environment variable, never from this
# tracked file — deliberately not defined here. This key must stay absent
# (not even empty) for that: build.gradle does
# `project.properties['MAPBOX_DOWNLOADS_TOKEN'] ?: System.getenv(...)`, and
# Groovy's `?:` only falls through to the env var when the left side is
# null — a defined-but-empty value here would still win and disable the
# token entirely. Export RNMAPBOX_MAPS_DOWNLOAD_TOKEN in your shell (or CI
# secret store) with a real Mapbox secret token (Downloads:Read scope) from
# https://account.mapbox.com/access-tokens/ before building.
