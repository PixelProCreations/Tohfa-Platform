apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * React Native Gradle Plugin configuration (RN 0.88 template).
 *
 * Hermes is enabled by `hermesEnabled=true` in gradle.properties. The old
 * `project.ext.react` map (pre-0.71 config) was removed: the plugin no longer reads it.
 */
react {
    // pnpm does not place @react-native/codegen in this app's own
    // node_modules (it is a dependency of react-native, not of the app), so
    // resolve it the same way Node would from react-native's location instead
    // of relying on the plugin's default ../../node_modules/@react-native/codegen.
    codegenDir = new File(["node", "--print", "require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * The preferred build flavor of JavaScriptCore (JSC), only used if hermesEnabled=false.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    // Single app for every role (farmer/customer/admin) -- one namespace,
    // one applicationId, no product flavors. Role-based screens are decided
    // by the JS bundle at runtime after login (see src/shell/auth/RootShell.tsx),
    // not by which native flavor was installed.
    namespace "in.tohfa.mobile"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "in.tohfa.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

