apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * React Native Gradle Plugin configuration (RN 0.88 template).
 *
 * Hermes is enabled by `hermesEnabled=true` in gradle.properties. The old
 * `project.ext.react` map (pre-0.71 config) was removed: the plugin no longer reads it.
 */
react {
    // pnpm does not place @react-native/codegen in this app's own
    // node_modules (it is a dependency of react-native, not of the app), so
    // resolve it the same way Node would from react-native's location instead
    // of relying on the plugin's default ../../node_modules/@react-native/codegen.
    codegenDir = new File(["node", "--print", "require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
    // pnpm keeps hermes-compiler outside react-native's folder, so the plugin can't find
    // hermesc on its own and release bundling fails. Resolve it the same way as codegenDir.
    hermesCommand = new File(["node", "--print", "require.resolve('hermes-compiler/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsolutePath() + "/hermesc/%OS-BIN%/hermesc"

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * The preferred build flavor of JavaScriptCore (JSC), only used if hermesEnabled=false.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    // Single app for every role (farmer/customer/admin) -- one namespace,
    // one applicationId, no product flavors. Role-based screens are decided
    // by the JS bundle at runtime after login (see src/shell/auth/RootShell.tsx),
    // not by which native flavor was installed.
    namespace "in.tohfa.mobile"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "in.tohfa.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    externalNativeBuild {
        cmake {
            // Where the CMake/NDK staging output goes. It was hardcoded to
            // "C:/cxx" — a Windows absolute path, almost certainly to dodge
            // Windows' 260-character MAX_PATH limit, which the deep
            // react-native codegen paths do hit. On macOS and Linux there is
            // no C: drive, so Gradle created a directory literally named "C:"
            // inside app/ and wrote ~325 MB of build output into it. That path
            // is not covered by .gitignore's `.cxx` rule, so it also showed up
            // as untracked in every `git status`.
            //
            // Default to the conventional, gitignored app/.cxx on macOS/Linux.
            //
            // On Windows that default breaks the New Architecture C++ build:
            // CMake embeds the *absolute* source path of out-of-tree sources
            // (e.g. node_modules/@rnmapbox/maps/cpp/...) in each object
            // directory under app/.cxx/<variant>/<hash>/<abi>, which from a
            // normal clone exceeds 260 chars. The ninja bundled with SDK CMake
            // 3.22.1 (1.10.x) is not long-path aware, so even with
            // LongPathsEnabled=1 it fails with "mkdir(...): No such file or
            // directory". So on Windows default to a short folder at the root
            // of the project's drive (e.g. D:/.cxx-tohfa).
            //
            // Either default can be overridden WITHOUT committing a path:
            //   gradle.properties (not checked in) or -P on the command line
            //   tohfaCxxDir=C:/cxx
            // (This must stay the single buildStagingDirectory assignment: a
            // second externalNativeBuild block later in the file wins.)
            def isWindows = org.gradle.internal.os.OperatingSystem.current().isWindows()
            def defaultCxxDir = isWindows
                ? new File(rootDir.toPath().getRoot().toFile(), ".cxx-tohfa").absolutePath
                : "${projectDir}/.cxx"
            buildStagingDirectory file(
                project.hasProperty("tohfaCxxDir") ? project.property("tohfaCxxDir") : defaultCxxDir
            )
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    // SMS User Consent API for OTP autofill (src/shell/otp, smsconsent module).
    // No READ_SMS / RECEIVE_SMS permission is needed or added for it.
    implementation("com.google.android.gms:play-services-auth-api-phone:18.1.0")
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

